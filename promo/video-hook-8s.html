    background:radial-gradient(60% 42% at 50% 46%,rgba(230,126,34,.20),transparent 70%);opacity:0;transition:opacity .2s ease}
  .stage.kick .pulse{opacity:1;transition:opacity .03s}
  .stage::after{content:"";position:absolute;inset:0;z-index:40;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 44%,transparent 56%,rgba(0,0,0,.5) 100%)}

  .beatbox{position:absolute;inset:0;z-index:2;transition:transform .1s cubic-bezier(.2,.8,.2,1)}
  .stage.kick .beatbox{transform:scale(1.03)}

  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:9% 7%;opacity:0;visibility:hidden}
  .scene.on{opacity:1;visibility:visible}
  h1{font-weight:800;letter-spacing:-.03em;line-height:.98;text-wrap:balance;text-transform:uppercase}
  .sig{color:var(--signal)}.hl{color:var(--gold)}
  .sub{color:var(--gold-soft);font-weight:800;text-transform:uppercase;letter-spacing:.02em}

  .in{opacity:0;transform:scale(.86) translateY(6px)}
  .scene.on .in{animation:pop .34s cubic-bezier(.15,.9,.2,1.15) forwards}
  .scene.on .in.d1{animation-delay:.06s}.scene.on .in.d2{animation-delay:.22s}.scene.on .in.d3{animation-delay:.4s}
  @keyframes pop{to{opacity:1;transform:none}}

  /* SCENE hook */
  #hook h1{font-size:clamp(40px,13.5cqw,80px)}
  #hook .emoji{font-size:clamp(48px,17cqw,96px);margin-bottom:2cqh}
  #hook .sub{font-size:clamp(15px,5cqw,26px);margin-top:4cqh;color:var(--mute)}

  /* SCENE map */
  #map h1{font-size:clamp(30px,10cqw,56px);margin-bottom:3cqh}
  .map{position:relative;width:min(78cqw,330px);aspect-ratio:1;border-radius:22px;overflow:hidden;
    background:linear-gradient(0deg,#14110e,#1b1712);border:1px solid var(--line)}
  .map::before{content:"";position:absolute;inset:0;opacity:.5;
    background:repeating-linear-gradient(38deg,transparent 0 26px,rgba(255,255,255,.03) 26px 28px),
               repeating-linear-gradient(-52deg,transparent 0 34px,rgba(255,255,255,.025) 34px 36px)}
  .me{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;
    background:var(--signal);box-shadow:0 0 0 5px rgba(230,126,34,.25);z-index:3}
  .pin{position:absolute;transform:translate(-50%,-100%) scale(0);z-index:4}
  .pin.pop{animation:drop .32s cubic-bezier(.2,1.5,.3,1) forwards}
  @keyframes drop{to{transform:translate(-50%,-100%) scale(1)}}
  .pin .head{width:30px;height:30px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);background:var(--gold);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.5)}
  .pin .head b{transform:rotate(-45deg);font-size:14px}
  .chip{margin-top:3cqh;display:inline-flex;gap:8px;align-items:center;background:rgba(39,174,96,.18);
    border:1px solid rgba(39,174,96,.55);color:#8ce0ac;font-weight:800;padding:8px 15px;border-radius:999px;font-size:clamp(13px,4.2cqw,18px)}

  /* SCENE proof */
  #proof h1{font-size:clamp(32px,11cqw,60px)}
  #proof .checks{display:flex;gap:14px;margin-top:4cqh}
  #proof .ck{width:clamp(44px,14cqw,66px);height:clamp(44px,14cqw,66px);border-radius:50%;display:grid;place-items:center;
    background:rgba(39,174,96,.16);border:1px solid rgba(39,174,96,.5)}

  /* SCENE cta */
  .mark{position:relative;width:clamp(120px,40cqw,200px);aspect-ratio:1;border-radius:26%;overflow:hidden;
    background:var(--logo) center/cover no-repeat;box-shadow:0 24px 70px -14px rgba(230,126,34,.4)}
  .wordmark{font-weight:800;letter-spacing:-.02em;font-size:clamp(38px,13cqw,66px);margin-top:3cqh}
  .tag{color:var(--gold-soft);font-weight:700;font-size:clamp(15px,4.6cqw,24px);margin-top:1.5cqh}
  #cta .soon{margin-top:3cqh;color:var(--paper);font-weight:800;text-transform:uppercase;font-size:clamp(13px,3.8cqw,17px)}

  .brandtab{position:absolute;top:14px;left:16px;z-index:20;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;opacity:.9}
  .brandtab .b-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(240,184,64,.18)}
  .beatbar{position:absolute;left:0;right:0;bottom:0;z-index:20;height:4px;background:rgba(255,255,255,.1)}
  .beatbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--signal),var(--gold))}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.stage.kick .beatbox{transform:none}}
</style>

<div class="stage-wrap"><div class="stage" id="stage">
  <div class="pulse"></div>
  <div class="brandtab"><span class="b-dot"></span>Magofeed</div>
  <div class="beatbox">

    <section class="scene" id="hook" data-id="hook">

      <h1 class="in d1"><span class="hl">3 magasins</span><br>l'ont en stock 📍</h1>
      <div class="map in d2">
        <div class="me"></div>
        <div class="pin" data-pin style="left:30%;top:32%"><div class="head"><b>🥤</b></div></div>
        <div class="pin" data-pin style="left:70%;top:44%"><div class="head"><b>🥤</b></div></div>
        <div class="pin" data-pin style="left:50%;top:74%"><div class="head"><b>🥤</b></div></div>
      </div>
      <div class="chip in d3">✓ autour de toi, maintenant</div>
    </section>

    <section class="scene" id="proof" data-id="proof">
      <h1 class="in d1">Confirmé en<br><span class="hl">temps réel</span></h1>
      <div class="checks">
        <div class="ck in d1"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#27ae60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="ck in d2"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#27ae60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="ck in d3"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#27ae60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
      <div class="sub in d3" style="margin-top:4cqh;color:var(--mute)">par la communauté</div>
    </section>

    </section>

  </div>
  <div class="beatbar"><i id="bb"></i></div>
</div></div>

<script>
(function(){
  var BPM=120, BEAT=60/BPM;                 // 0.5 s
  var SCENES=[{id:"hook",dur:2000},{id:"map",dur:2500},{id:"proof",dur:2000},{id:"cta",dur:1500}];
  var TOTAL=SCENES.reduce(function(a,c){return a+c.dur;},0)/1000; // 8 s
  var stage=document.getElementById('stage'), bb=document.getElementById('bb');
  var els={}; SCENES.forEach(function(s){ els[s.id]=stage.querySelector('.scene[data-id="'+s.id+'"]'); });
  var cum=[],acc=0; SCENES.forEach(function(s){ cum.push(acc); acc+=s.dur/1000; });

  var startPerf=0,cur=-1,lastBeat=-1,raf=null;
  function reset(el){ el.querySelectorAll('[data-pin]').forEach(function(p){p.classList.remove('pop');}); }
  function enter(i){ cur=i; SCENES.forEach(function(s,k){ els[s.id].classList.toggle('on',k===i); }); reset(els[SCENES[i].id]); }
  function beatHit(bi){
    stage.classList.add('kick'); setTimeout(function(){stage.classList.remove('kick');},100);
    if(SCENES[cur] && SCENES[cur].id==='map'){
      var local=bi-Math.round(cum[cur]/BEAT); var pins=els.map.querySelectorAll('[data-pin]');
      if(local>=1 && pins[local-1]) pins[local-1].classList.add('pop');
    }
  }
  function loop(now){
    var t=(now-startPerf)/1000; if(t>=TOTAL){ startPerf=now; t=0; cur=-1; lastBeat=-1; }
    var si=0; for(var i=0;i<SCENES.length;i++){ if(t>=cum[i]) si=i; }
    if(si!==cur) enter(si);
    var bi=Math.floor(t/BEAT); if(bi!==lastBeat){ lastBeat=bi; beatHit(bi); }
    bb.style.width=((t/TOTAL)*100)+'%';
    raf=requestAnimationFrame(loop);
  }
  function startVisual(){ startPerf=performance.now(); cur=-1; lastBeat=-1; cancelAnimationFrame(raf); raf=requestAnimationFrame(loop); }
  window.__hookRestart=startVisual;   // utilisé par le rendu pour caler proprement le début
  startVisual();

  /* ---------- audio (punchy) ---------- */
  var AC=window.AudioContext||window.webkitAudioContext, actx,master,comp,started=false,muted=false;
  function noise(d){ var n=Math.floor(actx.sampleRate*d),b=actx.createBuffer(1,n,actx.sampleRate),o=b.getChannelData(0); for(var i=0;i<n;i++)o[i]=Math.random()*2-1; return b; }
  function kick(t){ var o=actx.createOscillator(),g=actx.createGain(); o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(50,t+0.11); g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.26); o.connect(g); g.connect(master); o.start(t); o.stop(t+0.28); }
  function hat(t){ var s=actx.createBufferSource(); s.buffer=noise(0.03); var hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=8000; var g=actx.createGain(); g.gain.setValueAtTime(0.09,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.035); s.connect(hp); hp.connect(g); g.connect(master); s.start(t); s.stop(t+0.05); }
  function bell(t,f,gain,pan){ var o=actx.createOscillator(); o.type='sine'; o.frequency.value=f; var o2=actx.createOscillator(); o2.type='sine'; o2.frequency.value=f*2; var g=actx.createGain(),g2=actx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+0.7); g2.gain.setValueAtTime(0.0001,t); g2.gain.exponentialRampToValueAtTime(gain*0.3,t+0.006); g2.gain.exponentialRampToValueAtTime(0.0001,t+0.45); var p=actx.createStereoPanner?actx.createStereoPanner():null; o.connect(g); o2.connect(g2); if(p){p.pan.value=pan||0;g.connect(p);g2.connect(p);p.connect(master);}else{g.connect(master);g2.connect(master);} o.start(t); o2.start(t); o.stop(t+0.75); o2.stop(t+0.75); }
  function riser(t,d){ var s=actx.createBufferSource(); s.buffer=noise(d); s.loop=true; var bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2; bp.frequency.setValueAtTime(500,t); bp.frequency.exponentialRampToValueAtTime(7000,t+d); var g=actx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.11,t+d*0.9); g.gain.linearRampToValueAtTime(0.0001,t+d); s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t+d); }
  function impact(t){ var s=actx.createBufferSource(); s.buffer=noise(0.5); var lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1600; var g=actx.createGain(); g.gain.setValueAtTime(0.45,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.5); s.connect(lp); lp.connect(g); g.connect(master); s.start(t); s.stop(t+0.5); kick(t); }
  var SUB=[55,55,73.42,110], MEL=[440,523.25,659.25,880,659.25,523.25,587.33,440];
  function schedule(t0){
    // 16 beats groove
    riser(t0, 2*BEAT);                      // build over the hook
    for(var b=0;b<16;b++){
      if(b>=2) kick(t0+b*BEAT);
      hat(t0+b*BEAT+BEAT/2);
      if(b%2===0){ bell(t0+b*BEAT, MEL[(b/2)%MEL.length], 0.07, (b%4<2?-0.25:0.25)); }
    }
    impact(t0+13*BEAT);                     // punch sur le logo
    // sub bass
    for(var s=2;s<16;s+=4){ var o=actx.createOscillator(); o.type='sine'; o.frequency.value=SUB[((s-2)/4)%SUB.length]; var g=actx.createGain(); g.gain.setValueAtTime(0.0001,t0+s*BEAT); g.gain.linearRampToValueAtTime(0.2,t0+s*BEAT+0.02); g.gain.setValueAtTime(0.2,t0+(s+4)*BEAT-0.1); g.gain.exponentialRampToValueAtTime(0.0001,t0+(s+4)*BEAT); o.connect(g); g.connect(master); o.start(t0+s*BEAT); o.stop(t0+(s+4)*BEAT); }
  }
  function run(){ schedule(actx.currentTime+0.06); setTimeout(function(){ startVisual(); if(!muted) run(); else pending=true; }, TOTAL*1000); }
  var pending=false;
  function startAudio(){ if(started)return; started=true; actx=new AC(); if(actx.resume)actx.resume(); master=actx.createGain(); master.gain.value=0.0001; comp=actx.createDynamicsCompressor(); comp.threshold.value=-10; comp.ratio.value=6; master.connect(comp); comp.connect(actx.destination); master.gain.exponentialRampToValueAtTime(0.85,actx.currentTime+0.25); startVisual(); run(); mbtn.style.display='grid'; upd(); }
  function upd(){ mbtn.textContent=muted?'🔇':'🔊'; }
  function setMute(m){ muted=m; if(master) master.gain.linearRampToValueAtTime(m?0.0001:0.85,actx.currentTime+0.15); upd(); if(!m&&pending){pending=false;run();} }

  var ov=document.createElement('button'); ov.type='button'; ov.setAttribute('aria-label','Activer le son');
  ov.style.cssText='position:absolute;inset:0;z-index:30;border:0;cursor:pointer;background:rgba(8,6,4,.5);backdrop-filter:blur(3px);color:#f5f2ec;font:800 17px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-transform:uppercase;letter-spacing:.04em';
  ov.innerHTML='<span style="width:82px;height:82px;border-radius:50%;background:rgba(230,126,34,.18);border:1px solid rgba(240,184,64,.6);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(230,126,34,.08)"><svg width="34" height="34" viewBox="0 0 24 24" fill="#f0b840"><path d="M8 5v14l11-7z"/></svg></span><span>Activer le son 🔊</span>';
  ov.addEventListener('click',function(){ ov.remove(); if(AC) startAudio(); });
  if(AC) stage.appendChild(ov);
  var mbtn=document.createElement('button'); mbtn.type='button'; mbtn.setAttribute('aria-label','Couper le son');
  mbtn.style.cssText='position:absolute;top:14px;right:16px;z-index:32;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(20,17,14,.72);color:#f5f2ec;cursor:pointer;display:none;place-items:center;font-size:15px';
  mbtn.addEventListener('click',function(){ setMute(!muted); }); stage.appendChild(mbtn);
})();
</script>
