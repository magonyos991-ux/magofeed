<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:'Space Grotesk',system-ui,sans-serif;
  background:#151210;position:relative}
/* Lueur doree en haut a droite, derriere le telephone : donne du relief sans
   distraire du texte. */
.glow{position:absolute;right:-120px;top:-160px;width:760px;height:760px;border-radius:50%;
  background:radial-gradient(circle,rgba(198,154,87,.30) 0%,rgba(198,154,87,.10) 42%,transparent 68%)}
.glow2{position:absolute;left:-180px;bottom:-260px;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle,rgba(198,154,87,.13) 0%,transparent 66%)}
.wrap{position:relative;height:100%;display:flex;align-items:center;padding:0 0 0 72px}
.left{width:648px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:26px}
.brand img{width:38px;height:38px;border-radius:10px}
.brand span{font-size:17px;font-weight:700;letter-spacing:3.5px;color:#c69a57}
h1{font-size:53px;line-height:1.08;font-weight:700;color:#f4f0e9;letter-spacing:-1.6px}
h1 em{font-style:normal;color:#e0a952}
p{margin-top:18px;font-size:20px;line-height:1.45;font-weight:500;color:#a99madjust}
p{color:#a9998a;max-width:530px}
.chips{display:flex;gap:9px;margin-top:30px}
.chip{padding:9px 16px;border-radius:999px;font-size:15px;font-weight:700;
  background:rgba(198,154,87,.14);border:1px solid rgba(198,154,87,.42);color:#e8c78e}
.chip.plein{background:#f4f0e9;border-color:#f4f0e9;color:#1a1714}
/* Le telephone : legerement incline et debordant a droite, pour qu'on sente
   qu'il y a une VRAIE app derriere, sans en montrer trop. */
.phone{position:absolute;right:-30px;top:50%;transform:translateY(-50%) rotate(-6deg);
  width:310px;height:640px;border-radius:40px;background:#0c0a08;padding:9px;
  box-shadow:0 34px 80px rgba(0,0,0,.6),0 0 0 1.5px rgba(198,154,87,.30)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top center;border-radius:36px;display:block}
</style></head><body>
<div class="glow"></div><div class="glow2"></div>
<div class="wrap"><div class="left">
  <div class="brand"><img src="icon-512.png"><span>MAGOFEED</span></div>
  <h1>Ta boisson est<br><em>en rupture</em> partout&nbsp;?</h1>
  <p>Magofeed te dit quel magasin l’a <b style="color:#d9cbbb;font-weight:700">vraiment</b> en stock, confirmé en temps réel par la communauté.</p>
  <div class="chips">
    <span class="chip plein">+750 boissons</span>
    <span class="chip">Gratuit</span>
    <span class="chip">Sans alcool</span>
  </div>
</div></div>
<div class="phone"><img src="2-recherche.png"></div>
</body></html>
