<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <!-- corps blanc, modelé métal -->
    <linearGradient id="sumo-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9d1d1"/>
      <stop offset=".10" stop-color="#eef2f1"/>
      <stop offset=".28" stop-color="#ffffff"/>
      <stop offset=".62" stop-color="#fbfcfa"/>
      <stop offset=".84" stop-color="#e4e9e8"/>
      <stop offset="1" stop-color="#b6bfbf"/>
    </linearGradient>
    <linearGradient id="sumo-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#98a3a3" stop-opacity="0"/>
      <stop offset=".78" stop-color="#98a3a3" stop-opacity="0"/>
      <stop offset=".95" stop-color="#7c8a8a" stop-opacity=".30"/>
      <stop offset="1" stop-color="#5f6c6c" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="sumo-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sumo-sideDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d9898" stop-opacity="0"/>
      <stop offset=".6" stop-color="#7f8b8b" stop-opacity=".28"/>
      <stop offset=".92" stop-color="#65716f" stop-opacity=".5"/>
      <stop offset="1" stop-color="#4f5a58" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="sumo-sideDarkL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#8d9898" stop-opacity="0"/>
      <stop offset=".7" stop-color="#7f8b8b" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5f6b69" stop-opacity=".4"/>
    </linearGradient>
    <!-- métal du couvercle -->
    <linearGradient id="sumo-lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa0aa"/>
      <stop offset=".2" stop-color="#e9f0f4"/>
      <stop offset=".45" stop-color="#b9c6cd"/>
      <stop offset=".7" stop-color="#dde6ea"/>
      <stop offset="1" stop-color="#7c8d97"/>
    </linearGradient>
    <radialGradient id="sumo-lidTop" cx=".36" cy=".3" r="1.05">
      <stop offset="0" stop-color="#f2f7f9"/>
      <stop offset=".45" stop-color="#ccd7dd"/>
      <stop offset=".75" stop-color="#a9b8c0"/>
      <stop offset="1" stop-color="#8a9ba4"/>
    </radialGradient>
    <!-- vert Sumol -->
    <linearGradient id="sumo-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fca4f"/>
      <stop offset=".35" stop-color="#17b04a"/>
      <stop offset=".7" stop-color="#009a40"/>
      <stop offset="1" stop-color="#007a33"/>
    </linearGradient>
    <!-- orange Sumol -->
    <linearGradient id="sumo-orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb648"/>
      <stop offset=".38" stop-color="#f9921e"/>
      <stop offset=".72" stop-color="#f07e12"/>
      <stop offset="1" stop-color="#e2660a"/>
    </linearGradient>
    <!-- chair d'ananas -->
    <radialGradient id="sumo-flesh" cx=".42" cy=".38" r=".95">
      <stop offset="0" stop-color="#fff8cf"/>
      <stop offset=".4" stop-color="#ffe98e"/>
      <stop offset=".75" stop-color="#ffcf4d"/>
      <stop offset="1" stop-color="#f4a92a"/>
    </radialGradient>
    <!-- écorce -->
    <linearGradient id="sumo-rind" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbd06a"/>
      <stop offset=".35" stop-color="#efb43e"/>
      <stop offset=".7" stop-color="#d3902a"/>
      <stop offset="1" stop-color="#a96c1a"/>
    </linearGradient>
    <!-- feuilles -->
    <linearGradient id="sumo-leaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1c6b22"/>
      <stop offset=".4" stop-color="#2f8c2b"/>
      <stop offset=".75" stop-color="#55ad38"/>
      <stop offset="1" stop-color="#8cd05a"/>
    </linearGradient>
    <!-- texture écorce : hachures croisées -->
    <pattern id="sumo-texA" width="50" height="50" patternUnits="userSpaceOnUse" patternTransform="rotate(36 372 1000)">
      <path d="M0 25 H50" stroke="#a96c1a" stroke-width="4.5" opacity=".7"/>
    </pattern>
    <pattern id="sumo-texB" width="50" height="50" patternUnits="userSpaceOnUse" patternTransform="rotate(-36 372 1000)">
      <path d="M0 25 H50" stroke="#965d14" stroke-width="4.5" opacity=".6"/>
    </pattern>
    <!-- courbes de texte (suivent la courbure du cylindre + inclinaison) -->
    <path id="sumo-arcLogo" d="M225 700 Q 448 662 672 572"/>
    <path id="sumo-arcLogoSh" d="M225 707 Q 448 669 672 579"/>
    <path id="sumo-arcSub" d="M420 820 Q 550 784 700 722"/>
    <clipPath id="sumo-clip">
      <path d="M282 302 Q450 324 618 302 C655 330 673 364 673 406
               L673 1128 C673 1184 664 1214 645 1238
               Q560 1290 450 1290 Q340 1290 255 1238
               C236 1214 227 1184 227 1128 L227 406
               C227 364 245 330 282 302 Z"/>
    </clipPath>
    <clipPath id="sumo-pineClip">
      <ellipse cx="372" cy="1005" rx="106" ry="138"/>
    </clipPath>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="38" fill="#000" opacity=".35"/>
  <ellipse cx="450" cy="1326" rx="180" ry="24" fill="#000" opacity=".22"/>

  <!-- ===== CORPS ===== -->
  <path d="M282 302 Q450 324 618 302 C655 330 673 364 673 406
           L673 1128 C673 1184 664 1214 645 1238
           Q560 1290 450 1290 Q340 1290 255 1238
           C236 1214 227 1184 227 1128 L227 406
           C227 364 245 330 282 302 Z" fill="url(#sumo-body)"/>

  <g clip-path="url(#sumo-clip)">
    <!-- ===== ILLUSTRATION ANANAS (moitié basse) ===== -->
    <!-- vague de jus orange derrière les fruits -->
    <path d="M227 1122 Q 330 1058 452 1098 Q 582 1140 673 1080 L 673 1290 L 227 1290 Z"
          fill="url(#sumo-orange)" opacity=".28"/>
    <path d="M227 1160 Q 340 1108 470 1146 Q 590 1180 673 1136 L 673 1290 L 227 1290 Z"
          fill="url(#sumo-orange)" opacity=".3"/>

    <!-- couronne de feuilles, plus fournie -->
    <g fill="url(#sumo-leaf)">
      <path d="M362 896 C 344 810 350 752 376 700 C 404 758 400 830 392 894 Q 376 910 362 896 Z"/>
      <path d="M338 904 C 300 848 266 814 222 790 C 280 802 328 842 356 894 Q 350 912 338 904 Z"/>
      <path d="M396 894 C 428 828 468 790 522 770 C 472 792 434 840 412 900 Q 400 908 396 894 Z"/>
      <path d="M322 916 C 284 876 248 856 206 850 C 254 846 300 868 336 904 Q 334 922 322 916 Z"/>
      <path d="M414 910 C 452 872 492 856 538 856 C 492 850 448 870 406 902 Q 402 916 414 910 Z"/>
      <path d="M376 900 C 372 838 380 786 398 748 C 412 794 404 856 394 900 Q 384 910 376 900 Z" opacity=".9"/>
    </g>
    <path d="M374 876 C 364 810 370 758 380 722" stroke="#1c6b22" stroke-width="4" fill="none" opacity=".55"/>
    <path d="M348 888 C 314 838 284 806 250 784" stroke="#1c6b22" stroke-width="4" fill="none" opacity=".5"/>
    <path d="M404 888 C 432 836 464 804 502 784" stroke="#1c6b22" stroke-width="3.5" fill="none" opacity=".45"/>

    <!-- corps du demi-ananas, écorce texturée -->
    <ellipse cx="372" cy="1005" rx="106" ry="138" fill="url(#sumo-rind)"/>
    <g clip-path="url(#sumo-pineClip)">
      <rect x="250" y="850" width="250" height="320" fill="url(#sumo-texA)"/>
      <rect x="250" y="850" width="250" height="320" fill="url(#sumo-texB)"/>
      <g fill="#f7d98a" opacity=".8">
        <circle cx="330" cy="946" r="5"/><circle cx="384" cy="932" r="5"/>
        <circle cx="304" cy="1002" r="5"/><circle cx="358" cy="988" r="5"/>
        <circle cx="412" cy="974" r="5"/><circle cx="332" cy="1044" r="5"/>
        <circle cx="386" cy="1030" r="5"/><circle cx="440" cy="1016" r="5"/>
        <circle cx="360" cy="1086" r="5"/><circle cx="414" cy="1072" r="5"/>
        <circle cx="336" cy="1128" r="5"/><circle cx="390 " cy="1116" r="5"/>
      </g>
      <ellipse cx="322" cy="950" rx="48" ry="98" fill="#ffffff" opacity=".3" transform="rotate(-14 322 950)"/>
      <ellipse cx="448" cy="1064" rx="44" ry="108" fill="#7c4c0e" opacity=".22" transform="rotate(-12 448 1064)"/>
    </g>
    <ellipse cx="372" cy="1005" rx="106" ry="138" fill="none" stroke="#965d14" stroke-width="4" opacity=".55"/>

    <!-- tranche jaune juteuse -->
    <g>
      <circle cx="548" cy="1078" r="97" fill="#e9a52c"/>
      <circle cx="548" cy="1078" r="90" fill="url(#sumo-flesh)"/>
      <g stroke="#fdf3b8" stroke-width="7" stroke-linecap="round" opacity=".9">
        <path d="M548 1002 L548 1046"/>
        <path d="M548 1110 L548 1154"/>
        <path d="M472 1078 L516 1078"/>
        <path d="M580 1078 L624 1078"/>
        <path d="M494 1024 L525 1055"/>
        <path d="M571 1101 L602 1132"/>
        <path d="M602 1024 L571 1055"/>
        <path d="M525 1101 L494 1132"/>
      </g>
      <circle cx="548" cy="1078" r="24" fill="#fff6c4"/>
      <circle cx="548" cy="1078" r="24" fill="none" stroke="#f0c14a" stroke-width="3" opacity=".7"/>
      <path d="M488 1020 A 84 84 0 0 1 560 996" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".55"/>
    </g>

    <!-- gouttes de jus -->
    <g fill="url(#sumo-orange)">
      <path d="M648 986 q 12 22 0 32 q -13 -10 -5 -30 Z"/>
      <path d="M472 960 q 10 18 0 26 q -11 -8 -4 -24 Z"/>
      <circle cx="668" cy="1042" r="9"/>
      <circle cx="500" cy="930" r="7"/>
      <circle cx="252" cy="1080" r="8"/>
      <path d="M240 1022 q 11 20 0 29 q -12 -9 -4 -27 Z"/>
    </g>

    <!-- ===== LOGO (moitié haute) ===== -->
    <text font-family="'Space Grotesk',sans-serif" font-size="124" font-weight="700" letter-spacing="2"
          fill="#00602a" opacity=".8">
      <textPath href="#sumo-arcLogoSh" startOffset="50%" text-anchor="middle">SUMOL</textPath>
    </text>
    <text font-family="'Space Grotesk',sans-serif" font-size="124" font-weight="700" letter-spacing="2"
          fill="url(#sumo-green)">
      <textPath href="#sumo-arcLogo" startOffset="50%" text-anchor="middle">SUMOL</textPath>
    </text>

    <!-- virgule / trait orange dynamique sous le nom -->
    <path d="M258 768 Q 400 746 520 712 Q 596 690 636 668 Q 650 660 642 680 Q 614 706 500 738 Q 372 772 268 786 Q 250 788 258 768 Z"
          fill="url(#sumo-orange)"/>
    <path d="M660 652 q 18 -16 27 -3 q 8 13 -9 24 q -16 10 -24 1 q -7 -11 6 -22 Z" fill="url(#sumo-orange)"/>

    <!-- ANANÁS -->
    <text font-family="'Space Grotesk',sans-serif" font-size="42" font-weight="700" letter-spacing="9"
          fill="#ef7d10">
      <textPath href="#sumo-arcSub" startOffset="50%" text-anchor="middle">ANANÁS</textPath>
    </text>

    <!-- ===== MODELÉ : bandes de reflet ===== -->
    <rect x="256" y="296" width="66" height="1000" fill="url(#sumo-band)" opacity=".85"/>
    <rect x="346" y="296" width="42" height="1000" fill="url(#sumo-band)" opacity=".5"/>
    <rect x="540" y="296" width="34" height="1000" fill="url(#sumo-band)" opacity=".45"/>
    <rect x="586" y="296" width="90" height="1000" fill="url(#sumo-sideDark)"/>
    <rect x="227" y="296" width="42" height="1000" fill="url(#sumo-sideDarkL)"/>
    <!-- rim light fin bord droit -->
    <path d="M664 340 Q 668 780 662 1226" stroke="#ffffff" stroke-width="4" fill="none" opacity=".65"/>
    <!-- assombrissement du pied -->
    <path d="M227 300 H673 V1290 H227 Z" fill="url(#sumo-depth)"/>
    <!-- ombre portée sous le couvercle -->
    <path d="M282 302 Q450 326 618 302 Q 620 316 616 320 Q 450 342 284 320 Q 280 316 282 302 Z" fill="#7f8d94" opacity=".38"/>
  </g>

  <!-- rebord de base -->
  <path d="M258 1236 Q 340 1288 450 1288 Q 560 1288 642 1236 Q 566 1282 450 1282 Q 334 1282 258 1236 Z"
        fill="#6d7878" opacity=".6"/>

  <!-- ===== COUVERCLE ALUMINIUM (vu légèrement de dessus) ===== -->
  <path d="M290 252 L610 252 L618 304 Q 450 326 282 304 Z" fill="url(#sumo-lid)"/>
  <path d="M284 300 Q450 322 616 300 L618 304 Q450 326 282 304 Z" fill="#5f6f78" opacity=".6"/>
  <ellipse cx="450" cy="250" rx="165" ry="34" fill="url(#sumo-lid)"/>
  <ellipse cx="450" cy="248" rx="165" ry="34" fill="none" stroke="#f4f9fb" stroke-width="3" opacity=".8"/>
  <ellipse cx="450" cy="252" rx="146" ry="27" fill="url(#sumo-lidTop)"/>
  <ellipse cx="450" cy="253" rx="118" ry="20" fill="none" stroke="#7f929e" stroke-width="3" opacity=".8"/>
  <!-- languette -->
  <g>
    <path d="M382 244 Q 378 252 382 260 L 448 262 Q 454 252 448 242 Z" fill="#cfdae0" stroke="#8496a1" stroke-width="2.5"/>
    <ellipse cx="470" cy="252" rx="26" ry="13" fill="none" stroke="#8496a1" stroke-width="7"/>
    <ellipse cx="470" cy="252" rx="26" ry="13" fill="none" stroke="#e8eff3" stroke-width="2" opacity=".8"/>
    <circle cx="404" cy="252" r="6.5" fill="#93a5b0" stroke="#6e808b" stroke-width="2"/>
    <ellipse cx="366" cy="252" rx="24" ry="11" fill="none" stroke="#7f929e" stroke-width="2.5" opacity=".7"/>
  </g>

  <!-- ===== CONDENSATION ===== -->
  <g>
    <g fill="#eef7f4" opacity=".7">
      <circle cx="300" cy="480" r="8"/>
      <circle cx="588" cy="520" r="7"/>
      <circle cx="264" cy="860" r="7"/>
      <circle cx="620" cy="900" r="8"/>
      <circle cx="336" cy="620" r="6"/>
      <circle cx="560" cy="430" r="5"/>
      <circle cx="416" cy="470" r="5"/>
      <circle cx="574" cy="640" r="6"/>
    </g>
    <g fill="#ffffff" opacity=".85">
      <circle cx="297" cy="477" r="2.6"/>
      <circle cx="585" cy="517" r="2.3"/>
      <circle cx="261" cy="857" r="2.3"/>
      <circle cx="617" cy="897" r="2.6"/>
      <circle cx="558" cy="428" r="1.8"/>
    </g>
    <path d="M636 700 q 9 26 0 40 q -11 -12 -5 -38 Z" fill="#eef7f4" opacity=".65"/>
    <path d="M268 640 q -8 24 0 38 q 10 -11 4 -36 Z" fill="#eef7f4" opacity=".68"/>
  </g>
</svg>
