<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <linearGradient id="sumo-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffdf6e"/>
      <stop offset=".13" stop-color="#ffefa0"/>
      <stop offset=".34" stop-color="#ffd23e"/>
      <stop offset=".58" stop-color="#ffb93f"/>
      <stop offset=".82" stop-color="#ff9d3d"/>
      <stop offset="1" stop-color="#d8741f"/>
    </linearGradient>
    <linearGradient id="sumo-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9661a" stop-opacity="0"/>
      <stop offset=".62" stop-color="#c9661a" stop-opacity="0"/>
      <stop offset="1" stop-color="#b85c14" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="sumo-lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3f8fb"/>
      <stop offset=".45" stop-color="#c0cdd6"/>
      <stop offset=".78" stop-color="#93a6b2"/>
      <stop offset="1" stop-color="#71858f"/>
    </linearGradient>
    <radialGradient id="sumo-lidTop" cx=".38" cy=".32" r="1">
      <stop offset="0" stop-color="#e6eef3"/>
      <stop offset=".55" stop-color="#b3c1cb"/>
      <stop offset="1" stop-color="#8496a2"/>
    </radialGradient>
    <linearGradient id="sumo-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="sumo-sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff4bc" stop-opacity=".55"/>
      <stop offset=".65" stop-color="#ffe9a0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sumo-flesh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2ae"/>
      <stop offset=".55" stop-color="#ffd95e"/>
      <stop offset="1" stop-color="#ffb832"/>
    </linearGradient>
    <linearGradient id="sumo-rind" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b0742f"/>
      <stop offset=".55" stop-color="#84521d"/>
      <stop offset="1" stop-color="#5f3812"/>
    </linearGradient>
    <linearGradient id="sumo-leaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f7d26"/>
      <stop offset=".5" stop-color="#57a836"/>
      <stop offset="1" stop-color="#93d45e"/>
    </linearGradient>
    <clipPath id="sumo-clip">
      <path d="M302 366
               Q302 398 278 420 Q260 438 260 470
               L260 1180 Q260 1238 302 1262 Q360 1288 450 1288
               Q540 1288 598 1262 Q640 1238 640 1180
               L640 470 Q640 438 622 420 Q598 398 598 366 Z"/>
    </clipPath>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="265" ry="40" fill="#000" opacity=".35"/>
  <ellipse cx="760" cy="1310" rx="105" ry="16" fill="#000" opacity=".25"/>

  <!-- corps de la canette -->
  <path d="M302 366
           Q302 398 278 420 Q260 438 260 470
           L260 1180 Q260 1238 302 1262 Q360 1288 450 1288
           Q540 1288 598 1262 Q640 1238 640 1180
           L640 470 Q640 438 622 420 Q598 398 598 366 Z"
        fill="url(#sumo-body)"/>

  <!-- motif tranches d'ananas stylisees, bas de canette -->
  <g clip-path="url(#sumo-clip)" stroke="#c96a12" fill="none" opacity=".32" stroke-linecap="round">
    <g stroke-width="7">
      <circle cx="318" cy="1150" r="58"/>
      <circle cx="318" cy="1150" r="15"/>
      <path d="M318 1108 L318 1128 M318 1172 L318 1192 M282 1129 L299 1139 M337 1161 L354 1171 M282 1171 L299 1161 M337 1139 L354 1129"/>
    </g>
    <g stroke-width="6">
      <circle cx="468" cy="1218" r="50"/>
      <circle cx="468" cy="1218" r="13"/>
      <path d="M468 1182 L468 1199 M468 1237 L468 1254 M437 1200 L452 1209 M484 1227 L499 1236 M437 1236 L452 1227 M484 1209 L499 1200"/>
    </g>
    <g stroke-width="6">
      <circle cx="606" cy="1142" r="45"/>
      <circle cx="606" cy="1142" r="12"/>
      <path d="M606 1110 L606 1125 M606 1159 L606 1174 M578 1126 L592 1134 M620 1150 L634 1158 M578 1158 L592 1150 M620 1134 L634 1126"/>
    </g>
  </g>

  <!-- profondeur : bas de canette plus chaud -->
  <path d="M260 470 L260 1180 Q260 1238 302 1262 Q360 1288 450 1288 Q540 1288 598 1262 Q640 1238 640 1180 L640 470 Z"
        fill="url(#sumo-depth)"/>
  <!-- base : rebord -->
  <path d="M282 1252 Q360 1288 450 1288 Q540 1288 618 1252 Q560 1284 450 1284 Q340 1284 282 1252 Z"
        fill="#8f4a10" opacity=".55"/>

  <!-- collerette metal sous le couvercle -->
  <path d="M300 362 L600 362 L594 404 Q450 418 306 404 Z" fill="url(#sumo-lid)"/>

  <!-- couvercle aluminium -->
  <ellipse cx="450" cy="346" rx="152" ry="30" fill="url(#sumo-lid)"/>
  <ellipse cx="450" cy="344" rx="152" ry="30" fill="none" stroke="#f2f7fa" stroke-width="3" opacity=".7"/>
  <ellipse cx="450" cy="348" rx="128" ry="22" fill="url(#sumo-lidTop)"/>
  <ellipse cx="450" cy="350" rx="110" ry="16" fill="#93a5b1" opacity=".5"/>
  <rect x="414" y="340" width="72" height="14" rx="7" fill="#d3dee5" stroke="#8fa2ae" stroke-width="2"/>
  <circle cx="434" cy="347" r="8" fill="none" stroke="#8fa2ae" stroke-width="4"/>
  <circle cx="468" cy="347" r="4.5" fill="#8fa2ae"/>

  <!-- etiquette : halo soleil discret + nom -->
  <circle cx="450" cy="700" r="150" fill="url(#sumo-sun)"/>
  <g transform="rotate(-5 450 720)">
    <text x="456" y="742" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="116" font-weight="700" letter-spacing="4" fill="#9c4408" opacity=".55">SUMOL</text>
    <text x="450" y="735" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="116" font-weight="700" letter-spacing="4" fill="#ffffff">SUMOL</text>
    <rect x="322" y="770" width="256" height="56" rx="28" fill="#ffffff" opacity=".95"/>
    <text x="450" y="808" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="34" font-weight="700" letter-spacing="10" fill="#e2660f">ANANÁS</text>
  </g>

  <!-- reflets : flanc gauche clair, bord droit assombri -->
  <path d="M306 430 Q290 800 302 1205 Q308 1252 346 1266 Q322 1080 322 830 Q322 560 334 432 Z"
        fill="url(#sumo-shine)" opacity=".6" clip-path="url(#sumo-clip)"/>
  <path d="M612 440 Q630 800 616 1200 Q610 1248 582 1263 Q604 1060 604 840 Q604 580 596 444 Z"
        fill="#8a4210" opacity=".32" clip-path="url(#sumo-clip)"/>
  <path d="M286 418 Q276 440 274 486 L288 486 Q290 444 300 424 Z" fill="#ffffff" opacity=".5"/>

  <!-- condensation -->
  <g fill="#fff7e6">
    <circle cx="332" cy="520" r="7" opacity=".62"/>
    <circle cx="565" cy="560" r="6" opacity=".55"/>
    <circle cx="302" cy="905" r="8" opacity=".6"/>
    <circle cx="588" cy="960" r="7" opacity=".55"/>
    <circle cx="348" cy="1090" r="6" opacity=".55"/>
    <circle cx="530" cy="478" r="5" opacity=".5"/>
    <circle cx="408" cy="580" r="5" opacity=".5"/>
    <path d="M578 760 q8 16 0 26 q-10 -8 -4 -24 Z" opacity=".6"/>
    <path d="M312 660 q-7 17 0 28 q10 -8 4 -26 Z" opacity=".62"/>
  </g>

  <!-- garniture : quartier d'ananas avec ecorce + 2 feuilles -->
  <g transform="translate(747 1233) scale(1.13) translate(-755 -1240) rotate(-4 755 1240)">
    <!-- chair : quartier aux flancs legerement bombes -->
    <path d="M752 1064 Q758 1056 764 1066 Q812 1152 850 1240 Q855 1252 843 1253 L667 1253 Q655 1252 660 1240 Q698 1152 746 1066 Z"
          fill="url(#sumo-flesh)"/>
    <!-- fibres -->
    <g stroke="#fff3c0" stroke-width="6" stroke-linecap="round" opacity=".8">
      <path d="M752 1092 L702 1230"/>
      <path d="M755 1094 L757 1236"/>
      <path d="M759 1092 L806 1226"/>
    </g>
    <!-- reflet flanc gauche du quartier -->
    <path d="M746 1080 Q706 1160 682 1226 Q690 1170 730 1088 Q738 1074 746 1080 Z" fill="#ffffff" opacity=".5"/>
    <!-- liseret pale entre chair et ecorce -->
    <path d="M654 1253 L850 1253 L850 1264 L654 1264 Z" fill="#f2dc8f"/>
    <!-- ecorce bosselee -->
    <path d="M648 1264 L856 1264 L856 1272 Q838 1290 812 1279 Q788 1296 762 1281 Q738 1298 712 1281 Q688 1294 668 1279 Q652 1286 648 1272 Z"
          fill="url(#sumo-rind)"/>
    <path d="M648 1264 L856 1264 L856 1271 L648 1271 Z" fill="#c98f3d" opacity=".6"/>
    <g fill="#5c3510" opacity=".7">
      <circle cx="676" cy="1272" r="4"/><circle cx="712" cy="1275" r="4"/>
      <circle cx="748" cy="1276" r="4"/><circle cx="784" cy="1275" r="4"/>
      <circle cx="820" cy="1272" r="4"/>
    </g>
    <!-- 2 petites feuilles flottant a cote du quartier -->
    <g fill="url(#sumo-leaf)">
      <path d="M798 1094 Q826 1040 812 986 Q782 1038 788 1092 Q793 1101 798 1094 Z"/>
      <path d="M830 1124 Q865 1082 863 1028 Q827 1070 819 1121 Q824 1130 830 1124 Z"/>
    </g>
    <path d="M806 1078 Q820 1038 814 1002" stroke="#2f7d26" stroke-width="3" fill="none" opacity=".6"/>
  </g>
</svg>
