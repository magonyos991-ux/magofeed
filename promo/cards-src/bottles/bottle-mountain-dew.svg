<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <!--
    Mountain Dew 20oz PET americaine.
    SYMETRIE : contour construit en demi-profil droit puis miroite autour de x=450 (x' = 900 - x).
      497->403  500->400  592->308  615->285  568->332  566->334  606->294  607->293
  -->
  <defs>
    <!-- plastique + liquide vert vif : clair a gauche -> sombre bord droit -->
    <linearGradient id="mdew-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#63cc2a"/>
      <stop offset=".14" stop-color="#79dd3c"/>
      <stop offset=".34" stop-color="#57bd23"/>
      <stop offset=".56" stop-color="#46a81c"/>
      <stop offset=".78" stop-color="#3a9317"/>
      <stop offset="1"   stop-color="#2e7d12"/>
    </linearGradient>
    <!-- bouchon vert fonce -->
    <linearGradient id="mdew-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#0c3a0b"/>
      <stop offset=".2"  stop-color="#2a8526"/>
      <stop offset=".38" stop-color="#3d9c36"/>
      <stop offset=".55" stop-color="#1c6b1a"/>
      <stop offset=".8"  stop-color="#12500f"/>
      <stop offset="1"   stop-color="#082c07"/>
    </linearGradient>
    <!-- etiquette vert tres sombre, courbure cylindre -->
    <linearGradient id="mdew-label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#1b3a12"/>
      <stop offset=".22" stop-color="#132f0e"/>
      <stop offset=".5"  stop-color="#0f260c"/>
      <stop offset=".78" stop-color="#0b1d09"/>
      <stop offset="1"   stop-color="#061404"/>
    </linearGradient>
    <!-- reflet vertical -->
    <linearGradient id="mdew-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".3"  stop-color="#ffffff" stop-opacity=".6"/>
      <stop offset=".75" stop-color="#ffffff" stop-opacity=".3"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity=".08"/>
    </linearGradient>
    <!-- grosse goutte de condensation -->
    <radialGradient id="mdew-drop" cx=".35" cy=".3" r="1">
      <stop offset="0"  stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#eaffd8" stop-opacity=".45"/>
      <stop offset="1"  stop-color="#bdf08a" stop-opacity=".1"/>
    </radialGradient>
    <radialGradient id="mdew-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0"  stop-color="#000000" stop-opacity="1"/>
      <stop offset=".7" stop-color="#000000" stop-opacity=".7"/>
      <stop offset="1"  stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- creux d'ombre entre lobes du fond petaloide -->
    <linearGradient id="mdew-groove" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#0c3a08" stop-opacity="0"/>
      <stop offset=".5"  stop-color="#0a3306" stop-opacity=".75"/>
      <stop offset="1"   stop-color="#0c3a08" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mdew-clip">
      <path d="M403 178 L400 230
               C395 255 340 285 308 330
               C290 352 285 368 285 395
               L285 745
               C285 800 315 830 332 865
               C344 890 344 915 334 945
               C320 985 298 1010 294 1055
               L293 1150
               C293 1225 340 1286 450 1286
               C560 1286 607 1225 607 1150
               L606 1055
               C602 1010 580 985 566 945
               C556 915 556 890 568 865
               C585 830 615 800 615 745
               L615 395
               C615 368 610 352 592 330
               C560 285 505 255 500 230
               L497 178 Z"/>
    </clipPath>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="36" fill="url(#mdew-shadow)" opacity=".35"/>

  <!-- ===== CORPS PET vert translucide (epaules hautes, taille cintree, bas reevase) ===== -->
  <path d="M403 178 L400 230
           C395 255 340 285 308 330
           C290 352 285 368 285 395
           L285 745
           C285 800 315 830 332 865
           C344 890 344 915 334 945
           C320 985 298 1010 294 1055
           L293 1150
           C293 1225 340 1286 450 1286
           C560 1286 607 1225 607 1150
           L606 1055
           C602 1010 580 985 566 945
           C556 915 556 890 568 865
           C585 830 615 800 615 745
           L615 395
           C615 368 610 352 592 330
           C560 285 505 255 500 230
           L497 178 Z"
        fill="url(#mdew-body)" stroke="#175207" stroke-width="4" stroke-opacity=".55"/>

  <g clip-path="url(#mdew-clip)">
    <!-- assombrissement bord droit + bord gauche discret (cylindre) -->
    <path d="M574 330 L622 330 L622 1290 L574 1290 Z" fill="#1d5a0c" opacity=".4"/>
    <path d="M278 330 L306 330 L306 1290 L278 1290 Z" fill="#2e7d12" opacity=".25"/>
    <!-- rim light fin bord droit -->
    <path d="M602 420 C608 700 608 1000 598 1230 L590 1224 C600 1000 600 700 594 428 Z"
          fill="#c8f59a" opacity=".55"/>
    <!-- liquide visible dans le col : surface ellipse plus claire -->
    <ellipse cx="450" cy="262" rx="57" ry="11" fill="#a5ea60" opacity=".85"/>
    <path d="M393 262 Q450 284 507 262" fill="none" stroke="#d6ffa4" stroke-width="3" opacity=".7"/>
    <!-- ombre sous les epaules -->
    <path d="M285 380 Q450 412 615 380 L615 400 Q450 430 285 400 Z" fill="#256a0f" opacity=".3"/>

    <!-- ===== TAILLE : monogramme MD embosse en diagonale (meme vert, souligne par l'ombre) ===== -->
    <g transform="rotate(-16 450 900)" font-family="'Space Grotesk',sans-serif"
       font-weight="800" font-style="italic" font-size="120" text-anchor="middle">
      <text x="452.5" y="942.5" fill="#1f5c0d" opacity=".28">MD</text>
      <text x="447.5" y="937.5" fill="#a4e964" opacity=".26">MD</text>
      <text x="450" y="940" fill="#46a81c" opacity=".2">MD</text>
    </g>
    <!-- sillons du cintrage de taille -->
    <path d="M334 852 Q450 878 566 852" fill="none" stroke="#256a0f" stroke-width="4" opacity=".3"/>
    <path d="M334 958 Q450 984 566 958" fill="none" stroke="#256a0f" stroke-width="4" opacity=".28"/>
    <path d="M338 862 Q450 888 562 862" fill="none" stroke="#b8f083" stroke-width="2.5" opacity=".35"/>

    <!-- ===== BAS : 4 lobes de prehension verticaux (fond petaloide) ===== -->
    <!-- creux d'ombre entre les lobes : fuseaux effiles haut/bas -->
    <path d="M371 1044 C360 1110 360 1180 371 1250 C382 1180 382 1110 371 1044 Z"
          fill="url(#mdew-groove)"/>
    <path d="M450 1034 C438 1108 438 1186 450 1262 C462 1186 462 1108 450 1034 Z"
          fill="url(#mdew-groove)"/>
    <path d="M529 1044 C518 1110 518 1180 529 1250 C540 1180 540 1110 529 1044 Z"
          fill="url(#mdew-groove)"/>
    <path d="M308 1064 C299 1122 299 1180 308 1236 C317 1180 317 1122 308 1064 Z"
          fill="url(#mdew-groove)" opacity=".7"/>
    <path d="M592 1064 C583 1122 583 1180 592 1236 C601 1180 601 1122 592 1064 Z"
          fill="url(#mdew-groove)" opacity=".7"/>
    <!-- fines lignes de creux au coeur des sillons -->
    <path d="M371 1058 C364 1116 364 1176 371 1236" fill="none" stroke="#0a3306" stroke-width="2.5" opacity=".45"/>
    <path d="M450 1048 C442 1112 442 1184 450 1248" fill="none" stroke="#0a3306" stroke-width="2.5" opacity=".45"/>
    <path d="M529 1058 C536 1116 536 1176 529 1236" fill="none" stroke="#0a3306" stroke-width="2.5" opacity=".45"/>
    <!-- renflements : reflets verticaux bombes des lobes -->
    <path d="M330 1052 C320 1112 320 1188 332 1244 C346 1250 352 1250 356 1246
             C344 1188 344 1114 350 1056 C342 1050 336 1050 330 1052 Z"
          fill="#b6f37e" opacity=".55"/>
    <path d="M404 1042 C396 1110 396 1198 406 1256 C418 1262 424 1262 428 1258
             C420 1198 420 1112 426 1046 C418 1040 410 1040 404 1042 Z"
          fill="#c9f893" opacity=".6"/>
    <path d="M486 1044 C480 1110 480 1198 488 1254 C498 1258 504 1258 508 1254
             C500 1198 500 1112 504 1048 C498 1042 492 1042 486 1044 Z"
          fill="#a2e563" opacity=".45"/>
    <path d="M560 1054 C554 1116 554 1188 562 1240 C570 1244 576 1244 580 1240
             C572 1188 572 1116 576 1058 C570 1054 564 1054 560 1054 Z"
          fill="#90d651" opacity=".26"/>
    <!-- naissance des lobes -->
    <path d="M298 1044 Q372 1022 450 1028 Q528 1022 602 1044" fill="none" stroke="#256a0f"
          stroke-width="3.5" opacity=".28"/>
    <!-- pieds sombres a la base -->
    <path d="M336 1270 Q366 1282 382 1280 Q370 1264 352 1260 Z" fill="#1d5a0c" opacity=".45"/>
    <path d="M420 1279 Q450 1286 480 1279 Q450 1270 420 1279 Z" fill="#1d5a0c" opacity=".45"/>
    <path d="M564 1270 Q534 1282 518 1280 Q530 1264 548 1260 Z" fill="#1d5a0c" opacity=".45"/>
    <!-- rondeur de la base : ombre d'assise -->
    <path d="M293 1180 C300 1250 360 1284 450 1284 C540 1284 600 1250 607 1180
             L607 1290 L293 1290 Z" fill="#14460a" opacity=".28"/>
    <path d="M340 1262 Q450 1292 560 1262 Q450 1250 340 1262 Z" fill="#8fdc52" opacity=".3"/>

    <!-- ===== reflet vertical blanc net a gauche du corps ===== -->
    <path d="M320 430 C306 640 304 900 318 1200 L346 1222 C332 900 334 640 348 446 Z"
          fill="url(#mdew-shine)" opacity=".75"/>
    <path d="M352 320 C336 340 322 360 312 384 L326 394 C336 370 350 350 366 332 Z"
          fill="#ffffff" opacity=".5"/>
    <path d="M416 190 C412 210 411 226 412 244 L422 244 C421 226 422 210 426 192 Z"
          fill="#ffffff" opacity=".6"/>
  </g>

  <!-- ===== ETIQUETTE enveloppante vert tres sombre ===== -->
  <g>
    <path d="M285 402 Q450 432 615 402 L615 726 Q450 756 285 726 Z" fill="url(#mdew-label)"/>
    <!-- ombre portee de l'etiquette -->
    <path d="M285 396 Q450 426 615 396 L615 402 Q450 432 285 402 Z" fill="#0a2b04" opacity=".6"/>
    <path d="M285 726 Q450 756 615 726 L615 734 Q450 764 285 734 Z" fill="#0a2b04" opacity=".6"/>

    <clipPath id="mdew-labelclip">
      <path d="M285 402 Q450 432 615 402 L615 726 Q450 756 285 726 Z"/>
    </clipPath>
    <g clip-path="url(#mdew-labelclip)">
      <!-- eclats geometriques anguleux en diagonale -->
      <g>
        <polygon points="292,470 346,436 330,502" fill="#2e7d12"/>
        <polygon points="352,420 396,404 372,452" fill="#46a81c"/>
        <polygon points="286,560 332,528 318,590" fill="#46a81c" opacity=".9"/>
        <polygon points="300,650 352,616 340,684" fill="#2e7d12"/>
        <polygon points="292,712 336,690 330,742" fill="#7ed321" opacity=".85"/>
        <polygon points="380,700 428,672 416,732" fill="#2e7d12"/>
        <polygon points="536,420 588,398 566,452" fill="#2e7d12"/>
        <polygon points="588,470 622,448 616,510" fill="#46a81c"/>
        <polygon points="560,560 606,532 594,596" fill="#2e7d12"/>
        <polygon points="576,640 620,612 610,676" fill="#46a81c" opacity=".9"/>
        <polygon points="524,716 568,694 556,746" fill="#46a81c"/>
        <polygon points="452,418 494,402 476,446" fill="#2e7d12" opacity=".9"/>
        <!-- quelques tessons lisere blanc -->
        <polygon points="332,486 372,462 358,514" fill="#7ed321" stroke="#ffffff" stroke-width="3"/>
        <polygon points="556,494 596,470 584,524" fill="#7ed321" stroke="#ffffff" stroke-width="3"/>
        <polygon points="336,668 374,646 364,696" fill="#46a81c" stroke="#ffffff" stroke-width="2.5"/>
        <polygon points="524,662 566,640 554,692" fill="#7ed321" stroke="#ffffff" stroke-width="2.5" opacity=".95"/>
        <polygon points="404,726 442,708 432,750" fill="#7ed321" opacity=".8"/>
      </g>

      <!-- logo en diagonale montante : MTN blanc / DEW rouge -->
      <g transform="rotate(-9 450 565)" text-anchor="middle"
         font-family="'Space Grotesk',sans-serif" font-style="italic" font-weight="800">
        <text x="428" y="532" font-size="82" letter-spacing="4" fill="#ffffff"
              stroke="#123307" stroke-width="7" stroke-linejoin="round" paint-order="stroke">MTN</text>
        <text x="444" y="650" font-size="122" letter-spacing="2" fill="#e02d2d"
              stroke="#ffffff" stroke-width="14" stroke-linejoin="round" paint-order="stroke">DEW</text>
      </g>

      <!-- mention contenance -->
      <text x="462" y="712" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
            font-size="16" font-weight="700" letter-spacing="2.5" fill="#d3f2ae">20 FL OZ (591 mL)</text>

      <!-- courbure cylindre par-dessus l'etiquette -->
      <path d="M285 402 L332 402 L332 756 L285 756 Z" fill="#ffffff" opacity=".05"/>
      <path d="M560 402 L615 402 L615 756 L560 756 Z" fill="#000000" opacity=".22"/>
    </g>
  </g>

  <!-- ===== CONDENSATION : buee generale + grosses gouttes ===== -->
  <g clip-path="url(#mdew-clip)">
    <!-- micro-gouttes -->
    <g fill="#ffffff">
      <circle cx="330" cy="352" r="3.5" opacity=".4"/>
      <circle cx="376" cy="300" r="3" opacity=".32"/>
      <circle cx="452" cy="330" r="4" opacity=".35"/>
      <circle cx="540" cy="318" r="3" opacity=".3"/>
      <circle cx="586" cy="368" r="3.5" opacity=".38"/>
      <circle cx="308" cy="446" r="3.5" opacity=".42"/>
      <circle cx="352" cy="540" r="4" opacity=".35"/>
      <circle cx="412" cy="472" r="3" opacity=".3"/>
      <circle cx="500" cy="452" r="3.5" opacity=".28"/>
      <circle cx="574" cy="542" r="4" opacity=".38"/>
      <circle cx="600" cy="620" r="3" opacity=".35"/>
      <circle cx="318" cy="622" r="3.5" opacity=".4"/>
      <circle cx="388" cy="608" r="2.8" opacity=".26"/>
      <circle cx="486" cy="586" r="3.2" opacity=".25"/>
      <circle cx="536" cy="618" r="2.8" opacity=".28"/>
      <circle cx="300" cy="710" r="4" opacity=".42"/>
      <circle cx="452" cy="700" r="3" opacity=".26"/>
      <circle cx="562" cy="712" r="3.5" opacity=".3"/>
      <circle cx="342" cy="788" r="4.5" opacity=".45"/>
      <circle cx="426" cy="812" r="3.5" opacity=".32"/>
      <circle cx="524" cy="796" r="4" opacity=".38"/>
      <circle cx="576" cy="830" r="3" opacity=".33"/>
      <circle cx="352" cy="906" r="3.5" opacity=".4"/>
      <circle cx="472" cy="880" r="3" opacity=".28"/>
      <circle cx="548" cy="912" r="3.5" opacity=".35"/>
      <circle cx="316" cy="988" r="4" opacity=".42"/>
      <circle cx="450" cy="1000" r="3.5" opacity=".3"/>
      <circle cx="572" cy="984" r="4" opacity=".36"/>
      <circle cx="330" cy="1096" r="3.5" opacity=".38"/>
      <circle cx="470" cy="1120" r="4" opacity=".32"/>
      <circle cx="560" cy="1102" r="3.5" opacity=".34"/>
      <circle cx="386" cy="1188" r="3.5" opacity=".36"/>
      <circle cx="516" cy="1196" r="3" opacity=".3"/>
      <circle cx="450" cy="1244" r="3.5" opacity=".28"/>
    </g>
    <!-- grosses gouttes -->
    <g>
      <circle cx="362" cy="418" r="8" fill="url(#mdew-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".45"/>
      <circle cx="590" cy="486" r="7" fill="url(#mdew-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".4"/>
      <circle cx="306" cy="676" r="7.5" fill="url(#mdew-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".45"/>
      <circle cx="596" cy="774" r="7" fill="url(#mdew-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".4"/>
      <circle cx="336" cy="1042" r="8" fill="url(#mdew-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".45"/>
      <circle cx="580" cy="1160" r="7.5" fill="url(#mdew-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".4"/>
      <!-- gouttes qui coulent avec trainee -->
      <path d="M566 894 q2 -7 4 0 q6 18 0 28 q-9 -7 -4 -28 Z" fill="url(#mdew-drop)"/>
      <path d="M568 850 L568 892" stroke="#eaffd8" stroke-width="2" opacity=".35"/>
      <path d="M340 574 q-2 -7 -4 0 q-6 18 0 28 q9 -7 4 -28 Z" fill="url(#mdew-drop)"/>
      <path d="M338 530 L338 572" stroke="#eaffd8" stroke-width="2" opacity=".35"/>
    </g>
  </g>

  <!-- ===== BOUCHON vert fonce court et crante ===== -->
  <g>
    <path d="M394 122 Q450 112 506 122 L506 172 Q450 180 394 172 Z" fill="url(#mdew-cap)"/>
    <path d="M394 122 Q450 110 506 122 L506 130 Q450 118 394 130 Z" fill="#3f9e36" opacity=".9"/>
    <!-- crans verticaux -->
    <g stroke="#06270a" stroke-width="3" opacity=".6">
      <line x1="404" y1="124" x2="404" y2="171"/>
      <line x1="416" y1="122" x2="416" y2="172"/>
      <line x1="428" y1="120" x2="428" y2="173"/>
      <line x1="440" y1="119" x2="440" y2="174"/>
      <line x1="452" y1="119" x2="452" y2="174"/>
      <line x1="464" y1="119" x2="464" y2="174"/>
      <line x1="476" y1="120" x2="476" y2="173"/>
      <line x1="488" y1="122" x2="488" y2="172"/>
      <line x1="498" y1="124" x2="498" y2="171"/>
    </g>
    <rect x="402" y="124" width="12" height="46" rx="5" fill="#ffffff" opacity=".28"/>
    <!-- bague d'inviolabilite -->
    <path d="M396 174 Q450 182 504 174 L504 188 Q450 196 396 188 Z" fill="#12500f"/>
    <path d="M396 181 Q450 189 504 181" fill="none" stroke="#06270a" stroke-width="2" opacity=".7"/>
  </g>
  <!-- bague de col sous le bouchon -->
  <path d="M390 204 Q450 214 510 204 L510 218 Q450 228 390 218 Z" fill="#3a9317"/>
  <path d="M390 204 Q450 214 510 204 L510 209 Q450 219 390 209 Z" fill="#7edd3e" opacity=".8"/>
  <path d="M390 213 Q450 223 510 213 L510 218 Q450 228 390 218 Z" fill="#1d5a0c" opacity=".6"/>
</svg>
