        fill="#160528" opacity=".4"/>
  <path d="M606 430 Q613 760 607 1140 Q606 1200 594 1234 Q604 1020 604 800 Q604 560 600 434 Z"
        fill="#e8d4fa" opacity=".45"/>

  <!-- ===== CONDENSATION ===== -->
  <g fill="#f3e9ff">
    <circle cx="336" cy="500" r="5.5" opacity=".6"/>
    <circle cx="574" cy="540" r="4.5" opacity=".55"/>
    <circle cx="322" cy="620" r="6" opacity=".58"/>
    <circle cx="586" cy="640" r="4.5" opacity=".5"/>
    <circle cx="322" cy="1110" r="6" opacity=".58"/>
