           C328 318 291 382 289 462
           L288 648
           C288 726 303 758 303 822
           L303 946
           C303 1008 288 1042 288 1118
           L288 1204
           Q288 1290 404 1290
           L496 1290
           Q612 1290 612 1204
           L612 1118
           C612 1042 597 1008 597 946
           L597 822
           C597 758 612 726 612 648
           L612 462
           C609 382 572 318 518 286
           C500 275 488 262 488 240
           L488 190 Z"
        fill="url(#vimt-pet)"/>

  <!-- ===== LIQUIDE pourpre profond, surface sous l'epaule, visible au-dessus/dessous de l'etiquette ===== -->
  <path d="M338 350
           C310 384 296 420 295 466
           L294 648
           C294 724 309 758 309 822
           L309 946
           C309 1006 294 1042 294 1118
           L294 1202
