    <path d="M294 1054 Q450 1082 606 1054 L606 1066 Q450 1094 294 1066 Z" fill="#12031f" opacity=".45"/>
    <!-- liseres clairs haut/bas -->
    <path d="M293 704 Q450 676 607 704 L607 716 Q450 688 293 716 Z" fill="#f0e0fc" opacity=".95"/>
    <path d="M294 1042 Q450 1070 606 1042 L606 1054 Q450 1082 294 1054 Z" fill="#f0e0fc" opacity=".95"/>

    <!-- VIMTO blanc epais, penche dynamique, leger contour -->
    <g transform="rotate(-8 450 826)">
      <text x="450" y="864" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
            font-size="118" font-weight="700" letter-spacing="2" fill="#ffffff"
            stroke="#2a0f4a" stroke-width="10" stroke-linejoin="round" paint-order="stroke">VIMTO</text>
      <text x="450" y="864" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
            font-size="118" font-weight="700" letter-spacing="2" fill="#ffffff">VIMTO</text>
    </g>
    <!-- DEPUIS 1908 discret -->
    <g transform="rotate(-8 450 906)">
