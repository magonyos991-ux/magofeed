      <path d="M2 -44 q14 -12 28 -8 q-8 12 -24 14 Z" fill="#4d9152"/>
      <circle cx="-14" cy="-28" r="12" fill="url(#vimt-grape)"/>
      <circle cx="12" cy="-30" r="12" fill="url(#vimt-grape)"/>
      <circle cx="-24" cy="-6" r="12" fill="url(#vimt-grape)"/>
      <circle cx="0" cy="-8" r="12.5" fill="url(#vimt-grape)"/>
      <circle cx="24" cy="-6" r="12" fill="url(#vimt-grape)"/>
      <circle cx="-12" cy="14" r="12" fill="url(#vimt-grape)"/>
      <circle cx="13" cy="14" r="12" fill="url(#vimt-grape)"/>
      <circle cx="0" cy="34" r="11.5" fill="url(#vimt-grape)"/>
