<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <!-- plastique PET vide (col, epaule au-dessus du liquide) -->
    <linearGradient id="vimt-pet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0e4fb"/>
      <stop offset=".2" stop-color="#dcc4f2"/>
      <stop offset=".5" stop-color="#c3a0e6"/>
      <stop offset=".8" stop-color="#9a6cc8"/>
      <stop offset="1" stop-color="#6f3fa0"/>
    </linearGradient>
    <!-- liquide pourpre profond -->
    <linearGradient id="vimt-liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f3cc8"/>
      <stop offset=".16" stop-color="#68289e"/>
      <stop offset=".42" stop-color="#4e1c7c"/>
      <stop offset=".62" stop-color="#3c1462"/>
      <stop offset=".82" stop-color="#2a0c44"/>
      <stop offset="1" stop-color="#1c0630"/>
    </linearGradient>
    <radialGradient id="vimt-glow" cx=".38" cy=".3" r=".9">
      <stop offset="0" stop-color="#d073e8" stop-opacity=".35"/>
      <stop offset=".45" stop-color="#a24fd8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#a24fd8" stop-opacity="0"/>
    </radialGradient>
    <!-- bouchon violet fonce -->
    <linearGradient id="vimt-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c50b0"/>
      <stop offset=".28" stop-color="#4e2a84"/>
      <stop offset=".62" stop-color="#38195f"/>
      <stop offset="1" stop-color="#220c40"/>
    </linearGradient>
    <!-- etiquette violette -->
    <linearGradient id="vimt-label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b06ae8"/>
      <stop offset=".22" stop-color="#8a44d0"/>
      <stop offset=".55" stop-color="#7436bc"/>
      <stop offset=".82" stop-color="#5d28a2"/>
      <stop offset="1" stop-color="#471b80"/>
    </linearGradient>
    <radialGradient id="vimt-fruitglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f0dcff" stop-opacity=".38"/>
      <stop offset=".7" stop-color="#f0dcff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#f0dcff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vimt-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".1"/>
    </linearGradient>
    <!-- fruits -->
    <radialGradient id="vimt-grape" cx=".35" cy=".28" r="1">
      <stop offset="0" stop-color="#e2b8f8"/>
      <stop offset=".45" stop-color="#a865da"/>
      <stop offset="1" stop-color="#5e2b90"/>
    </radialGradient>
    <radialGradient id="vimt-rasp" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#ff9dbf"/>
      <stop offset=".5" stop-color="#ea5590"/>
      <stop offset="1" stop-color="#b8306a"/>
    </radialGradient>
    <radialGradient id="vimt-cassis" cx=".35" cy=".28" r="1">
      <stop offset="0" stop-color="#7a4aae"/>
      <stop offset=".45" stop-color="#3f1d68"/>
      <stop offset="1" stop-color="#1d0a34"/>
    </radialGradient>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="38" fill="#000" opacity=".35"/>

