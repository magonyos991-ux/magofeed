<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <!--
    Bouteille Vimto Sparkling 60cl verre.
    SYMETRIE : le contour est defini par le DEMI-PROFIL DROIT uniquement,
    puis miroite autour de x=450 (x' = 900 - x). Points droits -> gauches :
      484->416  485->415  487->413  490->410  496->404  556->344  606->294
      602->298  594->306  590->310  589->311  604->296  615->285  600->300
      570->330  535->365  495->405
  -->
  <defs>
    <!-- verre vide (haut du col au-dessus du liquide) : clair, bords sombres -->
    <linearGradient id="vimt-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1440"/>
      <stop offset=".12" stop-color="#6a4694"/>
      <stop offset=".3" stop-color="#cdb2e8"/>
      <stop offset=".5" stop-color="#e8dcf6"/>
      <stop offset=".72" stop-color="#b494d8"/>
      <stop offset=".88" stop-color="#5d3a88"/>
      <stop offset="1" stop-color="#241038"/>
    </linearGradient>
    <!-- liquide pourpre tres fonce, presque noir sur les bords -->
    <linearGradient id="vimt-liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12051f"/>
      <stop offset=".08" stop-color="#1d0a2e"/>
      <stop offset=".26" stop-color="#33104c"/>
      <stop offset=".42" stop-color="#3d1257"/>
      <stop offset=".54" stop-color="#471861"/>
      <stop offset=".68" stop-color="#33104c"/>
      <stop offset=".88" stop-color="#1d0a2e"/>
      <stop offset="1" stop-color="#0e0418"/>
    </linearGradient>
    <!-- capsule metal violet fonce -->
    <linearGradient id="vimt-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0a32"/>
      <stop offset=".18" stop-color="#4a2a78"/>
      <stop offset=".38" stop-color="#7a54ae"/>
      <stop offset=".52" stop-color="#583a8c"/>
      <stop offset=".75" stop-color="#301656"/>
      <stop offset="1" stop-color="#12051f"/>
    </linearGradient>
    <!-- etiquette violette -->
    <linearGradient id="vimt-label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#471463"/>
      <stop offset=".16" stop-color="#6b2790"/>
      <stop offset=".38" stop-color="#8536ac"/>
      <stop offset=".55" stop-color="#7a2d9e"/>
      <stop offset=".78" stop-color="#5c2185"/>
      <stop offset="1" stop-color="#3c1058"/>
    </linearGradient>
    <linearGradient id="vimt-necklabel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#521a72"/>
      <stop offset=".3" stop-color="#7a2d9e"/>
      <stop offset=".55" stop-color="#6f2795"/>
      <stop offset=".8" stop-color="#5c2185"/>
      <stop offset="1" stop-color="#40125e"/>
    </linearGradient>
    <linearGradient id="vimt-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".65"/>
      <stop offset=".75" stop-color="#ffffff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>
    <clipPath id="vimt-clip">
      <path d="M416 160 L484 160
               C486 250 488 330 491 410
               C496 470 520 520 552 555
               C582 588 600 610 604 660
               C600 740 593 810 590 880
               C589 950 604 1060 615 1140
               C615 1200 600 1240 570 1262
               C535 1282 495 1290 450 1290
               C405 1290 365 1282 330 1262
               C300 1240 285 1200 285 1140
               C296 1060 311 950 310 880
               C307 810 300 740 296 660
               C300 610 318 588 348 555
               C380 520 404 470 409 410
               C412 330 414 250 416 160 Z"/>
    </clipPath>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="36" fill="#000" opacity=".35"/>

  <!-- ===== CORPS EN VERRE (contour miroite, symetrie exacte) ===== -->
  <path d="M416 160 L484 160
           C486 250 488 330 491 410
           C496 470 520 520 552 555
           C582 588 600 610 604 660
           C599 740 591 815 588 880
           C587 950 604 1060 615 1140
           C615 1200 600 1240 570 1262
           C535 1282 495 1290 450 1290
           C405 1290 365 1282 330 1262
           C300 1240 285 1200 285 1140
           C296 1060 313 950 312 880
           C309 815 301 740 296 660
           C300 610 318 588 348 555
           C380 520 404 470 409 410
           C412 330 414 250 416 160 Z"
        fill="url(#vimt-glass)"/>

  <!-- ===== LIQUIDE pourpre tres fonce, rempli jusqu'a mi-col ===== -->
  <path d="M481 362 L484 412
           C489 470 513 522 546 558
           C575 590 593 612 597 662
           C592 740 585 815 582 880
           C581 950 597 1060 608 1140
           C608 1198 595 1236 566 1256
           C532 1276 493 1282 450 1282
           C407 1282 368 1276 334 1256
           C305 1236 292 1198 292 1140
           C303 1060 319 950 318 880
           C315 815 308 740 303 662
           C307 612 325 590 354 558
           C387 522 411 470 416 412
           L419 362
           Q450 376 481 362 Z"
        fill="url(#vimt-liquid)"/>
  <!-- surface du liquide dans le col -->
  <ellipse cx="450" cy="362" rx="31" ry="9" fill="#5c2a8a"/>
  <ellipse cx="450" cy="361" rx="22" ry="5.5" fill="#7d44ae" opacity=".8"/>

  <g clip-path="url(#vimt-clip)">
    <!-- bords du verre tres sombres par-dessus le liquide -->
    <path d="M285 620 L322 620 L318 1290 L275 1290 Z" fill="#0c0316" opacity=".5"/>
    <path d="M578 620 L615 620 L625 1290 L582 1290 Z" fill="#0c0316" opacity=".5"/>
    <!-- fond de bouteille : verre epais -->
    <path d="M285 1170 Q320 1268 450 1272 Q580 1268 615 1170 L615 1290 L285 1290 Z"
          fill="#160724" opacity=".55"/>
    <path d="M340 1252 Q450 1284 560 1252 Q450 1236 340 1252 Z" fill="#4a2570" opacity=".5"/>

    <!-- bulles fines (sparkling) -->
    <g fill="#c9a0ee">
      <circle cx="416" cy="470" r="3.4" opacity=".5"/>
      <circle cx="475" cy="520" r="2.6" opacity=".45"/>
      <circle cx="372" cy="588" r="3.8" opacity=".42"/>
      <circle cx="522" cy="606" r="3" opacity=".45"/>
      <circle cx="448" cy="646" r="2.4" opacity=".4"/>
      <circle cx="352" cy="1130" r="3.6" opacity=".38"/>
      <circle cx="540" cy="1168" r="3" opacity=".4"/>
      <circle cx="470" cy="1215" r="2.6" opacity=".36"/>
    </g>

    <!-- reflet vertical blanc net a gauche -->
    <path d="M336 590 C322 780 320 990 330 1200 L350 1216 C340 990 342 780 356 606 Z"
          fill="url(#vimt-shine)" opacity=".65"/>
    <!-- gloss d'epaule gauche -->
    <path d="M388 508 C368 528 350 548 338 572 L352 584 C364 560 380 540 400 522 Z"
          fill="#fff" opacity=".45"/>
    <path d="M425 185 C421 250 421 300 424 352 L434 352 C431 300 431 250 435 185 Z"
          fill="#fff" opacity=".7"/>
    <!-- second reflet fin a droite (rim light) -->
    <path d="M597 500 C606 760 610 1000 601 1210 L592 1204 C601 1000 597 760 589 508 Z"
          fill="#e6d2fa" opacity=".5"/>
    <path d="M473 190 C476 250 477 300 475 350 L470 350 C472 300 471 250 468 190 Z"
          fill="#dcc4f2" opacity=".5"/>
  </g>

  <!-- ===== CAPSULE METAL violet fonce ===== -->
  <path d="M404 118 Q450 108 496 118 L498 158 Q450 150 402 158 Z" fill="url(#vimt-cap)"/>
  <rect x="402" y="118" width="96" height="46" rx="6" fill="url(#vimt-cap)"/>
  <path d="M402 118 Q450 106 498 118 L498 126 Q450 114 402 126 Z" fill="#8a62ba" opacity=".9"/>
  <g stroke="#0e0420" stroke-width="3" opacity=".55">
    <line x1="414" y1="120" x2="414" y2="162"/>
    <line x1="428" y1="118" x2="428" y2="163"/>
    <line x1="442" y1="117" x2="442" y2="164"/>
    <line x1="458" y1="117" x2="458" y2="164"/>
    <line x1="472" y1="118" x2="472" y2="163"/>
    <line x1="486" y1="120" x2="486" y2="162"/>
  </g>
  <rect x="408" y="120" width="14" height="42" rx="6" fill="#fff" opacity=".3"/>
  <!-- jupe de la capsule sur le col -->
  <path d="M402 158 Q450 150 498 158 L498 174 Q450 166 402 174 Z" fill="#22093e"/>
  <path d="M402 166 Q450 158 498 166 L498 174 Q450 166 402 174 Z" fill="#000" opacity=".3"/>

  <!-- bague de verre sous la capsule -->
  <path d="M413 196 Q450 203 487 196 L487 210 Q450 217 413 210 Z" fill="#8a62ba" opacity=".4"/>

  <!-- ===== PETITE ETIQUETTE DE COL ===== -->
  <g>
    <rect x="414" y="266" width="72" height="86" rx="11" fill="url(#vimt-necklabel)"/>
    <rect x="414" y="266" width="72" height="86" rx="11" fill="none" stroke="#e9d6fa" stroke-width="2" opacity=".55"/>
    <path d="M433 282 L450 316 L467 282" fill="none" stroke="#ffffff" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="450" y="342" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="15" font-weight="700" letter-spacing="1.5" fill="#ffffff">VIMTO</text>
  </g>

  <!-- ===== GRANDE ETIQUETTE VIOLETTE enveloppante ===== -->
  <g>
    <path d="M304 700 Q450 724 596 700
             C590 770 584 830 585 900
             C586 970 596 1030 604 1080
             Q450 1104 296 1080
             C304 1030 314 970 315 900
             C316 830 310 770 304 700 Z"
          fill="url(#vimt-label)"/>
    <!-- courbure cylindre : lumiere a gauche, ombre a droite -->
    <path d="M304 700 Q356 709 384 712 C378 840 378 962 384 1090 Q352 1086 296 1080
             C304 1030 314 970 315 900 C316 830 310 770 304 700 Z"
          fill="#ffffff" opacity=".08"/>
    <path d="M540 706 Q574 703 596 700 C590 770 584 830 585 900 C586 970 596 1030 604 1080
             Q576 1084 544 1087 C550 962 548 838 540 706 Z"
          fill="#1a0530" opacity=".28"/>
    <!-- ombre portee de l'etiquette sur le verre -->
    <path d="M304 692 Q450 716 596 692 L596 700 Q450 724 304 700 Z" fill="#0e0318" opacity=".5"/>
    <path d="M296 1080 Q450 1104 604 1080 L606 1090 Q450 1114 294 1090 Z" fill="#0e0318" opacity=".5"/>

    <!-- SINCE 1908 -->
    <text x="324" y="742" font-family="'Space Grotesk',sans-serif" font-size="17"
          font-weight="600" letter-spacing="2.5" fill="#e8d7f7">SINCE 1908</text>

    <!-- GRAND V blanc, pointes arrondies, presque toute la hauteur -->
    <path d="M376 764 L450 992 L524 764" fill="none" stroke="#ffffff" stroke-width="58"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M376 764 L450 992 L524 764" fill="none" stroke="#e2ccf4" stroke-width="58"
          stroke-linecap="round" stroke-linejoin="round" opacity=".22"/>

    <!-- semis de points bulles rouges / blancs / gris -->
    <g>
      <circle cx="332" cy="948" r="7" fill="#e02d2d" opacity=".9"/>
      <circle cx="352" cy="1000" r="5" fill="#ffffff" opacity=".85"/>
      <circle cx="326" cy="1034" r="6" fill="#b9a6c9" opacity=".8"/>
      <circle cx="360" cy="1052" r="8" fill="#e02d2d" opacity=".85"/>
      <circle cx="392" cy="1072" r="4.5" fill="#ffffff" opacity=".8"/>
      <circle cx="430" cy="1078" r="6" fill="#b9a6c9" opacity=".75"/>
      <circle cx="524" cy="1070" r="7.5" fill="#e02d2d" opacity=".85"/>
      <circle cx="404" cy="1008" r="4" fill="#ffffff" opacity=".8"/>
      <circle cx="534" cy="1044" r="5.5" fill="#b9a6c9" opacity=".8"/>
      <circle cx="562" cy="1006" r="7" fill="#e02d2d" opacity=".9"/>
      <circle cx="574" cy="952" r="4.5" fill="#ffffff" opacity=".85"/>
      <circle cx="548" cy="1066" r="4" fill="#ffffff" opacity=".75"/>
      <circle cx="388" cy="984" r="3.5" fill="#e02d2d" opacity=".7"/>
      <circle cx="516" cy="984" r="3.5" fill="#b9a6c9" opacity=".7"/>
    </g>

    <!-- VIMTO rouge contour blanc, lettres sautillantes -->
    <g font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="85"
       fill="#e02d2d" stroke="#ffffff" stroke-width="13" stroke-linejoin="round"
       paint-order="stroke" text-anchor="middle">
      <text x="360" y="924" transform="rotate(-6 360 898)">V</text>
      <text x="405" y="916" transform="rotate(5 405 890)">I</text>
      <text x="456" y="922" transform="rotate(-4 456 896)">M</text>
      <text x="509" y="914" transform="rotate(6 509 888)">T</text>
      <text x="556" y="922" transform="rotate(-5 556 896)">O</text>
    </g>

    <!-- Sparkling -->
    <text x="450" y="1050" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="31" font-weight="500" font-style="italic" letter-spacing="3"
          fill="#ffffff">Sparkling</text>

    <!-- 60cl -->
    <text x="450" y="1082" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="19" font-weight="600" letter-spacing="1" fill="#e8d7f7">60cl</text>
  </g>

  <!-- ===== CONDENSATION abondante ===== -->
  <g fill="#eaf0ff" clip-path="url(#vimt-clip)">
    <circle cx="346" cy="452" r="5" opacity=".55"/>
    <circle cx="560" cy="500" r="6.5" opacity=".6"/>
    <circle cx="318" cy="560" r="4" opacity=".5"/>
    <circle cx="596" cy="600" r="4.5" opacity=".55"/>
    <circle cx="368" cy="640" r="7" opacity=".62"/>
    <path d="M336 668 q-6 20 0 32 q9 -8 4 -30 Z" opacity=".6"/>
    <circle cx="576" cy="668" r="5" opacity=".5"/>
    <path d="M588 720 q6 18 1 30 q-9 -7 -5 -28 Z" opacity=".55"/>
    <circle cx="322" cy="760" r="5.5" opacity=".55"/>
    <circle cx="586" cy="836" r="4" opacity=".45"/>
    <circle cx="314" cy="880" r="6" opacity=".58"/>
    <path d="M594 906 q5 16 0 26 q-8 -6 -4 -24 Z" opacity=".5"/>
    <circle cx="310" cy="1000" r="4.5" opacity=".48"/>
    <circle cx="600" cy="1010" r="5.5" opacity=".52"/>
    <circle cx="300" cy="1096" r="6.5" opacity=".6"/>
    <circle cx="606" cy="1120" r="7" opacity=".62"/>
    <path d="M320 1140 q-6 20 0 34 q9 -8 4 -32 Z" opacity=".58"/>
    <circle cx="560" cy="1198" r="5" opacity=".5"/>
    <circle cx="396" cy="1248" r="6" opacity=".55"/>
    <circle cx="506" cy="1256" r="4.5" opacity=".48"/>
    <circle cx="470" cy="300" r="3.5" opacity=".5"/>
    <circle cx="428" cy="418" r="4" opacity=".5"/>
    <circle cx="352" cy="512" r="8" opacity=".55"/>
    <circle cx="349" cy="509" r="3" fill="#ffffff" opacity=".7"/>
    <circle cx="584" cy="770" r="7.5" opacity=".55"/>
    <circle cx="581" cy="767" r="2.8" fill="#ffffff" opacity=".7"/>
    <circle cx="318" cy="944" r="7" opacity=".55"/>
    <circle cx="315.5" cy="941.5" r="2.6" fill="#ffffff" opacity=".7"/>
    <circle cx="594" cy="1178" r="8" opacity=".6"/>
    <circle cx="591" cy="1175" r="3" fill="#ffffff" opacity=".7"/>
    <path d="M342 820 q-6 22 0 36 q9 -9 4 -34 Z" opacity=".55"/>
  </g>
</svg>
