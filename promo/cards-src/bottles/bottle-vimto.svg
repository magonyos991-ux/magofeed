<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <linearGradient id="vimt-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6d2f8"/>
      <stop offset=".18" stop-color="#cfaef0"/>
      <stop offset=".45" stop-color="#a878da"/>
      <stop offset=".68" stop-color="#8352b8"/>
      <stop offset=".88" stop-color="#5f3392"/>
      <stop offset="1" stop-color="#472370"/>
    </linearGradient>
    <linearGradient id="vimt-liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9455d2"/>
      <stop offset=".24" stop-color="#6d34a6"/>
      <stop offset=".5" stop-color="#5c2a8a"/>
      <stop offset=".78" stop-color="#421d62"/>
      <stop offset="1" stop-color="#2e1247"/>
    </linearGradient>
    <radialGradient id="vimt-glow" cx=".36" cy=".32" r=".85">
      <stop offset="0" stop-color="#c46ad8" stop-opacity=".32"/>
      <stop offset=".5" stop-color="#9a4fc0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#9a4fc0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vimt-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5cbe"/>
      <stop offset=".35" stop-color="#5a3190"/>
      <stop offset=".7" stop-color="#41216c"/>
      <stop offset="1" stop-color="#2a1149"/>
    </linearGradient>
    <linearGradient id="vimt-label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a56fdd"/>
      <stop offset=".35" stop-color="#7a3fb8"/>
      <stop offset=".75" stop-color="#6a34a6"/>
      <stop offset="1" stop-color="#54278a"/>
    </linearGradient>
    <linearGradient id="vimt-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d98a"/>
      <stop offset=".5" stop-color="#e0a83c"/>
      <stop offset="1" stop-color="#c98f2a"/>
    </linearGradient>
    <linearGradient id="vimt-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="vimt-berry" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#8a5cbe"/>
      <stop offset=".4" stop-color="#4a2570"/>
      <stop offset="1" stop-color="#2a1042"/>
    </radialGradient>
    <radialGradient id="vimt-grape" cx=".35" cy=".28" r="1">
      <stop offset="0" stop-color="#d8aaf2"/>
      <stop offset=".45" stop-color="#9a5cd0"/>
      <stop offset="1" stop-color="#5a2b8a"/>
    </radialGradient>
    <radialGradient id="vimt-rasp" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#ff8fb8"/>
      <stop offset=".55" stop-color="#e8568f"/>
      <stop offset="1" stop-color="#c23a72"/>
    </radialGradient>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="270" ry="40" fill="#000" opacity=".35"/>

  <!-- corps trapu au col court, epaules hautes -->
  <path d="M408 196 L408 232
           C408 260 392 278 362 296
           Q262 348 262 460
           L262 1142
           Q262 1288 450 1288
           Q638 1288 638 1142
           L638 460
           Q638 348 538 296
           C508 278 492 260 492 232
           L492 196 Z"
        fill="url(#vimt-glass)"/>

  <!-- liquide violet profond, ligne de surface sous l'epaule -->
  <path d="M273 446 Q450 398 627 446
           L628 1142
           Q628 1280 450 1280
           Q272 1280 272 1142 Z"
        fill="url(#vimt-liquid)" opacity=".97"/>
  <!-- surface du liquide -->
  <path d="M273 446 Q450 398 627 446 Q450 488 273 446 Z" fill="#b57de8" opacity=".8"/>
  <!-- lueur gourmande dans le liquide -->
  <path d="M273 446 Q450 398 627 446
           L628 1142
           Q628 1280 450 1280
           Q272 1280 272 1142 Z"
        fill="url(#vimt-glow)"/>
  <!-- profondeur au fond -->
  <path d="M272 1146 Q272 1280 450 1280 Q628 1280 628 1146 Q450 1236 272 1146 Z"
        fill="#241038" opacity=".38"/>

  <!-- bulles -->
  <g fill="#ffffff">
    <circle cx="376" cy="620" r="8" opacity=".45"/>
    <circle cx="452" cy="530" r="6" opacity=".38"/>
    <circle cx="532" cy="596" r="10" opacity=".42"/>
    <circle cx="498" cy="490" r="5" opacity=".36"/>
    <circle cx="392" cy="512" r="6" opacity=".32"/>
    <circle cx="470" cy="706" r="7" opacity=".4"/>
    <circle cx="544" cy="1130" r="9" opacity=".42"/>
    <circle cx="380" cy="1184" r="6" opacity=".34"/>
  </g>

  <!-- bouchon violet fonce -->
  <rect x="386" y="120" width="128" height="82" rx="15" fill="url(#vimt-cap)"/>
  <g stroke="#1e0b38" stroke-width="4" opacity=".45">
    <line x1="404" y1="128" x2="404" y2="194"/><line x1="424" y1="126" x2="424" y2="196"/>
    <line x1="444" y1="125" x2="444" y2="197"/><line x1="464" y1="125" x2="464" y2="197"/>
    <line x1="484" y1="126" x2="484" y2="196"/><line x1="500" y1="129" x2="500" y2="193"/>
  </g>
  <rect x="386" y="120" width="34" height="82" rx="15" fill="#fff" opacity=".25"/>
  <rect x="392" y="196" width="116" height="12" rx="6" fill="#2a1149"/>

  <!-- etiquette -->
  <g>
    <rect x="262" y="768" width="376" height="296" fill="url(#vimt-label)"/>
    <rect x="262" y="768" width="376" height="8" fill="url(#vimt-gold)"/>
    <rect x="262" y="1056" width="376" height="8" fill="url(#vimt-gold)"/>
    <rect x="262" y="776" width="376" height="16" fill="#ffffff" opacity=".14"/>
    <g transform="rotate(-6 450 900)">
      <text x="450" y="928" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
            font-size="96" font-weight="700" letter-spacing="4" fill="#ffffff">VIMTO</text>
    </g>
    <g transform="rotate(-6 450 992)">
      <line x1="336" y1="984" x2="396" y2="984" stroke="url(#vimt-gold)" stroke-width="3"/>
      <line x1="504" y1="984" x2="564" y2="984" stroke="url(#vimt-gold)" stroke-width="3"/>
      <text x="450" y="994" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
            font-size="25" font-weight="600" letter-spacing="7" fill="#f4cd66">DEPUIS 1908</text>
    </g>
  </g>

  <!-- reflets : lumiere haut-gauche -->
  <path d="M296 372 Q282 720 294 1210 Q298 1260 328 1270 Q308 1080 308 830 Q308 540 320 376 Z"
        fill="url(#vimt-shine)" opacity=".6"/>
  <rect x="414" y="206" width="12" height="46" rx="6" fill="#fff" opacity=".6"/>
  <path d="M322 322 Q362 292 392 266 L418 266 Q388 300 342 332 Z" fill="#fff" opacity=".4"/>
  <path d="M604 400 Q622 760 612 1180 Q608 1250 576 1266 Q598 1050 598 820 Q598 560 590 404 Z"
        fill="#1a0830" opacity=".38"/>

  <!-- condensation -->
  <g fill="#f3e9ff">
    <circle cx="334" cy="520" r="6" opacity=".62"/>
    <circle cx="580" cy="548" r="5" opacity=".55"/>
    <circle cx="318" cy="668" r="7" opacity=".6"/>
    <circle cx="594" cy="706" r="5" opacity=".5"/>
    <circle cx="326" cy="1122" r="7" opacity=".6"/>
    <circle cx="586" cy="1162" r="6" opacity=".55"/>
    <circle cx="382" cy="1242" r="5" opacity=".5"/>
    <circle cx="502" cy="378" r="4" opacity=".55"/>
    <path d="M598 900 q6 14 0 22 q-8 -6 -4 -20 Z" opacity=".55"/>
    <path d="M310 940 q-6 16 0 26 q9 -7 4 -24 Z" opacity=".6"/>
  </g>

  <!-- trio de fruits : framboise, cassis, raisin -->
  <g>
    <!-- framboise (gauche) -->
    <g>
      <path d="M156 962 q-14 -20 -30 -22 q14 20 24 24 Z" fill="#4a8f4f"/>
      <path d="M162 960 q4 -24 20 -32 q-2 24 -12 32 Z" fill="#5aa35f"/>
      <circle cx="134" cy="986" r="13" fill="url(#vimt-rasp)"/>
      <circle cx="158" cy="980" r="13" fill="url(#vimt-rasp)"/>
      <circle cx="182" cy="986" r="13" fill="url(#vimt-rasp)"/>
      <circle cx="124" cy="1010" r="13" fill="url(#vimt-rasp)"/>
      <circle cx="147" cy="1006" r="13" fill="url(#vimt-rasp)"/>
      <circle cx="171" cy="1006" r="13" fill="url(#vimt-rasp)"/>
      <circle cx="192" cy="1010" r="13" fill="url(#vimt-rasp)"/>
      <circle cx="134" cy="1034" r="13" fill="url(#vimt-rasp)"/>
      <circle cx="158" cy="1032" r="13" fill="url(#vimt-rasp)"/>
      <circle cx="182" cy="1034" r="13" fill="url(#vimt-rasp)"/>
      <circle cx="146" cy="1056" r="12" fill="url(#vimt-rasp)"/>
      <circle cx="170" cy="1056" r="12" fill="url(#vimt-rasp)"/>
      <circle cx="158" cy="1074" r="11" fill="url(#vimt-rasp)"/>
      <circle cx="152" cy="978" r="4" fill="#ffd3e4" opacity=".8"/>
      <circle cx="130" cy="1006" r="4" fill="#ffd3e4" opacity=".7"/>
      <circle cx="176" cy="1030" r="3.5" fill="#ffd3e4" opacity=".7"/>
    </g>
    <!-- cassis x2 (droite haut) -->
    <g>
      <line x1="722" y1="908" x2="736" y2="944" stroke="#4a2a12" stroke-width="5" stroke-linecap="round"/>
      <line x1="722" y1="908" x2="778" y2="972" stroke="#4a2a12" stroke-width="5" stroke-linecap="round"/>
      <circle cx="736" cy="978" r="34" fill="url(#vimt-berry)"/>
      <ellipse cx="724" cy="964" rx="10" ry="7" fill="#c9a4ea" opacity=".7" transform="rotate(-28 724 964)"/>
      <path d="M730 1010 l6 8 l6 -8 l-6 -3 Z" fill="#1c0b2e"/>
      <circle cx="786" cy="1020" r="28" fill="url(#vimt-berry)"/>
      <ellipse cx="776" cy="1008" rx="8" ry="6" fill="#c9a4ea" opacity=".7" transform="rotate(-28 776 1008)"/>
      <path d="M781 1046 l5 7 l5 -7 l-5 -3 Z" fill="#1c0b2e"/>
    </g>
    <!-- grain de raisin (droite bas) -->
    <g>
      <line x1="728" y1="1112" x2="720" y2="1136" stroke="#5aa35f" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="716" cy="1180" rx="34" ry="44" fill="url(#vimt-grape)"/>
      <ellipse cx="704" cy="1160" rx="10" ry="15" fill="#ecd6fb" opacity=".75" transform="rotate(-18 704 1160)"/>
    </g>
  </g>
</svg>
