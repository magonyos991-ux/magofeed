    <line x1="435" y1="115" x2="435" y2="181"/><line x1="453" y1="115" x2="453" y2="181"/>
    <line x1="471" y1="115" x2="471" y2="181"/><line x1="489" y1="116" x2="489" y2="180"/>
    <line x1="505" y1="119" x2="505" y2="177"/>
  </g>
  <rect x="388" y="114" width="26" height="66" rx="10" fill="#fff" opacity=".28"/>
  <!-- bague d'inviolabilite -->
  <rect x="392" y="182" width="116" height="14" rx="7" fill="#31135a"/>
  <rect x="392" y="182" width="24" height="14" rx="7" fill="#fff" opacity=".18"/>

  <!-- col : filet et reflet plastique -->
  <path d="M410 240 Q450 250 490 240 L490 252 Q450 262 410 252 Z" fill="#8a5cbe" opacity=".55"/>

