  <path d="M352 350 Q450 322 548 350 Q450 372 352 350 Z" fill="#e2b8f8" opacity=".4"/>
  <!-- lueur gourmande -->
  <path d="M338 350 C310 384 296 420 295 466 L294 648 C294 724 309 758 309 822 L309 946
           C309 1006 294 1042 294 1118 L294 1202 Q294 1284 404 1284 L496 1284
           Q606 1284 606 1202 L606 1118 C606 1042 591 1006 591 946 L591 822
           C591 758 606 724 606 648 L606 466 C605 420 590 384 562 350 Q450 314 338 350 Z"
        fill="url(#vimt-glow)"/>
  <!-- profondeur au fond -->
  <path d="M294 1150 Q300 1284 450 1284 Q600 1284 606 1150 Q450 1240 294 1150 Z"
        fill="#1c0830" opacity=".4"/>

  <!-- bulles fines -->
  <g fill="#ffffff">
