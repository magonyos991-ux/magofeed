      <path d="M-17 0 l3 5 l3 -5 l-3 -2 Z" fill="#120524"/>
      <circle cx="16" cy="-8" r="13.5" fill="url(#vimt-cassis)" stroke="#c9a4ea" stroke-width="1.6" stroke-opacity=".6"/>
      <path d="M13 5 l3 4.5 l3 -4.5 l-3 -2 Z" fill="#120524"/>
      <circle cx="-2" cy="16" r="14" fill="url(#vimt-cassis)" stroke="#c9a4ea" stroke-width="1.6" stroke-opacity=".6"/>
