    <circle cx="448" cy="470" r="4.5" opacity=".38"/>
    <circle cx="528" cy="540" r="7" opacity=".42"/>
    <circle cx="492" cy="420" r="4" opacity=".34"/>
    <circle cx="396" cy="640" r="5" opacity=".34"/>
    <circle cx="512" cy="628" r="5.5" opacity=".36"/>
    <circle cx="540" cy="1140" r="7" opacity=".4"/>
    <circle cx="378" cy="1190" r="5" opacity=".32"/>
  </g>

  <!-- ===== BOUCHON violet fonce crante ===== -->
  <path d="M398 176 Q450 168 502 176 L502 190 L398 190 Z" fill="#2a1149"/>
  <rect x="384" y="112" width="132" height="70" rx="10" fill="url(#vimt-cap)"/>
  <path d="M384 122 Q450 106 516 122 L516 132 Q450 118 384 132 Z" fill="#8a5cbe" opacity=".8"/>
  <g stroke="#180736" stroke-width="4.5" opacity=".5">
