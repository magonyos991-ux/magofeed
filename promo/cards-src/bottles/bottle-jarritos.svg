<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <linearGradient id="jarr-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef9c4e"/>
      <stop offset=".18" stop-color="#f8ba76"/>
      <stop offset=".5" stop-color="#e0741f"/>
      <stop offset=".8" stop-color="#ad4a0b"/>
      <stop offset="1" stop-color="#7c3204"/>
    </linearGradient>
    <linearGradient id="jarr-liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb866"/>
      <stop offset=".2" stop-color="#ff9c48"/>
      <stop offset=".5" stop-color="#ff8a3d"/>
      <stop offset=".78" stop-color="#ef6417"/>
      <stop offset="1" stop-color="#c44c08"/>
    </linearGradient>
    <linearGradient id="jarr-glasstop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe7cd"/>
      <stop offset=".5" stop-color="#ffcfa2"/>
      <stop offset="1" stop-color="#e3a067"/>
    </linearGradient>
    <linearGradient id="jarr-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc987"/>
      <stop offset=".42" stop-color="#ff9438"/>
      <stop offset=".8" stop-color="#d95c12"/>
      <stop offset="1" stop-color="#a8440b"/>
    </linearGradient>
    <linearGradient id="jarr-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffddb2"/>
      <stop offset=".5" stop-color="#ff9c4c"/>
      <stop offset="1" stop-color="#cf5710"/>
    </linearGradient>
    <linearGradient id="jarr-label" x1="0" y1="0" x2="1" y2=".25">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#faf3e7"/>
      <stop offset="1" stop-color="#e8dbc5"/>
    </linearGradient>
    <linearGradient id="jarr-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="jarr-flesh" cx=".42" cy=".25" r="1">
      <stop offset="0" stop-color="#ffd58c"/>
      <stop offset=".45" stop-color="#ffa64f"/>
      <stop offset=".8" stop-color="#f57a1e"/>
      <stop offset="1" stop-color="#df610c"/>
    </radialGradient>
    <linearGradient id="jarr-rind" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb763"/>
      <stop offset=".55" stop-color="#f58324"/>
      <stop offset="1" stop-color="#d95f10"/>
    </linearGradient>
    <linearGradient id="jarr-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93d15e"/>
      <stop offset=".55" stop-color="#4f9a33"/>
      <stop offset="1" stop-color="#2c6a21"/>
    </linearGradient>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="270" ry="40" fill="#000" opacity=".35"/>

  <!-- silhouette Jarritos : long cou fin + corps trapu aux flancs droits -->
  <path d="M412 178 L406 615
           Q406 668 358 700 Q268 752 264 852
           L264 1174 Q264 1290 450 1290 Q636 1290 636 1174
           L636 852 Q632 752 542 700 Q494 668 494 615
           L488 178 Z"
        fill="url(#jarr-glass)"/>

  <!-- liquide orange mandarine -->
  <path d="M413 236 L413 613
           Q413 664 366 694 Q276 746 272 852
           L272 1172 Q272 1282 450 1282 Q628 1282 628 1172
           L628 852 Q624 746 534 694 Q487 664 487 613
           L487 236 Z"
        fill="url(#jarr-liquid)" opacity=".97"/>

  <!-- haut du col vide + surface du liquide -->
  <rect x="409" y="182" width="82" height="44" rx="8" fill="url(#jarr-glasstop)" opacity=".75"/>
  <ellipse cx="450" cy="232" rx="37" ry="8" fill="#ffd9a8" opacity=".9"/>

  <!-- bulles -->
  <g fill="#ffffff">
    <circle cx="450" cy="400" r="4" opacity=".45"/>
    <circle cx="438" cy="560" r="3.5" opacity=".4"/>
    <circle cx="462" cy="478" r="4" opacity=".42"/>
    <circle cx="398" cy="902" r="6" opacity=".42"/>
    <circle cx="480" cy="918" r="5" opacity=".38"/>
    <circle cx="432" cy="860" r="4" opacity=".35"/>
    <circle cx="362" cy="1198" r="8" opacity=".45"/>
    <circle cx="500" cy="1232" r="6" opacity=".4"/>
    <circle cx="556" cy="1180" r="7" opacity=".35"/>
  </g>

  <!-- fond de verre epais -->
  <ellipse cx="450" cy="1266" rx="165" ry="20" fill="#7c3204" opacity=".32"/>

  <!-- stries fines du col (5 anneaux rapproches) -->
  <g>
    <rect x="398" y="330" width="104" height="13" rx="6.5" fill="url(#jarr-ring)" opacity=".9"/>
    <rect x="398" y="339" width="104" height="3" rx="1.5" fill="#a8440e" opacity=".38"/>
    <rect x="404" y="332" width="30" height="3.5" rx="1.75" fill="#fff" opacity=".55"/>
    <rect x="398" y="372" width="104" height="13" rx="6.5" fill="url(#jarr-ring)" opacity=".9"/>
    <rect x="398" y="381" width="104" height="3" rx="1.5" fill="#a8440e" opacity=".38"/>
    <rect x="404" y="374" width="30" height="3.5" rx="1.75" fill="#fff" opacity=".55"/>
    <rect x="398" y="414" width="104" height="13" rx="6.5" fill="url(#jarr-ring)" opacity=".9"/>
    <rect x="398" y="423" width="104" height="3" rx="1.5" fill="#a8440e" opacity=".38"/>
    <rect x="404" y="416" width="30" height="3.5" rx="1.75" fill="#fff" opacity=".55"/>
    <rect x="398" y="456" width="104" height="13" rx="6.5" fill="url(#jarr-ring)" opacity=".9"/>
    <rect x="398" y="465" width="104" height="3" rx="1.5" fill="#a8440e" opacity=".38"/>
    <rect x="404" y="458" width="30" height="3.5" rx="1.75" fill="#fff" opacity=".55"/>
    <rect x="398" y="498" width="104" height="13" rx="6.5" fill="url(#jarr-ring)" opacity=".9"/>
    <rect x="398" y="507" width="104" height="3" rx="1.5" fill="#a8440e" opacity=".38"/>
    <rect x="404" y="500" width="30" height="3.5" rx="1.75" fill="#fff" opacity=".55"/>
  </g>

  <!-- bague sous capsule -->
  <rect x="402" y="176" width="96" height="12" rx="6" fill="url(#jarr-ring)"/>

  <!-- capsule couronne orange -->
  <path d="M390 120 L510 120 Q517 120 517 129 L517 158
           L505 177 L493 158 L481 177 L469 158 L457 177 L445 158 L433 177
           L421 158 L409 177 L397 158 L385 174 L383 158
           L383 129 Q383 120 390 120 Z"
        fill="url(#jarr-cap)"/>
  <rect x="383" y="142" width="134" height="6" fill="#a8440e" opacity=".38"/>
  <rect x="394" y="127" width="24" height="9" rx="4.5" fill="#fff" opacity=".5"/>

  <!-- etiquette blanche ronde-rectangulaire -->
  <g>
    <rect x="290" y="940" width="320" height="210" rx="30" fill="url(#jarr-label)"/>
    <rect x="300" y="950" width="300" height="190" rx="22" fill="none" stroke="#f26f1a" stroke-width="3" opacity=".85"/>
    <!-- petite mandarine sur l'etiquette -->
    <circle cx="450" cy="992" r="22" fill="url(#jarr-flesh)"/>
    <ellipse cx="443" cy="985" rx="7" ry="5" fill="#fff" opacity=".55"/>
    <path d="M452 972 Q456 958 471 956 Q471 969 458 974 Z" fill="#4f9a33"/>
    <text x="450" y="1076" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="54" font-weight="700" letter-spacing="3" fill="#f26f1a">JARRITOS</text>
    <text x="450" y="1122" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="24" font-weight="600" letter-spacing="8" fill="#b8541c">MANDARINA</text>
  </g>

  <!-- reflets : lumiere haut-gauche -->
  <path d="M298 812 Q280 1010 292 1220 Q297 1258 325 1268 Q304 1130 304 1010 Q304 900 320 804 Z"
        fill="url(#jarr-shine)" opacity=".5"/>
  <ellipse cx="332" cy="742" rx="34" ry="15" fill="#fff" opacity=".3" transform="rotate(-34 332 742)"/>
  <rect x="416" y="292" width="13" height="298" rx="6.5" fill="#fff" opacity=".42"/>
  <rect x="412" y="194" width="10" height="46" rx="5" fill="#fff" opacity=".55"/>
  <path d="M610 814 Q624 1010 614 1214 Q608 1256 580 1268 Q599 1130 599 1010 Q599 902 588 810 Z"
        fill="#6b2a03" opacity=".35"/>

  <!-- condensation -->
  <g fill="#fff5ea">
    <circle cx="411" cy="468" r="4" opacity=".55"/>
    <circle cx="487" cy="544" r="4" opacity=".5"/>
    <circle cx="300" cy="988" r="6" opacity=".6"/>
    <circle cx="602" cy="1048" r="5" opacity=".55"/>
    <circle cx="322" cy="1178" r="7" opacity=".6"/>
    <circle cx="578" cy="1208" r="5" opacity=".5"/>
    <circle cx="350" cy="856" r="4" opacity=".5"/>
    <circle cx="505" cy="1246" r="6" opacity=".5"/>
    <path d="M608 1128 q6 14 0 22 q-8 -6 -4 -20 Z" opacity=".55"/>
    <path d="M294 1088 q-6 16 0 26 q9 -7 4 -24 Z" opacity=".6"/>
  </g>

  <!-- garniture : demi-rondelle d'orange + feuille -->
  <ellipse cx="722" cy="1262" rx="102" ry="15" fill="#000" opacity=".22"/>
  <g transform="translate(718 1168) rotate(-12)">
    <path d="M-100 0 A100 100 0 0 1 100 0 Z" fill="url(#jarr-rind)"/>
    <path d="M-89 0 A89 89 0 0 1 89 0 Z" fill="#ffe9cf"/>
    <path d="M-82 0 A82 82 0 0 1 82 0 Z" fill="url(#jarr-flesh)"/>
    <g stroke="#fff3e0" stroke-width="5.5" stroke-linecap="round">
      <line x1="0" y1="-3" x2="-75" y2="-20"/>
      <line x1="0" y1="-3" x2="-50" y2="-60"/>
      <line x1="0" y1="-3" x2="-7" y2="-78"/>
      <line x1="0" y1="-3" x2="39" y2="-67"/>
      <line x1="0" y1="-3" x2="71" y2="-33"/>
    </g>
    <rect x="-85" y="-3" width="170" height="5" fill="#ffe9cf" opacity=".9"/>
    <path d="M-64 -62 A88 88 0 0 1 -24 -84" fill="none" stroke="#fff" stroke-width="6" opacity=".5" stroke-linecap="round"/>
    <g transform="translate(-72 -70) rotate(-35)">
      <path d="M0 0 Q-32 -24 -17 -60 Q22 -49 9 -6 Z" fill="url(#jarr-leaf)"/>
      <path d="M-3 -8 Q-10 -30 -12 -50" fill="none" stroke="#2c6a21" stroke-width="3" opacity=".7"/>
    </g>
  </g>
</svg>
