<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <!-- verre clair (zones vides) -->
    <linearGradient id="jarr-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset=".22" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".62" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset=".88" stop-color="#3a1804" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".22"/>
    </linearGradient>
    <!-- liquide mandarine lumineux -->
    <linearGradient id="jarr-liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc36f"/>
      <stop offset=".16" stop-color="#ffa94f"/>
      <stop offset=".42" stop-color="#ff8f2e"/>
      <stop offset=".62" stop-color="#fb7a17"/>
      <stop offset=".84" stop-color="#e05f0a"/>
      <stop offset="1" stop-color="#a84205"/>
    </linearGradient>
    <linearGradient id="jarr-liquid-neck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffbd63"/>
      <stop offset=".35" stop-color="#ff9535"/>
      <stop offset=".72" stop-color="#f4700f"/>
      <stop offset="1" stop-color="#b84c06"/>
    </linearGradient>
    <linearGradient id="jarr-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffce8e"/>
      <stop offset=".3" stop-color="#ff9838"/>
      <stop offset=".68" stop-color="#ef6c12"/>
      <stop offset=".88" stop-color="#b64a0a"/>
      <stop offset="1" stop-color="#8c3506"/>
    </linearGradient>
    <linearGradient id="jarr-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd9a4"/>
      <stop offset=".3" stop-color="#ffa348"/>
      <stop offset=".68" stop-color="#f0700f"/>
      <stop offset=".9" stop-color="#b04a06"/>
      <stop offset="1" stop-color="#e8934c"/>
    </linearGradient>
    <linearGradient id="jarr-label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdfbf6"/>
      <stop offset=".14" stop-color="#ffffff"/>
      <stop offset=".68" stop-color="#f6efe2"/>
      <stop offset="1" stop-color="#ddccb0"/>
    </linearGradient>
    <linearGradient id="jarr-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="jarr-flesh" cx=".42" cy=".3" r="1">
      <stop offset="0" stop-color="#ffd58c"/>
      <stop offset=".45" stop-color="#ffa64f"/>
      <stop offset=".8" stop-color="#f57a1e"/>
      <stop offset="1" stop-color="#df610c"/>
    </radialGradient>
    <linearGradient id="jarr-rind" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb763"/>
      <stop offset=".55" stop-color="#f58324"/>
      <stop offset="1" stop-color="#d95f10"/>
    </linearGradient>
    <linearGradient id="jarr-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93d15e"/>
      <stop offset=".55" stop-color="#4f9a33"/>
      <stop offset="1" stop-color="#2c6a21"/>
    </linearGradient>
    <!-- arc pour le lettrage JARRITOS -->
    <path id="jarr-arc" d="M318 1076 Q450 1032 582 1076"/>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="38" fill="#000" opacity=".35"/>

  <!-- ===== SILHOUETTE : corps court et trapu, col tres long et fin ===== -->
  <!-- liquide (rempli jusque dans le col, surface a y=300) -->
  <path d="M411 300 L407 622
           C407 664 390 684 352 706
           C304 734 292 776 292 828
           L292 1196 Q292 1283 450 1283 Q608 1283 608 1196
           L608 828 C608 776 596 734 548 706
           C510 684 493 664 493 622
           L489 300 Z"
        fill="url(#jarr-liquid)"/>
  <!-- surface du liquide dans le col -->
  <ellipse cx="450" cy="300" rx="40" ry="9" fill="#ffd9a4"/>
  <ellipse cx="450" cy="302" rx="33" ry="6" fill="#ff9535" opacity=".8"/>

  <!-- lueur interne du liquide -->
  <ellipse cx="420" cy="1010" rx="120" ry="220" fill="#ffc36f" opacity=".28"/>

  <!-- bulles -->
  <g fill="#ffffff">
    <circle cx="452" cy="372" r="3.6" opacity=".5"/>
    <circle cx="440" cy="520" r="3.2" opacity=".45"/>
    <circle cx="461" cy="600" r="3.8" opacity=".45"/>
    <circle cx="386" cy="812" r="5" opacity=".42"/>
    <circle cx="470" cy="792" r="4" opacity=".4"/>
    <circle cx="352" cy="1218" r="7" opacity=".45"/>
    <circle cx="512" cy="1244" r="5.5" opacity=".4"/>
    <circle cx="556" cy="1200" r="6.5" opacity=".35"/>
  </g>

  <!-- verre par-dessus le liquide : reflets + teinte -->
  <path d="M404 178 L400 622
           C400 666 382 688 346 710
           C296 740 284 780 284 830
           L284 1198 Q284 1290 450 1290 Q616 1290 616 1198
           L616 830 C616 780 604 740 554 710
           C518 688 500 666 500 622
           L496 178 Z"
        fill="url(#jarr-glass)"/>

  <!-- col vide au-dessus du liquide : verre clair -->
  <path d="M404 178 L403 292 L497 292 L496 178 Z" fill="#fff3e2" opacity=".34"/>
  <path d="M408 184 L407 288 L413 288 L414 184 Z" fill="#fff" opacity=".4"/>

  <!-- fond de verre epais -->
  <path d="M300 1236 Q318 1276 450 1276 Q582 1276 600 1236 Q560 1268 450 1268 Q340 1268 300 1236 Z"
        fill="#6b2a03" opacity=".5"/>
  <ellipse cx="450" cy="1252" rx="128" ry="14" fill="#ffdcae" opacity=".18"/>

  <!-- ===== ANNEAUX DU COL (verre en relief : arc clair dessus / sombre dessous) ===== -->
  <g>
    <g transform="translate(0 336)">
      <rect x="394" y="0" width="112" height="17" rx="8.5" fill="url(#jarr-ring)"/>
      <path d="M398 4 Q450 -2 502 4" fill="none" stroke="#ffe9cc" stroke-width="3.5" opacity=".85"/>
      <path d="M398 14 Q450 20 502 14" fill="none" stroke="#8c3a06" stroke-width="3.5" opacity=".55"/>
      <rect x="404" y="3" width="18" height="10" rx="5" fill="#fff" opacity=".65"/>
    </g>
    <g transform="translate(0 390)">
      <rect x="394" y="0" width="112" height="17" rx="8.5" fill="url(#jarr-ring)"/>
      <path d="M398 4 Q450 -2 502 4" fill="none" stroke="#ffe9cc" stroke-width="3.5" opacity=".85"/>
      <path d="M398 14 Q450 20 502 14" fill="none" stroke="#8c3a06" stroke-width="3.5" opacity=".55"/>
      <rect x="404" y="3" width="18" height="10" rx="5" fill="#fff" opacity=".65"/>
    </g>
    <g transform="translate(0 444)">
      <rect x="394" y="0" width="112" height="17" rx="8.5" fill="url(#jarr-ring)"/>
      <path d="M398 4 Q450 -2 502 4" fill="none" stroke="#ffe9cc" stroke-width="3.5" opacity=".85"/>
      <path d="M398 14 Q450 20 502 14" fill="none" stroke="#8c3a06" stroke-width="3.5" opacity=".55"/>
      <rect x="404" y="3" width="18" height="10" rx="5" fill="#fff" opacity=".65"/>
    </g>
    <g transform="translate(0 498)">
      <rect x="394" y="0" width="112" height="17" rx="8.5" fill="url(#jarr-ring)"/>
      <path d="M398 4 Q450 -2 502 4" fill="none" stroke="#ffe9cc" stroke-width="3.5" opacity=".85"/>
      <path d="M398 14 Q450 20 502 14" fill="none" stroke="#8c3a06" stroke-width="3.5" opacity=".55"/>
      <rect x="404" y="3" width="18" height="10" rx="5" fill="#fff" opacity=".65"/>
    </g>
    <g transform="translate(0 552)">
      <rect x="394" y="0" width="112" height="17" rx="8.5" fill="url(#jarr-ring)"/>
      <path d="M398 4 Q450 -2 502 4" fill="none" stroke="#ffe9cc" stroke-width="3.5" opacity=".85"/>
      <path d="M398 14 Q450 20 502 14" fill="none" stroke="#8c3a06" stroke-width="3.5" opacity=".55"/>
      <rect x="404" y="3" width="18" height="10" rx="5" fill="#fff" opacity=".65"/>
    </g>
  </g>

  <!-- bague de buvant sous la capsule -->
  <rect x="396" y="168" width="108" height="15" rx="7.5" fill="url(#jarr-ring)"/>
  <path d="M400 172 Q450 166 500 172" fill="none" stroke="#ffe9cc" stroke-width="3" opacity=".8"/>

  <!-- ===== CAPSULE COURONNE ORANGE ===== -->
  <g>
    <path d="M390 112 Q450 104 510 112 L512 150 L388 150 Z" fill="url(#jarr-cap)"/>
    <!-- jupe crantee -->
    <path d="M388 148 L512 148 L519 172 L506 156 L496 173 L484 156 L474 174 L462 156 L450 174
             L438 156 L426 174 L416 156 L404 173 L394 156 L381 172 Z"
          fill="url(#jarr-cap)"/>
    <path d="M388 148 L512 148 L514 156 L386 156 Z" fill="#8c3506" opacity=".4"/>
    <!-- stries verticales de la capsule -->
    <g stroke="#8c3506" stroke-width="2" opacity=".35">
      <line x1="408" y1="114" x2="406" y2="148"/>
      <line x1="428" y1="112" x2="427" y2="148"/>
      <line x1="450" y1="111" x2="450" y2="148"/>
      <line x1="472" y1="112" x2="473" y2="148"/>
      <line x1="492" y1="114" x2="494" y2="148"/>
    </g>
    <rect x="398" y="118" width="26" height="11" rx="5.5" fill="#fff" opacity=".55"/>
    <path d="M392 112 Q450 105 508 112" fill="none" stroke="#ffd9a4" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ===== ETIQUETTE blanche presque carree, bords suivant la courbure ===== -->
  <g>
    <path d="M310 884 Q450 866 590 884 Q599 1028 590 1172 Q450 1190 310 1172 Q301 1028 310 884 Z"
          fill="url(#jarr-label)"/>
    <path d="M323 897 Q450 881 577 897 Q585 1028 577 1159 Q450 1175 323 1159 Q315 1028 323 897 Z"
          fill="none" stroke="#f26f1a" stroke-width="3.5" opacity=".9"/>
    <!-- ombre de courbure sur l'etiquette -->
    <path d="M540 878 Q590 884 590 884 Q599 1028 590 1172 Q540 1178 540 1178 Q550 1028 540 878 Z"
          fill="#b98c58" opacity=".28"/>
    <path d="M310 884 Q330 881 344 880 Q334 1028 344 1176 Q330 1175 310 1172 Q301 1028 310 884 Z"
          fill="#fff" opacity=".5"/>
    <!-- petite mandarine illustree avec feuille -->
    <g transform="translate(450 940)">
      <circle r="27" fill="url(#jarr-flesh)"/>
      <ellipse cx="-9" cy="-9" rx="9" ry="6.5" fill="#fff" opacity=".55"/>
      <circle cx="0" cy="10" r="1.6" fill="#c85708" opacity=".5"/>
      <circle cx="-12" cy="4" r="1.6" fill="#c85708" opacity=".5"/>
      <circle cx="11" cy="2" r="1.6" fill="#c85708" opacity=".5"/>
      <path d="M2 -26 Q4 -34 10 -37" fill="none" stroke="#7a4a1c" stroke-width="3" stroke-linecap="round"/>
      <path d="M6 -32 Q12 -48 30 -46 Q27 -28 8 -27 Z" fill="url(#jarr-leaf)"/>
    </g>
    <!-- JARRITOS arque vers le haut -->
    <text font-family="'Space Grotesk',sans-serif" font-size="58" font-weight="700"
          letter-spacing="2" fill="#f26f1a">
      <textPath href="#jarr-arc" startOffset="50%" text-anchor="middle">JARRITOS</textPath>
    </text>
    <text x="450" y="1128" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="27" font-weight="600" letter-spacing="9" fill="#bf5313">MANDARINA</text>
    <text x="450" y="1156" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="15" font-weight="500" letter-spacing="3" fill="#a08154">REFRESCO 370 ml</text>
  </g>

  <!-- ===== REFLETS DU VERRE ===== -->
  <!-- reflet vertical net sur le corps, cote gauche -->
  <path d="M312 790 Q296 1010 306 1210 Q311 1252 336 1266 Q317 1120 318 1006 Q319 890 334 776 Z"
        fill="url(#jarr-shine)" opacity=".55"/>
  <path d="M340 736 Q360 716 382 704 Q368 734 362 758 Q350 748 340 736 Z" fill="#fff" opacity=".4"/>
  <!-- reflet vertical net sur le col -->
  <rect x="412" y="316" width="11" height="300" rx="5.5" fill="#fff" opacity=".5"/>
  <rect x="413" y="188" width="10" height="96" rx="5" fill="#fff" opacity=".65"/>
  <!-- bord droit assombri + rim light -->
  <path d="M596 806 Q612 1010 602 1214 Q596 1254 572 1266 Q590 1120 590 1006 Q590 898 580 800 Z"
        fill="#5a2202" opacity=".45"/>
  <path d="M612 852 L612 1200 Q611 1240 596 1258 Q606 1236 607 1198 L607 856 Q606 812 588 776 Q610 806 612 852 Z"
        fill="#ffd9a4" opacity=".55"/>
  <path d="M494 200 L492 620 Q492 640 500 656 Q486 640 487 618 L489 200 Z" fill="#ffdcae" opacity=".5"/>
  <path d="M481 200 L480 620 Q479 646 470 664 Q474 642 474 618 L475 200 Z" fill="#8c3a06" opacity=".35"/>

  <!-- ===== CONDENSATION (gouttes) ===== -->
  <g fill="#fff8ee">
    <circle cx="409" cy="470" r="4" opacity=".6"/>
    <circle cx="490" cy="548" r="3.6" opacity=".55"/>
    <circle cx="316" cy="964" r="6" opacity=".6"/>
    <circle cx="586" cy="1064" r="5" opacity=".55"/>
    <circle cx="338" cy="1188" r="6.6" opacity=".6"/>
    <circle cx="566" cy="1224" r="5" opacity=".5"/>
    <path d="M362 830 q6 15 0 24 q-9 -7 -4 -22 Z" opacity=".6"/>
    <path d="M584 926 q6 16 0 26 q-9 -7 -4 -24 Z" opacity=".55"/>
  </g>

  <!-- ===== GARNITURE : demi-rondelle d'orange + feuille pres du pied ===== -->
  <ellipse cx="728" cy="1290" rx="122" ry="17" fill="#000" opacity=".22"/>
  <g transform="translate(724 1286) rotate(-8)">
    <g transform="translate(78 -88) rotate(38)">
      <path d="M0 0 Q-38 -26 -24 -68 Q24 -58 14 -8 Z" fill="url(#jarr-leaf)"/>
      <path d="M-4 -10 Q-15 -34 -18 -56" fill="none" stroke="#2c6a21" stroke-width="3.5" opacity=".7"/>
    </g>
    <path d="M-112 0 A112 112 0 0 1 112 0 Z" fill="url(#jarr-rind)"/>
    <path d="M-101 0 A101 101 0 0 1 101 0 Z" fill="#ffe9cf"/>
    <path d="M-93 0 A93 93 0 0 1 93 0 Z" fill="url(#jarr-flesh)"/>
    <g stroke="#fff3e0" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-4" x2="-85" y2="-23"/>
      <line x1="0" y1="-4" x2="-56" y2="-68"/>
      <line x1="0" y1="-4" x2="-7" y2="-88"/>
      <line x1="0" y1="-4" x2="46" y2="-76"/>
      <line x1="0" y1="-4" x2="80" y2="-38"/>
    </g>
    <rect x="-96" y="-4" width="192" height="6" fill="#ffe9cf" opacity=".9"/>
    <path d="M-71 -69 A99 99 0 0 1 -25 -94" fill="none" stroke="#fff" stroke-width="7" opacity=".5" stroke-linecap="round"/>
  </g>
</svg>
