<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <!-- bandeau rose vif -->
    <linearGradient id="chup-pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6cb4"/>
      <stop offset=".3" stop-color="#ff4fa0"/>
      <stop offset=".68" stop-color="#f44394"/>
      <stop offset="1" stop-color="#e83a8c"/>
    </linearGradient>
    <!-- moitie basse creme rosee -->
    <linearGradient id="chup-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6f8"/>
      <stop offset=".35" stop-color="#fdeef2"/>
      <stop offset=".72" stop-color="#ffe2ea"/>
      <stop offset="1" stop-color="#ffd9e4"/>
    </linearGradient>
    <!-- badge fleur jaune -->
    <radialGradient id="chup-yellow" cx=".42" cy=".34" r=".95">
      <stop offset="0" stop-color="#ffe36a"/>
      <stop offset=".4" stop-color="#ffd21e"/>
      <stop offset=".78" stop-color="#fcc414"/>
      <stop offset="1" stop-color="#f5b70a"/>
    </radialGradient>
    <!-- fraise brillante -->
    <radialGradient id="chup-berry" cx=".36" cy=".3" r="1">
      <stop offset="0" stop-color="#ff7d90"/>
      <stop offset=".32" stop-color="#f7495f"/>
      <stop offset=".64" stop-color="#e8365a"/>
      <stop offset=".86" stop-color="#c92047"/>
      <stop offset="1" stop-color="#a11338"/>
    </radialGradient>
    <linearGradient id="chup-leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe873"/>
      <stop offset=".45" stop-color="#5fc653"/>
      <stop offset=".8" stop-color="#3aa044"/>
      <stop offset="1" stop-color="#2a7d38"/>
    </linearGradient>
    <!-- interieur fraise coupee -->
    <radialGradient id="chup-flesh" cx=".5" cy=".42" r=".8">
      <stop offset="0" stop-color="#fff3f2"/>
      <stop offset=".45" stop-color="#ffdada"/>
      <stop offset=".8" stop-color="#ff9aa4"/>
      <stop offset="1" stop-color="#f26a7e"/>
    </radialGradient>
    <!-- metal : reflet vertical -->
    <linearGradient id="chup-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".8"/>
      <stop offset=".3" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset=".75" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".08"/>
    </linearGradient>
    <!-- metal : assombrissement bord droit -->
    <linearGradient id="chup-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#69102f" stop-opacity="0"/>
      <stop offset=".5" stop-color="#69102f" stop-opacity=".16"/>
      <stop offset=".82" stop-color="#560c26" stop-opacity=".38"/>
      <stop offset="1" stop-color="#42081c" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="chup-darkl" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#8c2050" stop-opacity="0"/>
      <stop offset=".62" stop-color="#8c2050" stop-opacity=".1"/>
      <stop offset="1" stop-color="#741a41" stop-opacity=".24"/>
    </linearGradient>
    <!-- couvercle -->
    <linearGradient id="chup-lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f9fc"/>
      <stop offset=".3" stop-color="#cfdbe2"/>
      <stop offset=".55" stop-color="#aebfc9"/>
      <stop offset=".8" stop-color="#8299a6"/>
      <stop offset="1" stop-color="#637988"/>
    </linearGradient>
    <radialGradient id="chup-lidtop" cx=".36" cy=".28" r="1.05">
      <stop offset="0" stop-color="#f0f6f9"/>
      <stop offset=".4" stop-color="#ccd9e0"/>
      <stop offset=".75" stop-color="#a3b6c1"/>
      <stop offset="1" stop-color="#7b909d"/>
    </radialGradient>

    <!-- silhouette canette standard 440 de large : demi-profil droit miroite (x' = 900 - x) -->
    <clipPath id="chup-clip">
      <path d="M272 268
               C 252 282, 232 302, 226 324
               C 222 340, 220 352, 220 366
               L 220 1150
               C 220 1196, 228 1224, 260 1246
               Q 335 1292 450 1292
               Q 565 1292 640 1246
               C 672 1224, 680 1196, 680 1150
               L 680 366
               C 680 352, 678 340, 674 324
               C 668 302, 648 282, 628 268
               Q 450 298 272 268 Z"/>
    </clipPath>

    <!-- fraise brillante reutilisable (boite locale ~ -56..56 x -70..70) -->
    <g id="chup-fraise">
      <path d="M0 -50 C 35 -50, 57 -28, 55 4 C 52 36, 27 60, 0 68
               C -27 60, -52 36, -55 4 C -57 -28, -35 -50, 0 -50 Z"
            fill="url(#chup-berry)"/>
      <path d="M55 4 C 52 36, 27 60, 0 68 C 30 48, 44 24, 46 -8
               C 52 -6, 56 -2, 55 4 Z" fill="#7c082a" opacity=".4"/>
      <g fill="#ffe9a8" stroke="#d8a33e" stroke-width="1.1">
        <ellipse cx="-30" cy="-24" rx="4.4" ry="7" transform="rotate(-18 -30 -24)"/>
        <ellipse cx="6" cy="-30" rx="4.4" ry="7" transform="rotate(6 6 -30)"/>
        <ellipse cx="36" cy="-12" rx="4" ry="6.4" transform="rotate(22 36 -12)"/>
        <ellipse cx="-38" cy="8" rx="4" ry="6.4" transform="rotate(-24 -38 8)"/>
        <ellipse cx="-4" cy="4" rx="4.4" ry="7"/>
        <ellipse cx="30" cy="20" rx="4" ry="6.4" transform="rotate(18 30 20)"/>
        <ellipse cx="-22" cy="34" rx="3.8" ry="6" transform="rotate(-14 -22 34)"/>
        <ellipse cx="8" cy="42" rx="3.8" ry="6" transform="rotate(6 8 42)"/>
      </g>
      <path d="M-40 -30 C -28 -42, -10 -46, 0 -43 C -14 -34, -28 -22, -34 -6
               C -41 -12, -45 -22, -40 -30 Z" fill="#ffffff" opacity=".55"/>
      <g fill="url(#chup-leaf)" stroke="#2a7d38" stroke-width="1.4" stroke-linejoin="round">
        <path d="M0 -46 C -18 -60, -40 -60, -54 -50 C -38 -40, -16 -38, 0 -46 Z"/>
        <path d="M0 -46 C 18 -60, 40 -60, 54 -50 C 38 -40, 16 -38, 0 -46 Z"/>
        <path d="M-2 -45 C -16 -38, -24 -26, -26 -12 C -12 -20, -4 -32, -2 -45 Z"/>
        <path d="M2 -45 C 16 -38, 24 -26, 26 -12 C 12 -20, 4 -32, 2 -45 Z"/>
        <path d="M0 -44 C -4 -32, -4 -20, 0 -10 C 4 -20, 4 -32, 0 -44 Z"/>
      </g>
      <path d="M0 -50 C 0 -62, 4 -72, 12 -80" stroke="#3f9b3f" stroke-width="7"
            stroke-linecap="round" fill="none"/>
    </g>

    <!-- fraise coupee en deux : interieur pale -->
    <g id="chup-moitie">
      <path d="M0 -50 C 35 -50, 57 -28, 55 4 C 52 36, 27 60, 0 68
               C -27 60, -52 36, -55 4 C -57 -28, -35 -50, 0 -50 Z"
            fill="#e8365a"/>
      <path d="M0 -42 C 29 -42, 48 -23, 46 4 C 44 31, 23 51, 0 58
               C -23 51, -44 31, -46 4 C -48 -23, -29 -42, 0 -42 Z"
            fill="url(#chup-flesh)"/>
      <path d="M0 -34 C 4 -20, 4 -8, 0 6 C -4 -8, -4 -20, 0 -34 Z" fill="#ffffff" opacity=".85"/>
      <g stroke="#ff8f9e" stroke-width="3" stroke-linecap="round" opacity=".8">
        <path d="M0 2 L -26 -22"/>
        <path d="M0 4 L 26 -22"/>
        <path d="M0 8 L -30 10"/>
        <path d="M0 8 L 30 10"/>
        <path d="M0 12 L -18 38"/>
        <path d="M0 12 L 18 38"/>
      </g>
      <ellipse cx="0" cy="16" rx="7" ry="10" fill="#ffffff" opacity=".9"/>
      <g fill="url(#chup-leaf)" stroke="#2a7d38" stroke-width="1.4" stroke-linejoin="round">
        <path d="M0 -46 C -16 -58, -36 -58, -48 -50 C -34 -41, -14 -39, 0 -46 Z"/>
        <path d="M0 -46 C 16 -58, 36 -58, 48 -50 C 34 -41, 14 -39, 0 -46 Z"/>
      </g>
    </g>

    <!-- etincelle 4 branches -->
    <path id="chup-spark" d="M0 -9 Q 1.8 -1.8 9 0 Q 1.8 1.8 0 9 Q -1.8 1.8 -9 0 Q -1.8 -1.8 0 -9 Z"/>

    <!-- chemins de texte (suivent la courbure du cylindre) -->
    <path id="chup-tSpark" d="M272 470 Q450 408 628 470" fill="none"/>
    <path id="chup-tChupa" d="M320 674 Q450 640 580 674" fill="none"/>
    <path id="chup-tChups" d="M320 786 Q450 752 580 786" fill="none"/>
    <path id="chup-tStraw" d="M258 1194 Q450 1230 642 1194" fill="none"/>
    <path id="chup-tMl" d="M386 1246 Q450 1258 514 1246" fill="none"/>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="40" fill="#000" opacity=".35"/>

  <!-- corps de la canette standard 345ml -->
  <path d="M272 268
           C 252 282, 232 302, 226 324
           C 222 340, 220 352, 220 366
           L 220 1150
           C 220 1196, 228 1224, 260 1246
           Q 335 1292 450 1292
           Q 565 1292 640 1246
           C 672 1224, 680 1196, 680 1150
           L 680 366
           C 680 352, 678 340, 674 324
           C 668 302, 648 282, 628 268
           Q 450 298 272 268 Z"
        fill="url(#chup-cream)"/>

  <g clip-path="url(#chup-clip)">
    <!-- ============ MOITIE BASSE : creme rosee + fraises ============ -->
    <rect x="220" y="560" width="460" height="740" fill="url(#chup-cream)"/>

    <!-- eclaboussures roses -->
    <g fill="#ff7fae">
      <circle cx="286" cy="912" r="7"/>
      <circle cx="330" cy="880" r="4.6"/>
      <path d="M610 902 q12 14 2 24 q-14 -6 -8 -22 Z"/>
      <circle cx="648" cy="948" r="5.4"/>
      <circle cx="262" cy="1002" r="5"/>
      <path d="M282 1150 q-10 16 0 26 q12 -8 6 -24 Z"/>
      <circle cx="636" cy="1120" r="6"/>
    </g>

    <!-- volutes de creme derriere les fraises -->
    <path d="M208 946 C 286 906, 344 982, 420 946 C 492 912, 540 980, 612 944 C 648 926, 678 936, 696 952
             L 696 1014 C 622 1048, 540 994, 462 1028 C 386 1060, 310 1008, 236 1042 L 208 1032 Z"
          fill="#ffffff" opacity=".96"/>
    <path d="M218 956 C 290 920, 346 988, 420 954" stroke="#f6cdd9" stroke-width="7"
          fill="none" stroke-linecap="round" opacity=".7"/>
    <path d="M470 952 C 534 922, 566 980, 640 948" stroke="#f6cdd9" stroke-width="6"
          fill="none" stroke-linecap="round" opacity=".6"/>

    <!-- composition de fraises -->
    <use href="#chup-fraise" transform="translate(334 1002) rotate(-12) scale(1.24)"/>
    <use href="#chup-fraise" transform="translate(588 1036) rotate(14) scale(1.1)"/>
    <use href="#chup-moitie" transform="translate(456 1094) rotate(-5) scale(1.14)"/>
    <use href="#chup-fraise" transform="translate(250 1102) rotate(-24) scale(.66)"/>

    <!-- creme qui repasse devant -->
    <path d="M216 1126 C 296 1090, 372 1154, 450 1122 C 526 1092, 600 1150, 686 1114
             L 686 1164 C 606 1194, 528 1142, 452 1170 C 376 1196, 296 1150, 216 1174 Z"
          fill="#ffffff" opacity=".93"/>
    <path d="M224 1134 C 298 1102, 372 1160, 448 1130" stroke="#f2c3d2" stroke-width="6"
          fill="none" stroke-linecap="round" opacity=".6"/>

    <!-- ============ MENTIONS DU BAS ============ -->
    <text font-family="'Space Grotesk',sans-serif" font-size="27" font-weight="700"
          letter-spacing="5" fill="#c22568">
      <textPath href="#chup-tStraw" startOffset="50%" text-anchor="middle">STRAWBERRY CREAM</textPath>
    </text>
    <text font-family="'Space Grotesk',sans-serif" font-size="27" font-weight="600"
          letter-spacing="3" fill="#d05585">
      <textPath href="#chup-tMl" startOffset="50%" text-anchor="middle">345 ml</textPath>
    </text>

    <!-- ============ BANDEAU ROSE VIF (tiers haut) ============ -->
    <path d="M220 240 L680 240 L680 600 Q450 652 220 600 Z" fill="url(#chup-pink)"/>
    <path d="M220 600 Q450 652 680 600" stroke="#ffffff" stroke-width="5" fill="none" opacity=".85"/>

    <!-- « Sparkling » script blanc penche, arque vers le haut -->
    <g transform="skewX(-8)" transform-origin="450 450">
      <text font-family="'Space Grotesk',sans-serif" font-style="italic" font-size="76"
            font-weight="700" letter-spacing="-2" fill="#ffffff"
            stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" paint-order="stroke">
        <textPath href="#chup-tSpark" startOffset="50%" text-anchor="middle">Sparkling</textPath>
      </text>
    </g>

    <!-- points scintillants -->
    <g fill="#ffffff">
      <use href="#chup-spark" transform="translate(288 380) scale(1.1)"/>
      <use href="#chup-spark" transform="translate(612 372) scale(.9)"/>
      <use href="#chup-spark" transform="translate(548 508) scale(.7)"/>
      <use href="#chup-spark" transform="translate(340 512) scale(.8)"/>
      <circle cx="336" cy="346" r="4.4"/>
      <circle cx="452" cy="352" r="3.4"/>
      <circle cx="566" cy="342" r="4.6"/>
      <circle cx="262" cy="452" r="3.6"/>
      <circle cx="642" cy="446" r="3.8"/>
      <circle cx="300" cy="548" r="3.2"/>
      <circle cx="602" cy="544" r="3.4"/>
    </g>

    <!-- mini fraises posees sur le bord du bandeau -->
    <use href="#chup-fraise" transform="translate(276 594) rotate(-16) scale(.44)"/>
    <use href="#chup-fraise" transform="translate(626 590) rotate(18) scale(.44)"/>
    <use href="#chup-fraise" transform="translate(634 360) rotate(24) scale(.32)"/>

    <!-- ============ GRAND BADGE FLEUR JAUNE ============ -->
    <!-- lisere rose puis lisere blanc puis disque jaune -->
    <g transform="translate(452 708) scale(1.09) translate(-450 -700)">
      <path d="M 450.0 550.0 Q 520.1 507.4 546.4 585.1 Q 627.5 597.5 597.7 674.0 Q 651.9 735.6 579.9 775.0 Q 581.8 857.0 501.3 841.0 Q 450.0 905.0 398.7 841.0 Q 318.2 857.0 320.1 775.0 Q 248.1 735.6 302.3 674.0 Q 272.5 597.5 353.6 585.1 Q 379.9 507.4 450.0 550.0 Z"
            fill="#8c1245" opacity=".18"/>
    </g>
    <g transform="translate(450 700) scale(1.075) translate(-450 -700)">
      <path d="M 450.0 550.0 Q 520.1 507.4 546.4 585.1 Q 627.5 597.5 597.7 674.0 Q 651.9 735.6 579.9 775.0 Q 581.8 857.0 501.3 841.0 Q 450.0 905.0 398.7 841.0 Q 318.2 857.0 320.1 775.0 Q 248.1 735.6 302.3 674.0 Q 272.5 597.5 353.6 585.1 Q 379.9 507.4 450.0 550.0 Z"
            fill="#f0338a"/>
    </g>
    <g transform="translate(450 700) scale(1.04) translate(-450 -700)">
      <path d="M 450.0 550.0 Q 520.1 507.4 546.4 585.1 Q 627.5 597.5 597.7 674.0 Q 651.9 735.6 579.9 775.0 Q 581.8 857.0 501.3 841.0 Q 450.0 905.0 398.7 841.0 Q 318.2 857.0 320.1 775.0 Q 248.1 735.6 302.3 674.0 Q 272.5 597.5 353.6 585.1 Q 379.9 507.4 450.0 550.0 Z"
            fill="#ffffff"/>
    </g>
    <path d="M 450.0 550.0 Q 520.1 507.4 546.4 585.1 Q 627.5 597.5 597.7 674.0 Q 651.9 735.6 579.9 775.0 Q 581.8 857.0 501.3 841.0 Q 450.0 905.0 398.7 841.0 Q 318.2 857.0 320.1 775.0 Q 248.1 735.6 302.3 674.0 Q 272.5 597.5 353.6 585.1 Q 379.9 507.4 450.0 550.0 Z"
          fill="url(#chup-yellow)"/>

    <!-- nom rouge, gras arrondi, legerement penche et arque (typo maison) -->
    <g transform="rotate(-5 450 700)">
      <text font-family="'Space Grotesk',sans-serif" font-size="97" font-weight="700"
            letter-spacing="-2" fill="#e02d2d"
            stroke="#e02d2d" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"
            paint-order="stroke">
        <textPath href="#chup-tChupa" startOffset="50%" text-anchor="middle">Chupa</textPath>
      </text>
      <text font-family="'Space Grotesk',sans-serif" font-size="97" font-weight="700"
            letter-spacing="-2" fill="#e02d2d"
            stroke="#e02d2d" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"
            paint-order="stroke">
        <textPath href="#chup-tChups" startOffset="50%" text-anchor="middle">Chups</textPath>
      </text>
    </g>

    <!-- ============ RENDU METAL ============ -->
    <rect x="220" y="240" width="72" height="1060" fill="url(#chup-darkl)"/>
    <rect x="472" y="240" width="208" height="1060" fill="url(#chup-dark)"/>
    <!-- rim light bord droit -->
    <path d="M669 360 Q675 800 663 1240" stroke="#ffd7e6" stroke-width="6" fill="none"
          opacity=".4" stroke-linecap="round"/>
    <!-- ombre sous le couvercle + gloss d'epaule -->
    <path d="M230 306 Q450 352 670 306" stroke="#9c3a63" stroke-width="12" fill="none" opacity=".22"/>
    <path d="M244 340 Q450 392 656 340" stroke="#ffffff" stroke-width="7" fill="none"
          opacity=".4" stroke-linecap="round"/>
    <!-- reflets verticaux : une large bande claire a gauche + 3 fines -->
    <rect x="274" y="356" width="46" height="800" rx="21" fill="url(#chup-shine)" opacity=".5"/>
    <rect x="336" y="392" width="13" height="720" rx="6.5" fill="#ffffff" opacity=".28"/>
    <rect x="528" y="410" width="18" height="700" rx="9" fill="#ffffff" opacity=".13"/>
    <rect x="616" y="420" width="9" height="680" rx="4.5" fill="#ffffff" opacity=".16"/>
    <!-- pied roule : ombre + reflet -->
    <path d="M246 1236 Q450 1306 654 1236" stroke="#8c2050" stroke-width="18" fill="none" opacity=".32"/>
    <path d="M266 1256 Q450 1314 634 1256" stroke="#ffb9d2" stroke-width="6" fill="none" opacity=".4"/>

    <!-- condensation : 7 gouttes -->
    <g>
      <path d="M316 428 q9 20 0 33 q-12 -9 -6 -29 Z" fill="#ffffff" opacity=".6"/>
      <circle cx="588" cy="470" r="7" fill="#ffffff" opacity=".5"/>
      <circle cx="586" cy="467" r="2.4" fill="#ffffff" opacity=".9"/>
      <circle cx="262" cy="700" r="6" fill="#ffffff" opacity=".55"/>
      <circle cx="260" cy="697" r="2" fill="#ffffff" opacity=".9"/>
      <path d="M646 720 q8 24 -1 38 q-11 -11 -4 -35 Z" fill="#ffffff" opacity=".55"/>
      <circle cx="300" cy="948" r="8" fill="#ffffff" opacity=".6"/>
      <circle cx="297" cy="944" r="2.8" fill="#ffffff" opacity=".95"/>
      <circle cx="620" cy="1012" r="7" fill="#ffffff" opacity=".55"/>
      <circle cx="617" cy="1009" r="2.4" fill="#ffffff" opacity=".9"/>
      <path d="M338 1210 q-8 20 0 32 q10 -9 5 -29 Z" fill="#ffffff" opacity=".5"/>
    </g>
  </g>

  <!-- ============ COUVERCLE ALUMINIUM (vu tres legerement de dessus) ============ -->
  <ellipse cx="450" cy="264" rx="178" ry="31" fill="url(#chup-lid)"/>
  <ellipse cx="450" cy="261" rx="178" ry="29" fill="#dde7ec"/>
  <ellipse cx="450" cy="262" rx="158" ry="24" fill="url(#chup-lidtop)"/>
  <ellipse cx="450" cy="262" rx="158" ry="24" fill="none" stroke="#5f7482" stroke-width="2.5" opacity=".55"/>
  <ellipse cx="450" cy="263" rx="128" ry="18" fill="none" stroke="#8ba0ad" stroke-width="1.6" opacity=".6"/>
  <!-- opercule + languette -->
  <ellipse cx="408" cy="264" rx="30" ry="9" fill="#9db1bd" stroke="#66798a" stroke-width="1.6"/>
  <g>
    <ellipse cx="484" cy="265" rx="38" ry="11.5" fill="#c3d1d9" stroke="#66798a" stroke-width="2"/>
    <ellipse cx="491" cy="265.5" rx="19" ry="6" fill="#7e93a0" stroke="#5c707e" stroke-width="1.4"/>
    <circle cx="452" cy="264" r="7" fill="#b3c3cc" stroke="#5c707e" stroke-width="1.6"/>
    <circle cx="450" cy="262.5" r="2.4" fill="#eef4f7"/>
  </g>
  <!-- reflet du rebord -->
  <path d="M300 250 Q372 236 450 235" stroke="#ffffff" stroke-width="4.5" fill="none"
        opacity=".75" stroke-linecap="round"/>
  <path d="M528 238 Q574 242 604 252" stroke="#ffffff" stroke-width="3" fill="none"
        opacity=".4" stroke-linecap="round"/>
</svg>
