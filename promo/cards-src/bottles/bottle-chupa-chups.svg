<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <linearGradient id="chup-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef92b2"/>
      <stop offset=".09" stop-color="#ffc7da"/>
      <stop offset=".24" stop-color="#ff9fc0"/>
      <stop offset=".5" stop-color="#f97ba8"/>
      <stop offset=".74" stop-color="#e65e91"/>
      <stop offset=".9" stop-color="#c74473"/>
      <stop offset="1" stop-color="#932e52"/>
    </linearGradient>
    <linearGradient id="chup-tone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3ec" stop-opacity=".32"/>
      <stop offset=".22" stop-color="#ffd0df" stop-opacity=".1"/>
      <stop offset=".55" stop-color="#f06a9a" stop-opacity="0"/>
      <stop offset=".82" stop-color="#c93a6c" stop-opacity=".28"/>
      <stop offset="1" stop-color="#992650" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="chup-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#fffdfd"/>
      <stop offset=".78" stop-color="#faeef3"/>
      <stop offset="1" stop-color="#f0d9e3"/>
    </linearGradient>
    <linearGradient id="chup-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c2d4c" stop-opacity="0"/>
      <stop offset=".45" stop-color="#7c2d4c" stop-opacity=".24"/>
      <stop offset=".8" stop-color="#611d3a" stop-opacity=".52"/>
      <stop offset="1" stop-color="#4c132b" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="chup-darkl" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#a8436b" stop-opacity="0"/>
      <stop offset=".6" stop-color="#a8436b" stop-opacity=".14"/>
      <stop offset="1" stop-color="#8c3257" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="chup-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".3" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".75" stop-color="#ffffff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="chup-lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f9fc"/>
      <stop offset=".3" stop-color="#cfdbe2"/>
      <stop offset=".55" stop-color="#aebfc9"/>
      <stop offset=".8" stop-color="#8299a6"/>
      <stop offset="1" stop-color="#637988"/>
    </linearGradient>
    <radialGradient id="chup-lidtop" cx=".36" cy=".28" r="1.05">
      <stop offset="0" stop-color="#f0f6f9"/>
      <stop offset=".4" stop-color="#ccd9e0"/>
      <stop offset=".75" stop-color="#a3b6c1"/>
      <stop offset="1" stop-color="#7b909d"/>
    </radialGradient>
    <radialGradient id="chup-berry" cx=".36" cy=".28" r="1">
      <stop offset="0" stop-color="#ff8ba0"/>
      <stop offset=".3" stop-color="#f74e6f"/>
      <stop offset=".62" stop-color="#e02350"/>
      <stop offset=".85" stop-color="#c11341"/>
      <stop offset="1" stop-color="#960c33"/>
    </radialGradient>
    <linearGradient id="chup-leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe873"/>
      <stop offset=".45" stop-color="#5fc653"/>
      <stop offset=".8" stop-color="#3aa044"/>
      <stop offset="1" stop-color="#2a7d38"/>
    </linearGradient>
    <radialGradient id="chup-berryglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- silhouette du corps (clip) -->
    <clipPath id="chup-clip">
      <path d="M302 266
               C 268 288, 255 312, 255 342
               L 255 1140
               C 255 1192, 262 1220, 296 1244
               Q 366 1288 450 1288
               Q 534 1288 604 1244
               C 638 1220, 645 1192, 645 1140
               L 645 342
               C 645 312, 632 288, 598 266
               Q 450 300 302 266 Z"/>
    </clipPath>
    <!-- bande blanche courbee -->
    <clipPath id="chup-bandclip">
      <path d="M255 638 Q450 694 645 638 L645 942 Q450 998 255 942 Z"/>
    </clipPath>
    <clipPath id="chup-bandl"><rect x="255" y="600" width="78" height="430"/></clipPath>
    <clipPath id="chup-bandr"><rect x="567" y="600" width="78" height="430"/></clipPath>

    <!-- chemins de texte suivant la courbure -->
    <path id="chup-t1" d="M290 764 Q450 806 610 764" fill="none"/>
    <path id="chup-t2" d="M290 848 Q450 890 610 848" fill="none"/>
    <path id="chup-t3" d="M300 930 Q450 966 600 930" fill="none"/>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="250" ry="38" fill="#000" opacity=".35"/>

  <!-- corps de la canette slim -->
  <path d="M302 266
           C 268 288, 255 312, 255 342
           L 255 1140
           C 255 1192, 262 1220, 296 1244
           Q 366 1288 450 1288
           Q 534 1288 604 1244
           C 638 1220, 645 1192, 645 1140
           L 645 342
           C 645 312, 632 288, 598 266
           Q 450 300 302 266 Z"
        fill="url(#chup-body)"/>

  <g clip-path="url(#chup-clip)">
    <!-- degrade vertical rose clair -> rose soutenu -->
    <rect x="255" y="260" width="390" height="1030" fill="url(#chup-tone)"/>

    <!-- ============ BANDE BLANCHE "PAPIER DE SUCETTE" ============ -->
    <g clip-path="url(#chup-bandclip)">
      <rect x="255" y="600" width="390" height="430" fill="url(#chup-band)"/>

      <!-- rayures obliques rose/blanc : extremite gauche (papier torsade) -->
      <g clip-path="url(#chup-bandl)">
        <path d="M160 1030 L280 596 L306 596 L186 1030 Z" fill="#e6407c"/>
        <path d="M212 1030 L332 596 L358 596 L238 1030 Z" fill="#e6407c"/>
        <path d="M264 1030 L384 596 L410 596 L290 1030 Z" fill="#e6407c"/>
        <path d="M186 1030 L306 596 L332 596 L212 1030 Z" fill="#ffb1cc"/>
        <path d="M238 1030 L358 596 L384 596 L264 1030 Z" fill="#ffb1cc"/>
      </g>
      <!-- extremite droite (miroir) -->
      <g clip-path="url(#chup-bandr)">
        <path d="M740 1030 L620 596 L594 596 L714 1030 Z" fill="#e6407c"/>
        <path d="M688 1030 L568 596 L542 596 L662 1030 Z" fill="#e6407c"/>
        <path d="M636 1030 L516 596 L490 596 L610 1030 Z" fill="#e6407c"/>
        <path d="M714 1030 L594 596 L568 596 L688 1030 Z" fill="#ffb1cc"/>
        <path d="M662 1030 L542 596 L516 596 L636 1030 Z" fill="#ffb1cc"/>
      </g>

      <!-- textes courbes -->
      <text font-family="'Space Grotesk',sans-serif" font-size="64" font-weight="700"
            letter-spacing="5" fill="#d6336c">
        <textPath href="#chup-t1" startOffset="50%" text-anchor="middle">CHUPA</textPath>
      </text>
      <text font-family="'Space Grotesk',sans-serif" font-size="64" font-weight="700"
            letter-spacing="5" fill="#d6336c">
        <textPath href="#chup-t2" startOffset="50%" text-anchor="middle">CHUPS</textPath>
      </text>
      <text font-family="'Space Grotesk',sans-serif" font-size="21" font-weight="600"
            letter-spacing="2" fill="#e2669a">
        <textPath href="#chup-t3" startOffset="50%" text-anchor="middle">SPARKLING &#183; FRAISE</textPath>
      </text>
    </g>
    <!-- lisere du haut/bas de bande -->
    <path d="M255 638 Q450 694 645 638" stroke="#c2517d" stroke-width="4" fill="none" opacity=".3"/>
    <path d="M255 942 Q450 998 645 942" stroke="#c2517d" stroke-width="5" fill="none" opacity=".35"/>

    <!-- ============ FRAISE dans le bas de la canette ============ -->
    <ellipse cx="446" cy="1120" rx="150" ry="130" fill="url(#chup-berryglow)"/>
    <g transform="rotate(-8 446 1118)">
      <path d="M446 1030 C512 1030 546 1068 542 1114 C537 1168 496 1212 446 1226
               C396 1212 355 1168 350 1114 C346 1068 380 1030 446 1030 Z"
            fill="url(#chup-berry)"/>
      <!-- ombre interne bas droit -->
      <path d="M542 1114 C537 1168 496 1212 446 1226 C476 1206 522 1170 528 1096
               C536 1098 542 1104 542 1114 Z" fill="#7c082a" opacity=".45"/>
      <!-- akenes -->
      <g fill="#ffe9a8" stroke="#d8a33e" stroke-width="1.2">
        <ellipse cx="412" cy="1076" rx="5" ry="8" transform="rotate(-16 412 1076)"/>
        <ellipse cx="466" cy="1066" rx="5" ry="8" transform="rotate(8 466 1066)"/>
        <ellipse cx="510" cy="1090" rx="4.6" ry="7.4" transform="rotate(20 510 1090)"/>
        <ellipse cx="386" cy="1116" rx="4.6" ry="7.4" transform="rotate(-22 386 1116)"/>
        <ellipse cx="440" cy="1112" rx="5" ry="8"/>
        <ellipse cx="494" cy="1130" rx="4.6" ry="7.4" transform="rotate(16 494 1130)"/>
        <ellipse cx="408" cy="1158" rx="4.4" ry="7" transform="rotate(-14 408 1158)"/>
        <ellipse cx="458" cy="1164" rx="4.4" ry="7" transform="rotate(6 458 1164)"/>
        <ellipse cx="432" cy="1200" rx="4" ry="6.4"/>
      </g>
      <!-- gloss appetissant -->
      <path d="M382 1052 C400 1038 422 1034 436 1038 C420 1048 402 1062 392 1082
               C384 1074 378 1062 382 1052 Z" fill="#ffffff" opacity=".6"/>
      <ellipse cx="486" cy="1054" rx="12" ry="7" fill="#ffffff" opacity=".4" transform="rotate(18 486 1054)"/>
      <!-- pedoncule -->
      <path d="M446 1030 C446 1010 452 994 462 980" stroke="#3f9b3f" stroke-width="10"
            stroke-linecap="round" fill="none"/>
      <!-- calice : leaflets pointus retombant sur la fraise -->
      <g fill="url(#chup-leaf)" stroke="#2a7d38" stroke-width="1.5" stroke-linejoin="round">
        <path d="M448 1036 C426 1018 400 1016 378 1030 C398 1044 428 1046 448 1036 Z"/>
        <path d="M448 1036 C470 1018 496 1016 518 1030 C498 1044 468 1046 448 1036 Z"/>
        <path d="M446 1038 C428 1044 414 1058 410 1076 C430 1068 442 1054 446 1038 Z"/>
        <path d="M450 1038 C468 1044 482 1058 486 1076 C466 1068 454 1054 450 1038 Z"/>
        <path d="M448 1040 C444 1054 444 1068 448 1082 C454 1068 454 1054 448 1040 Z"/>
        <path d="M448 1036 C440 1020 440 1004 448 990 C456 1004 456 1020 448 1036 Z"/>
      </g>
    </g>

    <!-- ============ RENDU METAL ============ -->
    <!-- assombrissement bords -->
    <rect x="255" y="260" width="64" height="1030" fill="url(#chup-darkl)"/>
    <rect x="530" y="260" width="115" height="1030" fill="url(#chup-dark)"/>
    <!-- rim light fin bord droit -->
    <path d="M636 380 Q641 800 632 1226" stroke="#ffd7e6" stroke-width="6" fill="none"
          opacity=".38" stroke-linecap="round"/>
    <!-- ombre sous le couvercle + gloss d'epaule -->
    <path d="M262 300 Q450 348 638 300" stroke="#93395e" stroke-width="12" fill="none" opacity=".28"/>
    <path d="M276 336 Q450 388 624 336" stroke="#ffffff" stroke-width="7" fill="none"
          opacity=".45" stroke-linecap="round"/>
    <!-- reflets verticaux (4 bandes) -->
    <rect x="306" y="360" width="34" height="620" rx="17" fill="url(#chup-shine)" opacity=".62"/>
    <rect x="306" y="1200" width="30" height="60" rx="15" fill="#ffffff" opacity=".22"/>
    <rect x="356" y="400" width="12" height="560" rx="6" fill="#ffffff" opacity=".3"/>
    <rect x="506" y="420" width="18" height="760" rx="9" fill="#ffffff" opacity=".14"/>
    <rect x="588" y="430" width="9" height="740" rx="4.5" fill="#ffffff" opacity=".18"/>
    <!-- pied roule : ombre + reflet -->
    <path d="M282 1236 Q450 1300 618 1236" stroke="#7c2d4c" stroke-width="16" fill="none" opacity=".38"/>
    <path d="M300 1252 Q450 1306 600 1252" stroke="#ffb9d2" stroke-width="6" fill="none" opacity=".4"/>

    <!-- condensation : 8 gouttes -->
    <g>
      <path d="M338 466 q9 20 0 33 q-12 -9 -6 -29 Z" fill="#ffffff" opacity=".6"/>
      <circle cx="561" cy="512" r="7" fill="#ffffff" opacity=".55"/>
      <circle cx="559" cy="509" r="2.4" fill="#ffffff" opacity=".9"/>
      <circle cx="497" cy="440" r="5.4" fill="#ffffff" opacity=".5"/>
      <path d="M300 560 q-8 22 0 36 q11 -10 5 -33 Z" fill="#ffffff" opacity=".62"/>
      <circle cx="322" cy="1032" r="8" fill="#ffffff" opacity=".58"/>
      <circle cx="319" cy="1028" r="2.8" fill="#ffffff" opacity=".9"/>
      <circle cx="584" cy="1096" r="7" fill="#ffffff" opacity=".55"/>
      <circle cx="581" cy="1093" r="2.4" fill="#ffffff" opacity=".85"/>
      <circle cx="352" cy="1210" r="6" fill="#ffffff" opacity=".5"/>
      <path d="M604 700 q8 24 -1 38 q-11 -11 -4 -35 Z" fill="#ffffff" opacity=".55"/>
    </g>
  </g>

  <!-- ============ COUVERCLE ALUMINIUM (vu tres legerement de dessus) ============ -->
  <ellipse cx="450" cy="262" rx="150" ry="27" fill="url(#chup-lid)"/>
  <ellipse cx="450" cy="260" rx="150" ry="25" fill="#dde7ec"/>
  <ellipse cx="450" cy="261" rx="132" ry="20.5" fill="url(#chup-lidtop)"/>
  <ellipse cx="450" cy="261" rx="132" ry="20.5" fill="none" stroke="#5f7482" stroke-width="2.5" opacity=".55"/>
  <ellipse cx="450" cy="262" rx="108" ry="15.5" fill="none" stroke="#8ba0ad" stroke-width="1.6" opacity=".6"/>
  <!-- opercule + languette -->
  <ellipse cx="412" cy="263" rx="26" ry="8" fill="#9db1bd" stroke="#66798a" stroke-width="1.6"/>
  <g>
    <ellipse cx="478" cy="264" rx="34" ry="10.5" fill="#c3d1d9" stroke="#66798a" stroke-width="2"/>
    <ellipse cx="484" cy="264.5" rx="17" ry="5.6" fill="#7e93a0" stroke="#5c707e" stroke-width="1.4"/>
    <circle cx="450" cy="263" r="6.5" fill="#b3c3cc" stroke="#5c707e" stroke-width="1.6"/>
    <circle cx="448" cy="261.5" r="2.2" fill="#eef4f7"/>
  </g>
  <!-- reflet du rebord -->
  <path d="M318 250 Q382 238 450 237" stroke="#ffffff" stroke-width="4.5" fill="none"
        opacity=".75" stroke-linecap="round"/>
  <path d="M520 240 Q560 244 586 252" stroke="#ffffff" stroke-width="3" fill="none"
        opacity=".4" stroke-linecap="round"/>

  <!-- bulles autour de la canette -->
  <g>
    <circle cx="672" cy="416" r="17" fill="#ffffff" opacity=".18"/>
    <circle cx="672" cy="416" r="17" fill="none" stroke="#ffffff" stroke-width="3.5" opacity=".55"/>
    <circle cx="667" cy="410" r="5" fill="#ffffff" opacity=".7"/>
    <circle cx="712" cy="500" r="9" fill="#ffffff" opacity=".2"/>
    <circle cx="712" cy="500" r="9" fill="none" stroke="#ffffff" stroke-width="2.6" opacity=".5"/>
    <circle cx="222" cy="560" r="12" fill="#ffffff" opacity=".16"/>
    <circle cx="222" cy="560" r="12" fill="none" stroke="#ffffff" stroke-width="3" opacity=".45"/>
    <circle cx="218" cy="555" r="3.6" fill="#ffffff" opacity=".65"/>
  </g>
</svg>
