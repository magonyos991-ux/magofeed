<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <linearGradient id="chup-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9fbf"/>
      <stop offset=".1" stop-color="#ffbdd2"/>
      <stop offset=".28" stop-color="#ff8fb3"/>
      <stop offset=".58" stop-color="#f077a2"/>
      <stop offset=".82" stop-color="#e86a96"/>
      <stop offset="1" stop-color="#c14b76"/>
    </linearGradient>
    <linearGradient id="chup-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#fdf4f7"/>
      <stop offset="1" stop-color="#f5dde8"/>
    </linearGradient>
    <linearGradient id="chup-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c2d4c" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7c2d4c" stop-opacity=".2"/>
      <stop offset="1" stop-color="#651f3c" stop-opacity=".52"/>
    </linearGradient>
    <linearGradient id="chup-darkl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8436b" stop-opacity=".3"/>
      <stop offset="1" stop-color="#a8436b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chup-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="chup-lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f8fb"/>
      <stop offset=".45" stop-color="#c9d6de"/>
      <stop offset=".75" stop-color="#93a7b3"/>
      <stop offset="1" stop-color="#6d8290"/>
    </linearGradient>
    <radialGradient id="chup-lidtop" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#eaf2f6"/>
      <stop offset=".55" stop-color="#b7c6cf"/>
      <stop offset="1" stop-color="#7e93a0"/>
    </radialGradient>
    <radialGradient id="chup-berry" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#ff9db5"/>
      <stop offset=".35" stop-color="#f45c7f"/>
      <stop offset=".75" stop-color="#e03059"/>
      <stop offset="1" stop-color="#b81f45"/>
    </radialGradient>
    <linearGradient id="chup-leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe06a"/>
      <stop offset=".5" stop-color="#57c04f"/>
      <stop offset="1" stop-color="#2f8f3e"/>
    </linearGradient>
    <clipPath id="chup-clip">
      <path d="M302 352 Q302 344 310 344 L590 344 Q598 344 598 352 L598 362
               Q632 394 632 432 L632 1200 Q632 1258 576 1276 Q516 1291 450 1291
               Q384 1291 324 1276 Q268 1258 268 1200 L268 432 Q268 394 302 362 Z"/>
    </clipPath>
    <clipPath id="chup-bandl"><rect x="268" y="690" width="48" height="300"/></clipPath>
    <clipPath id="chup-bandr"><rect x="584" y="690" width="48" height="300"/></clipPath>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="40" fill="#000" opacity=".35"/>

  <!-- corps de la canette slim -->
  <path d="M302 352 Q302 344 310 344 L590 344 Q598 344 598 352 L598 362
           Q632 394 632 432 L632 1200 Q632 1258 576 1276 Q516 1291 450 1291
           Q384 1291 324 1276 Q268 1258 268 1200 L268 432 Q268 394 302 362 Z"
        fill="url(#chup-body)"/>

  <g clip-path="url(#chup-clip)">
    <!-- bande blanche centrale -->
    <rect x="268" y="690" width="364" height="300" fill="url(#chup-band)"/>
    <rect x="268" y="690" width="364" height="7" fill="#c2517d" opacity=".22"/>
    <rect x="268" y="984" width="364" height="7" fill="#c2517d" opacity=".28"/>

    <!-- rayures torsadees aux extremites de la bande -->
    <g clip-path="url(#chup-bandl)">
      <path d="M154 996 L224 684 L244 684 L174 996 Z" fill="#e0517f"/>
      <path d="M188 996 L258 684 L278 684 L208 996 Z" fill="#ff8fb3"/>
      <path d="M222 996 L292 684 L312 684 L242 996 Z" fill="#e0517f"/>
      <path d="M256 996 L326 684 L346 684 L276 996 Z" fill="#ff8fb3"/>
      <path d="M290 996 L360 684 L380 684 L310 996 Z" fill="#e0517f"/>
    </g>
    <g clip-path="url(#chup-bandr)">
      <path d="M746 996 L676 684 L656 684 L726 996 Z" fill="#e0517f"/>
      <path d="M712 996 L642 684 L622 684 L692 996 Z" fill="#ff8fb3"/>
      <path d="M678 996 L608 684 L588 684 L658 996 Z" fill="#e0517f"/>
      <path d="M644 996 L574 684 L554 684 L624 996 Z" fill="#ff8fb3"/>
      <path d="M610 996 L540 684 L520 684 L590 996 Z" fill="#e0517f"/>
    </g>

    <!-- texte etiquette -->
    <text x="450" y="798" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="66" font-weight="700" letter-spacing="4" fill="#d1477a">CHUPA</text>
    <text x="450" y="880" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="66" font-weight="700" letter-spacing="4" fill="#d1477a">CHUPS</text>
    <rect x="400" y="906" width="100" height="5" rx="2.5" fill="#e86a96" opacity=".6"/>
    <text x="450" y="952" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="20" font-weight="600" letter-spacing="1" fill="#e86a96">SPARKLING · FRAISE</text>

    <!-- ombre du fond roule -->
    <ellipse cx="450" cy="1264" rx="172" ry="26" fill="#8f3557" opacity=".3"/>
    <!-- assombrissements cylindriques -->
    <rect x="268" y="344" width="52" height="947" fill="url(#chup-darkl)"/>
    <rect x="556" y="344" width="76" height="947" fill="url(#chup-dark)"/>
    <!-- gloss d'epaule + ombre sous couvercle -->
    <path d="M304 368 Q450 404 596 368" stroke="#a8436b" stroke-width="10" fill="none" opacity=".3"/>
    <path d="M312 404 Q450 454 588 404" stroke="#ffffff" stroke-width="6" fill="none" opacity=".4" stroke-linecap="round"/>
    <!-- liseret lumineux bord droit -->
    <path d="M624 470 Q628 850 620 1210" stroke="#ffd7e6" stroke-width="7" fill="none" opacity=".32" stroke-linecap="round"/>
  </g>

  <!-- couvercle aluminium -->
  <ellipse cx="450" cy="348" rx="148" ry="25" fill="url(#chup-lid)"/>
  <ellipse cx="450" cy="349" rx="126" ry="19" fill="url(#chup-lidtop)"/>
  <ellipse cx="450" cy="349" rx="126" ry="19" fill="none" stroke="#5f7482" stroke-width="2" opacity=".5"/>
  <ellipse cx="464" cy="350" rx="34" ry="9" fill="#8fa3b0"/>
  <ellipse cx="446" cy="350" rx="12" ry="5.5" fill="#66798a"/>
  <path d="M312 336 Q380 326 450 326" stroke="#ffffff" stroke-width="5" fill="none" opacity=".7" stroke-linecap="round"/>

  <!-- reflets verticaux, lumiere haut-gauche -->
  <rect x="314" y="430" width="30" height="800" rx="15" fill="url(#chup-shine)" opacity=".6"/>
  <rect x="360" y="470" width="10" height="700" rx="5" fill="#ffffff" opacity=".26"/>

  <!-- condensation -->
  <g fill="#ffffff">
    <circle cx="340" cy="492" r="7" opacity=".65"/>
    <circle cx="556" cy="544" r="6" opacity=".6"/>
    <circle cx="498" cy="452" r="5" opacity=".55"/>
    <circle cx="322" cy="1062" r="8" opacity=".65"/>
    <circle cx="578" cy="1128" r="7" opacity=".6"/>
    <circle cx="354" cy="1216" r="6" opacity=".55"/>
    <circle cx="534" cy="636" r="5" opacity=".55"/>
    <path d="M594 592 q7 16 0 26 q-9 -7 -5 -23 Z" opacity=".6"/>
    <path d="M306 620 q-7 18 0 29 q10 -8 5 -27 Z" opacity=".65"/>
    <circle cx="470" cy="1182" r="7" opacity=".55"/>
  </g>

  <!-- garniture : fraise flottante -->
  <g transform="rotate(14 720 560)">
    <path d="M720 492 C770 492 796 524 793 562 C789 606 757 646 720 658
             C683 646 651 606 647 562 C644 524 670 492 720 492 Z" fill="url(#chup-berry)"/>
    <g fill="#ffe9a8" opacity=".7">
      <ellipse cx="694" cy="540" rx="4.5" ry="7" transform="rotate(-14 694 540)"/>
      <ellipse cx="738" cy="534" rx="4.5" ry="7" transform="rotate(10 738 534)"/>
      <ellipse cx="716" cy="576" rx="4.5" ry="7"/>
      <ellipse cx="678" cy="588" rx="4" ry="6.5" transform="rotate(-18 678 588)"/>
      <ellipse cx="752" cy="580" rx="4" ry="6.5" transform="rotate(16 752 580)"/>
      <ellipse cx="722" cy="622" rx="4" ry="6.5"/>
    </g>
    <ellipse cx="688" cy="522" rx="18" ry="11" fill="#ffffff" opacity=".55" transform="rotate(-22 688 522)"/>
    <path d="M720 470 L734 492 L760 486 L744 506 L764 520 L738 522 L720 544
             L702 522 L676 520 L696 506 L680 486 L706 492 Z" fill="url(#chup-leaf)"/>
    <rect x="714" y="452" width="12" height="26" rx="6" fill="#3f9b3f"/>
  </g>
  <!-- 2 bulles pres de la fraise -->
  <circle cx="652" cy="420" r="16" fill="#ffffff" opacity=".45"/>
  <circle cx="652" cy="420" r="16" fill="none" stroke="#ffffff" stroke-width="3.5" opacity=".65"/>
  <circle cx="648" cy="415" r="5" fill="#ffffff" opacity=".7"/>
  <circle cx="796" cy="472" r="10" fill="#ffffff" opacity=".55"/>
</svg>
