<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <linearGradient id="mogu-plastic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe3ea"/>
      <stop offset=".2" stop-color="#ffccd7"/>
      <stop offset=".5" stop-color="#ffaebf"/>
      <stop offset=".8" stop-color="#f28ba0"/>
      <stop offset="1" stop-color="#d76e87"/>
    </linearGradient>
    <linearGradient id="mogu-liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd6de"/>
      <stop offset=".25" stop-color="#ffb4c4"/>
      <stop offset=".55" stop-color="#ff9bb0"/>
      <stop offset=".82" stop-color="#ef7f97"/>
      <stop offset="1" stop-color="#d3647e"/>
    </linearGradient>
    <linearGradient id="mogu-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8e7b7"/>
      <stop offset=".3" stop-color="#6cc985"/>
      <stop offset=".6" stop-color="#3fae5a"/>
      <stop offset=".85" stop-color="#2e8a46"/>
      <stop offset="1" stop-color="#1f6b34"/>
    </linearGradient>
    <linearGradient id="mogu-label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#fff6f8"/>
      <stop offset="1" stop-color="#f4e3e8"/>
    </linearGradient>
    <linearGradient id="mogu-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="mogu-cube" cx=".32" cy=".28" r="1.1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#faf2f4"/>
      <stop offset="1" stop-color="#e6d6db"/>
    </radialGradient>
    <linearGradient id="mogu-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c25a74" stop-opacity="0"/>
      <stop offset=".6" stop-color="#c25a74" stop-opacity=".14"/>
      <stop offset="1" stop-color="#a84462" stop-opacity=".38"/>
    </linearGradient>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="272" ry="40" fill="#000" opacity=".35"/>

  <!-- goulot (liquide visible) -->
  <rect x="398" y="206" width="104" height="56" fill="url(#mogu-liquid)"/>

  <!-- corps PET trapu a larges epaules carrees -->
  <path d="M398 254 L398 266
           Q396 288 356 296
           Q292 306 266 316
           Q248 324 248 372
           L248 1176
           Q248 1290 450 1290
           Q652 1290 652 1176
           L652 372
           Q652 324 634 316
           Q608 306 544 296
           Q504 288 502 266
           L502 254 Z"
        fill="url(#mogu-plastic)"/>

  <!-- liquide rose litchi par transparence -->
  <path d="M404 260 L404 270
           Q400 292 362 302
           Q300 312 276 322
           Q258 330 258 376
           L258 1172
           Q258 1276 450 1276
           Q642 1276 642 1172
           L642 376
           Q642 330 624 322
           Q600 312 538 302
           Q500 292 496 270
           L496 260 Z"
        fill="url(#mogu-liquid)" opacity=".95"/>
  <!-- profondeur du liquide vers la base -->
  <path d="M258 1000 L642 1000 L642 1172 Q642 1276 450 1276 Q258 1276 258 1172 Z"
        fill="url(#mogu-depth)"/>

  <!-- gorges horizontales du PET -->
  <g stroke="#c96a82" stroke-width="4" fill="none" opacity=".35">
    <path d="M254 404 Q450 420 646 404"/>
    <path d="M254 1160 Q450 1176 646 1160"/>
  </g>

  <!-- cubes de nata de coco dans le liquide -->
  <g fill="#ffffff" opacity=".85">
    <rect x="278" y="398" width="64" height="64" rx="12" transform="rotate(-12 310 430)"/>
    <rect x="425" y="360" width="54" height="54" rx="10" transform="rotate(18 452 387)"/>
    <rect x="540" y="448" width="62" height="62" rx="11" transform="rotate(-8 571 479)"/>
    <rect x="334" y="532" width="52" height="52" rx="10" transform="rotate(25 360 558)"/>
    <rect x="474" y="565" width="68" height="68" rx="12" transform="rotate(-18 508 599)"/>
    <rect x="291" y="1059" width="58" height="58" rx="11" transform="rotate(10 320 1088)"/>
    <rect x="496" y="1106" width="66" height="66" rx="12" transform="rotate(-14 529 1139)"/>
    <rect x="398" y="1188" width="52" height="52" rx="10" transform="rotate(20 424 1214)"/>
  </g>
  <!-- petits reflets sur les cubes -->
  <g fill="#ffffff" opacity=".6">
    <rect x="290" y="410" width="24" height="12" rx="6" transform="rotate(-12 310 430)"/>
    <rect x="552" y="460" width="22" height="11" rx="5" transform="rotate(-8 571 479)"/>
    <rect x="486" y="578" width="24" height="12" rx="6" transform="rotate(-18 508 599)"/>
    <rect x="508" y="1118" width="22" height="11" rx="5" transform="rotate(-14 529 1139)"/>
  </g>

  <!-- bulles -->
  <g fill="#ffffff">
    <circle cx="287" cy="505" r="4" opacity=".45"/>
    <circle cx="600" cy="548" r="5" opacity=".4"/>
    <circle cx="430" cy="478" r="6" opacity=".5"/>
    <circle cx="345" cy="648" r="5" opacity=".42"/>
    <circle cx="568" cy="660" r="4" opacity=".38"/>
    <circle cx="385" cy="1055" r="5" opacity=".45"/>
    <circle cx="598" cy="1078" r="6" opacity=".4"/>
    <circle cx="470" cy="1252" r="5" opacity=".35"/>
  </g>

  <!-- etiquette large et joyeuse -->
  <g>
    <rect x="248" y="690" width="404" height="325" fill="url(#mogu-label)"/>
    <rect x="248" y="690" width="404" height="12" fill="#ffc7d6"/>
    <text x="450" y="800" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="100" font-weight="700" letter-spacing="6" fill="#e84a8a">MOGU</text>
    <text x="450" y="900" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="100" font-weight="700" letter-spacing="6" fill="#e84a8a">MOGU</text>
    <rect x="296" y="940" width="46" height="6" rx="3" fill="#ffc7d6"/>
    <rect x="558" y="940" width="46" height="6" rx="3" fill="#ffc7d6"/>
    <text x="450" y="954" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="30" font-weight="700" letter-spacing="7" fill="#2e8a46">NATA DE COCO</text>
    <path d="M248 984 Q298 966 349 984 T450 984 T551 984 T652 984 L652 1015 L248 1015 Z"
          fill="#ffc7d6"/>
  </g>

  <!-- reflet vertical flanc gauche + bord droit assombri -->
  <path d="M282 400 Q268 700 282 1180 Q287 1250 318 1264 Q296 1100 296 900 Q296 560 306 402 Z"
        fill="url(#mogu-shine)" opacity=".62"/>
  <rect x="330" y="430" width="10" height="220" rx="5" fill="#ffffff" opacity=".3"/>
  <ellipse cx="336" cy="308" rx="54" ry="12" fill="#ffffff" opacity=".55" transform="rotate(-9 336 308)"/>
  <path d="M624 378 Q644 700 632 1150 Q626 1242 584 1266 Q613 1120 613 940 Q613 600 607 390 Z"
        fill="#8f3d55" opacity=".3"/>
  <path d="M646 420 Q650 800 644 1140 Q642 1200 630 1236 Q638 1180 638 1100 Q642 760 640 430 Q642 418 646 420 Z"
        fill="#ffffff" opacity=".35"/>
  <path d="M330 1272 Q400 1284 480 1283 Q390 1276 348 1262 Z" fill="#ffffff" opacity=".3"/>

  <!-- bague et bouchon vert -->
  <rect x="386" y="240" width="128" height="16" rx="8" fill="#e0778e"/>
  <rect x="372" y="120" width="156" height="86" rx="14" fill="url(#mogu-cap)"/>
  <g fill="#1f6b34" opacity=".3">
    <rect x="392" y="128" width="5" height="70"/>
    <rect x="414" y="128" width="5" height="70"/>
    <rect x="436" y="128" width="5" height="70"/>
    <rect x="458" y="128" width="5" height="70"/>
    <rect x="480" y="128" width="5" height="70"/>
    <rect x="502" y="128" width="5" height="70"/>
  </g>
  <rect x="380" y="124" width="140" height="9" rx="4" fill="#d2f2da" opacity=".65"/>
  <rect x="372" y="194" width="156" height="12" fill="#1f6b34" opacity=".45"/>
  <rect x="382" y="132" width="13" height="62" rx="6" fill="#ffffff" opacity=".45"/>

  <!-- condensation -->
  <g fill="#ffffff">
    <circle cx="290" cy="458" r="6" opacity=".62"/>
    <circle cx="344" cy="625" r="5" opacity=".55"/>
    <circle cx="614" cy="472" r="5" opacity=".6"/>
    <circle cx="598" cy="642" r="6" opacity=".55"/>
    <circle cx="292" cy="1084" r="6" opacity=".6"/>
    <circle cx="620" cy="1124" r="5" opacity=".55"/>
    <circle cx="338" cy="1234" r="5" opacity=".5"/>
    <circle cx="566" cy="1204" r="4" opacity=".5"/>
    <path d="M278 562 q-6 16 0 26 q9 -7 4 -24 Z" opacity=".6"/>
    <path d="M630 1002 q6 14 0 22 q-8 -6 -4 -20 Z" opacity=".55"/>
  </g>

  <!-- garniture : 2 cubes de coco flottants a l'exterieur -->
  <g transform="rotate(-14 190 905)">
    <rect x="153" y="868" width="74" height="74" rx="14" fill="url(#mogu-cube)"/>
    <rect x="165" y="880" width="30" height="15" rx="7" fill="#ffffff" opacity=".85"/>
  </g>
  <g transform="rotate(11 716 1150)">
    <rect x="672" y="1106" width="88" height="88" rx="16" fill="url(#mogu-cube)"/>
    <rect x="686" y="1120" width="36" height="17" rx="8" fill="#ffffff" opacity=".85"/>
  </g>
</svg>
