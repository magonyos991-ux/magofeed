<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <linearGradient id="mogu-plastic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe9ef"/>
      <stop offset=".22" stop-color="#ffd2dd"/>
      <stop offset=".5" stop-color="#ffbccb"/>
      <stop offset=".78" stop-color="#f09cb1"/>
      <stop offset="1" stop-color="#cf7690"/>
    </linearGradient>
    <linearGradient id="mogu-liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd9e0"/>
      <stop offset=".22" stop-color="#ffb9c8"/>
      <stop offset=".5" stop-color="#ff9fb4"/>
      <stop offset=".8" stop-color="#f2809b"/>
      <stop offset="1" stop-color="#cf5f7c"/>
    </linearGradient>
    <linearGradient id="mogu-sleeve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9dc0"/>
      <stop offset=".2" stop-color="#ff7cab"/>
      <stop offset=".5" stop-color="#f95f97"/>
      <stop offset=".8" stop-color="#dd4680"/>
      <stop offset="1" stop-color="#b23366"/>
    </linearGradient>
    <linearGradient id="mogu-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b6ecc4"/>
      <stop offset=".22" stop-color="#7fd497"/>
      <stop offset=".5" stop-color="#46b263"/>
      <stop offset=".8" stop-color="#2f8c49"/>
      <stop offset="1" stop-color="#1e6a35"/>
    </linearGradient>
    <linearGradient id="mogu-capdome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fdba4"/>
      <stop offset=".45" stop-color="#4fb96c"/>
      <stop offset="1" stop-color="#2f8c49"/>
    </linearGradient>
    <linearGradient id="mogu-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="mogu-cube" cx=".32" cy=".26" r="1.15">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#fdf8f7"/>
      <stop offset=".8" stop-color="#f3e4e6"/>
      <stop offset="1" stop-color="#dcc4ca"/>
    </radialGradient>
    <linearGradient id="mogu-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b44f6e" stop-opacity="0"/>
      <stop offset=".55" stop-color="#b44f6e" stop-opacity=".12"/>
      <stop offset=".85" stop-color="#a03e5e" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8c2f4f" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="mogu-winliq" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc3d1"/>
      <stop offset=".22" stop-color="#ff9cb6"/>
      <stop offset=".5" stop-color="#fb7fa1"/>
      <stop offset=".8" stop-color="#e8618b"/>
      <stop offset="1" stop-color="#c04a71"/>
    </linearGradient>
    <radialGradient id="mogu-drop" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".12"/>
    </radialGradient>

    <!-- silhouette PET courte et trapue : epaules hautes et carrees -->
    <clipPath id="mogu-clip-bottle">
      <path d="M392 396 L508 396 L508 424
               Q512 452 586 466
               Q658 480 662 530
               Q664 552 664 590
               L664 1180
               Q664 1236 606 1263
               Q548 1290 450 1290
               Q352 1290 294 1263
               Q236 1236 236 1180
               L236 590
               Q236 552 238 530
               Q242 480 314 466
               Q388 452 392 424 Z"/>
    </clipPath>
    <clipPath id="mogu-clip-win">
      <path d="M298 796 Q450 820 602 796
               Q622 794 624 816 L624 1046
               Q622 1068 602 1071
               Q450 1095 298 1071
               Q278 1068 276 1046 L276 816
               Q278 794 298 796 Z"/>
    </clipPath>

    <path id="mogu-tarc1" d="M230 622 Q450 656 670 622" fill="none"/>
    <path id="mogu-tarc2" d="M230 724 Q450 758 670 724" fill="none"/>
    <path id="mogu-tarc3" d="M250 766 Q450 792 650 766" fill="none"/>
    <path id="mogu-tarc4" d="M250 1133 Q450 1158 650 1133" fill="none"/>
    <path id="mogu-tarc5" d="M250 1176 Q450 1199 650 1176" fill="none"/>
    <path id="mogu-tarc6" d="M250 1243 Q450 1264 650 1243" fill="none"/>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="270" ry="38" fill="#000" opacity=".35"/>

  <!-- corps PET (fond) -->
  <path d="M392 396 L508 396 L508 424
           Q512 452 586 466
           Q658 480 662 530
           Q664 552 664 590
           L664 1180
           Q664 1236 606 1263
           Q548 1290 450 1290
           Q352 1290 294 1263
           Q236 1236 236 1180
           L236 590
           Q236 552 238 530
           Q242 480 314 466
           Q388 452 392 424 Z"
        fill="url(#mogu-plastic)"/>

  <g clip-path="url(#mogu-clip-bottle)">
    <!-- liquide visible dans le goulot et sous la base du sleeve -->
    <rect x="230" y="390" width="440" height="130" fill="url(#mogu-liquid)"/>
    <rect x="230" y="1230" width="440" height="70" fill="url(#mogu-liquid)"/>
    <rect x="230" y="1230" width="440" height="70" fill="url(#mogu-depth)" opacity=".9"/>
    <ellipse cx="450" cy="1288" rx="200" ry="16" fill="#8c2f4f" opacity=".4"/>

    <!-- sleeve plastique rose pleine hauteur -->
    <path d="M200 456 Q450 494 700 456 L700 1234 Q450 1272 200 1234 Z" fill="url(#mogu-sleeve)"/>
    <!-- lisere clair en haut du sleeve -->
    <path d="M200 456 Q450 494 700 456 L700 468 Q450 506 200 468 Z" fill="#ffffff" opacity=".5"/>

    <!-- logo MOGU MOGU : ombre puis lettres blanches a contour framboise -->
    <g font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="104" letter-spacing="4"
       text-anchor="middle">
      <g fill="#8c1f48" opacity=".55" transform="translate(5,9)">
        <text><textPath href="#mogu-tarc1" startOffset="50%">MOGU</textPath></text>
        <text><textPath href="#mogu-tarc2" startOffset="50%">MOGU</textPath></text>
      </g>
      <g fill="#ffffff" stroke="#c22a63" stroke-width="10" paint-order="stroke" stroke-linejoin="round">
        <text><textPath href="#mogu-tarc1" startOffset="50%">MOGU</textPath></text>
        <text><textPath href="#mogu-tarc2" startOffset="50%">MOGU</textPath></text>
      </g>
    </g>

    <!-- pastille LYCHEE -->
    <path d="M352 738 Q450 752 548 738 Q564 736 564 754 L564 764 Q564 782 548 784 Q450 798 352 784 Q336 782 336 764 L336 754 Q336 736 352 738 Z"
          fill="#a3195b"/>
    <text font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="34" letter-spacing="8"
          fill="#ffffff" text-anchor="middle">
      <textPath href="#mogu-tarc3" startOffset="50%">LYCHEE</textPath>
    </text>
    <!-- deux petits litchis -->
    <g>
      <circle cx="300" cy="756" r="24" fill="#e8506e"/>
      <circle cx="300" cy="756" r="24" fill="none" stroke="#b52746" stroke-width="3"/>
      <circle cx="292" cy="748" r="5" fill="#ffb3c2" opacity=".9"/>
      <circle cx="306" cy="762" r="2.4" fill="#b52746"/>
      <circle cx="296" cy="766" r="2.4" fill="#b52746"/>
      <circle cx="308" cy="750" r="2.4" fill="#b52746"/>
      <path d="M300 733 q4 -10 14 -12" stroke="#3f8f4e" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="606" cy="758" r="20" fill="#e8506e"/>
      <circle cx="606" cy="758" r="20" fill="none" stroke="#b52746" stroke-width="3"/>
      <circle cx="600" cy="751" r="4" fill="#ffb3c2" opacity=".9"/>
      <circle cx="611" cy="763" r="2.2" fill="#b52746"/>
      <circle cx="601" cy="765" r="2.2" fill="#b52746"/>
    </g>

    <!-- fenetre transparente : bord blanc puis jus + cubes -->
    <path d="M298 796 Q450 820 602 796 Q622 794 624 816 L624 1046 Q622 1068 602 1071
             Q450 1095 298 1071 Q278 1068 276 1046 L276 816 Q278 794 298 796 Z"
          fill="none" stroke="#ffffff" stroke-width="12"/>
    <g clip-path="url(#mogu-clip-win)">
      <rect x="270" y="788" width="360" height="312" fill="url(#mogu-winliq)"/>
      <rect x="270" y="788" width="360" height="312" fill="url(#mogu-depth)"/>
      <!-- ombres portees des cubes dans le jus -->
      <g fill="#b0446a" opacity=".45">
        <rect x="306" y="830" width="60" height="60" rx="12" transform="rotate(-14 330 852)"/>
        <rect x="432" y="820" width="52" height="52" rx="10" transform="rotate(16 452 838)"/>
        <rect x="543" y="843" width="62" height="62" rx="12" transform="rotate(-7 568 866)"/>
        <rect x="335" y="933" width="54" height="54" rx="10" transform="rotate(22 356 952)"/>
        <rect x="450" y="946" width="68" height="68" rx="13" transform="rotate(-19 478 972)"/>
        <rect x="574" y="960" width="48" height="48" rx="10" transform="rotate(9 592 976)"/>
        <rect x="301" y="1025" width="50" height="50" rx="10" transform="rotate(-24 320 1042)"/>
        <rect x="413" y="1031" width="58" height="58" rx="11" transform="rotate(12 436 1052)"/>
        <rect x="536" y="1032" width="52" height="52" rx="10" transform="rotate(-10 556 1050)"/>
      </g>
      <!-- cubes de nata de coco en suspension -->
      <g>
        <g transform="rotate(-14 330 852)">
          <rect x="300" y="822" width="60" height="60" rx="12" fill="url(#mogu-cube)"/>
          <rect x="308" y="830" width="24" height="12" rx="6" fill="#ffffff" opacity=".9"/>
        </g>
        <g transform="rotate(16 452 838)">
          <rect x="426" y="812" width="52" height="52" rx="10" fill="url(#mogu-cube)"/>
          <rect x="433" y="819" width="21" height="10" rx="5" fill="#ffffff" opacity=".9"/>
        </g>
        <g transform="rotate(-7 568 866)">
          <rect x="537" y="835" width="62" height="62" rx="12" fill="url(#mogu-cube)"/>
          <rect x="545" y="843" width="25" height="12" rx="6" fill="#ffffff" opacity=".9"/>
        </g>
        <g transform="rotate(22 356 952)">
          <rect x="329" y="925" width="54" height="54" rx="10" fill="url(#mogu-cube)"/>
          <rect x="336" y="932" width="22" height="11" rx="5" fill="#ffffff" opacity=".9"/>
        </g>
        <g transform="rotate(-19 478 972)">
          <rect x="444" y="938" width="68" height="68" rx="13" fill="url(#mogu-cube)"/>
          <rect x="453" y="947" width="27" height="13" rx="6" fill="#ffffff" opacity=".9"/>
        </g>
        <g transform="rotate(9 592 976)">
          <rect x="568" y="952" width="48" height="48" rx="10" fill="url(#mogu-cube)"/>
          <rect x="574" y="958" width="19" height="9" rx="4" fill="#ffffff" opacity=".9"/>
        </g>
        <g transform="rotate(-24 320 1042)">
          <rect x="295" y="1017" width="50" height="50" rx="10" fill="url(#mogu-cube)"/>
          <rect x="302" y="1024" width="20" height="10" rx="5" fill="#ffffff" opacity=".9"/>
        </g>
        <g transform="rotate(12 436 1052)">
          <rect x="407" y="1023" width="58" height="58" rx="11" fill="url(#mogu-cube)"/>
          <rect x="415" y="1031" width="23" height="11" rx="5" fill="#ffffff" opacity=".9"/>
        </g>
        <g transform="rotate(-10 556 1050)">
          <rect x="530" y="1024" width="52" height="52" rx="10" fill="url(#mogu-cube)"/>
          <rect x="537" y="1031" width="21" height="10" rx="5" fill="#ffffff" opacity=".9"/>
        </g>
      </g>
      <!-- bulles -->
      <g fill="#ffffff">
        <circle cx="398" cy="900" r="5" opacity=".5"/>
        <circle cx="522" cy="882" r="4" opacity=".45"/>
        <circle cx="300" cy="948" r="4" opacity=".42"/>
        <circle cx="606" cy="928" r="5" opacity=".45"/>
        <circle cx="386" cy="1010" r="4" opacity=".4"/>
        <circle cx="500" cy="1046" r="5" opacity=".38"/>
      </g>
      <!-- ombrage interieur de la fenetre -->
      <path d="M276 796 L624 796 L624 830 Q450 852 276 830 Z" fill="#8c2f4f" opacity=".16"/>
    </g>

    <!-- NATA DE COCO sous la fenetre -->
    <text font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="40" letter-spacing="5"
          fill="#ffffff" text-anchor="middle">
      <textPath href="#mogu-tarc4" startOffset="50%">NATA DE COCO</textPath>
    </text>
    <text font-family="'Space Grotesk',sans-serif" font-weight="500" font-size="25" letter-spacing="6"
          fill="#ffe1ec" text-anchor="middle">
      <textPath href="#mogu-tarc5" startOffset="50%">JUICE DRINK  320 ML</textPath>
    </text>

    <!-- bande blanche ondulee en bas du sleeve -->
    <path d="M200 1216 Q325 1196 450 1216 Q575 1236 700 1216 L700 1234 Q450 1272 200 1234 Z"
          fill="#fffdf6" opacity="0"/>
    <path d="M200 1218 Q325 1198 450 1218 Q575 1238 700 1218 L700 1238 Q450 1276 200 1238 Z"
          fill="#fffdf6"/>
    <text font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="21" letter-spacing="4"
          fill="#2e8a46" text-anchor="middle">
      <textPath href="#mogu-tarc6" startOffset="50%">JUICE WITH NATA DE COCO</textPath>
    </text>

    <!-- modelage cylindrique : lumiere haut-gauche, bord droit ombre -->
    <rect x="262" y="380" width="86" height="930" fill="url(#mogu-shine)" opacity=".55"/>
    <rect x="368" y="430" width="16" height="240" rx="8" fill="#ffffff" opacity=".28"/>
    <path d="M664 470 L664 1290 L584 1290 Q628 1120 628 880 Q628 640 600 470 Z"
          fill="#6e2140" opacity=".16"/>
    <path d="M657 500 Q662 850 652 1150 Q648 1215 626 1252 Q642 1170 642 1080 Q650 780 646 505 Q650 492 657 500 Z"
          fill="#ffffff" opacity=".4"/>
    <path d="M236 520 L236 1270 L300 1270 Q262 1120 262 880 Q262 660 282 512 Z"
          fill="#8c2f4f" opacity=".12"/>
    <!-- eclat sur l'epaule -->
    <ellipse cx="338" cy="492" rx="60" ry="15" fill="#ffffff" opacity=".55" transform="rotate(-17 338 492)"/>
    <ellipse cx="576" cy="496" rx="34" ry="9" fill="#ffffff" opacity=".3" transform="rotate(15 576 496)"/>
    <!-- reflet bas de bouteille -->
    <path d="M320 1274 Q400 1288 500 1286 Q396 1278 342 1262 Z" fill="#ffffff" opacity=".35"/>
  </g>

  <!-- collerette du goulot -->
  <path d="M386 398 Q450 410 514 398 L514 416 Q450 428 386 416 Z" fill="#e0788f"/>

  <!-- bouchon vert a jupe crantee -->
  <path d="M380 384 Q450 398 520 384 L520 402 Q450 416 380 402 Z" fill="#1e6a35"/>
  <rect x="374" y="306" width="152" height="80" rx="13" fill="url(#mogu-cap)"/>
  <path d="M374 300 Q450 288 526 300 L526 320 Q450 332 374 320 Z" fill="url(#mogu-capdome)"/>
  <g stroke="#175a2b" stroke-width="4.5" opacity=".4" stroke-linecap="round">
    <line x1="392" y1="316" x2="392" y2="378"/>
    <line x1="410" y1="318" x2="410" y2="380"/>
    <line x1="428" y1="320" x2="428" y2="382"/>
    <line x1="446" y1="321" x2="446" y2="383"/>
    <line x1="464" y1="321" x2="464" y2="383"/>
    <line x1="482" y1="320" x2="482" y2="382"/>
    <line x1="500" y1="318" x2="500" y2="380"/>
    <line x1="516" y1="316" x2="516" y2="378"/>
  </g>
  <path d="M374 372 L526 372 L526 386 Q450 398 374 386 Z" fill="#175a2b" opacity=".5"/>
  <rect x="384" y="314" width="14" height="58" rx="7" fill="#ffffff" opacity=".45"/>
  <path d="M380 296 Q450 284 520 296 L520 302 Q450 292 380 302 Z" fill="#d8f5e0" opacity=".8"/>

  <!-- condensation -->
  <g>
    <circle cx="292" cy="560" r="7" fill="url(#mogu-drop)"/>
    <circle cx="612" cy="586" r="6" fill="url(#mogu-drop)"/>
    <circle cx="326" cy="676" r="6" fill="url(#mogu-drop)"/>
    <circle cx="588" cy="700" r="7" fill="url(#mogu-drop)"/>
    <circle cx="300" cy="1128" r="7" fill="url(#mogu-drop)"/>
    <circle cx="622" cy="1114" r="6" fill="url(#mogu-drop)"/>
    <path d="M270 640 q-7 20 0 32 q10 -8 5 -29 Z" fill="#ffffff" opacity=".55"/>
    <path d="M636 960 q7 17 0 27 q-9 -7 -5 -25 Z" fill="#ffffff" opacity=".5"/>
  </g>

  <!-- garniture : 2 cubes de nata de coco a l'exterieur -->
  <ellipse cx="176" cy="1268" rx="60" ry="12" fill="#000" opacity=".18"/>
  <g transform="rotate(-13 176 1210)">
    <rect x="138" y="1172" width="76" height="76" rx="15" fill="url(#mogu-cube)"/>
    <path d="M148 1236 q30 12 56 0 l0 6 q-28 12 -56 0 Z" fill="#c9a9b2" opacity=".55"/>
    <rect x="150" y="1184" width="30" height="15" rx="7" fill="#ffffff" opacity=".92"/>
  </g>
  <ellipse cx="742" cy="1214" rx="66" ry="13" fill="#000" opacity=".18"/>
  <g transform="rotate(11 742 1150)">
    <rect x="698" y="1106" width="88" height="88" rx="17" fill="url(#mogu-cube)"/>
    <path d="M710 1180 q34 14 64 0 l0 7 q-32 14 -64 0 Z" fill="#c9a9b2" opacity=".55"/>
    <rect x="712" y="1120" width="36" height="17" rx="8" fill="#ffffff" opacity=".92"/>
  </g>
</svg>
