<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <linearGradient id="calp-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".28" stop-color="#fefefd"/>
      <stop offset=".55" stop-color="#f6f2e9"/>
      <stop offset=".8" stop-color="#ede8dc"/>
      <stop offset="1" stop-color="#e3ded1"/>
    </linearGradient>
    <linearGradient id="calp-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fccf0"/>
      <stop offset=".25" stop-color="#6badde"/>
      <stop offset=".55" stop-color="#4489c8"/>
      <stop offset=".8" stop-color="#2f6ba6"/>
      <stop offset="1" stop-color="#245686"/>
    </linearGradient>
    <linearGradient id="calp-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="calp-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3aa96" stop-opacity="0"/>
      <stop offset=".55" stop-color="#b3aa96" stop-opacity="0"/>
      <stop offset=".78" stop-color="#b3aa96" stop-opacity=".26"/>
      <stop offset="1" stop-color="#a89f8a" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="calp-lit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".2" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="calp-dot" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#9ccdf1"/>
      <stop offset=".55" stop-color="#7db8e8"/>
      <stop offset="1" stop-color="#63a5d9"/>
    </radialGradient>
    <clipPath id="calp-clip">
      <path d="M404 205 L404 232 Q404 254 386 268 Q306 338 306 452
               L306 592 Q306 656 315 718 Q321 762 315 806 Q306 868 306 932
               L306 1200 Q306 1290 398 1290 L502 1290 Q594 1290 594 1200
               L594 932 Q594 868 585 806 Q579 762 585 718 Q594 656 594 592
               L594 452 Q594 338 514 268 Q496 254 496 232 L496 205 Z"/>
    </clipPath>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="40" fill="#000" opacity=".35"/>

  <!-- garniture : petites bulles douces autour -->
  <g>
    <circle cx="222" cy="640" r="30" fill="none" stroke="#ffffff" stroke-width="6" opacity=".28"/>
    <circle cx="212" cy="628" r="7" fill="#ffffff" opacity=".5"/>
    <circle cx="665" cy="452" r="18" fill="none" stroke="#ffffff" stroke-width="5" opacity=".26"/>
    <circle cx="659" cy="445" r="4" fill="#ffffff" opacity=".5"/>
    <circle cx="680" cy="950" r="25" fill="none" stroke="#ffffff" stroke-width="6" opacity=".24"/>
    <circle cx="671" cy="940" r="6" fill="#ffffff" opacity=".45"/>
  </g>

  <!-- corps PET blanc, epaules douces -->
  <path d="M404 205 L404 232 Q404 254 386 268 Q306 338 306 452
           L306 592 Q306 656 315 718 Q321 762 315 806 Q306 868 306 932
           L306 1200 Q306 1290 398 1290 L502 1290 Q594 1290 594 1200
           L594 932 Q594 868 585 806 Q579 762 585 718 Q594 656 594 592
           L594 452 Q594 338 514 268 Q496 254 496 232 L496 205 Z"
        fill="url(#calp-body)"/>

  <!-- pois bleus asymetriques (rognes au corps) -->
  <g clip-path="url(#calp-clip)">
    <circle cx="372" cy="318" r="20" fill="url(#calp-dot)"/>
    <circle cx="486" cy="282" r="12" fill="#7db8e8"/>
    <circle cx="548" cy="368" r="24" fill="url(#calp-dot)"/>
    <circle cx="332" cy="436" r="13" fill="#7db8e8"/>
    <circle cx="452" cy="420" r="8" fill="#7db8e8"/>
    <circle cx="566" cy="500" r="15" fill="#7db8e8"/>
    <circle cx="352" cy="528" r="26" fill="url(#calp-dot)"/>
    <circle cx="482" cy="520" r="9" fill="#7db8e8"/>
    <circle cx="590" cy="560" r="12" fill="#7db8e8"/>
    <circle cx="316" cy="760" r="11" fill="#7db8e8"/>
    <circle cx="524" cy="760" r="28" fill="url(#calp-dot)"/>
    <circle cx="408" cy="822" r="13" fill="#7db8e8"/>
    <circle cx="582" cy="866" r="18" fill="#7db8e8"/>
    <circle cx="344" cy="912" r="22" fill="url(#calp-dot)"/>
    <circle cx="478" cy="892" r="8" fill="#7db8e8"/>
    <circle cx="552" cy="972" r="13" fill="#7db8e8"/>
    <circle cx="376" cy="1022" r="28" fill="url(#calp-dot)"/>
    <circle cx="504" cy="1060" r="11" fill="#7db8e8"/>
    <circle cx="312" cy="1128" r="15" fill="#7db8e8"/>
    <circle cx="566" cy="1130" r="24" fill="url(#calp-dot)"/>
    <circle cx="436" cy="1186" r="12" fill="#7db8e8"/>
    <circle cx="336" cy="1244" r="9" fill="#7db8e8"/>
    <circle cx="496" cy="1252" r="18" fill="url(#calp-dot)"/>
    <!-- assise du fond -->
    <ellipse cx="450" cy="1272" rx="134" ry="16" fill="#d9d3c5" opacity=".55"/>
  </g>

  <!-- modelé : cote droit assombri en degrade doux, cote gauche eclaire -->
  <g clip-path="url(#calp-clip)">
    <rect x="306" y="205" width="288" height="1085" fill="url(#calp-shade)"/>
    <rect x="306" y="205" width="288" height="1085" fill="url(#calp-lit)"/>
    <path d="M594 452 Q594 338 514 268 L524 258 Q594 330 594 440 Z
             M594 460 L594 1200 Q594 1284 508 1290 L560 1268 Q586 1240 586 1160
             L588 700 Z"
          fill="#9b917c" opacity=".3"/>
  </g>

  <!-- lumiere haut-gauche : bande de reflet vertical -->
  <path d="M336 372 Q322 700 330 1150 Q334 1232 362 1254 Q342 1080 344 780
           Q346 520 358 380 Z"
        fill="url(#calp-shine)" opacity=".55"/>
  <path d="M390 284 Q344 318 328 372 L350 386 Q366 332 408 302 Z"
        fill="#ffffff" opacity=".5"/>

  <!-- etiquette integree -->
  <g>
    <text x="450" y="648" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="62" font-weight="700" fill="#3a7fc1"
          textLength="264" lengthAdjust="spacingAndGlyphs">CALPICO</text>
    <text x="450" y="694" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="20" font-weight="600" fill="#3a7fc1" opacity=".8"
          textLength="252" lengthAdjust="spacingAndGlyphs">SODA LACTÉ JAPONAIS</text>
    <circle cx="426" cy="722" r="4" fill="#7db8e8"/>
    <circle cx="450" cy="722" r="4" fill="#7db8e8"/>
    <circle cx="474" cy="722" r="4" fill="#7db8e8"/>
  </g>

  <!-- bouchon bleu -->
  <rect x="386" y="122" width="128" height="74" rx="14" fill="url(#calp-cap)"/>
  <g stroke="#1e4d78" stroke-width="3" opacity=".28">
    <line x1="400" y1="130" x2="400" y2="188"/><line x1="414" y1="128" x2="414" y2="190"/>
    <line x1="428" y1="126" x2="428" y2="192"/><line x1="442" y1="126" x2="442" y2="192"/>
    <line x1="456" y1="126" x2="456" y2="192"/><line x1="470" y1="126" x2="470" y2="192"/>
    <line x1="484" y1="128" x2="484" y2="190"/><line x1="498" y1="130" x2="498" y2="188"/>
  </g>
  <rect x="394" y="128" width="16" height="60" rx="8" fill="#ffffff" opacity=".45"/>
  <rect x="394" y="196" width="112" height="16" rx="6" fill="url(#calp-cap)"/>
  <rect x="394" y="196" width="112" height="16" rx="6" fill="#123a5e" opacity=".35"/>

  <!-- condensation -->
  <g fill="#9cc4e2">
    <circle cx="356" cy="470" r="6" opacity=".65"/>
    <circle cx="540" cy="440" r="5" opacity=".6"/>
    <circle cx="338" cy="850" r="7" opacity=".65"/>
    <circle cx="558" cy="905" r="5" opacity=".6"/>
    <circle cx="372" cy="1150" r="6" opacity=".65"/>
    <circle cx="536" cy="1206" r="5" opacity=".55"/>
    <circle cx="452" cy="960" r="4" opacity=".55"/>
    <path d="M562 690 q6 15 0 24 q-9 -6 -4 -22 Z" opacity=".65"/>
    <path d="M334 990 q-6 16 0 26 q9 -7 4 -24 Z" opacity=".65"/>
  </g>
  <g fill="#ffffff">
    <circle cx="354" cy="468" r="2" opacity=".8"/>
    <circle cx="336" cy="847" r="2.4" opacity=".8"/>
    <circle cx="370" cy="1147" r="2" opacity=".75"/>
    <circle cx="556" cy="902" r="1.8" opacity=".7"/>
  </g>
</svg>
