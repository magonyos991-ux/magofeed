<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <!-- plastique laiteux : blanc chaud -> blanc ombre, modelé horizontal -->
    <linearGradient id="calp-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f1ea"/>
      <stop offset=".14" stop-color="#fdfcf9"/>
      <stop offset=".34" stop-color="#ffffff"/>
      <stop offset=".58" stop-color="#f7f4ed"/>
      <stop offset=".78" stop-color="#ece7db"/>
      <stop offset=".92" stop-color="#dfd9ca"/>
      <stop offset="1" stop-color="#d3ccbb"/>
    </linearGradient>
    <linearGradient id="calp-neck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ece8de"/>
      <stop offset=".3" stop-color="#ffffff"/>
      <stop offset=".62" stop-color="#f3efe6"/>
      <stop offset=".85" stop-color="#e2dccd"/>
      <stop offset="1" stop-color="#d5cebd"/>
    </linearGradient>
    <linearGradient id="calp-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb5e4"/>
      <stop offset=".18" stop-color="#5b9bd6"/>
      <stop offset=".45" stop-color="#3f7fbe"/>
      <stop offset=".72" stop-color="#2f679f"/>
      <stop offset="1" stop-color="#245380"/>
    </linearGradient>
    <linearGradient id="calp-capring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f97cc"/>
      <stop offset=".4" stop-color="#396fa8"/>
      <stop offset=".75" stop-color="#2a5a8c"/>
      <stop offset="1" stop-color="#1f4569"/>
    </linearGradient>
    <!-- reflet vertical doux (lumiere haut-gauche) -->
    <linearGradient id="calp-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset=".75" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="calp-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7ad97" stop-opacity="0"/>
      <stop offset=".6" stop-color="#b7ad97" stop-opacity="0"/>
      <stop offset=".82" stop-color="#b0a68f" stop-opacity=".2"/>
      <stop offset=".95" stop-color="#a2977e" stop-opacity=".42"/>
      <stop offset="1" stop-color="#978c72" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="calp-lit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".4"/>
      <stop offset=".12" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".3" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="calp-basefade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c2b0" stop-opacity="0"/>
      <stop offset=".55" stop-color="#c4bca8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#b3aa93" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="calp-dotbig" cx=".38" cy=".32" r="1">
      <stop offset="0" stop-color="#b5d9f3"/>
      <stop offset=".55" stop-color="#9ccbee"/>
      <stop offset="1" stop-color="#85bce6"/>
    </radialGradient>
    <clipPath id="calp-clip">
      <path d="M414 230 L486 230 L486 262
               C486 292 494 300 522 314
               C574 340 606 366 608 434
               C608 546 592 640 592 748
               C592 862 604 962 604 1100
               L604 1212 Q604 1290 520 1290 L380 1290
               Q296 1290 296 1212 L296 1100
               C296 962 308 862 308 748
               C308 640 292 546 292 434
               C294 366 326 340 378 314
               C406 300 414 292 414 262 Z"/>
    </clipPath>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="38" fill="#000" opacity=".35"/>
  <ellipse cx="440" cy="1326" rx="180" ry="24" fill="#000" opacity=".22"/>

  <!-- silhouette : epaules douces, cintrage a la taille, pied stable -->
  <path d="M414 230 L486 230 L486 262
           C486 292 494 300 522 314
           C574 340 606 366 608 434
           C608 546 592 640 592 748
           C592 862 604 962 604 1100
           L604 1212 Q604 1290 520 1290 L380 1290
           Q296 1290 296 1212 L296 1100
           C296 962 308 862 308 748
           C308 640 292 546 292 434
           C294 366 326 340 378 314
           C406 300 414 292 414 262 Z"
        fill="url(#calp-body)"/>

  <!-- tout ce qui habille le corps est rogne a la silhouette -->
  <g clip-path="url(#calp-clip)">

    <!-- pois bleu clair, dispersion diagonale, aplatis pres des bords (courbure) -->
    <g>
      <!-- bande haute -->
      <ellipse cx="332" cy="392" rx="13" ry="17" fill="#9ccbee"/>
      <circle cx="440" cy="352" r="9" fill="#a7d2f1"/>
      <ellipse cx="562" cy="398" rx="17" ry="22" fill="url(#calp-dotbig)"/>
      <circle cx="486" cy="446" r="13" fill="#9ccbee"/>
      <ellipse cx="308" cy="490" rx="9" ry="14" fill="#a7d2f1"/>
      <ellipse cx="592" cy="500" rx="10" ry="16" fill="#9ccbee"/>
      <!-- bande logo : discrets pour laisser respirer le texte -->
      <circle cx="368" cy="470" r="7" fill="#b0d7f2"/>
      <ellipse cx="594" cy="672" rx="8" ry="13" fill="#a7d2f1"/>
      <ellipse cx="306" cy="628" rx="10" ry="15" fill="#9ccbee"/>
      <!-- bande mediane sous le logo -->
      <circle cx="420" cy="756" r="25" fill="url(#calp-dotbig)"/>
      <circle cx="516" cy="716" r="11" fill="#a7d2f1"/>
      <ellipse cx="322" cy="742" rx="12" ry="16" fill="#9ccbee"/>
      <ellipse cx="585" cy="756" rx="13" ry="19" fill="#9ccbee"/>
      <circle cx="472" cy="836" r="8" fill="#b0d7f2"/>
      <ellipse cx="336" cy="860" rx="18" ry="23" fill="url(#calp-dotbig)"/>
      <circle cx="540" cy="872" r="16" fill="#9ccbee"/>
      <ellipse cx="602" cy="866" rx="7" ry="12" fill="#a7d2f1"/>
      <!-- bande basse -->
      <circle cx="430" cy="944" r="12" fill="#a7d2f1"/>
      <ellipse cx="310" cy="972" rx="10" ry="15" fill="#9ccbee"/>
      <circle cx="502" cy="1002" r="27" fill="url(#calp-dotbig)"/>
      <ellipse cx="580" cy="984" rx="11" ry="16" fill="#a7d2f1"/>
      <circle cx="372" cy="1046" r="9" fill="#b0d7f2"/>
      <ellipse cx="318" cy="1120" rx="15" ry="20" fill="url(#calp-dotbig)"/>
      <circle cx="444" cy="1110" r="14" fill="#9ccbee"/>
      <ellipse cx="588" cy="1096" rx="12" ry="18" fill="#9ccbee"/>
      <circle cx="524" cy="1168" r="10" fill="#a7d2f1"/>
      <ellipse cx="352" cy="1210" rx="20" ry="24" fill="url(#calp-dotbig)"/>
      <circle cx="452" cy="1236" r="8" fill="#b0d7f2"/>
      <ellipse cx="572" cy="1216" rx="14" ry="18" fill="#9ccbee"/>
      <circle cx="404" cy="1136" r="6" fill="#b0d7f2"/>
      <ellipse cx="606" cy="1176" rx="7" ry="11" fill="#a7d2f1"/>
    </g>

    <!-- lignes de moulage discretes du PET -->
    <g stroke="#c8c0ad" stroke-width="2.5" fill="none" opacity=".28">
      <path d="M300 560 Q450 588 600 560"/>
      <path d="M296 928 Q450 954 604 928"/>
    </g>
    <g stroke="#ffffff" stroke-width="2" fill="none" opacity=".4">
      <path d="M300 566 Q450 594 600 566"/>
      <path d="M296 934 Q450 960 604 934"/>
    </g>

    <!-- assise du fond : petillement conique du pied PET -->
    <rect x="290" y="1180" width="320" height="110" fill="url(#calp-basefade)"/>
    <path d="M310 1290 Q450 1252 590 1290 L590 1292 L310 1292 Z" fill="#b9b09a" opacity=".5"/>
    <path d="M356 1290 Q450 1266 544 1290 Z" fill="#f7f4ec" opacity=".6"/>

    <!-- modelé global : bord droit ombre, bord gauche eclaire -->
    <rect x="288" y="220" width="324" height="1075" fill="url(#calp-shade)"/>
    <rect x="288" y="220" width="324" height="1075" fill="url(#calp-lit)"/>
    <!-- ombre d'accentuation le long du bord droit -->
    <path d="M608 434 C606 366 574 340 522 314 L536 300 C598 330 616 372 617 440
             C617 550 601 642 601 748 C601 862 613 962 613 1100 L613 1212
             Q613 1282 528 1291 L560 1268 Q596 1252 596 1198 L596 1100
             C596 962 584 862 584 748 C584 642 600 550 600 434 Z"
          fill="#93886e" opacity=".28"/>
    <!-- creux d'ombre sous l'epaule -->
    <path d="M378 314 C326 340 294 366 292 434 L300 438 C306 380 340 352 388 328 Z"
          fill="#ffffff" opacity=".5"/>
  </g>

  <!-- reflet vertical doux cote gauche, suit le cintrage -->
  <path d="M330 368 C318 470 326 520 326 650 C326 760 316 820 318 900
           C320 1010 312 1090 316 1190 Q318 1246 348 1266
           C332 1180 336 1090 334 1000 C332 900 342 830 340 730
           C338 610 344 470 354 380 Z"
        fill="url(#calp-shine)" opacity=".6"/>
  <!-- eclat d'epaule haut-gauche -->
  <path d="M400 296 C360 316 336 342 324 384 L344 394 C356 356 380 332 416 314 Z"
        fill="#ffffff" opacity=".55"/>
  <!-- fin liseré lumineux bord droit (rebond de lumiere) -->
  <path d="M602 490 C602 580 588 660 588 748 C588 850 596 940 598 1050 L592 1050
           C590 940 582 850 582 748 C582 660 596 580 596 490 Z"
        fill="#ffffff" opacity=".35"/>

  <!-- logo CALPICO legerement incline -->
  <g transform="rotate(-5 450 540)">
    <text x="450" y="560" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="78" font-weight="700" fill="#2e6fb5" letter-spacing="2"
          textLength="272" lengthAdjust="spacingAndGlyphs">CALPICO</text>
    <text x="450" y="606" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="21" font-weight="600" fill="#5a92c8"
          textLength="238" lengthAdjust="spacingAndGlyphs">SODA LACTÉ JAPONAIS</text>
  </g>
  <g transform="rotate(-5 450 540)" fill="#9ccbee">
    <circle cx="414" cy="636" r="4.5"/>
    <circle cx="450" cy="636" r="4.5"/>
    <circle cx="486" cy="636" r="4.5"/>
  </g>

  <!-- col + bague -->
  <path d="M414 230 L486 230 L486 262 C486 278 489 288 498 296 L402 296
           C411 288 414 278 414 262 Z" fill="url(#calp-neck)"/>
  <rect x="399" y="196" width="102" height="18" rx="8" fill="url(#calp-capring)"/>
  <rect x="399" y="196" width="102" height="7" rx="3.5" fill="#6ea3d4" opacity=".7"/>

  <!-- bouchon bleu strie -->
  <rect x="392" y="112" width="116" height="76" rx="12" fill="url(#calp-cap)"/>
  <g stroke="#1c4166" stroke-width="3" opacity=".32">
    <line x1="404" y1="120" x2="404" y2="180"/><line x1="417" y1="117" x2="417" y2="183"/>
    <line x1="430" y1="116" x2="430" y2="184"/><line x1="443" y1="115" x2="443" y2="185"/>
    <line x1="456" y1="115" x2="456" y2="185"/><line x1="469" y1="115" x2="469" y2="185"/>
    <line x1="482" y1="116" x2="482" y2="184"/><line x1="495" y1="118" x2="495" y2="182"/>
  </g>
  <rect x="392" y="112" width="116" height="14" rx="7" fill="#a9cdec" opacity=".75"/>
  <rect x="400" y="122" width="14" height="58" rx="7" fill="#ffffff" opacity=".4"/>
  <rect x="486" y="126" width="10" height="52" rx="5" fill="#12314e" opacity=".35"/>

  <!-- condensation discrete -->
  <g fill="#a9cbe4">
    <circle cx="352" cy="452" r="6" opacity=".55"/>
    <circle cx="556" cy="470" r="5" opacity=".5"/>
    <circle cx="340" cy="800" r="7" opacity=".55"/>
    <circle cx="566" cy="940" r="5" opacity=".5"/>
    <circle cx="380" cy="1080" r="6" opacity=".55"/>
    <path d="M574 660 q6 16 0 26 q-9 -7 -4 -24 Z" opacity=".55"/>
    <path d="M330 1000 q-6 16 0 26 q9 -7 4 -24 Z" opacity=".55"/>
  </g>
  <g fill="#ffffff">
    <circle cx="350" cy="450" r="2" opacity=".8"/>
    <circle cx="338" cy="797" r="2.4" opacity=".8"/>
    <circle cx="378" cy="1077" r="2" opacity=".75"/>
    <circle cx="554" cy="468" r="1.8" opacity=".7"/>
  </g>
</svg>
