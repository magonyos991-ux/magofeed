<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <radialGradient id="ciao-halo">
      <stop offset="0" stop-color="#f2c94c" stop-opacity=".30"/>
      <stop offset=".45" stop-color="#f2c94c" stop-opacity=".14"/>
      <stop offset=".75" stop-color="#f2c94c" stop-opacity=".05"/>
      <stop offset="1" stop-color="#f2c94c" stop-opacity="0"/>
    </radialGradient>

    <!-- metal noir : gradient horizontal de base du cylindre -->
    <linearGradient id="ciao-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050403"/>
      <stop offset=".04" stop-color="#231f19"/>
      <stop offset=".10" stop-color="#4c463c"/>
      <stop offset=".17" stop-color="#2b2721"/>
      <stop offset=".30" stop-color="#191510"/>
      <stop offset=".55" stop-color="#120e0a"/>
      <stop offset=".78" stop-color="#0b0906"/>
      <stop offset=".93" stop-color="#060504"/>
      <stop offset="1" stop-color="#030202"/>
    </linearGradient>

    <!-- bande de reflet verticale : transparent - gris - transparent -->
    <linearGradient id="ciao-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d867a" stop-opacity="0"/>
      <stop offset=".35" stop-color="#8d867a" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#a39b8c" stop-opacity=".65"/>
      <stop offset=".75" stop-color="#8d867a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8d867a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ciao-bandthin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfc8b8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#cfc8b8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#cfc8b8" stop-opacity="0"/>
    </linearGradient>
    <!-- rim light dore du bord droit -->
    <linearGradient id="ciao-rimgold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2c94c" stop-opacity="0"/>
      <stop offset=".4" stop-color="#f2c94c" stop-opacity=".4"/>
      <stop offset=".75" stop-color="#ffdf82" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff0bc" stop-opacity="1"/>
    </linearGradient>
    <!-- fondu vertical applique aux bandes (plus fortes en haut) -->
    <linearGradient id="ciao-bandfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".06" stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".75"/>
      <stop offset=".9" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- couvercle -->
    <linearGradient id="ciao-lidring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a8172"/>
      <stop offset=".18" stop-color="#4a4438"/>
      <stop offset=".5" stop-color="#26211a"/>
      <stop offset=".82" stop-color="#15110c"/>
      <stop offset="1" stop-color="#3a342a"/>
    </linearGradient>
    <radialGradient id="ciao-lidtop" cx=".36" cy=".3" r="1">
      <stop offset="0" stop-color="#413a2d"/>
      <stop offset=".4" stop-color="#28221a"/>
      <stop offset=".75" stop-color="#17130d"/>
      <stop offset="1" stop-color="#0a0806"/>
    </radialGradient>
    <linearGradient id="ciao-tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e6553"/>
      <stop offset=".4" stop-color="#3f392e"/>
      <stop offset=".7" stop-color="#2a2419"/>
      <stop offset="1" stop-color="#171310"/>
    </linearGradient>

    <linearGradient id="ciao-bolt" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0" stop-color="#fff3c9"/>
      <stop offset=".3" stop-color="#f7d569"/>
      <stop offset=".62" stop-color="#f2c94c"/>
      <stop offset=".85" stop-color="#d9a531"/>
      <stop offset="1" stop-color="#b07c1e"/>
    </linearGradient>
    <linearGradient id="ciao-goldtext" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0bc"/>
      <stop offset=".35" stop-color="#f7d569"/>
      <stop offset=".7" stop-color="#f2c94c"/>
      <stop offset="1" stop-color="#c8922a"/>
    </linearGradient>

    <linearGradient id="ciao-rightshade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".55" stop-color="#000" stop-opacity=".3"/>
      <stop offset=".85" stop-color="#000" stop-opacity=".55"/>
      <stop offset="1" stop-color="#000" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="ciao-basefade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".45" stop-color="#000" stop-opacity=".25"/>
      <stop offset=".8" stop-color="#000" stop-opacity=".5"/>
      <stop offset="1" stop-color="#000" stop-opacity=".68"/>
    </linearGradient>
    <linearGradient id="ciao-foot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b6152"/>
      <stop offset=".22" stop-color="#332d24"/>
      <stop offset=".6" stop-color="#181510"/>
      <stop offset="1" stop-color="#080604"/>
    </linearGradient>

    <radialGradient id="ciao-sparkglow">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#f2c94c" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f2c94c" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="ciao-canclip">
      <path d="M300 272 C297 308 270 332 257 368 Q250 386 250 404
               L250 1158 Q250 1210 296 1240 Q316 1254 320 1272
               Q323 1288 346 1290 Q450 1298 554 1290 Q577 1288 580 1272
               Q584 1254 604 1240 Q650 1210 650 1158 L650 404
               Q650 386 643 368 C630 332 603 308 600 272 L300 272 Z"/>
    </clipPath>

    <!-- arcs de courbure pour les textes (bombes vers le bas) -->
    <path id="ciao-arcname" d="M235 686 Q450 728 665 686" fill="none"/>
    <path id="ciao-arcsub" d="M255 774 Q450 808 645 774" fill="none"/>
    <path id="ciao-arccl" d="M320 1178 Q450 1200 580 1178" fill="none"/>

    <filter id="ciao-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- halo dore mythique derriere la canette -->
  <ellipse cx="450" cy="790" rx="420" ry="580" fill="url(#ciao-halo)"/>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="250" ry="38" fill="#000" opacity=".35"/>
  <ellipse cx="450" cy="1322" rx="180" ry="22" fill="#f2c94c" opacity=".08"/>

  <!-- corps de la canette : epaule, fut droit, pied retreci -->
  <path d="M300 272 C297 308 270 332 257 368 Q250 386 250 404
           L250 1158 Q250 1210 296 1240 Q316 1254 320 1272
           Q323 1288 346 1290 Q450 1298 554 1290 Q577 1288 580 1272
           Q584 1254 604 1240 Q650 1210 650 1158 L650 404
           Q650 386 643 368 C630 332 603 308 600 272 L300 272 Z"
        fill="url(#ciao-body)"/>

  <!-- habillage clippe dans la canette -->
  <g clip-path="url(#ciao-canclip)">
    <!-- lueur de l'eclair -->
    <path d="M500 425 Q556 432 604 448 L512 830 Q548 833 580 842 L332 1210
             Q408 1010 452 888 Q416 878 380 868 Z"
          fill="#f2c94c" opacity=".34" filter="url(#ciao-blur)"/>
    <!-- eclair dore, legerement arque comme colle sur le cylindre -->
    <path d="M500 425 Q556 432 604 448 L512 830 Q548 833 580 842 L332 1210
             Q408 1010 452 888 Q416 878 380 868 Z"
          fill="url(#ciao-bolt)"/>
    <path d="M514 460 Q510 640 502 818" stroke="#fff3c9" stroke-width="8" stroke-linecap="round" opacity=".45" fill="none"/>
    <path d="M552 872 L368 1160" stroke="#ffe9a8" stroke-width="5" stroke-linecap="round" opacity=".3" fill="none"/>

    <!-- ombrages cylindriques : droite + base + fin bord gauche -->
    <rect x="470" y="230" width="180" height="1080" fill="url(#ciao-rightshade)"/>
    <rect x="240" y="1060" width="420" height="250" fill="url(#ciao-basefade)"/>
    <rect x="250" y="230" width="26" height="1080" fill="#000" opacity=".55"/>

    <!-- nom, arque selon la courbure -->
    <text font-family="'Space Grotesk',sans-serif" font-size="132" font-weight="700"
          letter-spacing="6" fill="url(#ciao-goldtext)" stroke="#0d0a06" stroke-width="11"
          style="paint-order:stroke">
      <textPath href="#ciao-arcname" startOffset="50%" text-anchor="middle">CIAO</textPath>
    </text>
    <text font-family="'Space Grotesk',sans-serif" font-size="44" font-weight="600"
          letter-spacing="24" fill="#ffffff" stroke="#0d0a06" stroke-width="6"
          style="paint-order:stroke">
      <textPath href="#ciao-arcsub" startOffset="50%" text-anchor="middle">ENERGY</textPath>
    </text>
    <text font-family="'Space Grotesk',sans-serif" font-size="28" font-weight="600"
          letter-spacing="6" fill="#ffffff" opacity=".5">
      <textPath href="#ciao-arccl" startOffset="50%" text-anchor="middle">25 CL</textPath>
    </text>

    <!-- bandes de reflet verticales du metal (lumiere venant de gauche) -->
    <g opacity=".9">
      <rect x="284" y="288" width="74" height="964" fill="url(#ciao-band)" opacity=".8"/>
      <rect x="376" y="330" width="16" height="880" fill="url(#ciao-bandthin)" opacity=".6"/>
      <rect x="470" y="360" width="10" height="820" fill="url(#ciao-bandthin)" opacity=".3"/>
      <rect x="560" y="380" width="11" height="760" fill="url(#ciao-bandthin)" opacity=".18"/>
    </g>
    <!-- rim light dore fin sur le bord droit -->
    <rect x="622" y="300" width="28" height="930" fill="url(#ciao-rimgold)"/>

    <!-- eclat de l'epaule (haut gauche) -->
    <path d="M262 366 Q282 322 300 300 L326 300 Q302 330 288 372 L266 402 Z" fill="#ffffff" opacity=".16"/>

    <!-- pied : anneau retreci avec reflet -->
    <path d="M296 1240 Q450 1274 604 1240 Q450 1262 296 1240 Z" fill="#000" opacity=".5"/>
    <path d="M320 1256 Q450 1284 580 1256 L580 1276 Q450 1300 320 1276 Z" fill="url(#ciao-foot)"/>
    <path d="M330 1268 Q450 1294 570 1268" fill="none" stroke="#f2c94c" stroke-width="6" opacity=".5"/>
    <path d="M334 1260 Q380 1276 436 1281" fill="none" stroke="#e8e0cc" stroke-width="5" opacity=".55"/>
  </g>

  <!-- ===== couvercle vu tres legerement de dessus ===== -->
  <!-- rebord serti -->
  <ellipse cx="450" cy="270" rx="150" ry="34" fill="url(#ciao-lidring)"/>
  <path d="M300 268 A150 34 0 0 1 600 268" fill="none" stroke="#b8ad94" stroke-width="4" opacity=".8"/>
  <path d="M306 280 A147 31 0 0 0 594 280" fill="none" stroke="#000" stroke-width="3" opacity=".5"/>
  <!-- creux entre sertissage et panneau -->
  <ellipse cx="450" cy="272" rx="134" ry="28" fill="#0a0806"/>
  <!-- panneau interieur -->
  <ellipse cx="450" cy="274" rx="118" ry="23" fill="url(#ciao-lidtop)"/>
  <path d="M344 268 A118 23 0 0 1 556 268" fill="none" stroke="#5e5544" stroke-width="2.5" opacity=".7"/>
  <!-- ouverture pre-decoupee (score) -->
  <ellipse cx="394" cy="277" rx="30" ry="12" fill="#120e09"/>
  <ellipse cx="394" cy="277" rx="30" ry="12" fill="none" stroke="#000" stroke-width="2.5" opacity=".8"/>
  <path d="M368 272 A30 12 0 0 1 420 272" fill="none" stroke="#4a4234" stroke-width="2" opacity=".8"/>
  <!-- languette (stay-on tab) : nez sur l'ouverture, anneau a droite, rivet central -->
  <path d="M434 262 L508 267 Q528 268 528 277 Q528 286 508 287 L434 284
           Q418 283 418 273 Q418 263 434 262 Z" fill="url(#ciao-tab)" stroke="#0c0a07" stroke-width="2.5"/>
  <path d="M433 264 L507 268" stroke="#c4b795" stroke-width="3" opacity=".95" fill="none"/>
  <ellipse cx="499" cy="277" rx="14" ry="7.5" fill="#0b0906"/>
  <path d="M487 273.5 A14 7.5 0 0 1 511 273.5" fill="none" stroke="#9c8f70" stroke-width="2.5" opacity=".95"/>
  <circle cx="437" cy="273" r="8" fill="#57503d"/>
  <circle cx="435" cy="270.5" r="3.5" fill="#c4b795"/>
  <!-- reflet dore du halo sur le rebord arriere -->
  <path d="M318 258 Q380 240 450 237" fill="none" stroke="#f2c94c" stroke-width="3.5" opacity=".45"/>

  <!-- liseret dore cote droit (reflet du halo sur le fut) -->
  <path d="M648 420 L648 1150 Q648 1204 606 1238" fill="none" stroke="#f2c94c" stroke-width="3" opacity=".25"/>

  <!-- condensation -->
  <g fill="#fff8e8">
    <circle cx="308" cy="520" r="6" opacity=".55"/>
    <circle cx="352" cy="628" r="4" opacity=".48"/>
    <circle cx="602" cy="540" r="5" opacity=".5"/>
    <circle cx="592" cy="972" r="5" opacity=".46"/>
    <circle cx="326" cy="920" r="7" opacity=".55"/>
    <circle cx="388" cy="1108" r="4" opacity=".45"/>
    <circle cx="566" cy="1130" r="5" opacity=".48"/>
    <path d="M300 812 q-6 16 0 26 q9 -7 4 -24 Z" opacity=".55"/>
  </g>

  <!-- etincelles dorees discretes -->
  <g>
    <circle cx="212" cy="450" r="28" fill="url(#ciao-sparkglow)"/>
    <path d="M212 426 Q216.8 445.2 236 450 Q216.8 454.8 212 474 Q207.2 454.8 188 450 Q207.2 445.2 212 426 Z" fill="#ffe9a8" opacity=".9"/>
    <circle cx="694" cy="570" r="20" fill="url(#ciao-sparkglow)"/>
    <path d="M694 554 Q697.2 566.8 710 570 Q697.2 573.2 694 586 Q690.8 573.2 678 570 Q690.8 566.8 694 554 Z" fill="#f2c94c" opacity=".85"/>
    <circle cx="220" cy="1020" r="22" fill="url(#ciao-sparkglow)"/>
    <path d="M220 1002 Q223.6 1016.4 238 1020 Q223.6 1023.6 220 1038 Q216.4 1023.6 202 1020 Q216.4 1016.4 220 1002 Z" fill="#f2c94c" opacity=".85"/>
    <circle cx="702" cy="1108" r="26" fill="url(#ciao-sparkglow)"/>
    <path d="M702 1086 Q706.4 1103.6 724 1108 Q706.4 1112.4 702 1130 Q697.6 1112.4 680 1108 Q697.6 1103.6 702 1086 Z" fill="#ffe9a8" opacity=".9"/>
    <circle cx="252" cy="744" r="4" fill="#f2c94c" opacity=".6"/>
    <circle cx="672" cy="866" r="3" fill="#ffe9a8" opacity=".6"/>
  </g>
</svg>
