<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <radialGradient id="ciao-halo">
      <stop offset="0" stop-color="#f2c94c" stop-opacity=".30"/>
      <stop offset=".45" stop-color="#f2c94c" stop-opacity=".14"/>
      <stop offset=".75" stop-color="#f2c94c" stop-opacity=".05"/>
      <stop offset="1" stop-color="#f2c94c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ciao-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f382c"/>
      <stop offset=".09" stop-color="#6a5d44"/>
      <stop offset=".2" stop-color="#2c261e"/>
      <stop offset=".42" stop-color="#1a1611"/>
      <stop offset=".68" stop-color="#14100b"/>
      <stop offset=".88" stop-color="#0c0a07"/>
      <stop offset="1" stop-color="#070503"/>
    </linearGradient>
    <linearGradient id="ciao-lidring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a705a"/>
      <stop offset=".3" stop-color="#3d372c"/>
      <stop offset=".7" stop-color="#1c1812"/>
      <stop offset="1" stop-color="#0d0b08"/>
    </linearGradient>
    <radialGradient id="ciao-lidtop" cx=".38" cy=".35" r=".9">
      <stop offset="0" stop-color="#352f24"/>
      <stop offset=".55" stop-color="#1d1913"/>
      <stop offset="1" stop-color="#0b0906"/>
    </radialGradient>
    <linearGradient id="ciao-bolt" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0" stop-color="#ffeeb0"/>
      <stop offset=".35" stop-color="#f7d569"/>
      <stop offset=".65" stop-color="#f2c94c"/>
      <stop offset="1" stop-color="#c08a24"/>
    </linearGradient>
    <linearGradient id="ciao-goldtext" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeeb0"/>
      <stop offset=".5" stop-color="#f2c94c"/>
      <stop offset="1" stop-color="#cf9a2e"/>
    </linearGradient>
    <linearGradient id="ciao-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="ciao-rightshade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset=".7" stop-color="#000000" stop-opacity=".38"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="ciao-basefade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset=".6" stop-color="#000000" stop-opacity=".3"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".62"/>
    </linearGradient>
    <radialGradient id="ciao-sparkglow">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#f2c94c" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f2c94c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ciao-canclip">
      <path d="M312 358 L588 358 Q606 358 618 388 L634 428 Q638 438 638 452
               L638 1128 Q638 1196 604 1226 Q574 1252 566 1276 Q560 1291 538 1293
               Q450 1300 362 1293 Q340 1291 334 1276 Q326 1252 296 1226
               Q262 1196 262 1128 L262 452 Q262 438 266 428 L282 388 Q294 358 312 358 Z"/>
    </clipPath>
    <filter id="ciao-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- halo dore mythique derriere la canette -->
  <ellipse cx="450" cy="820" rx="420" ry="560" fill="url(#ciao-halo)"/>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="40" fill="#000" opacity=".35"/>
  <ellipse cx="450" cy="1322" rx="190" ry="24" fill="#f2c94c" opacity=".08"/>

  <!-- corps de la canette -->
  <path d="M312 358 L588 358 Q606 358 618 388 L634 428 Q638 438 638 452
           L638 1128 Q638 1196 604 1226 Q574 1252 566 1276 Q560 1291 538 1293
           Q450 1300 362 1293 Q340 1291 334 1276 Q326 1252 296 1226
           Q262 1196 262 1128 L262 452 Q262 438 266 428 L282 388 Q294 358 312 358 Z"
        fill="url(#ciao-body)"/>

  <!-- habillage clippe dans la canette -->
  <g clip-path="url(#ciao-canclip)">
    <!-- lueur de l'eclair -->
    <path d="M520 438 L616 458 L506 856 L584 872 L324 1230 L448 902 L372 886 Z"
          fill="#f2c94c" opacity=".38" filter="url(#ciao-blur)"/>
    <!-- eclair -->
    <path d="M520 438 L616 458 L506 856 L584 872 L324 1230 L448 902 L372 886 Z"
          fill="url(#ciao-bolt)"/>
    <path d="M527 466 L515 846" stroke="#fff3c9" stroke-width="9" stroke-linecap="round" opacity=".5" fill="none"/>
    <path d="M560 890 L352 1196" stroke="#ffe9a8" stroke-width="6" stroke-linecap="round" opacity=".35" fill="none"/>

    <!-- ombrage droit + assombrissement de la base -->
    <rect x="500" y="340" width="140" height="980" fill="url(#ciao-rightshade)"/>
    <rect x="250" y="1100" width="400" height="210" fill="url(#ciao-basefade)"/>

    <!-- etiquette : nom -->
    <text x="454" y="708" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="128" font-weight="700" letter-spacing="8"
          fill="url(#ciao-goldtext)" stroke="#0e0b07" stroke-width="10"
          style="paint-order:stroke" >CIAO</text>
    <text x="461" y="784" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="44" font-weight="600" letter-spacing="26"
          fill="#ffffff" stroke="#0e0b07" stroke-width="6"
          style="paint-order:stroke">ENERGY</text>
    <text x="453" y="1212" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="30" font-weight="600" letter-spacing="6"
          fill="#ffffff" opacity=".55">25 CL</text>

    <!-- reflets verticaux (lumiere haut-gauche) -->
    <rect x="296" y="462" width="30" height="748" rx="15" fill="url(#ciao-shine)" opacity=".5"/>
    <rect x="338" y="490" width="11" height="640" rx="5" fill="url(#ciao-shine)" opacity=".25"/>
    <path d="M284 392 Q296 366 318 364 L344 364 Q316 372 306 396 L292 430 Z" fill="#ffffff" opacity=".22"/>
  </g>

  <!-- couvercle noir -->
  <ellipse cx="450" cy="360" rx="148" ry="33" fill="url(#ciao-lidring)"/>
  <ellipse cx="450" cy="361" rx="128" ry="26" fill="#0a0806"/>
  <ellipse cx="450" cy="362" rx="122" ry="23" fill="url(#ciao-lidtop)"/>
  <path d="M320 350 Q360 331 450 328" fill="none" stroke="#f2c94c" stroke-width="3" opacity=".4"/>
  <!-- languette -->
  <ellipse cx="452" cy="366" rx="36" ry="13" fill="#23201a" stroke="#6b6350" stroke-width="3"/>
  <ellipse cx="466" cy="366" rx="12" ry="6" fill="#0b0906"/>
  <path d="M424 361 Q446 353 484 360" fill="none" stroke="#9a8f70" stroke-width="3" opacity=".8"/>
  <circle cx="430" cy="365" r="8" fill="#4e4736"/>
  <circle cx="428" cy="363" r="3" fill="#8a7f63"/>

  <!-- liseret dore cote droit (reflet du halo) -->
  <path d="M636 470 L636 1122 Q636 1188 606 1220" fill="none" stroke="#f2c94c" stroke-width="4" opacity=".22"/>
  <!-- rebond de lumiere sur la base -->
  <path d="M336 1272 Q450 1298 564 1272" fill="none" stroke="#f2c94c" stroke-width="4" opacity=".25"/>
  <path d="M298 1224 Q322 1248 334 1272" fill="none" stroke="#ffe9a8" stroke-width="3" opacity=".3"/>

  <!-- condensation -->
  <g fill="#fff8e8">
    <circle cx="312" cy="548" r="6" opacity=".6"/>
    <circle cx="356" cy="646" r="4" opacity=".52"/>
    <circle cx="598" cy="560" r="5" opacity=".55"/>
    <circle cx="586" cy="992" r="5" opacity=".5"/>
    <circle cx="330" cy="936" r="7" opacity=".6"/>
    <circle cx="392" cy="1122" r="4" opacity=".5"/>
    <circle cx="560" cy="1146" r="5" opacity=".52"/>
    <path d="M306 828 q-6 16 0 26 q9 -7 4 -24 Z" opacity=".6"/>
    <path d="M612 862 q6 14 0 22 q-8 -6 -4 -20 Z" opacity=".55"/>
  </g>

  <!-- etincelles dorees -->
  <g>
    <circle cx="215" cy="470" r="30" fill="url(#ciao-sparkglow)"/>
    <path d="M215 444 Q220 465 241 470 Q220 475 215 496 Q210 475 189 470 Q210 465 215 444 Z" fill="#ffe9a8" opacity=".9"/>
    <circle cx="692" cy="586" r="22" fill="url(#ciao-sparkglow)"/>
    <path d="M692 568 Q695.6 582.4 710 586 Q695.6 589.6 692 604 Q688.4 589.6 674 586 Q688.4 582.4 692 568 Z" fill="#f2c94c" opacity=".85"/>
    <circle cx="222" cy="1030" r="24" fill="url(#ciao-sparkglow)"/>
    <path d="M222 1010 Q226 1026 242 1030 Q226 1034 222 1050 Q218 1034 202 1030 Q218 1026 222 1010 Z" fill="#f2c94c" opacity=".85"/>
    <circle cx="700" cy="1116" r="28" fill="url(#ciao-sparkglow)"/>
    <path d="M700 1092 Q705 1111 724 1116 Q705 1121 700 1140 Q695 1121 676 1116 Q695 1111 700 1092 Z" fill="#ffe9a8" opacity=".9"/>
    <circle cx="256" cy="760" r="4" fill="#f2c94c" opacity=".6"/>
    <circle cx="668" cy="880" r="3" fill="#ffe9a8" opacity=".6"/>
  </g>
</svg>
