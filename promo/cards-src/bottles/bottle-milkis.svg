<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <linearGradient id="milk-white" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#fdfeff"/>
      <stop offset=".5" stop-color="#f2f6fa"/>
      <stop offset=".78" stop-color="#dde6ee"/>
      <stop offset="1" stop-color="#c2cfdb"/>
    </linearGradient>
    <linearGradient id="milk-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfdff6"/>
      <stop offset=".25" stop-color="#93c8ef"/>
      <stop offset=".5" stop-color="#7db8e8"/>
      <stop offset=".78" stop-color="#5697d2"/>
      <stop offset="1" stop-color="#36709f"/>
    </linearGradient>
    <linearGradient id="milk-lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f6fa"/>
      <stop offset=".45" stop-color="#b3c5d1"/>
      <stop offset=".8" stop-color="#849aab"/>
      <stop offset="1" stop-color="#647d90"/>
    </linearGradient>
    <radialGradient id="milk-lidtop" cx=".38" cy=".35" r="1">
      <stop offset="0" stop-color="#f6fafc"/>
      <stop offset=".55" stop-color="#cdd9e1"/>
      <stop offset="1" stop-color="#8ea3b2"/>
    </radialGradient>
    <radialGradient id="milk-drop" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f4fafe"/>
      <stop offset="1" stop-color="#d3e8f8"/>
    </radialGradient>
    <linearGradient id="milk-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="milk-splash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f3f9fe"/>
      <stop offset="1" stop-color="#d8ebf9"/>
    </linearGradient>
    <clipPath id="milk-clip">
      <path d="M310 358 L590 358 Q633 398 633 452 L633 1228
               Q633 1262 601 1274 Q547 1291 450 1291 Q353 1291 299 1274
               Q267 1262 267 1228 L267 452 Q267 398 310 358 Z"/>
    </clipPath>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="40" fill="#000" opacity=".35"/>

  <!-- corps de la canette slim (blanc) -->
  <path d="M310 358 L590 358 Q633 398 633 452 L633 1228
           Q633 1262 601 1274 Q547 1291 450 1291 Q353 1291 299 1274
           Q267 1262 267 1228 L267 452 Q267 398 310 358 Z"
        fill="url(#milk-white)"/>

  <!-- moitie basse bleu ciel, vague de lait douce -->
  <g clip-path="url(#milk-clip)">
    <path d="M255 826 C330 780 392 872 470 846 C550 820 592 884 645 844
             L645 1300 L255 1300 Z" fill="url(#milk-blue)"/>
    <!-- liseret clair le long de la vague -->
    <path d="M255 826 C330 780 392 872 470 846 C550 820 592 884 645 844"
          fill="none" stroke="#ffffff" stroke-width="10" opacity=".75"/>
    <path d="M255 848 C330 802 392 894 470 868 C550 842 592 906 645 866"
          fill="none" stroke="#a9d2f2" stroke-width="5" opacity=".5"/>
    <!-- goutte de lait stylisee sur la partie bleue -->
    <path d="M450 912 C478 962 504 998 504 1038 A54 54 0 1 1 396 1038
             C396 998 422 962 450 912 Z" fill="url(#milk-drop)"/>
    <ellipse cx="428" cy="1022" rx="14" ry="22" fill="#ffffff" opacity=".85" transform="rotate(-18 428 1022)"/>
    <ellipse cx="450" cy="1140" rx="74" ry="14" fill="none" stroke="#ffffff" stroke-width="6" opacity=".38"/>
    <!-- reflet vertical clair, flanc gauche -->
    <path d="M296 470 Q286 850 296 1210 Q299 1252 322 1262 Q307 1080 307 880 Q307 640 316 472 Z"
          fill="url(#milk-shine)" opacity=".5"/>
    <rect x="276" y="880" width="13" height="330" rx="6" fill="#ffffff" opacity=".45"/>
    <!-- bord droit assombri -->
    <path d="M633 400 L633 1280 L588 1280 Q604 900 596 560 Q592 460 580 396 Z"
          fill="#12395c" opacity=".22"/>
    <!-- ombre du bas -->
    <path d="M267 1225 Q450 1268 633 1225 L633 1291 L267 1291 Z" fill="#0e2c4d" opacity=".2"/>
  </g>

  <!-- ombre portee sous le couvercle -->
  <path d="M318 372 Q450 398 582 372 Q556 408 450 408 Q344 408 318 372 Z" fill="#7d94a6" opacity=".2"/>

  <!-- couvercle aluminium -->
  <ellipse cx="450" cy="358" rx="141" ry="28" fill="url(#milk-lid)"/>
  <ellipse cx="450" cy="354" rx="131" ry="23" fill="url(#milk-lidtop)"/>
  <ellipse cx="450" cy="356" rx="98" ry="15" fill="none" stroke="#7f95a6" stroke-width="4" opacity=".6"/>
  <ellipse cx="474" cy="357" rx="26" ry="8" fill="#9db1bf"/>
  <circle cx="452" cy="357" r="6" fill="#7f95a6"/>
  <path d="M318 349 Q382 330 452 331" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".8"/>

  <!-- etiquette : nom sur la partie blanche -->
  <text x="450" y="614" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
        font-size="82" font-weight="700" letter-spacing="7" fill="#2b6cb8">MILKIS</text>
  <text x="450" y="668" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
        font-size="23" font-weight="600" letter-spacing="4" fill="#5f8cba">SODA LACTÉ CORÉEN</text>
  <path d="M368 706 C398 692 420 716 450 706 C480 696 502 718 532 704"
        fill="none" stroke="#7db8e8" stroke-width="7" stroke-linecap="round" opacity=".85"/>
  <!-- fines bulles imprimees sur la partie blanche -->
  <g fill="#7db8e8">
    <circle cx="368" cy="484" r="7" opacity=".35"/>
    <circle cx="416" cy="452" r="5" opacity=".3"/>
    <circle cx="520" cy="470" r="8" opacity=".32"/>
    <circle cx="560" cy="516" r="5" opacity=".28"/>
    <circle cx="332" cy="756" r="6" opacity=".3"/>
    <circle cx="548" cy="742" r="7" opacity=".3"/>
    <circle cx="500" cy="774" r="4" opacity=".28"/>
  </g>

  <!-- condensation -->
  <g>
    <circle cx="306" cy="520" r="6" fill="#c3d8ea" opacity=".62"/>
    <circle cx="577" cy="560" r="5" fill="#b4cbdf" opacity=".6"/>
    <circle cx="330" cy="732" r="5" fill="#c3d8ea" opacity=".55"/>
    <circle cx="556" cy="668" r="4" fill="#b4cbdf" opacity=".55"/>
    <circle cx="300" cy="912" r="6" fill="#f0f9ff" opacity=".65"/>
    <circle cx="598" cy="964" r="5" fill="#eaf7ff" opacity=".6"/>
    <circle cx="314" cy="1156" r="7" fill="#f0f9ff" opacity=".6"/>
    <circle cx="590" cy="1186" r="5" fill="#eaf7ff" opacity=".55"/>
    <path d="M612 1062 q6 15 0 24 q-9 -7 -4 -22 Z" fill="#eaf7ff" opacity=".58"/>
    <path d="M286 1018 q-6 16 0 26 q9 -7 4 -24 Z" fill="#f0f9ff" opacity=".6"/>
  </g>

  <!-- splash de lait au pied de la canette : arc blanc aux pointes relevees -->
  <g>
    <path d="M192 1294
             Q212 1220 302 1236 Q372 1248 450 1248 Q528 1248 598 1236
             Q688 1220 708 1294
             Q640 1266 450 1264 Q260 1266 192 1294 Z"
          fill="#ffffff"/>
    <path d="M238 1200 Q262 1228 250 1246 Q222 1238 226 1214 Q230 1202 238 1200 Z" fill="#ffffff"/>
    <path d="M662 1200 Q638 1228 650 1246 Q678 1238 674 1214 Q670 1202 662 1200 Z" fill="#ffffff"/>
    <path d="M212 1288 Q290 1262 450 1260 Q610 1262 688 1288 Q560 1278 450 1278 Q340 1278 212 1288 Z"
          fill="#b9d4ea" opacity=".35"/>
    <circle cx="258" cy="1172" r="9" fill="#ffffff"/>
    <circle cx="318" cy="1206" r="6" fill="#ffffff" opacity=".9"/>
    <circle cx="584" cy="1204" r="6" fill="#ffffff" opacity=".9"/>
    <circle cx="644" cy="1170" r="9" fill="#ffffff"/>
    <circle cx="702" cy="1250" r="7" fill="#ffffff" opacity=".9"/>
    <circle cx="198" cy="1252" r="7" fill="#ffffff" opacity=".9"/>
  </g>
</svg>
