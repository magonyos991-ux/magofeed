<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <!-- corps blanc de la canette : modele cylindrique -->
    <linearGradient id="milk-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8eef4"/>
      <stop offset=".12" stop-color="#ffffff"/>
      <stop offset=".42" stop-color="#ffffff"/>
      <stop offset=".68" stop-color="#eef3f8"/>
      <stop offset=".86" stop-color="#d5dfe9"/>
      <stop offset="1" stop-color="#adbccb"/>
    </linearGradient>
    <!-- degrade bleu doux du bas -->
    <linearGradient id="milk-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf5fd" stop-opacity="0"/>
      <stop offset=".28" stop-color="#cde8fa" stop-opacity=".65"/>
      <stop offset=".62" stop-color="#96ccf2"/>
      <stop offset="1" stop-color="#5fa9e5"/>
    </linearGradient>
    <!-- swoosh bleu ciel -->
    <linearGradient id="milk-swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5dcf7"/>
      <stop offset=".35" stop-color="#8cc6f0"/>
      <stop offset=".7" stop-color="#5da5e2"/>
      <stop offset="1" stop-color="#3c86cd"/>
    </linearGradient>
    <!-- metal du couvercle -->
    <linearGradient id="milk-lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa4b4"/>
      <stop offset=".2" stop-color="#eef4f8"/>
      <stop offset=".5" stop-color="#c2d1dc"/>
      <stop offset=".8" stop-color="#8ba1b1"/>
      <stop offset="1" stop-color="#5f7889"/>
    </linearGradient>
    <radialGradient id="milk-lidtop" cx=".4" cy=".32" r="1.05">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset=".45" stop-color="#dbe5ec"/>
      <stop offset=".75" stop-color="#b5c6d1"/>
      <stop offset="1" stop-color="#8399a9"/>
    </radialGradient>
    <linearGradient id="milk-neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93a8b7"/>
      <stop offset=".4" stop-color="#c8d5de"/>
      <stop offset="1" stop-color="#e9eff4" stop-opacity="0"/>
    </linearGradient>
    <!-- goutte de lait -->
    <radialGradient id="milk-drop" cx=".36" cy=".28" r="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f7fbfe"/>
      <stop offset=".85" stop-color="#e2f0fb"/>
      <stop offset="1" stop-color="#c9e3f7"/>
    </radialGradient>
    <linearGradient id="milk-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".1"/>
    </linearGradient>
    <!-- silhouette de la canette (clip) -->
    <clipPath id="milk-clip">
      <path d="M263 272 L637 272 C664 306 675 348 675 400
               L675 1120 C675 1180 668 1218 640 1244
               Q622 1260 585 1272 Q520 1290 450 1290
               Q380 1290 315 1272 Q278 1260 260 1244
               C232 1218 225 1180 225 1120 L225 400
               C225 348 236 306 263 272 Z"/>
    </clipPath>
    <!-- arcs pour la typo qui suit la courbure et monte vers la droite -->
    <path id="milk-arcname" d="M215 640 Q445 556 690 512"/>
    <path id="milk-arcsub" d="M240 706 Q450 636 665 596"/>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="38" fill="#000000" opacity=".35"/>

  <!-- corps de la canette -->
  <path d="M263 272 L637 272 C664 306 675 348 675 400
           L675 1120 C675 1180 668 1218 640 1244
           Q622 1260 585 1272 Q520 1290 450 1290
           Q380 1290 315 1272 Q278 1260 260 1244
           C232 1218 225 1180 225 1120 L225 400
           C225 348 236 306 263 272 Z" fill="url(#milk-body)"/>

  <g clip-path="url(#milk-clip)">
    <!-- degrade bleu doux dans le bas -->
    <rect x="215" y="930" width="470" height="380" fill="url(#milk-bottom)"/>

    <!-- swoosh dynamique qui traverse sous le nom, en montant vers la droite -->
    <path d="M215 812 C320 828 396 758 478 714
             C562 668 620 652 685 664
             L685 738 C622 722 566 736 492 782
             C412 832 322 892 215 876 Z" fill="url(#milk-swoosh)"/>
    <!-- crete blanche du swoosh -->
    <path d="M215 806 C320 822 398 752 480 708 C564 662 622 646 685 658"
          fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity=".9"/>
    <!-- filet secondaire sous le swoosh -->
    <path d="M215 906 C330 916 420 852 510 810 C580 778 636 764 685 770"
          fill="none" stroke="#8cc6f0" stroke-width="12" stroke-linecap="round" opacity=".8"/>
    <!-- bulles dans le swoosh -->
    <circle cx="352" cy="800" r="10" fill="#ffffff" opacity=".85"/>
    <circle cx="474" cy="742" r="7" fill="#ffffff" opacity=".8"/>
    <circle cx="560" cy="706" r="9" fill="#ffffff" opacity=".85"/>
    <circle cx="612" cy="746" r="5" fill="#ffffff" opacity=".7"/>

    <!-- gouttes / eclaboussures de lait stylisees pres du bas -->
    <path d="M362 1028 C378 1064 392 1090 392 1116 A34 34 0 1 1 324 1116
             C324 1090 344 1062 362 1028 Z" fill="url(#milk-drop)"/>
    <path d="M520 1078 C532 1104 542 1124 542 1144 A26 26 0 1 1 490 1144
             C490 1124 506 1102 520 1078 Z" fill="url(#milk-drop)"/>
    <path d="M448 1150 C458 1172 466 1188 466 1204 A21 21 0 1 1 424 1204
             C424 1188 438 1170 448 1150 Z" fill="url(#milk-drop)"/>
    <ellipse cx="348" cy="1104" rx="8" ry="12" fill="#ffffff" opacity=".9" transform="rotate(-16 348 1104)"/>
    <ellipse cx="508" cy="1134" rx="6" ry="9" fill="#ffffff" opacity=".9" transform="rotate(-16 508 1134)"/>
    <circle cx="596" cy="1052" r="9" fill="#ffffff" opacity=".8"/>
    <circle cx="286" cy="1160" r="7" fill="#ffffff" opacity=".8"/>
    <circle cx="562" cy="1188" r="6" fill="#ffffff" opacity=".75"/>
    <!-- petite vague de lait au ras du pied -->
    <path d="M215 1236 C300 1214 380 1230 450 1226 C530 1220 600 1206 685 1224
             L685 1300 L215 1300 Z" fill="#ffffff" opacity=".85"/>
    <path d="M215 1236 C300 1214 380 1230 450 1226 C530 1220 600 1206 685 1224"
          fill="none" stroke="#cfe6f8" stroke-width="6" opacity=".9"/>

    <!-- ombre du col sous le couvercle -->
    <rect x="215" y="272" width="470" height="70" fill="url(#milk-neck)" opacity=".55"/>

    <!-- bandes de reflet verticales -->
    <path d="M282 320 Q268 800 282 1250 L318 1258 Q300 800 316 316 Z"
          fill="url(#milk-shine)" opacity=".55"/>
    <rect x="342" y="330" width="22" height="900" rx="11" fill="url(#milk-shine)" opacity=".4"/>
    <rect x="540" y="360" width="14" height="820" rx="7" fill="url(#milk-shine)" opacity=".3"/>
    <!-- bord droit assombri + rim light fin -->
    <path d="M675 300 L675 1290 L610 1290 Q636 800 616 330 Z" fill="#274b6d" opacity=".18"/>
    <path d="M664 340 Q674 800 656 1240" fill="none" stroke="#ffffff" stroke-width="5" opacity=".55"/>
    <!-- bord gauche legerement assombri -->
    <path d="M225 300 L225 1290 L258 1290 Q244 800 256 330 Z" fill="#5c748a" opacity=".14"/>
    <!-- ombre et rebord du pied -->
    <path d="M215 1200 Q450 1252 685 1200 L685 1300 L215 1300 Z" fill="#1f4569" opacity=".16"/>
    <path d="M262 1250 Q450 1292 638 1250 Q560 1284 450 1284 Q340 1284 262 1250 Z"
          fill="#6c8299" opacity=".5"/>
  </g>

  <!-- ==================== ETIQUETTE ==================== -->
  <!-- fine ombre portee du logo (derriere) -->
  <text font-family="'Space Grotesk',sans-serif" font-size="112" font-weight="700"
        letter-spacing="4" fill="#123f7a" opacity=".25" transform="translate(4,5)">
    <textPath href="#milk-arcname" startOffset="50%" text-anchor="middle">MILKIS</textPath>
  </text>
  <!-- MILKIS incline vers le haut, suit la courbure -->
  <text font-family="'Space Grotesk',sans-serif" font-size="112" font-weight="700"
        letter-spacing="4" fill="#1d5fb4">
    <textPath href="#milk-arcname" startOffset="50%" text-anchor="middle">MILKIS</textPath>
  </text>
  <!-- sous-titre -->
  <text font-family="'Space Grotesk',sans-serif" font-size="26" font-weight="600"
        letter-spacing="6" fill="#4a86c2">
    <textPath href="#milk-arcsub" startOffset="50%" text-anchor="middle">SODA LACTÉ CORÉEN</textPath>
  </text>
  <!-- petites bulles imprimees sur la partie blanche haute -->
  <g fill="#7db8e8">
    <circle cx="330" cy="452" r="7" opacity=".4"/>
    <circle cx="392" cy="420" r="5" opacity=".35"/>
    <circle cx="530" cy="426" r="8" opacity=".38"/>
    <circle cx="586" cy="470" r="5" opacity=".32"/>
    <circle cx="272" cy="560" r="5" opacity=".3"/>
    <circle cx="618" cy="540" r="6" opacity=".3"/>
  </g>

  <!-- ==================== COUVERCLE ALUMINIUM (leger vu de dessus) ==================== -->
  <!-- rebord serti -->
  <ellipse cx="450" cy="272" rx="189" ry="42" fill="url(#milk-lid)"/>
  <ellipse cx="450" cy="272" rx="189" ry="42" fill="none" stroke="#54890000" stroke-width="0"/>
  <ellipse cx="450" cy="268" rx="176" ry="36" fill="url(#milk-lidtop)"/>
  <!-- anneau interieur (cuvette) -->
  <ellipse cx="450" cy="270" rx="140" ry="27" fill="none" stroke="#7e94a5" stroke-width="5" opacity=".75"/>
  <ellipse cx="450" cy="272" rx="140" ry="27" fill="none" stroke="#f2f7fa" stroke-width="2" opacity=".8"/>
  <!-- opercule d'ouverture (ellipse marquee a gauche du rivet) -->
  <ellipse cx="385" cy="276" rx="46" ry="13" fill="none" stroke="#7e94a5"
           stroke-width="3.5" opacity=".8" transform="rotate(-4 385 276)"/>
  <ellipse cx="385" cy="278" rx="46" ry="13" fill="none" stroke="#eef4f8"
           stroke-width="1.5" opacity=".7" transform="rotate(-4 385 278)"/>
  <!-- LANGUETTE : anneau + rivet -->
  <path d="M456 261 L556 256 A16 16 0 0 1 558 286 L458 283 A12 12 0 0 1 456 261 Z
           M508 263 A26 9 0 1 0 510 281 A26 9 0 1 0 508 263 Z"
        fill="#cbd8e1" fill-rule="evenodd" stroke="#6d8695" stroke-width="3"/>
  <path d="M470 262 L548 258" fill="none" stroke="#f2f7fa" stroke-width="3"
        stroke-linecap="round" opacity=".85"/>
  <circle cx="458" cy="272" r="9" fill="#8ea4b3" stroke="#63808f" stroke-width="2"/>
  <circle cx="455" cy="269" r="3" fill="#e4edf2"/>
  <!-- reflet du rebord -->
  <path d="M292 258 Q356 234 448 232" fill="none" stroke="#ffffff" stroke-width="7"
        stroke-linecap="round" opacity=".85"/>
  <path d="M600 292 Q548 306 486 308" fill="none" stroke="#4b6577" stroke-width="4"
        stroke-linecap="round" opacity=".5"/>

  <!-- condensation (8 gouttes) -->
  <g>
    <circle cx="292" cy="500" r="6" fill="url(#milk-drop)" opacity=".8"/>
    <circle cx="628" cy="620" r="5" fill="url(#milk-drop)" opacity=".75"/>
    <circle cx="268" cy="880" r="7" fill="url(#milk-drop)" opacity=".8"/>
    <circle cx="645" cy="900" r="5" fill="url(#milk-drop)" opacity=".7"/>
    <path d="M300 960 q-7 18 0 30 q10 -8 5 -27 Z" fill="url(#milk-drop)" opacity=".8"/>
    <path d="M624 1010 q7 17 0 28 q-10 -8 -5 -26 Z" fill="url(#milk-drop)" opacity=".75"/>
    <circle cx="316" cy="1180" r="6" fill="url(#milk-drop)" opacity=".8"/>
    <circle cx="600" cy="500" r="4" fill="url(#milk-drop)" opacity=".7"/>
  </g>
</svg>
