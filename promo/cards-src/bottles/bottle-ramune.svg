<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <!-- verre : quasi transparent au centre, fresnel sur les bords -->
    <linearGradient id="ram-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#eaf7ff" stop-opacity=".50"/>
      <stop offset=".10" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset=".30" stop-color="#f2faff" stop-opacity=".05"/>
      <stop offset=".52" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset=".72" stop-color="#cfe9fb" stop-opacity=".08"/>
      <stop offset=".88" stop-color="#8fbede" stop-opacity=".20"/>
      <stop offset="1"   stop-color="#2b5c88" stop-opacity=".55"/>
    </linearGradient>
    <!-- liquide incolore, a peine bleute, transparent -->
    <linearGradient id="ram-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#eef9ff" stop-opacity=".38"/>
      <stop offset=".35" stop-color="#d6effd" stop-opacity=".26"/>
      <stop offset=".7"  stop-color="#bfe3f8" stop-opacity=".30"/>
      <stop offset="1"   stop-color="#9ccbea" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="ram-liquidSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#f4fbff" stop-opacity=".26"/>
      <stop offset=".2"  stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset=".74" stop-color="#4f8dc2" stop-opacity=".05"/>
      <stop offset="1"   stop-color="#1f4a76" stop-opacity=".32"/>
    </linearGradient>
    <!-- bille de verre -->
    <radialGradient id="ram-marble" cx=".36" cy=".30" r=".95">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset=".22" stop-color="#e6f4ff" stop-opacity=".74"/>
      <stop offset=".52" stop-color="#b6ddf6" stop-opacity=".55"/>
      <stop offset=".82" stop-color="#6ea9db" stop-opacity=".55"/>
      <stop offset="1"   stop-color="#39699c" stop-opacity=".68"/>
    </radialGradient>
    <!-- manchon plastique blanc -->
    <linearGradient id="ram-wrap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset=".16" stop-color="#f4f8fb"/>
      <stop offset=".45" stop-color="#ffffff"/>
      <stop offset=".72" stop-color="#e7edf2"/>
      <stop offset=".9"  stop-color="#cfd9e1"/>
      <stop offset="1"   stop-color="#b7c4cf"/>
    </linearGradient>
    <linearGradient id="ram-wrapTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#ffffff"/>
      <stop offset="1"  stop-color="#dbe4ea"/>
    </linearGradient>
    <!-- bande rouge du manchon -->
    <linearGradient id="ram-redband" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#e04a3d"/>
      <stop offset=".4"  stop-color="#d1372c"/>
      <stop offset="1"   stop-color="#a92a21"/>
    </linearGradient>
    <!-- bandeau imprime bleu -->
    <linearGradient id="ram-banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#3b7cc9"/>
      <stop offset=".5"  stop-color="#2b6cb8"/>
      <stop offset="1"   stop-color="#1f568f"/>
    </linearGradient>
    <!-- reflets -->
    <linearGradient id="ram-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".4"  stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset=".8"  stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="ram-drop" cx=".35" cy=".3" r="1">
      <stop offset="0"  stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#dff2fd" stop-opacity=".5"/>
      <stop offset="1"  stop-color="#9cc8e8" stop-opacity=".15"/>
    </radialGradient>
    <radialGradient id="ram-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0"  stop-color="#000000" stop-opacity="1"/>
      <stop offset=".7" stop-color="#000000" stop-opacity=".7"/>
      <stop offset="1"  stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- creux circulaire (prise pour le pouce) -->
    <radialGradient id="ram-dimple" cx=".42" cy=".38" r=".75">
      <stop offset="0"   stop-color="#0d3255" stop-opacity=".05"/>
      <stop offset=".55" stop-color="#0d3255" stop-opacity=".14"/>
      <stop offset=".85" stop-color="#0d3255" stop-opacity=".30"/>
      <stop offset="1"   stop-color="#0d3255" stop-opacity=".12"/>
    </radialGradient>
    <!-- katakana simplifies (traces maison) : ra / mu / ne -->
    <g id="ram-ka-ra" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -14 -29 L 14 -31"/>
      <path d="M -24 -11 L 23 -14 C 24 6 12 23 -13 30"/>
    </g>
    <g id="ram-ka-mu" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 3 -29 L -21 17"/>
      <path d="M -21 17 L 14 9"/>
      <path d="M 6 -6 L 24 21"/>
    </g>
    <g id="ram-ka-ne" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -3 -31 L 7 -25"/>
      <path d="M -19 -13 L 20 -16"/>
      <path d="M 20 -16 C 11 -1 -6 12 -22 18"/>
      <path d="M 3 -8 L 3 30"/>
      <path d="M 5 3 L 21 15"/>
    </g>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="40" fill="url(#ram-shadow)" opacity=".35"/>

  <!-- ============ LIQUIDE (incolore, derriere le verre) ============ -->
  <ellipse cx="450" cy="716" rx="146" ry="15" fill="#f2fbff" opacity=".30"/>
  <path d="M304 716 Q450 742 596 716" fill="none" stroke="#ffffff" stroke-width="3" opacity=".5"/>
  <path d="M304 718 Q450 744 596 718 L596 1204
           C596 1252 574 1270 532 1277 C500 1282 400 1282 368 1277
           C326 1270 304 1252 304 1204 Z" fill="url(#ram-liquid)"/>
  <path d="M304 718 Q450 744 596 718 L596 1204
           C596 1252 574 1270 532 1277 C500 1282 400 1282 368 1277
           C326 1270 304 1252 304 1204 Z" fill="url(#ram-liquidSide)"/>
  <!-- fond epais du verre, visible a travers -->
  <ellipse cx="450" cy="1242" rx="140" ry="22" fill="#0b2c4c" opacity=".16"/>
  <path d="M320 1238 Q450 1270 580 1238" fill="none" stroke="#eaf7ff" stroke-width="5" opacity=".35"/>

  <!-- fines bulles -->
  <g fill="#ffffff">
    <circle cx="336" cy="1140" r="4" opacity=".35"/><circle cx="344" cy="1030" r="3" opacity=".3"/>
    <circle cx="352" cy="920"  r="3.5" opacity=".32"/><circle cx="342" cy="808" r="3" opacity=".28"/>
    <circle cx="356" cy="748"  r="2.5" opacity=".3"/>
    <circle cx="424" cy="1180" r="4.5" opacity=".26"/><circle cx="468" cy="1108" r="3" opacity=".24"/>
    <circle cx="556" cy="1064" r="3" opacity=".26"/><circle cx="562" cy="936" r="3.5" opacity=".28"/>
    <circle cx="566" cy="812"  r="2.5" opacity=".26"/><circle cx="548" cy="746" r="3" opacity=".28"/>
    <circle cx="486" cy="730"  r="2.5" opacity=".32"/><circle cx="402" cy="726" r="2.5" opacity=".32"/>
  </g>

  <!-- ============ CORPS EN VERRE (silhouette Codd : goulot, bulbe, taille, corps) ============ -->
  <path d="M402 236
           L402 280
           C402 300 380 308 366 322
           C342 344 334 372 334 408
           C334 452 346 480 362 502
           C374 516 378 528 376 546
           C374 566 350 584 332 606
           C306 636 296 668 296 712
           L296 1204
           C296 1254 318 1272 366 1282
           C400 1288 500 1288 534 1282
           C582 1272 604 1254 604 1204
           L604 712
           C604 668 594 636 568 606
           C550 584 526 566 524 546
           C522 528 526 516 538 502
           C554 480 566 452 566 408
           C566 372 558 344 534 322
           C520 308 498 300 498 280
           L498 236 Z"
        fill="url(#ram-glass)" stroke="#cfe7f8" stroke-width="3" stroke-opacity=".55"/>

  <!-- assombrissement bord droit (fresnel) -->
  <path d="M604 712 L604 1204 C604 1254 582 1272 534 1282
           C558 1266 576 1244 578 1200 L578 744 C578 724 590 716 604 712 Z"
        fill="#08243f" opacity=".32"/>
  <path d="M534 322 C558 344 566 372 566 408 C566 452 554 480 538 502
           C550 470 548 440 548 408 C548 368 542 342 526 324 Z"
        fill="#08243f" opacity=".24"/>
  <!-- rim light bord droit -->
  <path d="M596 730 C600 900 600 1090 594 1222" fill="none" stroke="#dff2ff" stroke-width="3" opacity=".6"/>
  <path d="M560 344 C566 372 564 428 552 470" fill="none" stroke="#dff2ff" stroke-width="2.5" opacity=".5"/>

  <!-- ============ BULBE : BILLE DE VERRE ============ -->
  <path d="M406 300 Q450 316 494 300 Q470 322 450 322 Q430 322 406 300 Z" fill="#0a2a48" opacity=".2"/>
  <circle cx="450" cy="402" r="59" fill="#0e3155" opacity=".3"/>
  <circle cx="450" cy="402" r="58" fill="url(#ram-marble)"/>
  <path d="M482 440 A58 58 0 0 0 506 380 C506 418 486 444 458 453 Z" fill="#1d4a78" opacity=".42"/>
  <path d="M450 344 A58 58 0 0 1 507 394" fill="none" stroke="#ffffff" stroke-width="3" opacity=".4"/>
  <ellipse cx="428" cy="380" rx="18" ry="11" transform="rotate(-26 428 380)" fill="#ffffff" opacity=".95"/>
  <circle cx="472" cy="428" r="6.5" fill="#ffffff" opacity=".45"/>
  <!-- ombre de la bille sur son siege -->
  <ellipse cx="450" cy="466" rx="44" ry="10" fill="#0a2a48" opacity=".34"/>
  <!-- reflet vertical sur le bulbe -->
  <path d="M352 330 Q340 376 348 442 Q354 466 364 476 Q350 410 362 342 Z" fill="url(#ram-shine)" opacity=".5"/>

  <!-- ============ DEUX CREUX CIRCULAIRES (prises pour les pouces) ============ -->
  <g>
    <circle cx="388" cy="478" r="33" fill="url(#ram-dimple)"/>
    <circle cx="388" cy="478" r="33" fill="none" stroke="#0d2f52" stroke-width="3" opacity=".4"/>
    <circle cx="388" cy="478" r="26" fill="none" stroke="#ffffff" stroke-width="2" opacity=".38"/>
    <path d="M365 492 A33 33 0 0 0 407 505" fill="none" stroke="#ffffff" stroke-width="3.5" opacity=".6"/>
    <path d="M363 462 A33 33 0 0 1 400 448" fill="none" stroke="#0d2f52" stroke-width="3" opacity=".3"/>
    <circle cx="512" cy="478" r="33" fill="url(#ram-dimple)"/>
    <circle cx="512" cy="478" r="33" fill="none" stroke="#0d2f52" stroke-width="3" opacity=".48"/>
    <circle cx="512" cy="478" r="26" fill="none" stroke="#ffffff" stroke-width="2" opacity=".3"/>
    <path d="M489 492 A33 33 0 0 0 531 505" fill="none" stroke="#ffffff" stroke-width="3" opacity=".5"/>
    <path d="M487 462 A33 33 0 0 1 524 448" fill="none" stroke="#0d2f52" stroke-width="3" opacity=".34"/>
  </g>

  <!-- resserrement doux sous le bulbe -->
  <path d="M376 546 Q450 560 524 546" fill="none" stroke="#0d2f52" stroke-width="2.5" opacity=".22"/>
  <path d="M380 560 Q450 574 520 560" fill="none" stroke="#ffffff" stroke-width="2" opacity=".3"/>

  <!-- ============ IMPRESSION (moitie basse du corps) ============ -->
  <!-- bandeau bleu arrondi borde de rouge -->
  <g>
    <path d="M332 872 Q450 892 568 872 Q592 869 594 892 L592 944
             Q590 966 566 963 Q450 981 334 963 Q310 966 308 943 L306 892
             Q308 869 332 872 Z"
          fill="url(#ram-banner)" stroke="#d1372c" stroke-width="7" stroke-linejoin="round"/>
    <path d="M332 880 Q450 899 568 880" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".5"/>
    <text x="450" y="939" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="56" font-weight="700" letter-spacing="8" fill="#ffffff">RAMUNE</text>
  </g>

  <!-- katakana verticaux bleus + petit texte rouge -->
  <g stroke="#2b6cb8">
    <use xlink:href="#ram-ka-ra" transform="translate(396 1006) scale(1.0)" stroke-width="10"/>
    <use xlink:href="#ram-ka-mu" transform="translate(396 1084) scale(1.0)" stroke-width="10"/>
    <use xlink:href="#ram-ka-ne" transform="translate(396 1162) scale(1.0)" stroke-width="10"/>
  </g>
  <text transform="rotate(90 448 992)" x="448" y="992" font-family="'Space Grotesk',sans-serif"
        font-size="18" font-weight="600" letter-spacing="4" fill="#d1372c">JAPANESE SODA</text>

  <!-- semis de pois bleus -->
  <g>
    <circle cx="512" cy="1006" r="13" fill="#2b6cb8"/>
    <circle cx="558" cy="1052" r="8"  fill="#7db8e8"/>
    <circle cx="524" cy="1096" r="15" fill="#7db8e8"/>
    <circle cx="565" cy="1136" r="9"  fill="#2b6cb8"/>
    <circle cx="510" cy="1162" r="7"  fill="#2b6cb8"/>
    <circle cx="330" cy="1002" r="8"  fill="#7db8e8"/>
    <circle cx="342" cy="1078" r="12" fill="#2b6cb8"/>
    <circle cx="326" cy="1150" r="7"  fill="#7db8e8"/>
    <circle cx="470" cy="1044" r="6"  fill="#7db8e8"/>
    <circle cx="352" cy="990"  r="5"  fill="#2b6cb8"/>
  </g>

  <!-- petite creature mignonne (baleine souriante) dans les vagues -->
  <g>
    <circle cx="436" cy="1176" r="4" fill="#7db8e8"/>
    <circle cx="444" cy="1166" r="3" fill="#7db8e8"/>
    <path d="M398 1234 C394 1204 420 1186 450 1186 C478 1186 497 1202 499 1224 L499 1234 Z" fill="#2b6cb8"/>
    <path d="M497 1216 C508 1208 512 1198 510 1188 C518 1196 520 1206 516 1213
             C524 1211 530 1215 532 1221 C520 1230 505 1228 497 1221 Z" fill="#2b6cb8"/>
    <path d="M404 1234 C408 1222 424 1214 444 1214 L440 1234 Z" fill="#7db8e8" opacity=".85"/>
    <circle cx="464" cy="1206" r="5" fill="#ffffff"/>
    <circle cx="465.5" cy="1206" r="2.4" fill="#0f3a68"/>
    <path d="M470 1218 Q477 1224 484 1217" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- vagues -->
    <path d="M312 1242 Q327 1226 342 1242 T 372 1242 T 402 1242 T 432 1242 T 462 1242
             T 492 1242 T 522 1242 T 552 1242 T 582 1242 L 582 1252 Q450 1262 318 1252 Z"
          fill="#7db8e8" opacity=".9"/>
    <path d="M322 1232 Q334 1220 346 1232 M 486 1230 Q 498 1218 510 1230 M 540 1234 Q 552 1222 564 1234"
          fill="none" stroke="#2b6cb8" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- fine bande 200ml -->
  <g>
    <line x1="336" y1="1270" x2="396" y2="1270" stroke="#2b6cb8" stroke-width="3"/>
    <line x1="504" y1="1270" x2="564" y2="1270" stroke="#2b6cb8" stroke-width="3"/>
    <text x="450" y="1278" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="22" font-weight="700" letter-spacing="2" fill="#2b6cb8">200ml</text>
  </g>

  <!-- ============ REFLETS VERRE (devant tout le corps) ============ -->
  <path d="M328 730 Q316 980 330 1236 Q340 1254 356 1260 Q342 1080 344 908 Q346 796 356 726 Z"
        fill="url(#ram-shine)" opacity=".62"/>
  <rect x="378" y="742" width="12" height="410" rx="6" fill="#ffffff" opacity=".2"/>
  <path d="M320 604 Q306 644 300 704 Q316 654 334 624 Z" fill="#ffffff" opacity=".3"/>
  <path d="M370 322 Q358 336 350 352 Q366 340 378 328 Z" fill="#ffffff" opacity=".4"/>

  <!-- ============ CAPSULE : MANCHON PLASTIQUE BLANC FROISSE ============ -->
  <g>
    <path d="M398 132 C398 118 420 110 450 110 C480 110 502 118 502 132
             L508 236 C509 250 500 256 490 259
             Q472 254 462 260 Q450 254 438 260 Q424 254 410 259
             C400 256 391 250 392 236 Z" fill="url(#ram-wrap)"/>
    <ellipse cx="450" cy="126" rx="52" ry="14" fill="url(#ram-wrapTop)"/>
    <ellipse cx="450" cy="124" rx="30" ry="8" fill="#c9d6df" opacity=".7"/>
    <!-- plis froisses du thermoretracte -->
    <g stroke="#a8b8c4" stroke-width="2" fill="none" opacity=".7">
      <path d="M414 136 L410 254"/>
      <path d="M426 132 L424 200 L420 256"/>
      <path d="M478 132 L482 196 L486 254"/>
      <path d="M494 140 L498 250"/>
      <path d="M404 150 L418 176"/>
      <path d="M496 160 L482 184"/>
      <path d="M420 118 L434 128 M 468 116 L 456 127 M 448 112 L 448 124"/>
    </g>
    <g stroke="#ffffff" stroke-width="2" fill="none" opacity=".85">
      <path d="M419 134 L416 254"/>
      <path d="M488 136 L492 252"/>
    </g>
    <!-- bande rouge verticale avec katakana blancs -->
    <path d="M431 113 L469 113 L472 258 L428 258 Z" fill="url(#ram-redband)"/>
    <path d="M431 113 L436 113 L433 258 L428 258 Z" fill="#7c1d16" opacity=".5"/>
    <g stroke="#ffffff">
      <use xlink:href="#ram-ka-ra" transform="translate(450 148) scale(.4)" stroke-width="13"/>
      <use xlink:href="#ram-ka-mu" transform="translate(450 190) scale(.4)" stroke-width="13"/>
      <use xlink:href="#ram-ka-ne" transform="translate(450 232) scale(.4)" stroke-width="13"/>
    </g>
    <!-- ombre du manchon sur le goulot + bord bas -->
    <path d="M392 236 C391 250 400 256 410 259 Q424 254 438 260 Q450 254 462 260 Q472 254 490 259
             C500 256 509 250 508 236 L508 244 Q450 262 392 244 Z" fill="#8fa2b0" opacity=".35"/>
  </g>
  <path d="M402 262 Q450 274 498 262 L498 274 Q450 284 402 274 Z" fill="#0a2a48" opacity=".16"/>

  <!-- ============ CONDENSATION ============ -->
  <g>
    <circle cx="352" cy="780" r="7" fill="url(#ram-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".4"/>
    <circle cx="544" cy="812" r="6" fill="url(#ram-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".35"/>
    <circle cx="343" cy="1108" r="8" fill="url(#ram-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".4"/>
    <circle cx="556" cy="1176" r="6.5" fill="url(#ram-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".35"/>
    <circle cx="524" cy="668" r="5" fill="url(#ram-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".35"/>
    <circle cx="560" cy="386" r="4.5" fill="url(#ram-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".35"/>
    <!-- goutte qui coule avec trainee -->
    <path d="M559 1050 q2 -6 4 0 q5 16 0 24 q-8 -6 -4 -24 Z" fill="url(#ram-drop)"/>
    <path d="M561 1012 L561 1048" stroke="#eaf7ff" stroke-width="2" opacity=".3"/>
    <path d="M340 946 q-2 -7 -4 0 q-5 18 0 27 q8 -7 4 -27 Z" fill="url(#ram-drop)"/>
    <path d="M338 900 L338 944" stroke="#eaf7ff" stroke-width="2" opacity=".3"/>
  </g>
</svg>
