<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <!-- verre : quasi transparent au centre, fresnel sur les bords -->
    <linearGradient id="ram-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#eaf7ff" stop-opacity=".52"/>
      <stop offset=".10" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".30" stop-color="#f2faff" stop-opacity=".05"/>
      <stop offset=".52" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset=".72" stop-color="#cfe9fb" stop-opacity=".09"/>
      <stop offset=".88" stop-color="#8fbede" stop-opacity=".22"/>
      <stop offset="1"   stop-color="#2b5c88" stop-opacity=".58"/>
    </linearGradient>
    <!-- liquide incolore a peine bleute, transparent -->
    <linearGradient id="ram-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#e2f6ff" stop-opacity=".55"/>
      <stop offset=".28" stop-color="#c2e9fd" stop-opacity=".40"/>
      <stop offset=".62" stop-color="#9dd4f4" stop-opacity=".44"/>
      <stop offset=".86" stop-color="#7cbce6" stop-opacity=".54"/>
      <stop offset="1"   stop-color="#5f9fd2" stop-opacity=".64"/>
    </linearGradient>
    <linearGradient id="ram-liquidSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#f4fbff" stop-opacity=".30"/>
      <stop offset=".2"  stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset=".72" stop-color="#4f8dc2" stop-opacity=".06"/>
      <stop offset="1"   stop-color="#1f4a76" stop-opacity=".40"/>
    </linearGradient>
    <!-- bille de verre -->
    <radialGradient id="ram-marble" cx=".36" cy=".30" r=".95">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".22" stop-color="#e2f3ff" stop-opacity=".78"/>
      <stop offset=".52" stop-color="#a9d7f4" stop-opacity=".62"/>
      <stop offset=".82" stop-color="#5f9fd4" stop-opacity=".58"/>
      <stop offset="1"   stop-color="#33689c" stop-opacity=".70"/>
    </radialGradient>
    <!-- bouchon plastique bleu -->
    <linearGradient id="ram-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#bfe2ff"/>
      <stop offset=".18" stop-color="#5aa4e4"/>
      <stop offset=".45" stop-color="#2f7cc6"/>
      <stop offset=".75" stop-color="#1c5da4"/>
      <stop offset="1"   stop-color="#113f78"/>
    </linearGradient>
    <linearGradient id="ram-capTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"  stop-color="#8ec4f2"/>
      <stop offset=".4" stop-color="#4c92d6"/>
      <stop offset=".7" stop-color="#2c6cb2"/>
      <stop offset="1"  stop-color="#1a4e8c"/>
    </linearGradient>
    <!-- etiquette imprimee -->
    <linearGradient id="ram-label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#3572ba"/>
      <stop offset=".35" stop-color="#2a63a8"/>
      <stop offset=".72" stop-color="#1d4e8b"/>
      <stop offset="1"   stop-color="#153e72"/>
    </linearGradient>
    <linearGradient id="ram-labelShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#04101f" stop-opacity=".42"/>
      <stop offset=".14" stop-color="#04101f" stop-opacity="0"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset=".82" stop-color="#04101f" stop-opacity="0"/>
      <stop offset="1"   stop-color="#04101f" stop-opacity=".5"/>
    </linearGradient>
    <!-- reflets -->
    <linearGradient id="ram-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".4"  stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset=".8"  stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="ram-drop" cx=".35" cy=".3" r="1">
      <stop offset="0"  stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#dff2fd" stop-opacity=".5"/>
      <stop offset="1"  stop-color="#9cc8e8" stop-opacity=".15"/>
    </radialGradient>
    <radialGradient id="ram-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0"  stop-color="#000000" stop-opacity="1"/>
      <stop offset=".7" stop-color="#000000" stop-opacity=".7"/>
      <stop offset="1"  stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="40" fill="url(#ram-shadow)" opacity=".35"/>

  <!-- ============ LIQUIDE (derriere le verre, transparent) ============ -->
  <!-- surface du liquide (ellipse, bord arriere visible) -->
  <ellipse cx="450" cy="700" rx="148" ry="16" fill="#eaf8ff" opacity=".32"/>
  <path d="M302 700 Q450 728 598 700 Q450 684 302 700 Z" fill="#ffffff" opacity=".22"/>
  <path d="M302 702 Q450 730 598 702" fill="none" stroke="#ffffff" stroke-width="3" opacity=".55"/>
  <!-- masse du liquide -->
  <path d="M302 704 Q450 730 598 704 L598 1210
           C598 1256 576 1274 532 1281 C500 1286 400 1286 368 1281
           C324 1274 302 1256 302 1210 Z" fill="url(#ram-liquid)"/>
  <path d="M302 704 Q450 730 598 704 L598 1210
           C598 1256 576 1274 532 1281 C500 1286 400 1286 368 1281
           C324 1274 302 1256 302 1210 Z" fill="url(#ram-liquidSide)"/>
  <!-- fond epais du verre vu a travers le liquide -->
  <ellipse cx="450" cy="1248" rx="142" ry="22" fill="#0b2c4c" opacity=".22"/>
  <path d="M318 1244 Q450 1276 582 1244" fill="none" stroke="#eaf7ff" stroke-width="5" opacity=".38"/>

  <!-- bulles fines -->
  <g fill="#ffffff">
    <circle cx="338" cy="1150" r="4" opacity=".38"/><circle cx="346" cy="1042" r="3" opacity=".33"/>
    <circle cx="352" cy="930"  r="3.5" opacity=".35"/><circle cx="344" cy="812" r="3" opacity=".3"/>
    <circle cx="358" cy="742"  r="2.5" opacity=".33"/>
    <circle cx="420" cy="1196" r="5" opacity=".3"/><circle cx="470" cy="1120" r="3" opacity=".26"/>
    <circle cx="508" cy="1176" r="4" opacity=".3"/><circle cx="552" cy="1084" r="3" opacity=".28"/>
    <circle cx="560" cy="948"  r="3.5" opacity=".3"/><circle cx="566" cy="820" r="2.5" opacity=".28"/>
    <circle cx="548" cy="742"  r="3" opacity=".3"/><circle cx="486" cy="716" r="2.5" opacity=".35"/>
    <circle cx="400" cy="712"  r="2.5" opacity=".35"/>
  </g>

  <!-- ============ CORPS EN VERRE (bouteille Codd) ============ -->
  <path d="M404 192
           C402 220 400 262 374 288
           C338 322 328 348 328 392
           C328 442 344 470 368 492
           C380 502 384 512 384 526
           C384 542 378 552 366 562
           C316 600 296 640 296 710
           L296 1212
           C296 1262 320 1280 366 1287
           C398 1292 502 1292 534 1287
           C580 1280 604 1262 604 1212
           L604 710
           C604 640 584 600 534 562
           C522 552 516 542 516 526
           C516 512 520 502 532 492
           C556 470 572 442 572 392
           C572 348 562 322 526 288
           C500 262 498 220 496 192 Z"
        fill="url(#ram-glass)" stroke="#cfe7f8" stroke-width="3" stroke-opacity=".55"/>

  <!-- assombrissement bord droit (fresnel) -->
  <path d="M604 710 L604 1212 C604 1262 580 1280 534 1287
           C558 1270 576 1248 578 1208 L578 742 C578 722 590 714 604 710 Z"
        fill="#08243f" opacity=".34"/>
  <path d="M526 288 C562 322 572 348 572 392 C572 442 556 470 532 492
           C548 462 552 436 552 396 C552 350 546 322 522 296 Z"
        fill="#08243f" opacity=".26"/>
  <!-- rim light bord droit -->
  <path d="M597 726 C600 900 600 1090 594 1226" fill="none" stroke="#dff2ff" stroke-width="3" opacity=".6"/>
  <path d="M566 336 C571 366 571 420 560 462" fill="none" stroke="#dff2ff" stroke-width="2.5" opacity=".5"/>

  <!-- ============ CHAMBRE + BILLE ============ -->
  <!-- ombre interieure de la chambre -->
  <path d="M368 492 C380 502 384 512 384 526 L516 526 C516 512 520 502 532 492
           C512 508 388 508 368 492 Z" fill="#0a2a48" opacity=".28"/>
  <!-- bille de verre posee dans la chambre -->
  <circle cx="450" cy="404" r="63" fill="#0e3155" opacity=".35"/>
  <circle cx="450" cy="404" r="62" fill="url(#ram-marble)"/>
  <path d="M484 444 A62 62 0 0 0 510 380 C510 420 488 448 460 458 Z" fill="#1d4a78" opacity=".45"/>
  <path d="M450 342 A62 62 0 0 1 511 396" fill="none" stroke="#ffffff" stroke-width="3" opacity=".35"/>
  <ellipse cx="427" cy="380" rx="19" ry="12" transform="rotate(-26 427 380)" fill="#ffffff" opacity=".95"/>
  <circle cx="474" cy="432" r="7" fill="#ffffff" opacity=".45"/>
  <!-- ombre de la bille sur le siege -->
  <ellipse cx="450" cy="472" rx="46" ry="11" fill="#0a2a48" opacity=".38"/>
  <!-- reflet vertical sur la chambre (devant la bille) -->
  <path d="M354 318 Q342 366 350 434 Q356 458 366 468 Q352 402 364 332 Z" fill="url(#ram-shine)" opacity=".5"/>

  <!-- pincements lateraux (les oreilles) -->
  <g>
    <ellipse cx="389" cy="526" rx="11" ry="27" fill="#0a2745" opacity=".5"/>
    <ellipse cx="511" cy="526" rx="11" ry="27" fill="#0a2745" opacity=".5"/>
    <path d="M395 505 Q391 526 395 547" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".55"/>
    <path d="M505 505 Q509 526 505 547" fill="none" stroke="#ffffff" stroke-width="2" opacity=".35"/>
    <path d="M384 500 Q450 512 516 500" fill="none" stroke="#0d2f52" stroke-width="2" opacity=".3"/>
    <path d="M384 552 Q450 564 516 552" fill="none" stroke="#ffffff" stroke-width="2" opacity=".3"/>
  </g>

  <!-- embossage des epaules -->
  <g fill="none" stroke="#ffffff">
    <path d="M318 646 Q450 606 582 646" stroke-width="3" opacity=".25"/>
    <path d="M312 668 Q450 630 588 668" stroke-width="2.5" opacity=".18"/>
    <path d="M326 624 Q450 588 574 624" stroke-width="2" opacity=".14"/>
  </g>
  <g fill="#ffffff" opacity=".28">
    <circle cx="378" cy="640" r="3"/><circle cx="414" cy="628" r="3"/><circle cx="450" cy="624" r="3"/>
    <circle cx="486" cy="628" r="3"/><circle cx="522" cy="640" r="3"/>
  </g>

  <!-- lèvre de verre sous le bouchon -->
  <path d="M400 192 Q450 200 500 192 L500 208 Q450 216 400 208 Z" fill="#dff0fc" opacity=".4"/>
  <path d="M400 208 Q450 216 500 208" fill="none" stroke="#ffffff" stroke-width="2" opacity=".5"/>

  <!-- ============ BOUCHON PLASTIQUE BLEU CRANTE ============ -->
  <g>
    <path d="M398 128 Q450 118 502 128 L507 186 Q450 196 393 186 Z" fill="url(#ram-cap)"/>
    <ellipse cx="450" cy="127" rx="53" ry="11" fill="url(#ram-capTop)"/>
    <ellipse cx="450" cy="126" rx="40" ry="7" fill="#6fb0e8" opacity=".8"/>
    <!-- crans verticaux -->
    <g stroke="#0d3a6b" stroke-width="3" opacity=".38">
      <line x1="404" y1="136" x2="405" y2="184"/><line x1="416" y1="134" x2="417" y2="186"/>
      <line x1="428" y1="132" x2="429" y2="188"/><line x1="440" y1="131" x2="441" y2="189"/>
      <line x1="452" y1="131" x2="452" y2="189"/><line x1="464" y1="132" x2="463" y2="188"/>
      <line x1="476" y1="134" x2="475" y2="186"/><line x1="488" y1="136" x2="487" y2="184"/>
    </g>
    <g stroke="#a8d4f5" stroke-width="1.5" opacity=".5">
      <line x1="410" y1="135" x2="411" y2="185"/><line x1="434" y1="132" x2="435" y2="188"/>
      <line x1="458" y1="131" x2="458" y2="189"/><line x1="482" y1="134" x2="481" y2="186"/>
    </g>
    <path d="M393 186 Q450 196 507 186" fill="none" stroke="#0b2f5a" stroke-width="3" opacity=".6"/>
    <path d="M400 132 Q404 158 406 182" fill="none" stroke="#e6f4ff" stroke-width="3" opacity=".7"/>
  </g>

  <!-- ============ ETIQUETTE (bords en arc, cylindre) ============ -->
  <g>
    <path d="M298 860 Q450 882 602 860 L602 1056 Q450 1078 298 1056 Z" fill="url(#ram-label)"/>
    <path d="M298 860 Q450 882 602 860 L602 1056 Q450 1078 298 1056 Z" fill="url(#ram-labelShade)"/>
    <path d="M298 860 Q450 882 602 860 L602 871 Q450 893 298 871 Z" fill="#eaf4fd" opacity=".85"/>
    <path d="M298 1045 Q450 1067 602 1045 L602 1056 Q450 1078 298 1056 Z" fill="#0e2c50" opacity=".8"/>
    <text x="450" y="962" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="64" font-weight="700" letter-spacing="7" fill="#ffffff">RAMUNE</text>
    <text x="450" y="1012" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="23" font-weight="600" letter-spacing="9" fill="#b8dcf8">SODA JAPONAIS</text>
    <g stroke="#8fc0ec" stroke-width="2" opacity=".7">
      <line x1="330" y1="900" x2="398" y2="893"/><line x1="502" y1="893" x2="570" y2="900"/>
    </g>
    <circle cx="450" cy="893" r="9" fill="none" stroke="#8fc0ec" stroke-width="2.5" opacity=".8"/>
    <circle cx="450" cy="893" r="3.5" fill="#cfe6fa" opacity=".9"/>
  </g>

  <!-- ============ REFLETS VERRE (devant tout) ============ -->
  <path d="M328 726 Q316 980 330 1240 Q340 1258 356 1264 Q342 1080 344 908 Q346 792 356 722 Z"
        fill="url(#ram-shine)" opacity=".68"/>
  <rect x="380" y="738" width="12" height="420" rx="6" fill="#ffffff" opacity=".22"/>
  <path d="M320 600 Q306 640 302 700 Q316 652 334 622 Z" fill="#ffffff" opacity=".3"/>
  <path d="M382 256 Q372 274 364 292 Q378 282 388 264 Z" fill="#ffffff" opacity=".45"/>

  <!-- ============ CONDENSATION ============ -->
  <g>
    <circle cx="356" cy="770" r="7" fill="url(#ram-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".4"/>
    <circle cx="540" cy="806" r="6" fill="url(#ram-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".35"/>
    <circle cx="345" cy="1108" r="8" fill="url(#ram-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".4"/>
    <circle cx="556" cy="1140" r="6.5" fill="url(#ram-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".35"/>
    <circle cx="392" cy="1236" r="6" fill="url(#ram-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".35"/>
    <circle cx="524" cy="660" r="5" fill="url(#ram-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".35"/>
    <circle cx="562" cy="380" r="4.5" fill="url(#ram-drop)" stroke="#ffffff" stroke-width="1" stroke-opacity=".35"/>
    <!-- goutte qui coule avec trainee -->
    <path d="M559 940 q2 -6 4 0 q5 16 0 24 q-8 -6 -4 -24 Z" fill="url(#ram-drop)"/>
    <path d="M561 900 L561 938" stroke="#eaf7ff" stroke-width="2" opacity=".3"/>
    <path d="M340 926 q-2 -7 -4 0 q-5 18 0 27 q8 -7 4 -27 Z" fill="url(#ram-drop)"/>
    <path d="M338 880 L338 924" stroke="#eaf7ff" stroke-width="2" opacity=".3"/>
  </g>
</svg>
