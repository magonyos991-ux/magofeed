<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <linearGradient id="glassBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fd4f2"/>
      <stop offset=".18" stop-color="#cdeafa"/>
      <stop offset=".42" stop-color="#8ec7ec"/>
      <stop offset=".62" stop-color="#5ea9dd"/>
      <stop offset=".85" stop-color="#3f88c4"/>
      <stop offset="1" stop-color="#2f6ea6"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfe6fa"/>
      <stop offset=".45" stop-color="#7cc3ef"/>
      <stop offset="1" stop-color="#3e8fd0"/>
    </linearGradient>
    <radialGradient id="marble" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#cfeafd"/>
      <stop offset=".8" stop-color="#6fb5e8"/>
      <stop offset="1" stop-color="#3f7fbb"/>
    </radialGradient>
    <linearGradient id="capMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8f4fb"/>
      <stop offset=".5" stop-color="#9db8c8"/>
      <stop offset="1" stop-color="#5f7c8f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".25"/>
    </linearGradient>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="270" ry="42" fill="#000" opacity=".35"/>

  <!-- corps codd-neck : goulot, chambre a bille, deux pincements, corps -->
  <path d="M406 150
           L406 225 Q406 258 384 282 Q330 330 330 400
           L330 452 Q330 520 384 552 Q414 570 414 598
           Q414 626 382 646 Q305 690 305 790
           L305 1160 Q305 1285 450 1285 Q595 1285 595 1160
           L595 790 Q595 690 518 646 Q486 626 486 598
           Q486 570 516 552 Q570 520 570 452
           L570 400 Q570 330 516 282 Q494 258 494 225 L494 150 Z"
        fill="url(#glassBody)"/>

  <!-- liquide dans le corps -->
  <path d="M318 720 Q360 668 450 668 Q540 668 582 720
           L595 790 L595 1160 Q595 1285 450 1285 Q305 1285 305 1160 L305 790 Z"
        fill="url(#liquid)" opacity=".92"/>
  <!-- bulles -->
  <g fill="#ffffff">
    <circle cx="392" cy="1105" r="9" opacity=".5"/><circle cx="430" cy="980" r="6" opacity=".4"/>
    <circle cx="500" cy="1060" r="11" opacity=".45"/><circle cx="472" cy="880" r="5" opacity=".38"/>
    <circle cx="395" cy="812" r="7" opacity=".42"/><circle cx="525" cy="915" r="6" opacity=".35"/>
    <circle cx="452" cy="748" r="5" opacity=".3"/><circle cx="512" cy="1188" r="8" opacity=".4"/>
  </g>

  <!-- bille dans la chambre -->
  <circle cx="450" cy="428" r="62" fill="url(#marble)"/>
  <ellipse cx="428" cy="404" rx="19" ry="13" fill="#fff" opacity=".85" transform="rotate(-24 432 400)"/>

  <!-- capsule -->
  <rect x="392" y="120" width="116" height="56" rx="16" fill="url(#capMetal)"/>
  <rect x="392" y="144" width="116" height="9" fill="#4d6a7d" opacity=".5"/>

  <!-- etiquette -->
  <g>
    <path d="M305 840 L595 840 L595 1035 L305 1035 Z" fill="#1d4f8a"/>
    <path d="M305 840 L595 840 L595 860 L305 860 Z" fill="#ffffff" opacity=".22"/>
    <path d="M305 1015 L595 1015 L595 1035 L305 1035 Z" fill="#12355f"/>
    <text x="450" y="922" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="72" font-weight="700" letter-spacing="6" fill="#ffffff">RAMUNE</text>
    <text x="450" y="982" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="26" font-weight="600" letter-spacing="10" fill="#a8d4f5">SODA JAPONAIS</text>
  </g>

  <!-- reflets verticaux -->
  <path d="M345 715 Q335 940 345 1200 Q348 1250 372 1262 Q356 1140 356 960 Q356 800 366 718 Z"
        fill="url(#shine)" opacity=".5"/>
  <rect x="352" y="316" width="18" height="130" rx="9" fill="#fff" opacity=".55"/>
  <path d="M562 745 Q576 940 566 1170 Q562 1238 536 1256 Q554 1110 554 960 Q554 820 548 748 Z"
        fill="#0e2c4d" opacity=".28"/>

  <!-- condensation -->
  <g fill="#eaf7ff">
    <circle cx="358" cy="742" r="6" opacity=".65"/><circle cx="540" cy="778" r="5" opacity=".6"/>
    <circle cx="352" cy="1075" r="7" opacity=".6"/><circle cx="551" cy="1120" r="6" opacity=".55"/>
    <circle cx="382" cy="1245" r="5" opacity=".5"/><circle cx="510" cy="640" r="4" opacity=".5"/>
    <path d="M556 940 q6 14 0 22 q-8 -6 -4 -20 Z" opacity=".55"/>
    <path d="M344 890 q-6 16 0 26 q9 -7 4 -24 Z" opacity=".6"/>
  </g>
</svg>
