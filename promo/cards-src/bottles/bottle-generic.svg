<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <!-- verre clair et transparent -->
    <linearGradient id="gene-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset=".12" stop-color="#f4fbfc" stop-opacity=".5"/>
      <stop offset=".4" stop-color="#e8f4f5" stop-opacity=".28"/>
      <stop offset=".66" stop-color="#dcecee" stop-opacity=".26"/>
      <stop offset=".88" stop-color="#c3d8db" stop-opacity=".45"/>
      <stop offset="1" stop-color="#9fbcc1" stop-opacity=".7"/>
    </linearGradient>
    <!-- liquide ambre dore lumineux -->
    <linearGradient id="gene-liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2c977"/>
      <stop offset=".25" stop-color="#e8bd7a"/>
      <stop offset=".55" stop-color="#d6a04a"/>
      <stop offset=".8" stop-color="#b8863a"/>
      <stop offset="1" stop-color="#81591f"/>
    </linearGradient>
    <radialGradient id="gene-glow" cx=".5" cy=".45" r=".65">
      <stop offset="0" stop-color="#ffdf96" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#ffd06e" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffd06e" stop-opacity="0"/>
    </radialGradient>
    <!-- capsule couronne doree -->
    <linearGradient id="gene-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset=".3" stop-color="#f3d488"/>
      <stop offset=".58" stop-color="#e0b45c"/>
      <stop offset=".82" stop-color="#c1913c"/>
      <stop offset="1" stop-color="#8f6722"/>
    </linearGradient>
    <linearGradient id="gene-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".12"/>
    </linearGradient>
    <!-- etiquette creme -->
    <linearGradient id="gene-label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf3e2"/>
      <stop offset=".45" stop-color="#f2e8d0"/>
      <stop offset="1" stop-color="#e2d3b0"/>
    </linearGradient>
    <linearGradient id="gene-labelcurve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".4"/>
      <stop offset=".22" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".78" stop-color="#7a5c2e" stop-opacity="0"/>
      <stop offset="1" stop-color="#7a5c2e" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="gene-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d795"/>
      <stop offset=".5" stop-color="#d8ab5d"/>
      <stop offset="1" stop-color="#a9793a"/>
    </linearGradient>
    <!-- profondeur du liquide cote droit -->
    <linearGradient id="gene-depth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4712" stop-opacity="0"/>
      <stop offset=".6" stop-color="#6b4712" stop-opacity=".3"/>
      <stop offset="1" stop-color="#523408" stop-opacity=".62"/>
    </linearGradient>
    <!-- interieur du verre : borne le liquide -->
    <clipPath id="gene-clip">
      <path d="M415 165 L415 274
               Q415 310 386 346
               Q313 436 311 534
               L311 1174
               Q311 1279 450 1279
               Q589 1279 589 1174
               L589 534
               Q587 436 514 346
               Q485 310 485 274
               L485 165 Z"/>
    </clipPath>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="40" fill="#000" opacity=".35"/>

  <!-- corps : silhouette soda classique, col court, epaules douces, corps droit -->
  <path d="M404 158 L404 270
           Q404 310 376 344
           Q302 434 300 530
           L300 1176
           Q300 1290 450 1290
           Q600 1290 600 1176
           L600 530
           Q598 434 524 344
           Q496 310 496 270
           L496 158 Z"
        fill="url(#gene-glass)"/>

  <!-- liquide ambre petillant, borne a l'interieur du verre -->
  <g clip-path="url(#gene-clip)">
    <rect x="300" y="250" width="300" height="1044" fill="url(#gene-liquid)" opacity=".97"/>
    <!-- profondeur a droite -->
    <rect x="480" y="250" width="120" height="1044" fill="url(#gene-depth)"/>
    <!-- surface du liquide dans le col -->
    <ellipse cx="450" cy="250" rx="36" ry="9" fill="#ffe9b8" opacity=".9"/>
    <ellipse cx="450" cy="254" rx="36" ry="6" fill="#a87c3e" opacity=".4"/>
    <!-- lueur interieure -->
    <ellipse cx="420" cy="600" rx="126" ry="210" fill="url(#gene-glow)" opacity=".9"/>
    <ellipse cx="404" cy="620" rx="60" ry="150" fill="#ffedb8" opacity=".38"/>
    <ellipse cx="440" cy="1180" rx="120" ry="110" fill="url(#gene-glow)" opacity=".6"/>
    <!-- petites bulles a la surface -->
    <g fill="#ffffff">
      <circle cx="432" cy="262" r="3" opacity=".65"/>
      <circle cx="464" cy="266" r="2.5" opacity=".55"/>
      <circle cx="448" cy="272" r="2" opacity=".5"/>
    </g>
    <!-- fond epais du verre : refraction claire -->
    <path d="M311 1180 Q318 1270 450 1274 Q582 1270 589 1180
             Q556 1244 450 1248 Q344 1244 311 1180 Z" fill="#ffe6ae" opacity=".5"/>
    <path d="M340 1254 Q450 1286 560 1254 Q450 1270 340 1254 Z" fill="#fff4d6" opacity=".65"/>
  </g>

  <!-- bulles qui montent -->
  <g fill="#ffffff">
    <circle cx="440" cy="368" r="5" opacity=".6"/>
    <circle cx="460" cy="300" r="3.5" opacity=".62"/>
    <circle cx="396" cy="548" r="5.5" opacity=".55"/>
    <circle cx="478" cy="600" r="7" opacity=".55"/>
    <circle cx="534" cy="512" r="4.5" opacity=".5"/>
    <circle cx="356" cy="682" r="5.5" opacity=".55"/>
    <circle cx="508" cy="700" r="8" opacity=".6"/>
    <circle cx="446" cy="646" r="4.5" opacity=".45"/>
    <circle cx="396" cy="1148" r="7.5" opacity=".58"/>
    <circle cx="500" cy="1196" r="5.5" opacity=".5"/>
  </g>

  <!-- etiquette creme sobre -->
  <g>
    <rect x="314" y="780" width="272" height="304" rx="10" fill="url(#gene-label)"/>
    <rect x="314" y="780" width="272" height="304" rx="10" fill="url(#gene-labelcurve)"/>
    <rect x="324" y="790" width="252" height="284" rx="6" fill="none" stroke="url(#gene-gold)" stroke-width="2.5" opacity=".9"/>
    <rect x="331" y="797" width="238" height="270" rx="4" fill="none" stroke="#b98d4a" stroke-width="1" opacity=".45"/>
    <circle cx="450" cy="884" r="50" fill="none" stroke="url(#gene-gold)" stroke-width="3"/>
    <circle cx="450" cy="884" r="43" fill="none" stroke="#c69a57" stroke-width="1" opacity=".5"/>
    <text x="450" y="910" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="72" font-weight="700" fill="url(#gene-gold)">M</text>
    <text x="450" y="994" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="30" font-weight="600" letter-spacing="9" fill="#3a2b12">BOISSON</text>
    <text x="450" y="1036" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="30" font-weight="600" letter-spacing="9" fill="#3a2b12">DU JOUR</text>
    <path d="M394 946 L506 946" stroke="#c69a57" stroke-width="2" opacity=".6"/>
  </g>

  <!-- lumiere haut-gauche : bande de reflet vertical sur le flanc gauche -->
  <path d="M330 448 Q320 790 328 1120 Q332 1218 356 1254
           Q342 1080 342 880 Q342 650 352 454 Z"
        fill="url(#gene-shine)" opacity=".6"/>
  <path d="M360 352 Q328 402 316 470 Q344 414 378 380 Z" fill="#ffffff" opacity=".5"/>
  <rect x="414" y="180" width="13" height="78" rx="6" fill="#ffffff" opacity=".7"/>
  <rect x="477" y="168" width="10" height="94" rx="5" fill="#54390f" opacity=".3"/>
  <!-- bord droit assombri -->
  <path d="M592 542 Q600 840 594 1120 Q590 1222 562 1256
           Q580 1080 578 880 Q576 670 568 546 Z"
        fill="#54390f" opacity=".5"/>
  <path d="M524 348 Q562 392 580 448 Q590 478 594 520 Q572 430 514 364 Z" fill="#4a3211" opacity=".4"/>
  <!-- fin lisere clair sur les aretes -->
  <path d="M404 158 L404 270 Q404 310 376 344 Q302 434 300 530 L300 1176
           Q300 1290 450 1290 Q600 1290 600 1176 L600 530
           Q598 434 524 344 Q496 310 496 270 L496 158"
        fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".3"/>

  <!-- bague du goulot -->
  <rect x="398" y="160" width="104" height="17" rx="8" fill="#eef6f7" opacity=".55"/>
  <rect x="398" y="160" width="34" height="17" rx="8" fill="#ffffff" opacity=".55"/>

  <!-- capsule couronne doree dentelee -->
  <path d="M388 144 l6 27 l6 -27 l6 27 l6 -27 l6 27 l6 -27 l6 27 l6 -27 l6 27 l6 -27 l6 27 l6 -27 l6 27 l6 -27 l6 27 l6 -27 l6 27 l6 -27 l6 27 l6 -27 Z" fill="#a87c33"/>
  <rect x="384" y="108" width="132" height="44" rx="10" fill="url(#gene-cap)"/>
  <g stroke="#8a6420" stroke-width="2" opacity=".38">
    <path d="M412 114 L412 148"/><path d="M438 114 L438 148"/>
    <path d="M464 114 L464 148"/><path d="M490 114 L490 148"/>
  </g>
  <rect x="384" y="138" width="132" height="8" fill="#7a5620" opacity=".5"/>
  <ellipse cx="414" cy="121" rx="18" ry="7" fill="#ffffff" opacity=".6"/>

  <!-- gouttes de condensation -->
  <g fill="#fff8e8">
    <circle cx="354" cy="620" r="6" opacity=".6"/>
    <circle cx="560" cy="662" r="5" opacity=".55"/>
    <circle cx="346" cy="742" r="7" opacity=".58"/>
    <circle cx="568" cy="1130" r="5" opacity=".5"/>
    <circle cx="376" cy="1200" r="6" opacity=".55"/>
    <circle cx="522" cy="1246" r="5" opacity=".48"/>
    <circle cx="488" cy="472" r="4" opacity=".5"/>
    <path d="M566 820 q6 15 0 24 q-9 -7 -4 -22 Z" opacity=".55"/>
    <path d="M338 1000 q-6 16 0 26 q9 -7 4 -24 Z" opacity=".6"/>
  </g>

  <!-- fines etincelles dorees autour du goulot -->
  <g fill="#ffd98a">
    <path transform="translate(330 206) scale(.85)" d="M0 -18 Q3 -3 18 0 Q3 3 0 18 Q-3 3 -18 0 Q-3 -3 0 -18 Z" opacity=".9"/>
    <path transform="translate(590 148) scale(.7)" d="M0 -18 Q3 -3 18 0 Q3 3 0 18 Q-3 3 -18 0 Q-3 -3 0 -18 Z" opacity=".85"/>
    <path transform="translate(566 256) scale(.45)" d="M0 -18 Q3 -3 18 0 Q3 3 0 18 Q-3 3 -18 0 Q-3 -3 0 -18 Z" opacity=".7"/>
    <path transform="translate(352 92) scale(.5)" d="M0 -18 Q3 -3 18 0 Q3 3 0 18 Q-3 3 -18 0 Q-3 -3 0 -18 Z" fill="#fff2d4" opacity=".9"/>
    <path transform="translate(268 330) scale(.85)" d="M0 -18 Q3 -3 18 0 Q3 3 0 18 Q-3 3 -18 0 Q-3 -3 0 -18 Z" opacity=".75"/>
    <path transform="translate(646 342) scale(.6)" d="M0 -18 Q3 -3 18 0 Q3 3 0 18 Q-3 3 -18 0 Q-3 -3 0 -18 Z" opacity=".7"/>
    <path transform="translate(520 68) scale(.4)" d="M0 -18 Q3 -3 18 0 Q3 3 0 18 Q-3 3 -18 0 Q-3 -3 0 -18 Z" fill="#fff2d4" opacity=".8"/>
    <circle cx="248" cy="248" r="4" opacity=".55"/>
    <circle cx="666" cy="220" r="3.5" opacity=".5"/>
    <circle cx="620" cy="452" r="3.5" opacity=".45"/>
  </g>
</svg>
