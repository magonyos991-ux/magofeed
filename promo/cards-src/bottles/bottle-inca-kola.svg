<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <linearGradient id="inca-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5c93e"/>
      <stop offset=".16" stop-color="#ffefac"/>
      <stop offset=".4" stop-color="#ffd94f"/>
      <stop offset=".62" stop-color="#efb01c"/>
      <stop offset=".85" stop-color="#c98108"/>
      <stop offset="1" stop-color="#9d6206"/>
    </linearGradient>
    <linearGradient id="inca-liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffeb92"/>
      <stop offset=".25" stop-color="#ffda4e"/>
      <stop offset=".5" stop-color="#ffd23e"/>
      <stop offset=".72" stop-color="#eeac16"/>
      <stop offset="1" stop-color="#bd7a08"/>
    </linearGradient>
    <linearGradient id="inca-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f8fb"/>
      <stop offset=".35" stop-color="#cdd9e1"/>
      <stop offset=".7" stop-color="#93a5b1"/>
      <stop offset="1" stop-color="#5c6d7a"/>
    </linearGradient>
    <linearGradient id="inca-label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a63a8"/>
      <stop offset=".45" stop-color="#1d4f8a"/>
      <stop offset="1" stop-color="#123a66"/>
    </linearGradient>
    <linearGradient id="inca-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".2"/>
    </linearGradient>
    <path id="inca-spark" d="M0 -18 Q3 -3 18 0 Q3 3 0 18 Q-3 3 -18 0 Q-3 -3 0 -18 Z"/>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="265" ry="40" fill="#000" opacity=".35"/>

  <!-- silhouette verre : col long, epaule, corps droit legerement galbe -->
  <path d="M404 168 L404 250
           Q404 335 390 385
           Q370 448 332 488
           Q304 522 304 595
           L304 640
           Q304 720 310 810
           Q315 900 310 990
           Q305 1080 305 1150
           L305 1230
           Q305 1275 348 1284
           Q396 1290 450 1290
           Q504 1290 552 1284
           Q595 1275 595 1230
           L595 1150
           Q595 1080 590 990
           Q585 900 590 810
           Q596 720 596 640
           L596 595
           Q596 522 568 488
           Q530 448 510 385
           Q496 335 496 250
           L496 168 Z"
        fill="url(#inca-glass)"/>

  <!-- liquide dore (niveau dans le col) -->
  <path d="M409 296 Q450 282 491 296
           L491 330 Q498 390 516 442
           Q536 476 574 508
           Q588 534 588 598
           L588 642
           Q588 720 582 810
           Q577 900 582 990
           Q587 1078 587 1148
           L587 1226
           Q587 1266 546 1274
           Q500 1281 450 1281
           Q400 1281 354 1274
           Q313 1266 313 1226
           L313 1148
           Q313 1078 318 990
           Q323 900 318 810
           Q312 720 312 642
           L312 598
           Q312 534 326 508
           Q364 476 384 442
           Q402 390 409 330 Z"
        fill="url(#inca-liquid)" opacity=".97"/>
  <!-- assise du fond de bouteille -->
  <path d="M318 1240 Q360 1276 450 1278 Q540 1276 582 1240 Q560 1282 450 1284 Q340 1282 318 1240 Z"
        fill="#8a5505" opacity=".5"/>
  <!-- surface du liquide -->
  <ellipse cx="450" cy="297" rx="42" ry="10" fill="#ffefaf" opacity=".95"/>
  <!-- espace d'air dans le col -->
  <path d="M409 174 L491 174 L491 290 Q450 276 409 290 Z" fill="#fdf3d2" opacity=".6"/>
  <!-- lueur du fond -->
  <path d="M330 1230 Q380 1272 450 1274 Q385 1250 352 1200 Z" fill="#ffe98a" opacity=".4"/>

  <!-- bulles -->
  <g fill="#ffffff">
    <circle cx="472" cy="342" r="4" opacity=".45"/>
    <circle cx="432" cy="520" r="5" opacity=".42"/>
    <circle cx="470" cy="602" r="6" opacity=".38"/>
    <circle cx="418" cy="700" r="5" opacity=".45"/>
    <circle cx="502" cy="762" r="7" opacity=".4"/>
    <circle cx="446" cy="1152" r="6" opacity=".42"/>
    <circle cx="516" cy="1204" r="8" opacity=".36"/>
    <circle cx="390" cy="1232" r="7" opacity=".4"/>
  </g>

  <!-- bague du goulot -->
  <rect x="392" y="164" width="116" height="18" rx="9" fill="#f7dd8f"/>
  <rect x="392" y="164" width="116" height="8" rx="4" fill="#fff4cd" opacity=".8"/>

  <!-- capsule couronne argentee -->
  <path d="M386 146 L514 146 L514 152 L506 168 L498 152 L490 168 L482 152 L474 168 L466 152 L458 168
           L450 152 L442 168 L434 152 L426 168 L418 152 L410 168 L402 152 L394 168 L386 152 Z"
        fill="url(#inca-cap)"/>
  <rect x="386" y="114" width="128" height="36" rx="9" fill="url(#inca-cap)"/>
  <rect x="386" y="138" width="128" height="7" fill="#465864" opacity=".5"/>
  <rect x="396" y="120" width="42" height="9" rx="4.5" fill="#ffffff" opacity=".65"/>

  <!-- etiquette bleu roi -->
  <g>
    <path d="M310 832 L590 832 L590 1088 L310 1088 Z" fill="url(#inca-label)"/>
    <path d="M310 832 L590 832 L590 850 L310 850 Z" fill="#ffffff" opacity=".2"/>
    <path d="M310 1068 L590 1068 L590 1088 L310 1088 Z" fill="#0e2c50"/>
    <rect x="352" y="866" width="196" height="3.5" fill="#ffd23e" opacity=".85"/>
    <text x="450" y="944" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="84" font-weight="700" letter-spacing="6" fill="#ffd23e">INCA</text>
    <text x="450" y="1026" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="84" font-weight="700" letter-spacing="6" fill="#ffd23e">KOLA</text>
    <text x="450" y="1057" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="18" font-weight="600" letter-spacing="2.5" fill="#ffffff">LA BOISSON DU PÉROU</text>
  </g>

  <!-- reflets : bande claire a gauche, bord droit assombri -->
  <path d="M340 520 Q330 900 340 1200 Q344 1252 368 1264 Q352 1130 352 950 Q352 700 362 524 Z"
        fill="url(#inca-shine)" opacity=".52"/>
  <rect x="410" y="196" width="13" height="150" rx="6.5" fill="#ffffff" opacity=".6"/>
  <path d="M352 500 Q378 462 392 420 Q392 470 366 506 Q356 512 352 500 Z" fill="#ffffff" opacity=".5"/>
  <path d="M376 560 Q372 680 376 790 Q378 806 386 810 Q382 690 386 564 Q380 552 376 560 Z"
        fill="#ffffff" opacity=".38"/>
  <path d="M560 520 Q574 900 566 1170 Q562 1240 536 1258 Q554 1100 554 950 Q554 700 546 524 Z"
        fill="#3a2404" opacity=".34"/>
  <!-- liseret lumineux bord droit -->
  <path d="M568 492 Q593 524 593 596 L593 820 Q589 822 586 820 L586 598 Q586 530 562 500 Z"
        fill="#ffe374" opacity=".55"/>
  <path d="M592 1100 L592 1226 Q592 1262 550 1272 Q580 1256 585 1224 L586 1100 Z"
        fill="#ffe374" opacity=".4"/>

  <!-- condensation -->
  <g fill="#ffffff">
    <circle cx="330" cy="702" r="6" opacity=".6"/>
    <circle cx="562" cy="660" r="5" opacity=".55"/>
    <circle cx="326" cy="1132" r="7" opacity=".58"/>
    <circle cx="568" cy="1172" r="6" opacity=".52"/>
    <circle cx="352" cy="1250" r="5" opacity=".5"/>
    <circle cx="520" cy="562" r="4" opacity=".5"/>
    <circle cx="345" cy="590" r="4" opacity=".55"/>
    <path d="M556 940 q6 14 0 22 q-8 -6 -4 -20 Z" opacity=".55"/>
    <path d="M344 890 q-6 16 0 26 q9 -7 4 -24 Z" opacity=".6"/>
  </g>

  <!-- etincelles dorees autour du goulot -->
  <g>
    <use href="#inca-spark" transform="translate(316 232) scale(1.9)" fill="#ffd23e" opacity=".4"/>
    <use href="#inca-spark" transform="translate(316 232) scale(1.15)" fill="#fff3c2" opacity=".95"/>
    <use href="#inca-spark" transform="translate(584 186) scale(1.4)" fill="#ffd23e" opacity=".4"/>
    <use href="#inca-spark" transform="translate(584 186) scale(.85)" fill="#fff6d2" opacity=".95"/>
    <use href="#inca-spark" transform="translate(282 396) scale(.65)" fill="#fff3c2" opacity=".9"/>
    <use href="#inca-spark" transform="translate(612 330) scale(1.6)" fill="#ffd23e" opacity=".4"/>
    <use href="#inca-spark" transform="translate(612 330) scale(1)" fill="#fff3c2" opacity=".95"/>
    <use href="#inca-spark" transform="translate(360 128) scale(.6)" fill="#fff6d2" opacity=".9"/>
    <use href="#inca-spark" transform="translate(552 452) scale(.55)" fill="#fff3c2" opacity=".8"/>
    <circle cx="340" cy="306" r="5" fill="#fff3c2" opacity=".85"/>
    <circle cx="600" cy="252" r="4.5" fill="#fff6d2" opacity=".8"/>
    <circle cx="298" cy="474" r="3.5" fill="#ffe98a" opacity=".75"/>
    <circle cx="548" cy="140" r="4.5" fill="#fff6d2" opacity=".85"/>
  </g>
</svg>
