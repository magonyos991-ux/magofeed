<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <!-- verre clair vide (col au-dessus du liquide) -->
    <linearGradient id="inca-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe4dd"/>
      <stop offset=".18" stop-color="#f2fbf6"/>
      <stop offset=".5" stop-color="#e2f1ea"/>
      <stop offset=".82" stop-color="#b9d2cb"/>
      <stop offset="1" stop-color="#8fa9a3"/>
    </linearGradient>
    <!-- liquide jaune dore fluo, presque chartreuse, irradiant -->
    <linearGradient id="inca-liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdf76e"/>
      <stop offset=".14" stop-color="#fffbb0"/>
      <stop offset=".34" stop-color="#fff23c"/>
      <stop offset=".55" stop-color="#ffe504"/>
      <stop offset=".76" stop-color="#f2c303"/>
      <stop offset="1" stop-color="#c68f04"/>
    </linearGradient>
    <!-- coeur lumineux du liquide -->
    <radialGradient id="inca-glow" cx=".42" cy=".42" r=".75">
      <stop offset="0" stop-color="#fffde0" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#fff53c" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff53c" stop-opacity="0"/>
    </radialGradient>
    <!-- capsule couronne doree -->
    <linearGradient id="inca-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6cc"/>
      <stop offset=".28" stop-color="#f7d764"/>
      <stop offset=".58" stop-color="#dca82a"/>
      <stop offset=".82" stop-color="#b57c10"/>
      <stop offset="1" stop-color="#8a5a08"/>
    </linearGradient>
    <!-- etiquette bleu roi -->
    <linearGradient id="inca-label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e56c4"/>
      <stop offset=".22" stop-color="#1a4ec0"/>
      <stop offset=".55" stop-color="#123e9e"/>
      <stop offset=".85" stop-color="#0c2f7e"/>
      <stop offset="1" stop-color="#092560"/>
    </linearGradient>
    <linearGradient id="inca-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".15"/>
    </linearGradient>
    <clipPath id="inca-liquid-clip">
      <path d="M412 268 Q450 254 488 268
           L488 286 Q490 330 496 366
           Q509 436 550 486
           Q598 542 600 606
           L601 646
           Q601 764 593 872
           Q587 982 595 1092
           L597 1198
           Q597 1256 546 1271
           Q498 1283 450 1283
           Q402 1283 354 1271
           Q303 1256 303 1198
           L305 1092
           Q313 982 307 872
           Q299 764 299 646
           L300 606
           Q302 542 350 486
           Q391 436 404 366
           Q410 330 412 286 Z"/>
    </clipPath>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="38" fill="#000" opacity=".35"/>

  <!-- ===== silhouette de la bouteille en verre (col moyen, epaules douces, corps legerement galbe) ===== -->
  <path id="inca-body" d="M406 168 L406 244
           Q406 322 397 362
           Q385 432 343 482
           Q295 538 292 604
           L292 646
           Q292 764 300 872
           Q306 982 298 1092
           L296 1200
           Q295 1262 350 1278
           Q400 1290 450 1290
           Q500 1290 550 1278
           Q605 1262 604 1200
           L602 1092
           Q594 982 600 872
           Q608 764 608 646
           L608 604
           Q605 538 557 482
           Q515 432 503 362
           Q494 322 494 244
           L494 168 Z"
        fill="url(#inca-glass)"/>

  <!-- ===== liquide jaune dore fluo (niveau haut dans le col) ===== -->
  <path d="M412 268 Q450 254 488 268
           L488 286 Q490 330 496 366
           Q509 436 550 486
           Q598 542 600 606
           L601 646
           Q601 764 593 872
           Q587 982 595 1092
           L597 1198
           Q597 1256 546 1271
           Q498 1283 450 1283
           Q402 1283 354 1271
           Q303 1256 303 1198
           L305 1092
           Q313 982 307 872
           Q299 764 299 646
           L300 606
           Q302 542 350 486
           Q391 436 404 366
           Q410 330 412 286 Z"
        fill="url(#inca-liquid)"/>
  <!-- coeur irradiant + zones sur-eclairees (limites au liquide) -->
  <g clip-path="url(#inca-liquid-clip)">
    <ellipse cx="425" cy="690" rx="175" ry="320" fill="url(#inca-glow)"/>
    <ellipse cx="430" cy="1180" rx="170" ry="120" fill="url(#inca-glow)" opacity=".8"/>
    <!-- profondeur a droite du liquide -->
    <path d="M520 380 Q560 470 596 540 L601 700 Q601 950 597 1180 Q596 1250 540 1272 Q575 1230 578 1120 Q582 900 574 700 Q566 520 512 396 Z"
          fill="#b87f02" opacity=".45"/>
  </g>
  <path d="M330 560 Q372 500 396 430 Q402 500 362 566 Q342 592 330 560 Z" fill="#fffde0" opacity=".55"/>
  <!-- surface du liquide dans le col -->
  <ellipse cx="450" cy="269" rx="39" ry="9" fill="#fffbc2"/>
  <ellipse cx="450" cy="267" rx="27" ry="5.5" fill="#fff34a"/>
  <!-- fond de bouteille : assise + lueur -->
  <path d="M316 1236 Q360 1274 450 1276 Q540 1274 584 1236 Q556 1280 450 1283 Q344 1280 316 1236 Z"
        fill="#8a5f04" opacity=".55"/>
  <path d="M326 1224 Q380 1268 452 1272 Q384 1244 352 1190 Z" fill="#fff9a8" opacity=".5"/>

  <!-- bulles montantes -->
  <g fill="#ffffff">
    <circle cx="470" cy="318" r="4" opacity=".55"/>
    <circle cx="428" cy="452" r="5" opacity=".5"/>
    <circle cx="474" cy="560" r="6" opacity=".45"/>
    <circle cx="414" cy="668" r="5" opacity=".5"/>
    <circle cx="508" cy="722" r="7" opacity=".45"/>
    <circle cx="448" cy="1140" r="6" opacity=".5"/>
    <circle cx="522" cy="1196" r="8" opacity=".4"/>
    <circle cx="386" cy="1226" r="7" opacity=".45"/>
  </g>

  <!-- bague du goulot en verre -->
  <path d="M398 170 Q450 158 502 170 L502 190 Q450 179 398 190 Z" fill="#f4fbf7" opacity=".85"/>
  <path d="M398 186 Q450 176 502 186 L502 194 Q450 184 398 194 Z" fill="#89a39d" opacity=".6"/>

  <!-- ===== capsule couronne DOREE dentelee ===== -->
  <g>
    <!-- jupe dentelee -->
    <path d="M384 148 L516 148 L516 152 L507 170 L498 152 L489 170 L480 152 L471 170 L462 152 L453 170
             L444 152 L435 170 L426 152 L417 170 L408 152 L399 170 L390 152 L384 152 Z"
          fill="url(#inca-cap)"/>
    <path d="M384 148 L516 148 L516 152 L507 170 L498 152 L489 170 L480 152 L471 170 L462 152 L453 170
             L444 152 L435 170 L426 152 L417 170 L408 152 L399 170 L390 152 L384 152 Z"
          fill="#6b4405" opacity=".28"/>
    <!-- corps de la capsule -->
    <rect x="384" y="112" width="132" height="40" rx="10" fill="url(#inca-cap)"/>
    <rect x="384" y="140" width="132" height="8" fill="#7a5106" opacity=".5"/>
    <rect x="384" y="112" width="132" height="9" rx="4.5" fill="#fff9db" opacity=".7"/>
    <rect x="396" y="119" width="40" height="10" rx="5" fill="#ffffff" opacity=".75"/>
    <!-- pastille bleue au centre de la capsule -->
    <ellipse cx="450" cy="133" rx="26" ry="11" fill="#123e9e"/>
    <ellipse cx="450" cy="131" rx="26" ry="10" fill="#1e56c4"/>
  </g>

  <!-- ===== etiquette BLEU ROI, coins arrondis, bords suivant la courbure ===== -->
  <g>
    <path d="M330 778
             L570 778
             Q597 778 598 806
             L599 862
             Q593 962 598 1046
             Q598 1072 571 1073
             L329 1073
             Q302 1072 302 1046
             Q307 962 301 862
             L302 806
             Q303 778 330 778 Z"
          fill="url(#inca-label)"/>
    <!-- lumiere sur le haut de l'etiquette + ombre en bas -->
    <path d="M330 778 L570 778 Q597 778 598 806 L598 812 Q450 796 302 812 L302 806 Q303 778 330 778 Z"
          fill="#ffffff" opacity=".22"/>
    <path d="M302 1040 Q450 1056 598 1040 L598 1046 Q598 1072 571 1073 L329 1073 Q302 1072 302 1046 Z"
          fill="#04123a" opacity=".55"/>
    <!-- bord gauche eclaire, bord droit assombri (courbure) -->
    <path d="M330 778 Q302 780 302 812 L303 1044 Q303 1071 330 1073 L342 1073 Q318 1064 317 1040 L316 812 Q317 784 342 778 Z"
          fill="#5f8ae0" opacity=".5"/>
    <path d="M570 778 Q598 780 598 812 L597 1044 Q597 1071 570 1073 L556 1073 Q582 1064 583 1040 L584 812 Q583 784 558 778 Z"
          fill="#04123a" opacity=".5"/>
    <!-- filet dore -->
    <path d="M320 796 Q450 786 580 796 L580 801 Q450 791 320 801 Z" fill="#ffd23e" opacity=".8"/>
    <path d="M320 1052 Q450 1062 580 1052 L580 1057 Q450 1067 320 1057 Z" fill="#ffd23e" opacity=".7"/>
    <!-- INCA KOLA incline, dynamique -->
    <g transform="rotate(-7 450 910)">
      <text x="454" y="892" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
            font-size="86" font-weight="700" font-style="italic" letter-spacing="2"
            fill="#052058" opacity=".9">INCA</text>
      <text x="450" y="888" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
            font-size="86" font-weight="700" font-style="italic" letter-spacing="2"
            fill="#ffd23e">INCA</text>
      <text x="454" y="978" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
            font-size="86" font-weight="700" font-style="italic" letter-spacing="2"
            fill="#052058" opacity=".9">KOLA</text>
      <text x="450" y="974" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
            font-size="86" font-weight="700" font-style="italic" letter-spacing="2"
            fill="#ffd23e">KOLA</text>
    </g>
    <text x="450" y="1036" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="19" font-weight="600" letter-spacing="3" fill="#ffffff">LA BEBIDA DEL PER&#218;</text>
  </g>

  <!-- ===== reflets du verre ===== -->
  <!-- large bande claire verticale a gauche -->
  <path d="M334 520 Q322 880 332 1190 Q336 1248 366 1264 Q348 1120 348 950 Q348 700 358 520 Z"
        fill="url(#inca-shine)" opacity=".55"/>
  <!-- reflet net etroit a gauche -->
  <path d="M372 540 Q366 700 370 830 Q372 846 381 848 Q376 700 382 546 Q377 532 372 540 Z"
        fill="#ffffff" opacity=".5"/>
  <!-- reflet du col -->
  <rect x="412" y="182" width="12" height="140" rx="6" fill="#ffffff" opacity=".75"/>
  <path d="M350 500 Q380 458 394 414 Q394 466 366 508 Q355 514 350 500 Z" fill="#ffffff" opacity=".6"/>
  <!-- bord droit assombri -->
  <path d="M560 512 Q578 880 570 1170 Q566 1244 536 1262 Q556 1100 556 950 Q556 700 546 516 Z"
        fill="#4a3202" opacity=".32"/>
  <path d="M500 300 Q506 358 522 410 Q510 372 502 322 Z" fill="#4a3202" opacity=".3"/>
  <!-- rim light bord droit -->
  <path d="M556 486 Q604 540 606 610 L606 780 Q601 782 598 779 L598 612 Q596 548 548 494 Z"
        fill="#fff8b0" opacity=".8"/>
  <path d="M605 1100 L604 1200 Q604 1258 552 1274 Q590 1252 596 1204 L597 1100 Z"
        fill="#fff8b0" opacity=".6"/>
  <path d="M494 176 L494 244 Q494 300 500 344 L492 344 Q487 298 487 244 L487 176 Z"
        fill="#ffffff" opacity=".5"/>

  <!-- ===== condensation ===== -->
  <g fill="#ffffff">
    <circle cx="328" cy="690" r="6" opacity=".6"/>
    <circle cx="566" cy="646" r="5" opacity=".55"/>
    <circle cx="322" cy="1128" r="7" opacity=".6"/>
    <circle cx="572" cy="1168" r="6" opacity=".55"/>
    <circle cx="350" cy="1244" r="5" opacity=".5"/>
    <circle cx="524" cy="540" r="4" opacity=".55"/>
    <circle cx="342" cy="600" r="4" opacity=".6"/>
    <path d="M556 1105 q7 15 0 24 q-9 -7 -4 -22 Z" opacity=".6"/>
    <path d="M338 736 q-6 16 0 26 q9 -7 4 -24 Z" opacity=".62"/>
  </g>
</svg>
