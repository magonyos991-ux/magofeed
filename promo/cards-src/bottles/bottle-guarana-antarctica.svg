<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <linearGradient id="guar-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f8f52"/>
      <stop offset=".13" stop-color="#8ee0a8"/>
      <stop offset=".3" stop-color="#3aa763"/>
      <stop offset=".55" stop-color="#1a7c41"/>
      <stop offset=".8" stop-color="#0f5a2e"/>
      <stop offset="1" stop-color="#083a1d"/>
    </linearGradient>
    <linearGradient id="guar-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa9b1"/>
      <stop offset=".2" stop-color="#eef4f6"/>
      <stop offset=".5" stop-color="#b9c6cc"/>
      <stop offset=".8" stop-color="#7f8f97"/>
      <stop offset="1" stop-color="#5d6c74"/>
    </linearGradient>
    <linearGradient id="guar-lidtop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f5f7"/>
      <stop offset=".35" stop-color="#c9d4d9"/>
      <stop offset=".7" stop-color="#a5b3ba"/>
      <stop offset="1" stop-color="#84949c"/>
    </linearGradient>
    <radialGradient id="guar-disc" cx=".38" cy=".32" r="1.05">
      <stop offset="0" stop-color="#ff5a45"/>
      <stop offset=".35" stop-color="#e6301f"/>
      <stop offset=".75" stop-color="#c81f12"/>
      <stop offset="1" stop-color="#9a150b"/>
    </radialGradient>
    <linearGradient id="guar-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="guar-shadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#041f0f" stop-opacity="0"/>
      <stop offset=".55" stop-color="#041f0f" stop-opacity=".42"/>
      <stop offset=".86" stop-color="#03170b" stop-opacity=".6"/>
      <stop offset="1" stop-color="#0a3a1d" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="guar-drop" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#dff7e8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9fd8b6" stop-opacity=".25"/>
    </radialGradient>
    <clipPath id="guar-clip">
      <path d="M280 292 C272 336 236 358 230 415 L228 1150 C228 1200 246 1224 258 1244 C268 1262 280 1288 312 1290 Q450 1300 588 1290 C620 1288 632 1262 642 1244 C654 1224 672 1200 672 1150 L670 415 C664 358 628 336 620 292 Q450 332 280 292 Z"/>
    </clipPath>
    <path id="guar-arc1" d="M270 702 Q450 722 630 702" fill="none"/>
    <path id="guar-arc2" d="M270 934 Q450 952 630 934" fill="none"/>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="38" fill="#000" opacity=".35"/>

  <!-- corps vert -->
  <path d="M280 292 C272 336 236 358 230 415 L228 1150 C228 1200 246 1224 258 1244 C268 1262 280 1288 312 1290 Q450 1300 588 1290 C620 1288 632 1262 642 1244 C654 1224 672 1200 672 1150 L670 415 C664 358 628 336 620 292 Q450 332 280 292 Z"
        fill="url(#guar-body)"/>

  <g clip-path="url(#guar-clip)">
    <!-- ombrage epaule + pied -->
    <path d="M228 292 L672 292 L672 400 Q450 428 228 400 Z" fill="#062d16" opacity=".28"/>
    <path d="M228 1180 Q450 1206 672 1180 L672 1300 L228 1300 Z" fill="#052712" opacity=".4"/>
    <path d="M228 1236 Q450 1262 672 1236 L672 1300 L228 1300 Z" fill="#031a0b" opacity=".5"/>
    <rect x="228" y="1264" width="444" height="6" fill="#bfe9cd" opacity=".22"/>

    <!-- filigrane : baies et feuilles de guarana -->
    <g fill="#0b4a25" opacity=".55">
      <path d="M310 445 q26 -34 62 -38 q-18 34 -48 44 Z"/>
      <circle cx="392" cy="432" r="15"/><circle cx="424" cy="452" r="11"/>
      <path d="M470 428 q30 -22 60 -16 q-22 26 -52 30 Z"/>
      <circle cx="556" cy="444" r="14"/><circle cx="586" cy="424" r="10"/>
      <path d="M600 460 q28 -12 48 2 q-22 16 -46 10 Z"/>
      <circle cx="300" cy="480" r="10"/>
      <path d="M290 1030 q-30 26 -34 64 q34 -16 46 -52 Z"/>
      <circle cx="336" cy="1084" r="17"/><circle cx="308" cy="1120" r="12"/>
      <path d="M382 1108 q10 -40 44 -56 q-2 40 -30 62 Z"/>
      <circle cx="452" cy="1078" r="14"/><circle cx="486" cy="1104" r="18"/>
      <path d="M540 1060 q34 -18 66 -6 q-26 26 -62 22 Z"/>
      <circle cx="596" cy="1102" r="13"/><circle cx="628" cy="1070" r="10"/>
      <path d="M576 1150 q24 -28 58 -30 q-14 32 -44 42 Z"/>
      <circle cx="352" cy="1168" r="11"/><circle cx="500" cy="1160" r="12"/>
    </g>
    <!-- yeux des baies en filigrane -->
    <g fill="#3aa763" opacity=".85">
      <circle cx="392" cy="430" r="6.5"/><circle cx="556" cy="442" r="6"/>
      <circle cx="336" cy="1082" r="7.5"/><circle cx="486" cy="1102" r="8"/>
      <circle cx="452" cy="1076" r="6"/><circle cx="596" cy="1100" r="5.5"/>
      <circle cx="424" cy="450" r="4.5"/><circle cx="308" cy="1118" r="5"/>
    </g>

    <!-- cercle rouge signature, anneau blanc -->
    <circle cx="450" cy="690" r="196" fill="#ffffff"/>
    <circle cx="450" cy="690" r="178" fill="url(#guar-disc)"/>
    <path d="M330 590 Q378 542 452 536 Q386 566 352 624 Z" fill="#ffffff" opacity=".22"/>
    <text font-family="'Space Grotesk',sans-serif" font-size="66" font-weight="700" letter-spacing="2" fill="#ffffff">
      <textPath href="#guar-arc1" startOffset="50%" text-anchor="middle">GUARANÁ</textPath>
    </text>
    <path d="M358 756 Q450 768 542 756" fill="none" stroke="#ffffff" stroke-width="4" opacity=".85"/>
    <text font-family="'Space Grotesk',sans-serif" font-size="42" font-weight="700" letter-spacing="6" fill="#ffffff">
      <textPath href="#guar-arc2" startOffset="50%" text-anchor="middle">ANTARCTICA</textPath>
    </text>

    <!-- reflets metal : bande large a gauche, fines ailleurs -->
    <path d="M264 340 L368 340 L358 1280 L272 1280 Z" fill="url(#guar-shine)" opacity=".8"/>
    <path d="M382 380 L404 380 L400 1270 L384 1270 Z" fill="url(#guar-shine)" opacity=".4"/>
    <path d="M496 360 L514 360 L512 1275 L498 1275 Z" fill="url(#guar-shine)" opacity=".3"/>
    <path d="M588 380 L602 380 L600 1260 L590 1260 Z" fill="url(#guar-shine)" opacity=".22"/>
    <!-- bord droit assombri + rim light -->
    <rect x="560" y="280" width="112" height="1020" fill="url(#guar-shadeR)"/>
    <path d="M660 420 Q666 850 658 1230 L666 1228 Q674 850 668 418 Z" fill="#c9f2d6" opacity=".5"/>
    <!-- bord gauche legerement assombri -->
    <path d="M228 400 L246 400 L244 1250 L228 1250 Z" fill="#052712" opacity=".35"/>
  </g>

  <!-- couvercle aluminium vu legerement de dessus -->
  <ellipse cx="450" cy="288" rx="171" ry="40" fill="#3d4a51"/>
  <ellipse cx="450" cy="280" rx="172" ry="40" fill="url(#guar-rim)"/>
  <ellipse cx="450" cy="281" rx="152" ry="33" fill="#6d7d86"/>
  <ellipse cx="450" cy="283" rx="146" ry="30" fill="url(#guar-lidtop)"/>
  <ellipse cx="450" cy="286" rx="112" ry="22" fill="none" stroke="#8d9ca4" stroke-width="3" opacity=".9"/>
  <ellipse cx="450" cy="286" rx="112" ry="22" fill="#c3ced4" opacity=".5"/>
  <!-- opercule -->
  <ellipse cx="414" cy="291" rx="26" ry="10" fill="#aab7be" stroke="#78878f" stroke-width="2.5"/>
  <!-- languette -->
  <g>
    <path d="M432 297 Q432 285 446 285 L502 288 Q518 289 518 300 Q518 311 502 312 L446 309 Q432 308 432 297 Z"
          fill="#e4ebee" stroke="#5f6e76" stroke-width="3.5"/>
    <ellipse cx="496" cy="299" rx="11" ry="6.5" fill="#8b9aa2" stroke="#57666e" stroke-width="2.5"/>
    <ellipse cx="449" cy="297" rx="7" ry="4.5" fill="#a8b5bc"/>
    <circle cx="447" cy="294" r="5.5" fill="#cfd8dd" stroke="#5f6e76" stroke-width="2.5"/>
  </g>
  <!-- eclat sur le rebord -->
  <path d="M300 262 Q360 240 440 238 Q368 250 322 274 Z" fill="#ffffff" opacity=".75"/>

  <!-- condensation -->
  <g>
    <circle cx="330" cy="560" r="7" fill="url(#guar-drop)"/>
    <circle cx="580" cy="530" r="6" fill="url(#guar-drop)"/>
    <circle cx="606" cy="820" r="6.5" fill="url(#guar-drop)"/>
    <circle cx="296" cy="900" r="7.5" fill="url(#guar-drop)"/>
    <circle cx="560" cy="1005" r="5.5" fill="url(#guar-drop)"/>
    <circle cx="318" cy="1180" r="6" fill="url(#guar-drop)"/>
    <circle cx="596" cy="1150" r="7" fill="url(#guar-drop)"/>
    <circle cx="470" cy="1225" r="5" fill="url(#guar-drop)"/>
    <path d="M352 640 q8 20 0 32 q-11 -9 -5 -30 Z" fill="url(#guar-drop)"/>
    <path d="M624 950 q7 18 0 28 q-10 -8 -4 -26 Z" fill="url(#guar-drop)"/>
  </g>
</svg>
