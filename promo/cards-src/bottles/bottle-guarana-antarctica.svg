<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <linearGradient id="guar-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a6b33"/>
      <stop offset=".16" stop-color="#3cc274"/>
      <stop offset=".34" stop-color="#17a052"/>
      <stop offset=".55" stop-color="#0e8a44"/>
      <stop offset=".8" stop-color="#0a6b33"/>
      <stop offset="1" stop-color="#05461f"/>
    </linearGradient>
    <linearGradient id="guar-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa9b1"/>
      <stop offset=".2" stop-color="#eef4f6"/>
      <stop offset=".5" stop-color="#b9c6cc"/>
      <stop offset=".8" stop-color="#7f8f97"/>
      <stop offset="1" stop-color="#5d6c74"/>
    </linearGradient>
    <linearGradient id="guar-lidtop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f5f7"/>
      <stop offset=".35" stop-color="#c9d4d9"/>
      <stop offset=".7" stop-color="#a5b3ba"/>
      <stop offset="1" stop-color="#84949c"/>
    </linearGradient>
    <radialGradient id="guar-berry" cx=".38" cy=".32" r="1.05">
      <stop offset="0" stop-color="#ee5a44"/>
      <stop offset=".4" stop-color="#d1372c"/>
      <stop offset=".8" stop-color="#b32418"/>
      <stop offset="1" stop-color="#8c170d"/>
    </radialGradient>
    <linearGradient id="guar-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fae5f"/>
      <stop offset=".55" stop-color="#178a45"/>
      <stop offset="1" stop-color="#0c6b32"/>
    </linearGradient>
    <linearGradient id="guar-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="guar-shadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#03270f" stop-opacity="0"/>
      <stop offset=".55" stop-color="#03270f" stop-opacity=".4"/>
      <stop offset=".86" stop-color="#021a0a" stop-opacity=".58"/>
      <stop offset="1" stop-color="#0a3a1d" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="guar-drop" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#dff7e8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9fd8b6" stop-opacity=".25"/>
    </radialGradient>
    <clipPath id="guar-clip">
      <path d="M280 292 C272 336 236 358 230 415 L228 1150 C228 1200 246 1224 258 1244 C268 1262 280 1288 312 1290 Q450 1300 588 1290 C620 1288 632 1262 642 1244 C654 1224 672 1200 672 1150 L670 415 C664 358 628 336 620 292 Q450 332 280 292 Z"/>
    </clipPath>
    <!-- arcs suivant la courbure -->
    <path id="guar-arcTop" d="M262 466 Q450 420 638 466" fill="none"/>
    <path id="guar-arcScript" d="M246 902 Q450 924 654 902" fill="none"/>
    <path id="guar-arcAnt" d="M288 978 Q450 996 612 978" fill="none"/>
    <path id="guar-arc350" d="M356 1154 Q450 1165 544 1154" fill="none"/>
    <path id="guar-arcM1" d="M290 1202 Q450 1213 610 1202" fill="none"/>
    <path id="guar-arcM2" d="M300 1230 Q450 1241 600 1230" fill="none"/>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="38" fill="#000" opacity=".35"/>

  <!-- corps vert -->
  <path d="M280 292 C272 336 236 358 230 415 L228 1150 C228 1200 246 1224 258 1244 C268 1262 280 1288 312 1290 Q450 1300 588 1290 C620 1288 632 1262 642 1244 C654 1224 672 1200 672 1150 L670 415 C664 358 628 336 620 292 Q450 332 280 292 Z"
        fill="url(#guar-body)"/>

  <g clip-path="url(#guar-clip)">
    <!-- ombrage epaule + pied -->
    <path d="M228 292 L672 292 L672 398 Q450 426 228 398 Z" fill="#04371a" opacity=".3"/>
    <path d="M228 1180 Q450 1206 672 1180 L672 1300 L228 1300 Z" fill="#042d14" opacity=".4"/>
    <path d="M228 1236 Q450 1262 672 1236 L672 1300 L228 1300 Z" fill="#021c0a" opacity=".5"/>
    <rect x="228" y="1264" width="444" height="6" fill="#bfe9cd" opacity=".22"/>

    <!-- ORIGINAL DO BRASIL, arque vers le haut -->
    <text font-family="'Space Grotesk',sans-serif" font-size="29" font-weight="700" letter-spacing="3.5" fill="#ffffff">
      <textPath href="#guar-arcTop" startOffset="50%" text-anchor="middle">ORIGINAL DO BRASIL</textPath>
    </text>

    <!-- EMBLEME : panneau blanc trapeze arrondi incline, liseré rouge epais debordant en bas,
         baies rouges brillantes + grande feuille verte contour blanc -->
    <g transform="rotate(-5 450 660)">
      <!-- liseré rouge exterieur (plus epais en bas, deborde) -->
      <path d="M312 512 L588 512 Q628 512 632 552 L642 750 Q646 804 596 808 L304 808 Q254 804 258 750 L268 552 Q272 512 312 512 Z"
            fill="#cf2e21"/>
      <path d="M312 512 L588 512 Q628 512 632 552 L642 750 Q646 804 596 808 L304 808 Q254 804 258 750 L268 552 Q272 512 312 512 Z"
            fill="none" stroke="#8c170d" stroke-width="3" opacity=".5"/>
      <!-- panneau blanc interieur -->
      <path d="M322 532 L578 532 Q608 532 611 562 L620 746 Q621 770 593 770 L307 770 Q279 770 280 746 L289 562 Q292 532 322 532 Z"
            fill="#ffffff"/>
      <!-- troisieme baie qui depasse en dessous, entre les deux -->
      <circle cx="452" cy="738" r="50" fill="url(#guar-berry)"/>
      <ellipse cx="433" cy="719" rx="14" ry="8.5" fill="#ffffff" opacity=".85" transform="rotate(-30 433 719)"/>
      <!-- deux grosses baies cote a cote -->
      <circle cx="388" cy="650" r="55" fill="url(#guar-berry)"/>
      <circle cx="512" cy="650" r="55" fill="url(#guar-berry)"/>
      <ellipse cx="367" cy="627" rx="17" ry="10.5" fill="#ffffff" opacity=".9" transform="rotate(-32 367 627)"/>
      <ellipse cx="491" cy="627" rx="17" ry="10.5" fill="#ffffff" opacity=".9" transform="rotate(-32 491 627)"/>
      <!-- grande feuille verte au contour blanc, balaye le coin haut-droit, pointe a droite -->
      <path d="M434 590 C460 524 556 492 674 536 C656 590 552 618 442 602 Q428 598 434 590 Z"
            fill="url(#guar-leaf)" stroke="#ffffff" stroke-width="9" stroke-linejoin="round"/>
      <path d="M458 582 C526 544 594 536 656 542" fill="none" stroke="#ffffff" stroke-width="5" opacity=".85" stroke-linecap="round"/>
      <path d="M498 580 L512 552 M550 568 L562 542 M598 558 L608 540" stroke="#ffffff" stroke-width="3.5" opacity=".6" stroke-linecap="round"/>
    </g>

    <!-- Guarana en script penche (skew italique) -->
    <g transform="translate(297 0) skewX(-18)">
      <text font-family="'Space Grotesk',sans-serif" font-size="100" font-weight="700" fill="#ffffff" letter-spacing="-2">
        <textPath href="#guar-arcScript" startOffset="50%" text-anchor="middle">Guaran&#225;</textPath>
      </text>
    </g>
    <!-- ANTARCTICA -->
    <text font-family="'Space Grotesk',sans-serif" font-size="36" font-weight="700" letter-spacing="7" fill="#ffffff">
      <textPath href="#guar-arcAnt" startOffset="50%" text-anchor="middle">ANTARCTICA</textPath>
    </text>

    <!-- drapeau bresilien (suit la courbure) -->
    <g>
      <path d="M393 1022 Q450 1029 507 1022 L507 1094 Q450 1101 393 1094 Z" fill="#159b3f"/>
      <path d="M450 1030 L500 1059 L450 1088 L400 1059 Z" fill="#ffcc29"/>
      <circle cx="450" cy="1059" r="16" fill="#1c3f94"/>
      <path d="M436 1056 Q450 1050 464 1056" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    </g>

    <!-- 350ml + micro-lignes -->
    <text font-family="'Space Grotesk',sans-serif" font-size="44" font-weight="700" fill="#ffffff">
      <textPath href="#guar-arc350" startOffset="50%" text-anchor="middle">350ml</textPath>
    </text>
    <text font-family="'Space Grotesk',sans-serif" font-size="19" font-weight="500" letter-spacing="2" fill="#ffffff" opacity=".92">
      <textPath href="#guar-arcM1" startOffset="50%" text-anchor="middle">REFRIGERANTE DE GUARAN&#193;</textPath>
    </text>
    <text font-family="'Space Grotesk',sans-serif" font-size="19" font-weight="500" letter-spacing="2" fill="#ffffff" opacity=".92">
      <textPath href="#guar-arcM2" startOffset="50%" text-anchor="middle">CONT&#201;M AROMATIZANTE</textPath>
    </text>

    <!-- reflets metal : bande large a gauche, fines ailleurs -->
    <path d="M264 340 L360 340 L352 1280 L272 1280 Z" fill="url(#guar-shine)" opacity=".55"/>
    <path d="M382 380 L404 380 L400 1270 L384 1270 Z" fill="url(#guar-shine)" opacity=".3"/>
    <path d="M496 360 L514 360 L512 1275 L498 1275 Z" fill="url(#guar-shine)" opacity=".22"/>
    <path d="M588 380 L602 380 L600 1260 L590 1260 Z" fill="url(#guar-shine)" opacity=".18"/>
    <!-- bord droit assombri + rim light -->
    <rect x="560" y="280" width="112" height="1020" fill="url(#guar-shadeR)"/>
    <path d="M660 420 Q666 850 658 1230 L666 1228 Q674 850 668 418 Z" fill="#c9f2d6" opacity=".5"/>
    <!-- bord gauche legerement assombri -->
    <path d="M228 400 L246 400 L244 1250 L228 1250 Z" fill="#042d14" opacity=".35"/>
  </g>

  <!-- couvercle aluminium vu legerement de dessus -->
  <ellipse cx="450" cy="286" rx="171" ry="40" fill="#3d4a51"/>
  <ellipse cx="450" cy="278" rx="172" ry="40" fill="url(#guar-rim)"/>
  <ellipse cx="450" cy="279" rx="152" ry="33" fill="#6d7d86"/>
  <ellipse cx="450" cy="281" rx="146" ry="30" fill="url(#guar-lidtop)"/>
  <ellipse cx="450" cy="284" rx="112" ry="22" fill="none" stroke="#8d9ca4" stroke-width="3" opacity=".9"/>
  <ellipse cx="450" cy="284" rx="112" ry="22" fill="#c3ced4" opacity=".5"/>
  <!-- opercule -->
  <ellipse cx="414" cy="289" rx="26" ry="10" fill="#aab7be" stroke="#78878f" stroke-width="2.5"/>
  <!-- languette -->
  <g>
    <path d="M432 295 Q432 283 446 283 L502 286 Q518 287 518 298 Q518 309 502 310 L446 307 Q432 306 432 295 Z"
          fill="#e4ebee" stroke="#5f6e76" stroke-width="3.5"/>
    <ellipse cx="496" cy="297" rx="11" ry="6.5" fill="#8b9aa2" stroke="#57666e" stroke-width="2.5"/>
    <ellipse cx="449" cy="295" rx="7" ry="4.5" fill="#a8b5bc"/>
    <circle cx="447" cy="292" r="5.5" fill="#cfd8dd" stroke="#5f6e76" stroke-width="2.5"/>
  </g>
  <!-- eclat sur le rebord -->
  <path d="M300 260 Q360 238 440 236 Q368 248 322 272 Z" fill="#ffffff" opacity=".75"/>

  <!-- condensation -->
  <g>
    <circle cx="322" cy="560" r="7" fill="url(#guar-drop)"/>
    <circle cx="588" cy="500" r="6" fill="url(#guar-drop)"/>
    <circle cx="612" cy="840" r="6.5" fill="url(#guar-drop)"/>
    <circle cx="288" cy="880" r="7.5" fill="url(#guar-drop)"/>
    <circle cx="562" cy="1050" r="5.5" fill="url(#guar-drop)"/>
    <circle cx="318" cy="1180" r="6" fill="url(#guar-drop)"/>
    <circle cx="600" cy="1150" r="7" fill="url(#guar-drop)"/>
    <path d="M300 700 q8 20 0 32 q-11 -9 -5 -30 Z" fill="url(#guar-drop)"/>
    <path d="M628 960 q7 18 0 28 q-10 -8 -4 -26 Z" fill="url(#guar-drop)"/>
  </g>
</svg>
