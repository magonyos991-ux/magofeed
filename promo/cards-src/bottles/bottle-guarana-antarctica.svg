<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <linearGradient id="guar-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fd49b"/>
      <stop offset=".16" stop-color="#4db374"/>
      <stop offset=".4" stop-color="#1c7a40"/>
      <stop offset=".7" stop-color="#135c30"/>
      <stop offset="1" stop-color="#0d3d22"/>
    </linearGradient>
    <linearGradient id="guar-lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f7f8"/>
      <stop offset=".45" stop-color="#c2cdd2"/>
      <stop offset=".8" stop-color="#8b9aa2"/>
      <stop offset="1" stop-color="#66757d"/>
    </linearGradient>
    <linearGradient id="guar-lidtop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eff1"/>
      <stop offset=".55" stop-color="#b9c5cb"/>
      <stop offset="1" stop-color="#93a2aa"/>
    </linearGradient>
    <linearGradient id="guar-label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdf7e6"/>
      <stop offset=".45" stop-color="#f2e8d0"/>
      <stop offset=".85" stop-color="#e3d5b4"/>
      <stop offset="1" stop-color="#cdbc95"/>
    </linearGradient>
    <linearGradient id="guar-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="guar-berry" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#ff8a6a"/>
      <stop offset=".4" stop-color="#e04a35"/>
      <stop offset=".8" stop-color="#c22f22"/>
      <stop offset="1" stop-color="#8f1d13"/>
    </radialGradient>
    <clipPath id="guar-clip">
      <path d="M304 366 Q304 402 268 430 Q262 444 262 470 L262 1156 Q262 1204 296 1236 Q310 1248 310 1268 Q312 1290 366 1290 L534 1290 Q588 1290 590 1268 Q590 1248 604 1236 Q638 1204 638 1156 L638 470 Q638 444 632 430 Q596 402 596 366 Z"/>
    </clipPath>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="40" fill="#000" opacity=".35"/>

  <!-- corps de la canette -->
  <path d="M304 366 Q304 402 268 430 Q262 444 262 470 L262 1156 Q262 1204 296 1236 Q310 1248 310 1268 Q312 1290 366 1290 L534 1290 Q588 1290 590 1268 Q590 1248 604 1236 Q638 1204 638 1156 L638 470 Q638 444 632 430 Q596 402 596 366 Z"
        fill="url(#guar-body)"/>

  <!-- fines bandes sombres haut / bas + assise -->
  <g clip-path="url(#guar-clip)">
    <rect x="262" y="452" width="376" height="22" fill="#0a2e1a" opacity=".78"/>
    <rect x="262" y="478" width="376" height="4" fill="#a8e6bd" opacity=".3"/>
    <rect x="262" y="1198" width="376" height="22" fill="#0a2e1a" opacity=".78"/>
    <rect x="262" y="1252" width="376" height="40" fill="#06210f" opacity=".65"/>
  </g>

  <!-- etiquette creme avec lisere rouge -->
  <g>
    <path d="M262 690 Q450 718 638 690 L638 1000 Q450 1028 262 1000 Z" fill="url(#guar-label)"/>
    <path d="M262 690 Q450 718 638 690 L638 702 Q450 730 262 702 Z" fill="#d1372c"/>
    <path d="M262 988 Q450 1016 638 988 L638 1000 Q450 1028 262 1000 Z" fill="#d1372c"/>
    <!-- petite baie iconique sur l'etiquette -->
    <g>
      <path d="M430 762 Q414 736 396 730 Q420 722 438 742 Z" fill="#1c7a40"/>
      <path d="M470 762 Q486 736 504 730 Q480 722 462 742 Z" fill="#2f9c57"/>
      <circle cx="450" cy="776" r="25" fill="url(#guar-berry)"/>
      <ellipse cx="450" cy="782" rx="13" ry="11" fill="#7e150d"/>
      <ellipse cx="450" cy="781" rx="10" ry="9" fill="#fdf7ea"/>
      <circle cx="450" cy="782" r="4.6" fill="#241a16"/>
    </g>
    <text x="450" y="888" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="66" font-weight="700" letter-spacing="2" fill="#14351f">GUARANÁ</text>
    <text x="450" y="948" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="31" font-weight="700" letter-spacing="7" fill="#d1372c">ANTARCTICA</text>
  </g>

  <!-- couvercle aluminium + languette -->
  <ellipse cx="450" cy="376" rx="150" ry="30" fill="#0a2e1a"/>
  <ellipse cx="450" cy="362" rx="150" ry="30" fill="url(#guar-lid)"/>
  <ellipse cx="450" cy="360" rx="132" ry="24" fill="url(#guar-lidtop)"/>
  <ellipse cx="450" cy="348" rx="30" ry="10" fill="none" stroke="#8a99a1" stroke-width="3"/>
  <path d="M418 362 Q418 352 432 352 L468 352 Q482 352 482 362 L482 372 Q482 382 468 382 L432 382 Q418 382 418 372 Z"
        fill="#dfe7ea" stroke="#7c8b93" stroke-width="2.5"/>
  <ellipse cx="450" cy="374" rx="12" ry="5.5" fill="#7c8b93"/>
  <circle cx="450" cy="359" r="5.5" fill="#98a6ad" stroke="#6d7c84" stroke-width="2"/>

  <!-- reflets : lumiere haut-gauche, bord droit assombri -->
  <path d="M300 470 Q288 850 300 1210 Q303 1246 322 1258 Q310 1080 310 860 Q310 640 318 474 Z"
        fill="url(#guar-shine)" opacity=".5"/>
  <rect x="318" y="492" width="18" height="120" rx="9" fill="#ffffff" opacity=".5"/>
  <path d="M292 424 Q330 396 366 390 Q336 412 322 442 Z" fill="#ffffff" opacity=".35"/>
  <path d="M540 478 Q534 850 540 1240 L556 1244 Q550 860 552 480 Z" fill="#d9ffe6" opacity=".16"/>
  <path d="M612 476 Q626 850 616 1200 Q612 1246 590 1258 Q604 1090 604 880 Q604 660 600 480 Z"
        fill="#06210f" opacity=".38"/>

  <!-- condensation -->
  <g fill="#eaffef">
    <circle cx="335" cy="610" r="6" opacity=".62"/><circle cx="566" cy="585" r="5" opacity=".55"/>
    <circle cx="312" cy="1100" r="7" opacity=".6"/><circle cx="588" cy="1035" r="6" opacity=".62"/>
    <circle cx="576" cy="1150" r="5" opacity=".58"/>
    <circle cx="350" cy="1235" r="5" opacity=".5"/><circle cx="540" cy="1242" r="6" opacity=".5"/>
    <circle cx="520" cy="722" r="5" opacity=".5"/><circle cx="372" cy="982" r="5" opacity=".5"/>
    <path d="M600 748 q6 15 0 24 q-9 -6 -4 -22 Z" opacity=".55"/>
    <path d="M296 838 q-6 16 0 26 q9 -7 4 -24 Z" opacity=".6"/>
  </g>

  <!-- grappe de baies de guarana -->
  <g>
    <path d="M796 1066 Q852 1020 884 962 Q892 1030 842 1078 Z" fill="#2f9c57"/>
    <path d="M708 1160 Q664 1200 652 1258 Q716 1244 736 1196 Z" fill="#1c7a40"/>
    <path d="M760 1062 Q780 1012 798 1006" fill="none" stroke="#5a3a1e" stroke-width="6" stroke-linecap="round"/>
    <path d="M742 1084 Q770 1140 816 1184" fill="none" stroke="#5a3a1e" stroke-width="6" stroke-linecap="round"/>

    <!-- petite baie fermee -->
    <circle cx="798" cy="1006" r="24" fill="url(#guar-berry)"/>
    <ellipse cx="790" cy="997" rx="7" ry="5" fill="#ffffff" opacity=".55"/>

    <!-- grosse baie ouverte -->
    <circle cx="742" cy="1084" r="58" fill="url(#guar-berry)"/>
    <ellipse cx="720" cy="1058" rx="18" ry="12" fill="#ffffff" opacity=".55" transform="rotate(-22 720 1058)"/>
    <ellipse cx="742" cy="1098" rx="30" ry="26" fill="#7e150d"/>
    <ellipse cx="742" cy="1096" rx="24" ry="21" fill="#fdf7ea"/>
    <circle cx="742" cy="1098" r="11" fill="#241a16"/>
    <circle cx="738" cy="1093" r="3.5" fill="#ffffff" opacity=".8"/>

    <!-- baie ouverte moyenne -->
    <circle cx="816" cy="1188" r="46" fill="url(#guar-berry)"/>
    <ellipse cx="800" cy="1168" rx="13" ry="9" fill="#ffffff" opacity=".5" transform="rotate(-22 800 1168)"/>
    <ellipse cx="818" cy="1198" rx="23" ry="20" fill="#7e150d"/>
    <ellipse cx="818" cy="1196" rx="18" ry="16" fill="#fdf7ea"/>
    <circle cx="818" cy="1198" r="8.5" fill="#241a16"/>
    <circle cx="815" cy="1194" r="2.8" fill="#ffffff" opacity=".8"/>

    <!-- baie fermee -->
    <circle cx="702" cy="1216" r="42" fill="url(#guar-berry)"/>
    <ellipse cx="688" cy="1200" rx="12" ry="8" fill="#ffffff" opacity=".5" transform="rotate(-22 688 1200)"/>
  </g>
</svg>
