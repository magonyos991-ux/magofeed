<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <linearGradient id="poca-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9be0"/>
      <stop offset=".16" stop-color="#63b0f0"/>
      <stop offset=".44" stop-color="#2a6db8"/>
      <stop offset=".74" stop-color="#1d4f8a"/>
      <stop offset="1" stop-color="#0f3562"/>
    </linearGradient>
    <linearGradient id="poca-cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset=".14" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset=".30" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".70" stop-color="#08213f" stop-opacity="0"/>
      <stop offset=".88" stop-color="#08213f" stop-opacity=".18"/>
      <stop offset="1" stop-color="#08213f" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="poca-lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f8fc"/>
      <stop offset=".28" stop-color="#c9d9e4"/>
      <stop offset=".55" stop-color="#93aebf"/>
      <stop offset=".8" stop-color="#6e8ba0"/>
      <stop offset="1" stop-color="#54718a"/>
    </linearGradient>
    <linearGradient id="poca-wave" x1="0" y1="0" x2="1" y2=".2">
      <stop offset="0" stop-color="#eef6fb"/>
      <stop offset=".4" stop-color="#ffffff"/>
      <stop offset=".78" stop-color="#e9f1f7"/>
      <stop offset="1" stop-color="#d3e2ee"/>
    </linearGradient>
    <linearGradient id="poca-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="poca-dropg" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#bfe2f8"/>
      <stop offset=".85" stop-color="#6fb4e4"/>
      <stop offset="1" stop-color="#4d94cc"/>
    </radialGradient>
    <linearGradient id="poca-splash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe4f9"/>
      <stop offset=".5" stop-color="#8ccbf0"/>
      <stop offset="1" stop-color="#5da4dd"/>
    </linearGradient>
    <clipPath id="poca-canclip">
      <path d="M308 370
               C308 402 262 420 262 472
               L262 1180
               C262 1236 286 1259 317 1272
               Q383 1296 450 1296
               Q517 1296 583 1272
               C614 1259 638 1236 638 1180
               L638 472
               C638 420 592 402 592 370 Z"/>
    </clipPath>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="262" ry="40" fill="#000" opacity=".35"/>

  <!-- splash bleu clair au pied (derriere la canette) -->
  <g>
    <ellipse cx="450" cy="1298" rx="218" ry="24" fill="#8ccbf0" opacity=".55"/>
    <path d="M270 1302 Q182 1296 158 1242 Q154 1216 176 1202 Q178 1236 214 1256 Q258 1280 322 1288 Q296 1302 270 1302 Z"
          fill="url(#poca-splash)" opacity=".95"/>
    <path d="M630 1304 Q718 1298 742 1244 Q746 1218 724 1204 Q722 1238 686 1258 Q642 1282 578 1290 Q604 1304 630 1304 Z"
          fill="url(#poca-splash)" opacity=".95"/>
    <circle cx="176" cy="1170" r="8" fill="#9fd4f2" opacity=".9"/>
    <circle cx="204" cy="1128" r="5" fill="#bfe4f9" opacity=".85"/>
    <circle cx="146" cy="1218" r="6" fill="#bfe4f9" opacity=".85"/>
    <circle cx="726" cy="1174" r="7" fill="#9fd4f2" opacity=".9"/>
    <circle cx="752" cy="1222" r="5" fill="#bfe4f9" opacity=".85"/>
    <circle cx="698" cy="1130" r="4" fill="#bfe4f9" opacity=".8"/>
  </g>

  <!-- corps de la canette -->
  <path d="M308 370
           C308 402 262 420 262 472
           L262 1180
           C262 1236 286 1259 317 1272
           Q383 1296 450 1296
           Q517 1296 583 1272
           C614 1259 638 1236 638 1180
           L638 472
           C638 420 592 402 592 370 Z"
        fill="url(#poca-body)"/>

  <!-- vague blanche signature + habillage, clippes dans la canette -->
  <g clip-path="url(#poca-canclip)">
    <!-- fine vague claire au-dessus de la grande vague -->
    <path d="M262 986 C336 962 372 894 448 868 C534 838 566 786 638 752
             L638 792 C566 826 534 878 448 908 C372 934 336 1002 262 1026 Z"
          fill="#bfe0f5" opacity=".85"/>
    <!-- grande vague blanche -->
    <path d="M262 1042 C334 1018 366 948 444 920 C532 888 564 834 638 800
             L638 1310 L262 1310 Z"
          fill="url(#poca-wave)"/>
    <!-- creux d'ombre sous la crete de vague -->
    <path d="M262 1042 C334 1018 366 948 444 920 C532 888 564 834 638 800
             L638 828 C566 862 534 914 448 946 C372 974 338 1040 262 1066 Z"
          fill="#9cbcd6" opacity=".45"/>
    <!-- ombrage cylindrique global -->
    <rect x="262" y="340" width="376" height="980" fill="url(#poca-cyl)"/>
    <!-- sertissage bas -->
    <path d="M262 1236 Q450 1300 638 1236 L638 1258 Q450 1320 262 1258 Z" fill="#7d9db8" opacity=".55"/>
  </g>

  <!-- couvercle aluminium -->
  <ellipse cx="450" cy="370" rx="142" ry="27" fill="url(#poca-lid)"/>
  <ellipse cx="450" cy="372" rx="116" ry="19" fill="#8ea9bc"/>
  <ellipse cx="450" cy="373" rx="116" ry="17" fill="#b9cdda"/>
  <ellipse cx="450" cy="374" rx="52" ry="9" fill="#98b2c4"/>
  <path d="M430 374 q20 -7 40 0 q-20 6 -40 0 Z" fill="#6d8ba0"/>
  <path d="M320 358 q60 -14 130 -14 q70 0 130 14" fill="none" stroke="#ffffff" stroke-width="5" opacity=".7"/>

  <!-- texte sur le bleu -->
  <g>
    <text x="450" y="612" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="80" font-weight="700" letter-spacing="5" fill="#ffffff">POCARI</text>
    <text x="450" y="704" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="80" font-weight="700" letter-spacing="5" fill="#ffffff">SWEAT</text>
    <text x="450" y="758" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
          font-size="23" font-weight="600" letter-spacing="8" fill="#cfe6f8">ION SUPPLY DRINK</text>
  </g>

  <!-- reflets : lumiere haut-gauche -->
  <path d="M310 462 Q296 850 310 1234 Q314 1266 340 1274 Q322 1030 322 850 Q322 636 332 460 Z"
        fill="url(#poca-shine)" opacity=".55"/>
  <rect x="352" y="446" width="18" height="170" rx="9" fill="#ffffff" opacity=".5"/>
  <path d="M612 480 Q626 850 614 1220 Q610 1256 588 1266 Q602 1030 602 860 Q602 660 596 484 Z"
        fill="#0a2a4a" opacity=".3"/>

  <!-- condensation -->
  <g>
    <circle cx="336" cy="540" r="6" fill="#eaf7ff" opacity=".65"/>
    <circle cx="560" cy="512" r="5" fill="#eaf7ff" opacity=".6"/>
    <circle cx="300" cy="666" r="5" fill="#eaf7ff" opacity=".6"/>
    <circle cx="608" cy="626" r="4" fill="#eaf7ff" opacity=".55"/>
    <circle cx="398" cy="806" r="7" fill="#eaf7ff" opacity=".6"/>
    <circle cx="586" cy="742" r="5" fill="#eaf7ff" opacity=".55"/>
    <circle cx="322" cy="928" r="5" fill="#eaf7ff" opacity=".6"/>
    <path d="M574 908 q6 14 0 22 q-8 -6 -4 -20 Z" fill="#eaf7ff" opacity=".6"/>
    <circle cx="380" cy="1120" r="7" fill="#9cc3de" opacity=".65"/>
    <circle cx="540" cy="1180" r="6" fill="#9cc3de" opacity=".6"/>
    <path d="M330 1052 q-6 16 0 26 q9 -7 4 -24 Z" fill="#eaf7ff" opacity=".6"/>
    <circle cx="470" cy="1236" r="5" fill="#9cc3de" opacity=".55"/>
  </g>

  <!-- petits jets de splash devant le pied -->
  <g fill="#8ccbf0">
    <path d="M352 1290 q-7 -36 9 -56 q11 24 5 56 Z" opacity=".9"/>
    <path d="M556 1292 q7 -32 -8 -50 q-10 22 -4 50 Z" opacity=".85"/>
  </g>

  <!-- garniture : 3 gouttes d'eau stylisees -->
  <g>
    <g transform="translate(198 560)">
      <path d="M0 -34 C15 -8 24 6 24 19 A24 24 0 1 1 -24 19 C-24 6 -15 -8 0 -34 Z" fill="url(#poca-dropg)"/>
      <ellipse cx="-8" cy="12" rx="6" ry="9" fill="#ffffff" opacity=".8" transform="rotate(-18 -8 12)"/>
    </g>
    <g transform="translate(712 660) scale(.8)">
      <path d="M0 -34 C15 -8 24 6 24 19 A24 24 0 1 1 -24 19 C-24 6 -15 -8 0 -34 Z" fill="url(#poca-dropg)"/>
      <ellipse cx="-8" cy="12" rx="6" ry="9" fill="#ffffff" opacity=".8" transform="rotate(-18 -8 12)"/>
    </g>
    <g transform="translate(690 1080) scale(1.05)">
      <path d="M0 -34 C15 -8 24 6 24 19 A24 24 0 1 1 -24 19 C-24 6 -15 -8 0 -34 Z" fill="url(#poca-dropg)"/>
      <ellipse cx="-8" cy="12" rx="6" ry="9" fill="#ffffff" opacity=".8" transform="rotate(-18 -8 12)"/>
    </g>
  </g>
</svg>
