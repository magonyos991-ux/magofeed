<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <!-- corps bleu roi : cylindre horizontal, 6 stops -->
    <linearGradient id="poca-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1668c4"/>
      <stop offset=".13" stop-color="#3e97ec"/>
      <stop offset=".30" stop-color="#2381dd"/>
      <stop offset=".55" stop-color="#0f5cb8"/>
      <stop offset=".80" stop-color="#0a4392"/>
      <stop offset="1" stop-color="#062e68"/>
    </linearGradient>
    <!-- bandes de lumiere/ombre cylindriques par-dessus l'impression -->
    <linearGradient id="poca-cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a2547" stop-opacity=".38"/>
      <stop offset=".045" stop-color="#0a2547" stop-opacity=".1"/>
      <stop offset=".13" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset=".24" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset=".34" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".70" stop-color="#04162e" stop-opacity=".12"/>
      <stop offset=".90" stop-color="#04162e" stop-opacity=".44"/>
      <stop offset=".965" stop-color="#04162e" stop-opacity=".55"/>
      <stop offset=".985" stop-color="#bcd8ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#eef7fd" stop-opacity=".75"/>
    </linearGradient>
    <!-- aluminium du couvercle et du col -->
    <linearGradient id="poca-alu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa4b4"/>
      <stop offset=".18" stop-color="#e9f1f6"/>
      <stop offset=".38" stop-color="#c2d2dd"/>
      <stop offset=".60" stop-color="#9db2c2"/>
      <stop offset=".82" stop-color="#7c93a6"/>
      <stop offset="1" stop-color="#5f7689"/>
    </linearGradient>
    <linearGradient id="poca-lidtop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7e3ec"/>
      <stop offset=".35" stop-color="#b6c8d5"/>
      <stop offset=".7" stop-color="#93a9ba"/>
      <stop offset="1" stop-color="#7e95a8"/>
    </linearGradient>
    <!-- vague blanche signature -->
    <linearGradient id="poca-wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#f7fbfe"/>
      <stop offset=".7" stop-color="#e8f1f8"/>
      <stop offset="1" stop-color="#d4e4f0"/>
    </linearGradient>
    <!-- goutte de condensation -->
    <radialGradient id="poca-drop" cx=".32" cy=".28" r="1.05">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#dceefb" stop-opacity=".55"/>
      <stop offset=".75" stop-color="#7fb2dd" stop-opacity=".35"/>
      <stop offset="1" stop-color="#274b74" stop-opacity=".45"/>
    </radialGradient>
    <!-- silhouette de la canette : col + corps + pied retreci -->
    <clipPath id="poca-clip">
      <path d="M304 262
               C304 300 234 322 232 376
               L232 1148
               C232 1196 244 1222 276 1244
               C300 1262 336 1272 372 1277
               Q450 1287 528 1277
               C564 1272 600 1262 624 1244
               C656 1222 668 1196 668 1148
               L668 376
               C666 322 596 300 596 262 Z"/>
    </clipPath>
    <!-- arcs pour textes qui suivent la courbure (vue legerement de dessus : bombes vers le bas) -->
    <path id="poca-arc1" d="M228 560 Q450 596 672 560" fill="none"/>
    <path id="poca-arc2" d="M228 668 Q450 704 672 668" fill="none"/>
    <path id="poca-arc3" d="M228 742 Q450 772 672 742" fill="none"/>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="38" fill="#000" opacity=".35"/>

  <!-- ============ CANETTE ============ -->
  <g clip-path="url(#poca-clip)">
    <!-- fond bleu du corps -->
    <rect x="225" y="250" width="450" height="1050" fill="url(#poca-body)"/>

    <!-- grande vague blanche signature : monte de gauche a droite -->
    <path d="M232 1092
             C300 1074 342 1018 400 972
             C462 922 520 902 574 862
             C612 834 644 812 668 802
             L668 1300 L232 1300 Z"
          fill="url(#poca-wave)"/>
    <!-- ombre douce sous la crete (volume de la vague) -->
    <path d="M232 1092
             C300 1074 342 1018 400 972
             C462 922 520 902 574 862
             C612 834 644 812 668 802
             L668 836
             C640 848 610 868 576 894
             C522 934 466 954 406 1002
             C350 1048 306 1100 232 1120 Z"
          fill="#a9c4da" opacity=".5"/>
    <!-- fine vague blanche secondaire au-dessus (double trait Pocari) -->
    <path d="M232 1028
             C304 1006 348 946 410 898
             C470 852 528 832 580 794
             C614 770 646 750 668 740
             L668 766
             C644 778 612 798 578 822
             C526 860 470 880 414 924
             C354 970 308 1030 232 1054 Z"
          fill="#eaf4fb" opacity=".9"/>

    <!-- pied : la vague s'assombrit dans le retreint -->
    <path d="M232 1180 Q450 1252 668 1180 L668 1300 L232 1300 Z" fill="#0d3766" opacity=".22"/>

    <!-- col aluminium au-dessus de l'impression -->
    <rect x="225" y="250" width="450" height="78" fill="url(#poca-alu)"/>
    <path d="M225 318 Q450 352 675 318 L675 332 Q450 366 225 332 Z" fill="#0a2c55" opacity=".5"/>

    <!-- sertissage bas -->
    <path d="M232 1238 Q450 1300 668 1238 L668 1256 Q450 1318 232 1256 Z" fill="#5f7ea0" opacity=".6"/>
    <path d="M232 1252 Q450 1312 668 1252 L668 1262 Q450 1324 232 1262 Z" fill="#dcebf6" opacity=".4"/>

    <!-- ombrage cylindrique global : large bande claire a gauche, bord droit sombre + rim light -->
    <rect x="225" y="250" width="450" height="1060" fill="url(#poca-cyl)"/>
    <!-- reflet vertical net supplementaire (fenetre) -->
    <path d="M290 340 L318 340 L316 1240 L296 1232 Z" fill="#ffffff" opacity=".22"/>
    <path d="M352 348 L366 348 L365 1246 L354 1244 Z" fill="#ffffff" opacity=".14"/>
  </g>

  <!-- ============ TEXTES (suivent la courbure) ============ -->
  <text font-family="'Space Grotesk',sans-serif" font-size="97" font-weight="700"
        letter-spacing="2" fill="#ffffff">
    <textPath href="#poca-arc1" startOffset="50%" text-anchor="middle">POCARI</textPath>
  </text>
  <text font-family="'Space Grotesk',sans-serif" font-size="97" font-weight="700"
        letter-spacing="2" fill="#ffffff">
    <textPath href="#poca-arc2" startOffset="50%" text-anchor="middle">SWEAT</textPath>
  </text>
  <text font-family="'Space Grotesk',sans-serif" font-size="26" font-weight="600"
        letter-spacing="9" fill="#c9dced">
    <textPath href="#poca-arc3" startOffset="50%" text-anchor="middle">ION SUPPLY DRINK</textPath>
  </text>

  <!-- ============ COUVERCLE (vu tres legerement de dessus) ============ -->
  <g>
    <!-- rebord serti exterieur -->
    <ellipse cx="450" cy="262" rx="148" ry="30" fill="url(#poca-alu)"/>
    <ellipse cx="450" cy="259" rx="148" ry="28" fill="#e6eef4"/>
    <ellipse cx="450" cy="261" rx="136" ry="24" fill="#8fa6b7"/>
    <!-- plateau du couvercle -->
    <ellipse cx="450" cy="262" rx="128" ry="21" fill="url(#poca-lidtop)"/>
    <!-- anneau interieur grave -->
    <ellipse cx="450" cy="263" rx="96" ry="15" fill="none" stroke="#6d8598" stroke-width="3"/>
    <ellipse cx="450" cy="263" rx="96" ry="15" fill="none" stroke="#dfe9f0" stroke-width="1.4"
             stroke-dasharray="60 40" opacity=".8"/>
    <!-- languette (stay-on tab) -->
    <g>
      <!-- opercule (bouche) -->
      <ellipse cx="398" cy="264" rx="34" ry="9" fill="#8ba2b3" opacity=".9"/>
      <ellipse cx="398" cy="263" rx="34" ry="9" fill="none" stroke="#647c8f" stroke-width="2"/>
      <!-- corps de la languette -->
      <path d="M444 254
               q46 -7 62 3 q8 6 0 12 q-16 10 -62 3
               q-11 -3 -11 -9 q0 -6 11 -9 Z"
            fill="#c9d8e2" stroke="#5c7488" stroke-width="3"/>
      <path d="M468 258 q20 -3 32 3 q-12 6 -32 3 q-6 -1 -6 -3 q0 -2 6 -3 Z" fill="#7d94a6"/>
      <!-- rivet -->
      <circle cx="441" cy="263" r="8" fill="#6f8798"/>
      <circle cx="440" cy="262" r="4.5" fill="#d5e2ea"/>
    </g>
    <!-- eclat sur le rebord avant -->
    <path d="M330 276 q56 14 120 14 q64 0 120 -14" fill="none" stroke="#ffffff"
          stroke-width="4" opacity=".65" stroke-linecap="round"/>
    <path d="M336 246 q52 -12 114 -12" fill="none" stroke="#ffffff"
          stroke-width="3" opacity=".8" stroke-linecap="round"/>
  </g>

  <!-- ============ CONDENSATION (8 gouttes) ============ -->
  <g stroke="#ffffff" stroke-opacity=".25" stroke-width="1">
    <ellipse cx="332" cy="452" rx="9" ry="12" fill="url(#poca-drop)"/>
    <ellipse cx="577" cy="428" rx="7" ry="9" fill="url(#poca-drop)"/>
    <ellipse cx="270" cy="620" rx="7" ry="10" fill="url(#poca-drop)"/>
    <ellipse cx="628" cy="588" rx="6" ry="8" fill="url(#poca-drop)"/>
    <path d="M395 812 q9 0 9 12 q0 26 -9 26 q-8 0 -8 -24 q0 -14 8 -14 Z" fill="url(#poca-drop)"/>
    <ellipse cx="560" cy="936" rx="8" ry="11" fill="url(#poca-drop)"/>
    <ellipse cx="318" cy="1010" rx="7" ry="9" fill="url(#poca-drop)"/>
    <path d="M612 1052 q8 0 8 11 q0 22 -8 22 q-7 0 -7 -21 q0 -12 7 -12 Z" fill="url(#poca-drop)"/>
    <ellipse cx="418" cy="1132" rx="7" ry="9" fill="url(#poca-drop)"/>
    <ellipse cx="506" cy="702" rx="6" ry="8" fill="url(#poca-drop)"/>
  </g>
</svg>
