<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <!-- corps bleu roi (base ~#2456a8) : cylindre horizontal -->
    <linearGradient id="poca-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c4488"/>
      <stop offset=".13" stop-color="#3e77c9"/>
      <stop offset=".30" stop-color="#2d63b8"/>
      <stop offset=".55" stop-color="#2456a8"/>
      <stop offset=".80" stop-color="#1a4489"/>
      <stop offset="1" stop-color="#0e2c60"/>
    </linearGradient>
    <!-- bandes de lumiere/ombre cylindriques par-dessus l'impression -->
    <linearGradient id="poca-cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a2547" stop-opacity=".40"/>
      <stop offset=".045" stop-color="#0a2547" stop-opacity=".1"/>
      <stop offset=".12" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".24" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset=".34" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".70" stop-color="#04162e" stop-opacity=".12"/>
      <stop offset=".90" stop-color="#04162e" stop-opacity=".42"/>
      <stop offset=".965" stop-color="#04162e" stop-opacity=".55"/>
      <stop offset=".985" stop-color="#bcd8ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#eef7fd" stop-opacity=".75"/>
    </linearGradient>
    <!-- aluminium du couvercle et du col -->
    <linearGradient id="poca-alu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa4b4"/>
      <stop offset=".18" stop-color="#e9f1f6"/>
      <stop offset=".38" stop-color="#c2d2dd"/>
      <stop offset=".60" stop-color="#9db2c2"/>
      <stop offset=".82" stop-color="#7c93a6"/>
      <stop offset="1" stop-color="#5f7689"/>
    </linearGradient>
    <linearGradient id="poca-lidtop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7e3ec"/>
      <stop offset=".35" stop-color="#b6c8d5"/>
      <stop offset=".7" stop-color="#93a9ba"/>
      <stop offset="1" stop-color="#7e95a8"/>
    </linearGradient>
    <!-- vague blanche verticale signature -->
    <linearGradient id="poca-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f8fc"/>
      <stop offset=".45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcebf6"/>
    </linearGradient>
    <!-- goutte de condensation -->
    <radialGradient id="poca-drop" cx=".32" cy=".28" r="1.05">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#dceefb" stop-opacity=".55"/>
      <stop offset=".75" stop-color="#7fb2dd" stop-opacity=".35"/>
      <stop offset="1" stop-color="#274b74" stop-opacity=".45"/>
    </radialGradient>
    <!-- silhouette de la canette : col + corps + pied retreci -->
    <clipPath id="poca-clip">
      <path d="M304 262
               C304 300 234 322 232 376
               L232 1148
               C232 1196 244 1222 276 1244
               C300 1262 336 1272 372 1277
               Q450 1287 528 1277
               C564 1272 600 1262 624 1244
               C656 1222 668 1196 668 1148
               L668 376
               C666 322 596 300 596 262 Z"/>
    </clipPath>
  </defs>

  <!-- ombre au sol -->
  <ellipse cx="450" cy="1330" rx="260" ry="38" fill="#000" opacity=".35"/>

  <!-- ============ CANETTE ============ -->
  <g clip-path="url(#poca-clip)">
    <!-- fond bleu du corps -->
    <rect x="225" y="250" width="450" height="1060" fill="url(#poca-body)"/>

    <!-- ===== VAGUE BLANCHE VERTICALE : bande en S qui descend le long du cote gauche ===== -->
    <path d="M238 250
             C236 470 322 600 320 780
             C318 950 234 1060 240 1300
             L312 1300
             C306 1060 390 950 392 780
             C394 600 308 470 310 250 Z"
          fill="url(#poca-wave)"/>
    <!-- ombre douce sur le bord droit de la vague (volume) -->
    <path d="M310 250
             C308 470 394 600 392 780
             C390 950 306 1060 312 1300
             L292 1300
             C286 1060 370 950 372 780
             C374 600 288 470 290 250 Z"
          fill="#aac6dd" opacity=".45"/>
    <!-- fin filet bleu clair a l'interieur de la vague -->
    <path d="M284 250
             C282 470 368 600 366 780
             C364 950 280 1060 286 1300"
          fill="none" stroke="#a9d0ef" stroke-width="5"/>

    <!-- ===== micro-colonnes de texte simule (cote droit, illisible) ===== -->
    <g stroke="#ffffff" stroke-opacity=".32">
      <line x1="598" y1="430" x2="598" y2="760" stroke-width="6" stroke-dasharray="9 6"/>
      <line x1="614" y1="418" x2="614" y2="820" stroke-width="6" stroke-dasharray="7 5"/>
      <line x1="630" y1="430" x2="630" y2="700" stroke-width="6" stroke-dasharray="10 7"/>
      <line x1="614" y1="920" x2="614" y2="1130" stroke-width="6" stroke-dasharray="8 6"/>
      <line x1="630" y1="932" x2="630" y2="1090" stroke-width="6" stroke-dasharray="7 5"/>
    </g>

    <!-- ===== TEXTES VERTICAUX (rotation horaire 90deg : se lisent de haut en bas) ===== -->
    <!-- ION SUPPLY DRINK, vertical, a gauche du grand texte -->
    <text transform="rotate(90 378 800)" x="378" y="800" text-anchor="middle"
          font-family="'Space Grotesk',sans-serif" font-size="30" font-weight="600"
          letter-spacing="9" fill="#ffffff" opacity=".92">ION SUPPLY DRINK</text>
    <!-- POCARI SWEAT enorme, blanc, condense/gras, presque toute la hauteur -->
    <text transform="rotate(90 440 800)" x="440" y="800" text-anchor="middle"
          font-family="'Space Grotesk',sans-serif" font-size="186" font-weight="700"
          fill="#ffffff" textLength="850" lengthAdjust="spacingAndGlyphs">POCARI SWEAT</text>

    <!-- pied : le retreint s'assombrit -->
    <path d="M232 1180 Q450 1252 668 1180 L668 1300 L232 1300 Z" fill="#0d3766" opacity=".22"/>

    <!-- col aluminium au-dessus de l'impression -->
    <rect x="225" y="250" width="450" height="72" fill="url(#poca-alu)"/>
    <path d="M225 312 Q450 344 675 312 L675 324 Q450 356 225 324 Z" fill="#0a2c55" opacity=".5"/>

    <!-- 3 anneaux de retreint (stries d'usinage) tout en haut du corps -->
    <g fill="none">
      <path d="M225 338 Q450 364 675 338" stroke="#0f2f5e" stroke-opacity=".55" stroke-width="3.5"/>
      <path d="M225 343 Q450 369 675 343" stroke="#8fbce6" stroke-opacity=".55" stroke-width="2"/>
      <path d="M225 356 Q450 382 675 356" stroke="#0f2f5e" stroke-opacity=".55" stroke-width="3.5"/>
      <path d="M225 361 Q450 387 675 361" stroke="#8fbce6" stroke-opacity=".55" stroke-width="2"/>
      <path d="M225 374 Q450 400 675 374" stroke="#0f2f5e" stroke-opacity=".55" stroke-width="3.5"/>
      <path d="M225 379 Q450 405 675 379" stroke="#8fbce6" stroke-opacity=".55" stroke-width="2"/>
    </g>

    <!-- sertissage bas -->
    <path d="M232 1238 Q450 1300 668 1238 L668 1256 Q450 1318 232 1256 Z" fill="#5f7ea0" opacity=".6"/>
    <path d="M232 1252 Q450 1312 668 1252 L668 1262 Q450 1324 232 1262 Z" fill="#dcebf6" opacity=".4"/>

    <!-- ombrage cylindrique global : large bande claire a gauche, bord droit sombre + rim light -->
    <rect x="225" y="250" width="450" height="1060" fill="url(#poca-cyl)"/>
    <!-- reflet vertical net supplementaire (fenetre) -->
    <path d="M290 340 L318 340 L316 1240 L296 1232 Z" fill="#ffffff" opacity=".20"/>
    <path d="M352 348 L366 348 L365 1246 L354 1244 Z" fill="#ffffff" opacity=".12"/>
  </g>

  <!-- ============ COUVERCLE (vu tres legerement de dessus) ============ -->
  <g>
    <!-- rebord serti exterieur -->
    <ellipse cx="450" cy="262" rx="148" ry="30" fill="url(#poca-alu)"/>
    <ellipse cx="450" cy="259" rx="148" ry="28" fill="#e6eef4"/>
    <ellipse cx="450" cy="261" rx="136" ry="24" fill="#8fa6b7"/>
    <!-- plateau du couvercle -->
    <ellipse cx="450" cy="262" rx="128" ry="21" fill="url(#poca-lidtop)"/>
    <!-- anneau interieur grave -->
    <ellipse cx="450" cy="263" rx="96" ry="15" fill="none" stroke="#6d8598" stroke-width="3"/>
    <ellipse cx="450" cy="263" rx="96" ry="15" fill="none" stroke="#dfe9f0" stroke-width="1.4"
             stroke-dasharray="60 40" opacity=".8"/>
    <!-- languette (stay-on tab) -->
    <g>
      <!-- opercule (bouche) -->
      <ellipse cx="398" cy="264" rx="34" ry="9" fill="#8ba2b3" opacity=".9"/>
      <ellipse cx="398" cy="263" rx="34" ry="9" fill="none" stroke="#647c8f" stroke-width="2"/>
      <!-- corps de la languette -->
      <path d="M444 254
               q46 -7 62 3 q8 6 0 12 q-16 10 -62 3
               q-11 -3 -11 -9 q0 -6 11 -9 Z"
            fill="#c9d8e2" stroke="#5c7488" stroke-width="3"/>
      <path d="M468 258 q20 -3 32 3 q-12 6 -32 3 q-6 -1 -6 -3 q0 -2 6 -3 Z" fill="#7d94a6"/>
      <!-- rivet -->
      <circle cx="441" cy="263" r="8" fill="#6f8798"/>
      <circle cx="440" cy="262" r="4.5" fill="#d5e2ea"/>
    </g>
    <!-- eclat sur le rebord avant -->
    <path d="M330 276 q56 14 120 14 q64 0 120 -14" fill="none" stroke="#ffffff"
          stroke-width="4" opacity=".65" stroke-linecap="round"/>
    <path d="M336 246 q52 -12 114 -12" fill="none" stroke="#ffffff"
          stroke-width="3" opacity=".8" stroke-linecap="round"/>
  </g>

  <!-- ============ CONDENSATION (9 gouttes) ============ -->
  <g stroke="#ffffff" stroke-opacity=".25" stroke-width="1">
    <ellipse cx="332" cy="452" rx="9" ry="12" fill="url(#poca-drop)"/>
    <ellipse cx="577" cy="428" rx="7" ry="9" fill="url(#poca-drop)"/>
    <ellipse cx="270" cy="620" rx="7" ry="10" fill="url(#poca-drop)"/>
    <ellipse cx="640" cy="588" rx="6" ry="8" fill="url(#poca-drop)"/>
    <path d="M395 812 q9 0 9 12 q0 26 -9 26 q-8 0 -8 -24 q0 -14 8 -14 Z" fill="url(#poca-drop)"/>
    <ellipse cx="560" cy="936" rx="8" ry="11" fill="url(#poca-drop)"/>
    <ellipse cx="318" cy="1010" rx="7" ry="9" fill="url(#poca-drop)"/>
    <path d="M632 1052 q8 0 8 11 q0 22 -8 22 q-7 0 -7 -21 q0 -12 7 -12 Z" fill="url(#poca-drop)"/>
    <ellipse cx="418" cy="1132" rx="7" ry="9" fill="url(#poca-drop)"/>
  </g>
</svg>
