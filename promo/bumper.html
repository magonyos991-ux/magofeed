<title>Magofeed — Bumper 7s</title>
<style>
  :root{
    --ground:#1a1714;--ink:#100e0c;--ground2:#241f1a;--line:#3a332c;
    --signal:#e67e22;--gold:#f0b840;--gold-soft:#e8c17a;--paper:#f5f2ec;--mute:#8a817a;--good:#27ae60;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);color:var(--paper);font-family:var(--sans);display:grid;place-items:center;min-height:100dvh;overflow:hidden;padding:14px}
  .stage-wrap{position:relative;height:min(94dvh,calc((100vw - 28px)*16/9));aspect-ratio:9/16;max-width:100%}
  .stage{position:absolute;inset:0;border-radius:24px;overflow:hidden;container-type:size;
    background:radial-gradient(130% 80% at 50% 8%,#26201b 0%,var(--ground) 46%,#0d0b09 100%);
    box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
  .stage::after{content:"";position:absolute;inset:0;z-index:9;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.45) 100%)}

  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:10% 9%;opacity:0}
  h1{font-weight:800;letter-spacing:-.025em;line-height:1.02;text-wrap:balance;font-size:clamp(30px,11cqw,60px)}
  .sig{color:var(--signal)}.hl{color:var(--gold)}
  .kick{color:var(--mute);font-weight:600;font-size:clamp(15px,4.4cqw,22px);margin-top:3cqh}

  /* timeline via one keyframed opacity per scene (total 7s, loop) */
  .s1{animation:s1 7s infinite}
  .s2{animation:s2 7s infinite}
  .s3{animation:s3 7s infinite}
  @keyframes s1{0%{opacity:0;transform:scale(1.04)}4%{opacity:1;transform:none}26%{opacity:1}31%{opacity:0}100%{opacity:0}}
  @keyframes s2{0%,31%{opacity:0}35%{opacity:1}62%{opacity:1}67%{opacity:0}100%{opacity:0}}
  @keyframes s3{0%,67%{opacity:0}72%{opacity:1}96%{opacity:1}100%{opacity:.001}}

  /* radar mark */
  .mark{position:relative;width:clamp(120px,44cqw,220px);aspect-ratio:1;border-radius:26%;display:grid;place-items:center;
    background:linear-gradient(160deg,#211c17,#141110);box-shadow:0 24px 60px -18px rgba(0,0,0,.8)}
  .mark .M{font-weight:800;font-size:clamp(80px,32cqw,150px);letter-spacing:-.04em;margin-top:.14em}
  .mark .eye{position:absolute;top:12%;left:50%;transform:translateX(-50%);width:20%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle,var(--gold) 0 26%,#7a5a1e 27% 40%,transparent 41%)}
  .mark .eye::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(240,184,64,.5);animation:ping 2s ease-out infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}
  .wordmark{font-weight:800;letter-spacing:-.02em;font-size:clamp(40px,14cqw,72px);margin-top:5cqh}
  .tag{color:var(--gold-soft);font-weight:600;font-size:clamp(16px,4.8cqw,24px);margin-top:2cqh}

  /* map ping */
  .map{position:relative;width:min(76cqw,320px);aspect-ratio:1;border-radius:24px;overflow:hidden;margin-top:5cqh;
    background:linear-gradient(0deg,#14110e,#1b1712);border:1px solid var(--line)}
  .map::before{content:"";position:absolute;inset:0;opacity:.5;
    background:repeating-linear-gradient(38deg,transparent 0 26px,rgba(255,255,255,.03) 26px 28px),
               repeating-linear-gradient(-52deg,transparent 0 34px,rgba(255,255,255,.025) 34px 36px)}
  .me{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;
    background:var(--signal);box-shadow:0 0 0 4px rgba(230,126,34,.25);z-index:3}
  .ring{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(230,126,34,.35);
    animation:radiate 2.2s ease-out infinite}
  @keyframes radiate{0%{width:16px;height:16px;opacity:.7}100%{width:300px;height:300px;opacity:0}}
  .pin{position:absolute;transform:translate(-50%,-100%);z-index:4}
  .pin .head{width:26px;height:26px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);background:var(--gold);display:grid;place-items:center;box-shadow:0 6px 14px rgba(0,0,0,.5)}
  .pin .head b{transform:rotate(-45deg);font-size:12px}
  .chip{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);background:rgba(39,174,96,.16);border:1px solid rgba(39,174,96,.5);
    color:#8ce0ac;font-weight:800;font-size:12px;padding:6px 12px;border-radius:999px;z-index:5}

  .brandtab{position:absolute;top:14px;left:16px;z-index:8;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;opacity:.9}
  .brandtab .b-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(240,184,64,.18)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.s3{opacity:1}}
</style>
<div class="stage-wrap"><div class="stage">
  <div class="brandtab"><span class="b-dot"></span>Magofeed</div>

  <section class="scene s1">
    <h1>Ta boisson,<br><span class="sig">introuvable</span> ?</h1>
    <p class="kick">3 magasins. Rien.</p>
  </section>

  <section class="scene s2">
    <div class="map">
      <div class="ring"></div><div class="me"></div>
      <div class="pin" style="left:32%;top:32%"><div class="head"><b>🥤</b></div></div>
      <div class="pin" style="left:70%;top:44%"><div class="head"><b>🥤</b></div></div>
      <div class="pin" style="left:50%;top:72%"><div class="head"><b>🥤</b></div></div>
      <div class="chip">✓ 3 magasins l'ont en stock</div>
    </div>
    <p class="kick" style="color:var(--paper);font-weight:800;font-size:clamp(18px,5.4cqw,26px)">Magofeed te dit <span class="hl">qui l'a</span>.</p>
  </section>

  <section class="scene s3">
    <div class="mark"><span class="eye"></span><span class="M">M</span></div>
    <div class="wordmark">Magofeed</div>
    <div class="tag">Trouve ta boisson près de toi</div>
    <p class="kick" style="font-size:clamp(13px,3.6cqw,16px)">Bientôt · gratuit · sans pub intrusive</p>
  </section>

</div></div>
