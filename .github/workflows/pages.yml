name: Deploy to GitHub Pages

# Publie le site (app Magofeed + dossier promo/) sur GitHub Pages.
# URL : https://magonyos991-ux.github.io/magofeed/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # Régénère les pages de partage "Où trouver X" (/f/<id>.html) à partir du
      # catalogue actuel d'index.html, pour que les aperçus de lien soient
      # toujours à jour sans intervention manuelle. Non bloquant : si la
      # génération échoue, les pages déjà committées dans /f/ sont déployées.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate share pages
        run: |
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
          node growth/build-share-pages.js
        continue-on-error: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
