# ─────────────────────────────────────────────────────────────────────────────
# DEPLOYER LE SERVEUR DEPUIS GITHUB, EN APPUYANT SUR UN BOUTON
#
# POURQUOI CE FICHIER EXISTE. Le site web se redeploie tout seul a chaque
# poussee (pages.yml), mais le SERVEUR — les Cloud Functions et les regles
# Firestore — se deployait a la main, par une longue commande PowerShell, sur
# le PC du fondateur. Consequence observee : cinq jours de corrections cote
# client en ligne sans leur moitie serveur, des outils qui repondaient
# « functions/internal », et des regles neuves qui refusaient ce que l'app
# venait d'apprendre a faire.
#
# CE N'EST PAS AUTOMATIQUE, ET C'EST VOULU. Le declenchement est MANUEL
# (bouton « Run workflow » dans l'onglet Actions) : deployer le serveur a
# chaque poussee, c'est mettre en ligne une fonction a moitie ecrite. Ici, on
# choisit le moment.
#
# LE BANC D'ESSAI GARDE LA PORTE. Les regles ne partent jamais sans que les
# 280 epreuves soient passees sur l'emulateur Firestore. Une regle cassee, ce
# n'est pas un bug d'affichage : c'est une porte ouverte sur les donnees de
# tout le monde.
#
# CE QU'IL FAUT, UNE SEULE FOIS : un secret GitHub nomme
# FIREBASE_SERVICE_ACCOUNT contenant le fichier JSON d'un compte de service
# Firebase. Mode d'emploi dans DEPLOIEMENT-SECURITE.md. Ce JSON ne doit JAMAIS
# etre commite : un secret GitHub n'est pas un fichier du depot, c'est le bon
# endroit.
# ─────────────────────────────────────────────────────────────────────────────
name: Déployer le serveur (fonctions + règles)

on:
  workflow_dispatch:
    inputs:
      quoi:
        description: "Ce qu'on déploie"
        required: true
        default: "tout"
        type: choice
        options:
          - tout
          - fonctions seulement
          - règles et index seulement

concurrency:
  group: deploiement-serveur
  cancel-in-progress: false

jobs:
  regles:
    name: 280 épreuves sur l'émulateur Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions-a-deployer/tests-regles/package-lock.json
      # L'emulateur Firestore tourne sur la machine virtuelle Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Installer le banc d'essai
        working-directory: functions-a-deployer/tests-regles
        run: npm ci
      # `npm test` recopie d'abord ../firestore.rules (pretest), puis lance
      # l'emulateur et les epreuves. Sortie non nulle = deploiement annule.
      - name: Lancer les épreuves
        working-directory: functions-a-deployer/tests-regles
        run: npm test

  deployer:
    name: Déployer chez Firebase
    needs: regles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # On assemble le dossier que Firebase attend : firebase.json a la racine,
      # les regles et les index a cote, et TOUT le code serveur dans functions/.
      # Meme principe de liste blanche que partout ailleurs — le banc d'essai
      # et les notes internes ne montent pas.
      - name: Assembler le dossier de déploiement
        run: |
          set -e
          mkdir -p deploiement/functions
          cp functions-a-deployer/firebase.json.modele deploiement/firebase.json
          cp functions-a-deployer/firestore.rules      deploiement/firestore.rules
          cp functions-a-deployer/firestore.indexes.json deploiement/firestore.indexes.json
          cp functions-a-deployer/*.js                 deploiement/functions/
          cp functions-a-deployer/package.json         deploiement/functions/
          # verifier-listes-pseudos.mjs est un outil de verification, pas une
          # fonction : il n'a rien a faire dans le paquet deploye.
          rm -f deploiement/functions/verifier-listes-pseudos.mjs
          echo "Fichiers serveur embarqués :"
          ls -1 deploiement/functions/

      # Chaque fichier charge par index.js doit exister dans le paquet. Sans ce
      # controle, un require oublie ne se decouvre qu'en pleine mise en ligne,
      # quand le deploiement echoue apres avoir deja pousse la moitie.
      - name: Vérifier que rien ne manque
        run: |
          set -e
          cd deploiement/functions
          node -e '
            const fs = require("fs");
            /* index.js garde en COMMENTAIRE les modules pas encore branches
               (le paiement Stripe, le recap du soir). Les compter comme actifs
               ferait dire au controle que dix-neuf modules partent quand il en
               part seize — un controle qui ment est pire que pas de controle.
               On retire donc les blocs de commentaire avant de chercher. */
            const src = fs.readFileSync("index.js", "utf8")
              .replace(/\/\*[\s\S]*?\*\//g, "")
              .replace(/^\s*\/\/.*$/gm, "");
            const vus = [...src.matchAll(/Object\.assign\(exports, require\("\.\/([a-z-]+)"\)\);/g)].map(m => m[1]);
            const manquants = vus.filter(n => !fs.existsSync(n + ".js"));
            console.log(vus.length + " modules réellement branchés : " + vus.join(", "));
            if (!vus.length) { console.error("Aucun module trouvé — index.js a changé de forme."); process.exit(1); }
            if (manquants.length) { console.error("ABSENTS du paquet : " + manquants.join(", ")); process.exit(1); }
          '
          node --check index.js
          for f in *.js; do node --check "$f" || exit 1; done
          echo "Syntaxe : tout passe."

      - name: Installer les dépendances des fonctions
        working-directory: deploiement/functions
        run: npm install --omit=dev --no-audit --no-fund

      # LE PAQUET DOIT DEMARRER AVANT D'ETRE ENVOYE.
      # La premiere tentative a echoue ici, sur une version de dependance qui
      # n'existait pas — on l'a su en trente secondes. Mais une version qui
      # s'installe peut tout de meme casser le code (une API renommee d'un
      # majeur a l'autre), et ca, on ne le decouvrirait qu'en production, sur
      # des fonctions a moitie deployees. On charge donc index.js pour de vrai :
      # s'il ne demarre pas ici, rien ne part.
      - name: Vérifier que le serveur démarre
        working-directory: deploiement/functions
        env:
          GCLOUD_PROJECT: magofeed-7f621
        run: |
          # Le script passe par un HEREDOC plutot que par « node -e '...' ».
          # La premiere version tenait dans des apostrophes, et contenait une
          # apostrophe francaise : le shell fermait la chaine au milieu du code
          # et sortait en erreur 2. Le deploiement a echoue sur MA syntaxe, pas
          # sur celle du serveur. Ici, rien n'est interprete par le shell.
          cat > verif-demarrage.cjs <<'FIN'
          const ex = require("./index.js");
          const noms = Object.keys(ex);
          if (!noms.length) {
            console.error("index.js n\u2019exporte aucune fonction.");
            process.exit(1);
          }
          console.log(noms.length + " fonctions pretes :");
          console.log(noms.sort().join(", "));
          FIN
          node verif-demarrage.cjs
          rm -f verif-demarrage.cjs

      # Le JSON du compte de service vit dans un secret GitHub, jamais dans le
      # depot. On l'ecrit hors de l'arborescence du code, le temps du
      # deploiement, et le runner est detruit juste apres.
      - name: Ouvrir la porte chez Firebase
        env:
          COMPTE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$COMPTE" ]; then
            echo "::error::Le secret FIREBASE_SERVICE_ACCOUNT est absent. Voir DEPLOIEMENT-SECURITE.md, section « Déployer depuis GitHub »."
            exit 1
          fi
          printf '%s' "$COMPTE" > "$RUNNER_TEMP/compte.json"
          node -e 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/compte.json","utf8"))' \
            || { echo "::error::Le secret n'est pas un JSON valide — recopie le fichier entier, accolades comprises."; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/compte.json" >> "$GITHUB_ENV"

      - name: Déployer
        working-directory: deploiement
        run: |
          set -e
          case "${{ inputs.quoi }}" in
            "fonctions seulement")      CIBLES="functions" ;;
            "règles et index seulement") CIBLES="firestore:rules,firestore:indexes" ;;
            *)                           CIBLES="firestore:rules,firestore:indexes,functions" ;;
          esac
          echo "Cibles : $CIBLES"
          npx --yes firebase-tools@13 deploy \
            --only "$CIBLES" \
            --project magofeed-7f621 \
            --non-interactive \
            --force

      - name: Refermer la porte
        if: always()
        run: rm -f "$RUNNER_TEMP/compte.json"
